<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 100" width="900" height="100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0a1428"/>
      <stop offset="50%" stop-color="#0f2240"/>
      <stop offset="100%" stop-color="#0a1428"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="15%" stop-color="#3A7BD5" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#00D4AA" stop-opacity="0.5"/>
      <stop offset="85%" stop-color="#3A7BD5" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
  </defs>
  <rect width="900" height="100" fill="url(#bg)" rx="0"/>
  <!-- subtle glow lines -->
  <line x1="0" y1="20" x2="900" y2="20" stroke="url(#line)" stroke-width="1"/>
  <line x1="0" y1="80" x2="900" y2="80" stroke="url(#line)" stroke-width="1"/>
  <!-- center icon -->
  <g transform="translate(450,50)">
    <circle cx="0" cy="0" r="18" fill="none" stroke="#3A7BD5" stroke-width="1" stroke-dasharray="3,3" opacity="0.4"/>
    <circle cx="0" cy="0" r="10" fill="rgba(58,123,213,0.15)" stroke="#00D4AA" stroke-width="1.2"/>
    <text x="0" y="4.5" text-anchor="middle" font-size="11" fill="#00D4AA" font-family="Arial,sans-serif">⚡</text>
  </g>
  <!-- circuitry dots -->
  <circle cx="100" cy="30" r="2" fill="#3A7BD5" opacity="0.4"/>
  <circle cx="200" cy="70" r="1.5" fill="#00D4AA" opacity="0.3"/>
  <circle cx="350" cy="25" r="1.5" fill="#3A7BD5" opacity="0.3"/>
  <circle cx="550" cy="75" r="2" fill="#00D4AA" opacity="0.4"/>
  <circle cx="700" cy="35" r="1.5" fill="#3A7BD5" opacity="0.25"/>
  <circle cx="800" cy="65" r="2" fill="#00D4AA" opacity="0.35"/>
</svg>
