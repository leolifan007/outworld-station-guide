<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 100" style="background:#1A2533;border-radius:8px;font-family:'Segoe UI',Arial,sans-serif;">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A5F;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#162D4A;stop-opacity:1"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#00D4AA"/>
    </marker>
  </defs>

  <text x="400" y="20" text-anchor="middle" fill="#C8D6E8" font-size="11" font-weight="bold">Power Generation Layout</text>

  <!-- Fuel Storage -->
  <rect x="50" y="35" width="120" height="35" rx="6" fill="url(#boxGrad)" stroke="#FFB347" stroke-width="1.5"/>
  <text x="110" y="57" text-anchor="middle" fill="#FFB347" font-size="9">Fuel Storage</text>

  <line x1="170" y1="52" x2="210" y2="52" stroke="#00D4AA" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Power Generators -->
  <rect x="215" y="35" width="100" height="35" rx="6" fill="url(#boxGrad)" stroke="#4A9EFF" stroke-width="1.5"/>
  <text x="265" y="57" text-anchor="middle" fill="#4A9EFF" font-size="8">Power Gen 1</text>

  <rect x="330" y="35" width="100" height="35" rx="6" fill="url(#boxGrad)" stroke="#4A9EFF" stroke-width="1.5"/>
  <text x="380" y="57" text-anchor="middle" fill="#4A9EFF" font-size="8">Power Gen 2</text>

  <rect x="445" y="35" width="100" height="35" rx="6" fill="url(#boxGrad)" stroke="#4A9EFF" stroke-width="1.5"/>
  <text x="495" y="57" text-anchor="middle" fill="#4A9EFF" font-size="8">Power Gen 3</text>

  <!-- Arrows down -->
  <line x1="265" y1="70" x2="265" y2="85" stroke="#00D4AA" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="380" y1="70" x2="380" y2="85" stroke="#00D4AA" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="495" y1="70" x2="495" y2="85" stroke="#00D4AA" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Power Grid Connection -->
  <rect x="180" y="90" width="400" height="30" rx="6" fill="url(#boxGrad)" stroke="#00D4AA" stroke-width="2"/>
  <text x="380" y="110" text-anchor="middle" fill="#00D4AA" font-size="9" font-weight="bold">Power Grid Connection Point</text>
</svg>