<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 180" style="background:#1A2533;border-radius:8px;font-family:'Segoe UI',Arial,sans-serif;">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A5F;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#162D4A;stop-opacity:1"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#00D4AA"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="25" text-anchor="middle" fill="#C8D6E8" font-size="14" font-weight="bold">Two-Level Station Strategy</text>

  <!-- Lower Level Box -->
  <rect x="30" y="45" width="350" height="120" rx="8" fill="url(#boxGrad)" stroke="#4A9EFF" stroke-width="2"/>
  <text x="205" y="65" text-anchor="middle" fill="#4A9EFF" font-size="12" font-weight="bold">Lower Level (Foundation)</text>

  <!-- Lower level items -->
  <rect x="45" y="80" width="150" height="30" rx="4" fill="#162D4A" stroke="#6A8AAA" stroke-width="1"/>
  <text x="120" y="100" text-anchor="middle" fill="#C8D6E8" font-size="9">⚙️ Raw Ore Processing</text>

  <rect x="45" y="115" width="150" height="30" rx="4" fill="#162D4A" stroke="#6A8AAA" stroke-width="1"/>
  <text x="120" y="135" text-anchor="middle" fill="#C8D6E8" font-size="9">⚡ Power Generation</text>

  <rect x="210" y="80" width="150" height="30" rx="4" fill="#162D4A" stroke="#6A8AAA" stroke-width="1"/>
  <text x="285" y="100" text-anchor="middle" fill="#C8D6E8" font-size="9">📦 Storage Buffers</text>

  <rect x="210" y="115" width="150" height="30" rx="4" fill="#162D4A" stroke="#6A8AAA" stroke-width="1"/>
  <text x="285" y="135" text-anchor="middle" fill="#C8D6E8" font-size="9">🔧 Heavy Machinery</text>

  <!-- Upper Level Box -->
  <rect x="420" y="45" width="350" height="120" rx="8" fill="url(#boxGrad)" stroke="#00D4AA" stroke-width="2"/>
  <text x="595" y="65" text-anchor="middle" fill="#00D4AA" font-size="12" font-weight="bold">Upper Level (Platform)</text>

  <!-- Upper level items -->
  <rect x="435" y="80" width="150" height="30" rx="4" fill="#162D4A" stroke="#6A8AAA" stroke-width="1"/>
  <text x="510" y="100" text-anchor="middle" fill="#C8D6E8" font-size="9">🏭 Assembly Machines</text>

  <rect x="435" y="115" width="150" height="30" rx="4" fill="#162D4A" stroke="#6A8AAA" stroke-width="1"/>
  <text x="510" y="135" text-anchor="middle" fill="#C8D6E8" font-size="9">🔬 Research Labs</text>

  <rect x="600" y="80" width="150" height="30" rx="4" fill="#162D4A" stroke="#6A8AAA" stroke-width="1"/>
  <text x="675" y="100" text-anchor="middle" fill="#C8D6E8" font-size="9">🎛️ Control Rooms</text>

  <rect x="600" y="115" width="150" height="30" rx="4" fill="#162D4A" stroke="#6A8AAA" stroke-width="1"/>
  <text x="675" y="135" text-anchor="middle" fill="#C8D6E8" font-size="9">✋ Frequent Access</text>
</svg>