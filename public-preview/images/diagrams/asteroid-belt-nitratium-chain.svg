<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 280" fill="none">
  <rect width="700" height="280" fill="#1A2533" rx="12"/>
  
  <text x="350" y="35" text-anchor="middle" fill="#00D4AA" font-size="16" font-family="system-ui,sans-serif" font-weight="600">Nitratium Processing Chain</text>
  
  <!-- Nitratium Node -->
  <rect x="25" y="65" width="120" height="75" rx="10" fill="#4A2A4A"/>
  <text x="85" y="95" text-anchor="middle" fill="#CC66CC" font-size="13" font-family="monospace" font-weight="600">Nitratium</text>
  <text x="85" y="115" text-anchor="middle" fill="#AA8899" font-size="11" font-family="monospace">8-12 ore/sec</text>
  
  <line x1="145" y1="102" x2="195" y2="102" stroke="#CC66CC" stroke-width="2"/>
  <polygon points="193,96 203,102 193,108" fill="#CC66CC"/>
  
  <!-- Miner -->
  <rect x="200" y="65" width="110" height="75" rx="10" fill="#3A6B5A"/>
  <text x="255" y="100" text-anchor="middle" fill="#FFFFFF" font-size="13" font-family="monospace" font-weight="600">Miner</text>
  <text x="255" y="118" text-anchor="middle" fill="#AAD4CA" font-size="10" font-family="monospace">Overclocked</text>
  
  <!-- Arrow -->
  <line x1="310" y1="102" x2="360" y2="102" stroke="#00D4AA" stroke-width="2"/>
  <polygon points="358,96 368,102 358,108" fill="#00D4AA"/>
  
  <!-- Dedicated Buffer -->
  <rect x="365" y="65" width="110" height="75" rx="10" fill="#2A3F55"/>
  <text x="420" y="95" text-anchor="middle" fill="#E8A838" font-size="12" font-family="monospace">Dedicated</text>
  <text x="420" y="112" text-anchor="middle" fill="#E8A838" font-size="12" font-family="monospace">Buffer</text>
  <text x="420" y="130" text-anchor="middle" fill="#8899AA" font-size="10" font-family="monospace">200 cap</text>
  
  <!-- Arrow -->
  <line x1="475" y1="102" x2="525" y2="102" stroke="#00D4AA" stroke-width="2"/>
  <polygon points="523,96 533,102 523,108" fill="#00D4AA"/>
  
  <!-- Priority Launcher -->
  <rect x="530" y="55" width="70" height="95" rx="10" fill="#6B3A6B"/>
  <text x="565" y="95" text-anchor="middle" fill="#FFFFFF" font-size="11" font-family="monospace">Priority</text>
  <text x="565" y="112" text-anchor="middle" fill="#FFFFFF" font-size="11" font-family="monospace">Launcher</text>
  <text x="565" y="132" text-anchor="middle" fill="#CCAACC" font-size="10" font-family="monospace">-&gt; Shipyard</text>

  <!-- Warning box -->
  <rect x="25" y="165" width="575" height="50" rx="8" fill="#3A2A1A" stroke="#CC8844" stroke-width="1"/>
  <text x="45" y="188" fill="#E8A838" font-size="12" font-family="system-ui,sans-serif" font-weight="600">Bottleneck Risk</text>
  <text x="170" y="188" fill="#DDBB88" font-size="12" font-family="system-ui,sans-serif">200 Nitratium needed per tier-2 component. Two miners recommended.</text>
  <text x="45" y="208" fill="#AA8855" font-size="11" font-family="system-ui,sans-serif">Never let Nitratium share a launcher with iron/copper. The bulk ore drowns the slow Nitratium feed.</text>

  <!-- Second miner note -->
  <rect x="25" y="230" width="650" height="35" rx="6" fill="#1E2D40" stroke="#8899AA" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="350" y="252" text-anchor="middle" fill="#8899AA" font-size="12" font-family="monospace">Miner 2 (optional, for 2x throughput) -&gt; same buffer/launcher</text>
</svg>
