<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 160" style="background:#1A2533;border-radius:8px;font-family:'Segoe UI',Arial,sans-serif;">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A5F;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#162D4A;stop-opacity:1"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#00D4AA"/>
    </marker>
  </defs>

  <text x="350" y="22" text-anchor="middle" fill="#C8D6E8" font-size="14" font-weight="bold">Station Power Source Strategy</text>

  <!-- Fusion -->
  <rect x="20" y="40" width="180" height="55" rx="8" fill="url(#boxGrad)" stroke="#00D4AA" stroke-width="2"/>
  <text x="110" y="60" text-anchor="middle" fill="#00D4AA" font-size="13" font-weight="bold">⚡ Fusion Reactors</text>
  <text x="110" y="78" text-anchor="middle" fill="#8AACCD" font-size="11">Baseline: 40-50% of demand</text>
  <text x="110" y="92" text-anchor="middle" fill="#6A8AAA" font-size="10">Always on, steady output</text>

  <!-- Arrow -->
  <line x1="200" y1="67" x2="250" y2="67" stroke="#00D4AA" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Grid box -->
  <rect x="255" y="30" width="190" height="75" rx="8" fill="url(#boxGrad)" stroke="#4A9EFF" stroke-width="2"/>
  <text x="350" y="55" text-anchor="middle" fill="#4A9EFF" font-size="12" font-weight="bold">🔌 Station Power Grid</text>
  <text x="350" y="73" text-anchor="middle" fill="#8AACCD" font-size="11">Total demand: Forges +</text>
  <text x="350" y="88" text-anchor="middle" fill="#8AACCD" font-size="11">Defense + Wormholes</text>

  <!-- Antimatter arrow -->
  <line x1="445" y1="67" x2="490" y2="67" stroke="#00D4AA" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Antimatter -->
  <rect x="495" y="40" width="190" height="55" rx="8" fill="url(#boxGrad)" stroke="#D4A0FF" stroke-width="2"/>
  <text x="590" y="60" text-anchor="middle" fill="#D4A0FF" font-size="13" font-weight="bold">⚛️ Antimatter Reactor</text>
  <text x="590" y="78" text-anchor="middle" fill="#8AACCD" font-size="11">Peak: 50-60% of demand</text>
  <text x="590" y="92" text-anchor="middle" fill="#6A8AAA" font-size="10">Auto-scales during raids</text>

  <!-- Solar emergency at bottom -->
  <rect x="255" y="115" width="190" height="35" rx="6" fill="url(#boxGrad)" stroke="#FFB347" stroke-width="1.5"/>
  <text x="350" y="137" text-anchor="middle" fill="#FFB347" font-size="10" font-weight="bold">☀️ Solar Panels — Emergency backup</text>

  <path d="M 255 125 L 220 100 L 200 100" fill="none" stroke="#FFB347" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arrow)"/>

  <text x="350" y="152" text-anchor="middle" fill="#4A6070" font-size="9">Power Source Balance — Outworld Station Guide</text>
</svg>
