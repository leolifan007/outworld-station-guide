  <text x="85" y="117" text-anchor="middle" fill="#FF6B35" font-size="10">Hydrogen Tank</text>
  <line x1="140" y1="112" x2="170" y2="112" stroke="#667788" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="175" y="95" width="110" height="35" rx="4" fill="#2A3A4A" stroke="#00D4AA" stroke-width="1.5"/>
  <text x="230" y="110" text-anchor="middle" fill="#00D4AA" font-size="10">Fuel Cell Synth</text>
  <text x="230" y="124" text-anchor="middle" fill="#8899AA" font-size="9">20 sec</text>
  <line x1="285" y1="112" x2="315" y2="112" stroke="#667788" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="320" y="95" width="110" height="35" rx="4" fill="#1A2A3A" stroke="#00D4AA" stroke-width="1.5"/>
  <text x="375" y="117" text-anchor="middle" fill="#00D4AA" font-size="10" font-weight="bold">Fuel Cells</text>
  <rect x="30" y="145" width="110" height="35" rx="4" fill="#3A2A1A" stroke="#FF6B35" stroke-width="1.5"/>
  <text x="85" y="160" text-anchor="middle" fill="#FF6B35" font-size="10">Methane Tank</text>
  <text x="85" y="174" text-anchor="middle" fill="#8899AA" font-size="9">+ Oxygen</text>
