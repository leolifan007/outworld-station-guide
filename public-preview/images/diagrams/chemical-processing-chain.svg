<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" style="background:#1A2533;font-family:Arial,sans-serif">
  <defs><marker id="a" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#00D4AA"/></marker></defs>
  <text x="400" y="28" text-anchor="middle" fill="#00D4AA" font-size="16" font-weight="bold">Chemical Processing &amp; Refining Chain</text>
