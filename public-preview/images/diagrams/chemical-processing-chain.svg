  <text x="230" y="160" text-anchor="middle" fill="#00D4AA" font-size="10">Carbon Fiber S.</text>
  <text x="230" y="174" text-anchor="middle" fill="#8899AA" font-size="9">30 sec</text>
  <line x1="285" y1="162" x2="315" y2="162" stroke="#667788" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="320" y="145" width="110" height="35" rx="4" fill="#1A2A3A" stroke="#00D4AA" stroke-width="1.5"/>
  <text x="375" y="167" text-anchor="middle" fill="#00D4AA" font-size="10" font-weight="bold">Carbon Fiber</text>
  <rect x="30" y="195" width="110" height="35" rx="4" fill="#3A2A1A" stroke="#FF6B35" stroke-width="1.5"/>
  <text x="85" y="210" text-anchor="middle" fill="#FF6B35" font-size="10">Argon Tank</text>
  <text x="85" y="224" text-anchor="middle" fill="#8899AA" font-size="9">+ Helium-3</text>
  <line x1="140" y1="212" x2="170" y2="212" stroke="#667788" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="175" y="195" width="110" height="35" rx="4" fill="#2A3A4A" stroke="#00D4AA" stroke-width="1.5"/>
