  <rect x="320" y="195" width="110" height="35" rx="4" fill="#1A2A3A" stroke="#00D4AA" stroke-width="1.5"/>
  <text x="375" y="217" text-anchor="middle" fill="#00D4AA" font-size="10" font-weight="bold">Shield Gas</text>
  <rect x="480" y="45" width="280" height="185" rx="6" fill="#1A2A3A" stroke="#4A9EFF" stroke-width="1"/>
  <text x="620" y="65" text-anchor="middle" fill="#4A9EFF" font-size="11" font-weight="bold">Distribution &amp; Usage</text>
  <text x="620" y="85" text-anchor="middle" fill="#E0E0E0" font-size="10">Plastic -> Components, Storage</text>
  <text x="620" y="105" text-anchor="middle" fill="#E0E0E0" font-size="10">Fuel Cells -> Power Plant, Drones</text>
  <text x="620" y="125" text-anchor="middle" fill="#E0E0E0" font-size="10">Coolant -> Fusion Reactors</text>
  <text x="620" y="145" text-anchor="middle" fill="#E0E0E0" font-size="10">Carbon Fiber -> Superalloy</text>
  <text x="620" y="165" text-anchor="middle" fill="#E0E0E0" font-size="10">Fusion Pellets -> Fusion Fuel</text>
  <text x="620" y="185" text-anchor="middle" fill="#E0E0E0" font-size="10">Shield Gas -> Shield Generators</text>
  <text x="620" y="215" text-anchor="middle" fill="#FF6B35" font-size="10">All via Inventory Pair</text>
  <rect x="100" y="295" width="600" height="30" rx="4" fill="#0A2A1A" stroke="#00D4AA" stroke-width="1"/>
  <text x="400" y="315" text-anchor="middle" fill="#00D4AA" font-size="11">Principle: 1 gas type -> 1 synthesizer -> 1 product. Duplicate for scale, not upgrade.</text>
  <rect x="100" y="340" width="600" height="25" rx="4" fill="#2A1A1A" stroke="#FF6B35" stroke-width="1"/>
  <text x="400" y="357" text-anchor="middle" fill="#FF6B35" font-size="10">Start with Plastic + Fuel Cells. Add others as you unlock tech.</text>
</svg>