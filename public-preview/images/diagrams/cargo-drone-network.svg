<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" style="background:#1A2533;font-family:Arial,sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#00D4AA"/></marker>
    <marker id="arrow2" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#FF6B35"/></marker>
  </defs>
  <text x="400" y="30" text-anchor="middle" fill="#00D4AA" font-size="18" font-weight="bold">Cargo Drone Network - Hub and Spoke Topology</text>
  <rect x="300" y="55" width="200" height="50" rx="8" fill="#00D4AA" opacity="0.15" stroke="#00D4AA" stroke-width="2"/>
  <text x="400" y="80" text-anchor="middle" fill="#00D4AA" font-size="14" font-weight="bold">Central Cargo Hub</text>
  <text x="400" y="96" text-anchor="middle" fill="#8899AA" font-size="11">6 dedicated drone ports</text>
  <line x1="400" y1="105" x2="120" y2="175" stroke="#00D4AA" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="4,3"/>
  <line x1="400" y1="105" x2="680" y2="175" stroke="#00D4AA" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="4,3"/>
  <line x1="400" y1="105" x2="120" y2="350" stroke="#00D4AA" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="4,3"/>
  <line x1="400" y1="105" x2="680" y2="350" stroke="#00D4AA" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="4,3"/>
  <line x1="400" y1="105" x2="300" y2="400" stroke="#FF6B35" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="400" y1="105" x2="500" y2="400" stroke="#FF6B35" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <rect x="50" y="155" width="140" height="40" rx="5" fill="#2A3A4A" stroke="#4A9EFF" stroke-width="1.5"/>
  <text x="120" y="180" text-anchor="middle" fill="#4A9EFF" font-size="12">Module A - Iron Plates</text>
  <rect x="610" y="155" width="140" height="40" rx="5" fill="#2A3A4A" stroke="#4A9EFF" stroke-width="1.5"/>
  <text x="680" y="180" text-anchor="middle" fill="#4A9EFF" font-size="12">Module B - Copper Wire</text>
  <rect x="50" y="330" width="140" height="40" rx="5" fill="#2A3A4A" stroke="#4A9EFF" stroke-width="1.5"/>
  <text x="120" y="355" text-anchor="middle" fill="#4A9EFF" font-size="12">Module C - Circuits</text>
  <rect x="610" y="330" width="140" height="40" rx="5" fill="#2A3A4A" stroke="#4A9EFF" stroke-width="1.5"/>
  <text x="680" y="355" text-anchor="middle" fill="#4A9EFF" font-size="12">Module D - Assemblers</text>
  <rect x="270" y="385" width="60" height="30" rx="3" fill="#3A2A1A" stroke="#FF6B35" stroke-width="1"/>
  <text x="300" y="404" text-anchor="middle" fill="#FF6B35" font-size="10">Gas</text>
  <rect x="470" y="385" width="60" height="30" rx="3" fill="#3A2A1A" stroke="#FF6B35" stroke-width="1"/>
  <text x="500" y="404" text-anchor="middle" fill="#FF6B35" font-size="10">Defense</text>
  <text x="400" y="440" text-anchor="middle" fill="#667788" font-size="11">Hub handles 10-15 active routes. Each spoke is a dedicated drone path.</text>
</svg>