<div class="lang-bar">
  <div class="lang-bar-inner">
    <span class="lang-bar-title">🌐</span>
    {{ if eq .Site.Language.Lang "en" }}
      <span class="lang-flag current-lang" title="English">🇺🇸 English</span>
      <a class="lang-flag" href="/zh/" title="中文">🇨🇳 中文</a>
    {{ else }}
      <a class="lang-flag" href="/" title="English">🇺🇸 English</a>
      <span class="lang-flag current-lang" title="中文">🇨🇳 中文</span>
    {{ end }}
  </div>
</div>
