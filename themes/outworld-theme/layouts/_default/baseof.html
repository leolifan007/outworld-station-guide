<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} — {{ .Site.Title }}{{ end }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  <meta name="keywords" content="{{ .Site.Params.keywords }}">
  <link rel="canonical" href="{{ .Permalink }}">
  <link rel="alternate" hreflang="en" href="{{ .Permalink }}">
  <link rel="alternate" hreflang="zh-CN" href="https://translate.google.com/translate?hl=zh-CN&sl=en&u={{ .Permalink }}">
  <link rel="alternate" hreflang="ja" href="https://translate.google.com/translate?hl=ja&sl=en&u={{ .Permalink }}">
  <link rel="alternate" hreflang="x-default" href="{{ .Permalink }}">
  <link rel="stylesheet" href="./css/style.css">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXX" crossorigin="anonymous"></script>
  {{ block "head" . }}{{ end }}
</head>
<body>

<!-- Background stars canvas -->
<div class="bg-canvas">
  <div class="bg-layer"></div>
  <div class="nebula"></div>
  <div class="stars"></div>
</div>

<!-- Mobile sidebar toggle -->
<button class="sidebar-toggle" id="sidebarToggle">☰</button>
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="page-wrap">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon">🛸</div>
      <div>
        <div class="logo-text">Outworld Station</div>
        <div class="logo-sub">攻略站 · Guide</div>
      </div>
    </div>

    <nav class="sidebar-nav" id="sidebarNav">
      <div class="section-label">指南</div>
      <a href="/" class="{{ if .IsHome }}active{{ end }}"><span class="nav-icon">🏠</span> 首页</a>
      <a href="/beginner/" class="{{ if eq .RelPermalink "/beginner/" }}active{{ end }}"><span class="nav-icon">🚀</span> 新手入门</a>
      <a href="/automation-guide/" class="{{ if eq .RelPermalink "/automation-guide/" }}active{{ end }}"><span class="nav-icon">⚙️</span> 自动化系统</a>
      <a href="/building-tutorial/" class="{{ if eq .RelPermalink "/building-tutorial/" }}active{{ end }}"><span class="nav-icon">🏗️</span> 全建筑教程</a>
      <a href="/resources/" class="{{ if eq .RelPermalink "/resources/" }}active{{ end }}"><span class="nav-icon">🪨</span> 资源全说明</a>

      <div class="section-label">互动</div>
      <a href="/map/" class="{{ if eq .RelPermalink "/map/" }}active{{ end }}"><span class="nav-icon">🌌</span> 星系星图</a>

      <div class="section-label">更多</div>
      <a href="/contact/" class="{{ if eq .RelPermalink "/contact/" }}active{{ end }}"><span class="nav-icon">📧</span> 联系</a>
      <a href="/privacy/" class="{{ if eq .RelPermalink "/privacy/" }}active{{ end }}"><span class="nav-icon">🔒</span> 隐私政策</a>
    </nav>

    <div class="sidebar-steam">
      <a href="{{ .Site.Params.steam_url }}" target="_blank" rel="noopener">🎮 Steam 页面</a>
    </div>

    <div class="sidebar-footer">
      non-official · player community
    </div>
  </aside>

  <!-- MAIN -->
  <div class="main-area">
    {{ partial "lang-bar" . }}
    <main>
      {{ block "main" . }}{{ end }}
    </main>
    {{ partial "footer" . }}
  </div>

</div>

{{ partial "cookie-banner" . }}

<script>
(function(){
  // Sidebar toggle
  var btn=document.getElementById('sidebarToggle');
  var sidebar=document.querySelector('.sidebar');
  var overlay=document.getElementById('sidebarOverlay');
  var nav=document.getElementById('sidebarNav');
  function open(){sidebar.classList.add('open');overlay.classList.add('open')}
  function close(){sidebar.classList.remove('open');overlay.classList.remove('open')}
  if(btn){btn.onclick=function(e){e.stopPropagation();sidebar.classList.contains('open')?close():open()}}
  if(overlay){overlay.onclick=close}
  if(nav){nav.onclick=function(){if(window.innerWidth<=768)close()}}
  // Active sidebar link
  document.querySelectorAll('.sidebar-nav a').forEach(function(link){
    if(link.getAttribute('href')===window.location.pathname)link.classList.add('active');
  });
})();
</script>
</body>
</html>
