<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" style="background:#1A2533;border-radius:8px;font-family:'Segoe UI',Arial,sans-serif;">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A5F;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#162D4A;stop-opacity:1"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#00D4AA"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="25" text-anchor="middle" fill="#C8D6E8" font-size="14" font-weight="bold">Main Bus Layout</text>

  <!-- Raw Materials Row -->
  <rect x="50" y="45" width="80" height="35" rx="6" fill="url(#boxGrad)" stroke="#FFB347" stroke-width="1.5"/>
  <text x="90" y="67" text-anchor="middle" fill="#FFB347" font-size="10" font-weight="bold">Iron Ore</text>

  <rect x="160" y="45" width="80" height="35" rx="6" fill="url(#boxGrad)" stroke="#FFB347" stroke-width="1.5"/>
  <text x="200" y="67" text-anchor="middle" fill="#FFB347" font-size="10" font-weight="bold">Copper Ore</text>

  <rect x="270" y="45" width="80" height="35" rx="6" fill="url(#boxGrad)" stroke="#FFB347" stroke-width="1.5"/>
  <text x="310" y="67" text-anchor="middle" fill="#FFB347" font-size="10" font-weight="bold">Titanium</text>

  <rect x="380" y="45" width="80" height="35" rx="6" fill="url(#boxGrad)" stroke="#FFB347" stroke-width="1.5"/>
  <text x="420" y="67" text-anchor="middle" fill="#FFB347" font-size="10" font-weight="bold">Carbon</text>

  <!-- Arrows down -->
  <line x1="90" y1="80" x2="90" y2="100" stroke="#00D4AA" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="200" y1="80" x2="200" y2="100" stroke="#00D4AA" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="310" y1="80" x2="310" y2="100" stroke="#00D4AA" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="420" y1="80" x2="420" y2="100" stroke="#00D4AA" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Processing Row -->
  <rect x="50" y="110" width="80" height="35" rx="6" fill="url(#boxGrad)" stroke="#4A9EFF" stroke-width="1.5"/>
  <text x="90" y="132" text-anchor="middle" fill="#4A9EFF" font-size="9">Smelters</text>

  <rect x="160" y="110" width="80" height="35" rx="6" fill="url(#boxGrad)" stroke="#4A9EFF" stroke-width="1.5"/>
  <text x="200" y="132" text-anchor="middle" fill="#4A9EFF" font-size="9">Smelters</text>

  <rect x="270" y="110" width="80" height="35" rx="6" fill="url(#boxGrad)" stroke="#4A9EFF" stroke-width="1.5"/>
  <text x="310" y="132" text-anchor="middle" fill="#4A9EFF" font-size="9">Processors</text>

  <rect x="380" y="110" width="80" height="35" rx="6" fill="url(#boxGrad)" stroke="#4A9EFF" stroke-width="1.5"/>
  <text x="420" y="132" text-anchor="middle" fill="#4A9EFF" font-size="9">Chemistry</text>

  <!-- Arrows down to production -->
  <line x1="90" y1="145" x2="90" y2="165" stroke="#00D4AA" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="200" y1="145" x2="200" y2="165" stroke="#00D4AA" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="310" y1="145" x2="310" y2="165" stroke="#00D4AA" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="420" y1="145" x2="420" y2="165" stroke="#00D4AA" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Main Production Area -->
  <rect x="50" y="170" width="410" height="25" rx="6" fill="url(#boxGrad)" stroke="#00D4AA" stroke-width="2"/>
  <text x="255" y="187" text-anchor="middle" fill="#00D4AA" font-size="11" font-weight="bold">Main Production Area</text>

  <!-- Bus indicator -->
  <rect x="520" y="45" width="230" height="150" rx="8" fill="none" stroke="#2A3A4C" stroke-width="1" stroke-dasharray="5,5"/>
  <text x="635" y="70" text-anchor="middle" fill="#6A8AAA" font-size="10">Main Bus</text>
  <text x="635" y="90" text-anchor="middle" fill="#6A8AAA" font-size="9">(central belt highway)</text>
  <line x1="560" y1="110" x2="560" y2="170" stroke="#00D4AA" stroke-width="3"/>
  <line x1="620" y1="110" x2="620" y2="170" stroke="#4A9EFF" stroke-width="3"/>
  <line x1="680" y1="110" x2="680" y2="170" stroke="#FFB347" stroke-width="3"/>
  <text x="635" y="185" text-anchor="middle" fill="#6A8AAA" font-size="8">Materials flow down</text>
</svg>