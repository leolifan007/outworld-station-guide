<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300">
  <rect width="600" height="300" fill="#1A2533" rx="8"/>
  <text x="300" y="30" fill="#00D4AA" font-family="Arial,sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Hydrogen Production Chain Flow</text>
  <!-- Cloud Miner -->
  <rect x="40" y="65" width="100" height="50" fill="#2A3F55" rx="6" stroke="#4ECDC4" stroke-width="2"/>
  <text x="90" y="85" fill="#4ECDC4" font-family="Arial,sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Cloud Miner</text>
  <text x="90" y="102" fill="#8899AA" font-family="Arial,sans-serif" font-size="10" text-anchor="middle">46 H2/min</text>
  <!-- Arrow -->
  <line x1="140" y1="90" x2="190" y2="90" stroke="#B0C4D8" stroke-width="2" marker-end="url(#arrowGray)"/>
  <text x="165" y="82" fill="#8899AA" font-family="Arial,sans-serif" font-size="9" text-anchor="middle">Pipe</text>
  <!-- Buffer Tank -->
  <rect x="190" y="63" width="100" height="55" fill="#2A3F55" rx="6" stroke="#FFD93D" stroke-width="2"/>
  <text x="240" y="85" fill="#FFD93D" font-family="Arial,sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Buffer Tank</text>
  <text x="240" y="102" fill="#8899AA" font-family="Arial,sans-serif" font-size="10" text-anchor="middle">2000 capacity</text>
  <!-- Arrow -->
  <line x1="290" y1="90" x2="340" y2="90" stroke="#B0C4D8" stroke-width="2" marker-end="url(#arrowGray)"/>
  <!-- Reactors cluster -->
  <rect x="340" y="55" width="100" height="70" fill="#2A3F55" rx="6" stroke="#FF6B35" stroke-width="2"/>
  <text x="390" y="75" fill="#FF6B35" font-family="Arial,sans-serif" font-size="11" font-weight="bold" text-anchor="middle">H2 Reactors</text>
  <text x="390" y="92" fill="#8899AA" font-family="Arial,sans-serif" font-size="10" text-anchor="middle">6 Small + 2 Large</text>
  <text x="390" y="107" fill="#8899AA" font-family="Arial,sans-serif" font-size="10" text-anchor="middle">~2.2 MW</text>
  <!-- Arrow -->
  <line x1="440" y1="90" x2="490" y2="90" stroke="#B0C4D8" stroke-width="2" marker-end="url(#arrowGray)"/>
  <!-- Power Grid -->
  <rect x="490" y="65" width="80" height="50" fill="#00D4AA" rx="6" opacity="0.8"/>
  <text x="530" y="85" fill="#1A2533" font-family="Arial,sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Power</text>
  <text x="530" y="100" fill="#1A2533" font-family="Arial,sans-serif" font-size="10" text-anchor="middle">Grid</text>
  <!-- Pipe throughput note -->
  <g transform="translate(40, 160)">
    <rect x="0" y="0" width="520" height="55" fill="#1E3045" rx="6" stroke="#8899AA" stroke-width="1"/>
    <text x="260" y="20" fill="#B0C4D8" font-family="Arial,sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Pipe Throughput Limits</text>
    <text x="85" y="42" fill="#8899AA" font-family="Arial,sans-serif" font-size="11">Base pipe: 30 H2/min</text>
    <text x="260" y="42" fill="#8899AA" font-family="Arial,sans-serif" font-size="11">Mk2 pipe: 60 H2/min</text>
    <text x="435" y="42" fill="#8899AA" font-family="Arial,sans-serif" font-size="11">Mk3 pipe: 120 H2/min</text>
  </g>
  <defs>
    <marker id="arrowGray" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#B0C4D8"/>
    </marker>
  </defs>
</svg>
