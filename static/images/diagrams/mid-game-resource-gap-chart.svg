<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="100%" height="100%">
  <rect width="600" height="420" fill="#1A2533"/>
  <defs>
    <linearGradient id="titaniumGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A9EFF"/>
      <stop offset="100%" stop-color="#2A7EDF"/>
    </linearGradient>
    <linearGradient id="circuitGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF5252"/>
      <stop offset="100%" stop-color="#D03030"/>
    </linearGradient>
    <linearGradient id="superalloyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#E09000"/>
    </linearGradient>
    <linearGradient id="solGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00D4AA"/>
      <stop offset="100%" stop-color="#009977"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="300" y="32" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="bold">Three Mid-Game Bottlenecks</text>
  <line x1="140" y1="40" x2="460" y2="40" stroke="#FF5252" stroke-width="1.5" opacity="0.5"/>
  <text x="300" y="56" text-anchor="middle" fill="#8A9BAE" font-family="sans-serif" font-size="10">Level 3-4 transition: where most runs stall</text>

  <!-- ===== BOTTLENECK 1: Titanium ===== -->
  <g transform="translate(25, 75)">
    <rect x="0" y="0" width="170" height="300" rx="8" fill="#0F1A26" stroke="#4A9EFF" stroke-width="1.5"/>

    <!-- Title bar -->
    <rect x="0" y="0" width="170" height="36" rx="8" fill="url(#titaniumGrad)"/>
    <rect x="0" y="28" width="170" height="8" rx="0" fill="url(#titaniumGrad)"/>
    <text x="85" y="16" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="11" font-weight="bold">#1 Titanium Shortage</text>
    <text x="85" y="28" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="8" opacity="0.8">Drill-Refinery gap</text>

    <!-- Icon -->
    <text x="85" y="75" text-anchor="middle" font-family="sans-serif" font-size="28">⛏️</text>

    <!-- Stats display -->
    <rect x="15" y="90" width="140" height="55" rx="4" fill="#1A2A3D"/>
    <text x="85" y="106" text-anchor="middle" fill="#4A9EFF" font-family="sans-serif" font-size="10" font-weight="bold">Supply vs Demand</text>
    <text x="25" y="122" fill="#B0C4DE" font-family="sans-serif" font-size="9">Demand: 120/min</text>
    <text x="25" y="138" fill="#B0C4DE" font-family="sans-serif" font-size="9">Supply: ~45/min</text>

    <!-- Gap bar visualization -->
    <text x="85" y="162" text-anchor="middle" fill="#8A9BAE" font-family="sans-serif" font-size="8">Supply gap</text>
    <rect x="25" y="170" width="120" height="24" rx="4" fill="#2A3D4F"/>
    <rect x="25" y="170" width="45" height="24" rx="4" fill="#4A9EFF"/>
    <rect x="25" y="170" width="120" height="24" rx="4" fill="none" stroke="#4A9EFF" stroke-width="1"/>
    <text x="85" y="186" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="11" font-weight="bold">-63%</text>
    <text x="85" y="202" text-anchor="middle" fill="#FF5252" font-family="sans-serif" font-size="8" opacity="0.7">Critical deficit</text>

    <!-- Impact list -->
    <text x="15" y="222" fill="#4A9EFF" font-family="sans-serif" font-size="9" font-weight="bold">Impact:</text>
    <text x="15" y="238" fill="#B0C4DE" font-family="sans-serif" font-size="8">▸ T2 upgrades stalled</text>
    <text x="15" y="252" fill="#B0C4DE" font-family="sans-serif" font-size="8">▸ Pipe network delayed</text>
    <text x="15" y="266" fill="#B0C4DE" font-family="sans-serif" font-size="8">▸ Research slowed</text>

    <!-- Solution arrow -->
    <g transform="translate(15, 275)">
      <path d="M 0,0 L 140,0" stroke="#00D4AA" stroke-width="1.5" stroke-dasharray="4,2"/>
      <polygon points="140,0 134,-3 134,3" fill="#00D4AA"/>
    </g>
    <text x="85" y="290" text-anchor="middle" fill="#00D4AA" font-family="sans-serif" font-size="9" font-weight="bold">✓ Add 3 more drills</text>
  </g>

  <!-- ===== BOTTLENECK 2: Circuits ===== -->
  <g transform="translate(215, 75)">
    <rect x="0" y="0" width="170" height="300" rx="8" fill="#0F1A26" stroke="#FF5252" stroke-width="1.5"/>

    <rect x="0" y="0" width="170" height="36" rx="8" fill="url(#circuitGrad)"/>
    <rect x="0" y="28" width="170" height="8" rx="0" fill="url(#circuitGrad)"/>
    <text x="85" y="16" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="11" font-weight="bold">#2 Circuit Starvation</text>
    <text x="85" y="28" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="8" opacity="0.8">Assembler bottleneck</text>

    <text x="85" y="75" text-anchor="middle" font-family="sans-serif" font-size="28">🔌</text>

    <rect x="15" y="90" width="140" height="55" rx="4" fill="#2A1A1A"/>
    <text x="85" y="106" text-anchor="middle" fill="#FF5252" font-family="sans-serif" font-size="10" font-weight="bold">Supply vs Demand</text>
    <text x="25" y="122" fill="#B0C4DE" font-family="sans-serif" font-size="9">Demand: 80/min</text>
    <text x="25" y="138" fill="#B0C4DE" font-family="sans-serif" font-size="9">Supply: ~20/min</text>

    <text x="85" y="162" text-anchor="middle" fill="#8A9BAE" font-family="sans-serif" font-size="8">Supply gap</text>
    <rect x="25" y="170" width="120" height="24" rx="4" fill="#2A3D4F"/>
    <rect x="25" y="170" width="30" height="24" rx="4" fill="#FF5252"/>
    <rect x="25" y="170" width="120" height="24" rx="4" fill="none" stroke="#FF5252" stroke-width="1"/>
    <text x="85" y="186" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="11" font-weight="bold">-75%</text>
    <text x="85" y="202" text-anchor="middle" fill="#FF5252" font-family="sans-serif" font-size="8" opacity="0.7">Severe bottleneck</text>

    <text x="15" y="222" fill="#FF5252" font-family="sans-serif" font-size="9" font-weight="bold">Impact:</text>
    <text x="15" y="238" fill="#B0C4DE" font-family="sans-serif" font-size="8">▸ L4 requirements</text>
    <text x="15" y="252" fill="#B0C4DE" font-family="sans-serif" font-size="8">▸ Automation blocked</text>
    <text x="15" y="266" fill="#B0C4DE" font-family="sans-serif" font-size="8">▸ Turret production</text>

    <g transform="translate(15, 275)">
      <path d="M 0,0 L 140,0" stroke="#00D4AA" stroke-width="1.5" stroke-dasharray="4,2"/>
      <polygon points="140,0 134,-3 134,3" fill="#00D4AA"/>
    </g>
    <text x="85" y="290" text-anchor="middle" fill="#00D4AA" font-family="sans-serif" font-size="9" font-weight="bold">✓ Build 2nd Assembler</text>
  </g>

  <!-- ===== BOTTLENECK 3: Superalloy ===== -->
  <g transform="translate(405, 75)">
    <rect x="0" y="0" width="170" height="300" rx="8" fill="#0F1A26" stroke="#FFB300" stroke-width="1.5"/>

    <rect x="0" y="0" width="170" height="36" rx="8" fill="url(#superalloyGrad)"/>
    <rect x="0" y="28" width="170" height="8" rx="0" fill="url(#superalloyGrad)"/>
    <text x="85" y="16" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="11" font-weight="bold">#3 Superalloy Cost</text>
    <text x="85" y="28" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="8" opacity="0.8">High setup investment</text>

    <text x="85" y="75" text-anchor="middle" font-family="sans-serif" font-size="28">🔥</text>

    <rect x="15" y="90" width="140" height="55" rx="4" fill="#3D301A"/>
    <text x="85" y="106" text-anchor="middle" fill="#FFB300" font-family="sans-serif" font-size="10" font-weight="bold">Setup Cost</text>
    <text x="25" y="122" fill="#B0C4DE" font-family="sans-serif" font-size="9">Research: 400</text>
    <text x="25" y="138" fill="#B0C4DE" font-family="sans-serif" font-size="9">Components: 200</text>

    <text x="85" y="162" text-anchor="middle" fill="#8A9BAE" font-family="sans-serif" font-size="8">ROI timeline</text>
    <rect x="25" y="170" width="120" height="24" rx="4" fill="#2A3D4F"/>
    <!-- Gradient fill showing partial ROI -->
    <rect x="25" y="170" width="35" height="24" rx="4" fill="#FF5252" opacity="0.4"/>
    <rect x="60" y="170" width="35" height="24" rx="0" fill="#FFB300" opacity="0.4"/>
    <rect x="95" y="170" width="50" height="24" rx="0" fill="#00D4AA" opacity="0.4"/>
    <rect x="25" y="170" width="120" height="24" rx="4" fill="none" stroke="#FFB300" stroke-width="1"/>
    <text x="85" y="186" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="9">~20 min ROI</text>
    <text x="85" y="202" text-anchor="middle" fill="#FFB300" font-family="sans-serif" font-size="8" opacity="0.7">High upfront cost</text>

    <text x="15" y="222" fill="#FFB300" font-family="sans-serif" font-size="9" font-weight="bold">Impact:</text>
    <text x="15" y="238" fill="#B0C4DE" font-family="sans-serif" font-size="8">▸ Delayed T3 unlocks</text>
    <text x="15" y="252" fill="#B0C4DE" font-family="sans-serif" font-size="8">▸ Power upgrade block</text>
    <text x="15" y="266" fill="#B0C4DE" font-family="sans-serif" font-size="8">▸ Export bottleneck</text>

    <g transform="translate(15, 275)">
      <path d="M 0,0 L 140,0" stroke="#00D4AA" stroke-width="1.5" stroke-dasharray="4,2"/>
      <polygon points="140,0 134,-3 134,3" fill="#00D4AA"/>
    </g>
    <text x="85" y="290" text-anchor="middle" fill="#00D4AA" font-family="sans-serif" font-size="9" font-weight="bold">✓ Salvage for parts first</text>
  </g>

  <!-- Bottom summary -->
  <rect x="25" y="385" width="550" height="28" rx="6" fill="#0F1A26" stroke="#FF5252" stroke-width="1" opacity="0.5"/>
  <text x="300" y="403" text-anchor="middle" fill="#8A9BAE" font-family="sans-serif" font-size="10">These three bottlenecks compound. Solve Titanium → Circuits → Superalloy in order for smooth progression.</text>
</svg>