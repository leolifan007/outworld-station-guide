<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A2533"/>
      <stop offset="100%" stop-color="#0f1a24"/>
    </linearGradient>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00D4AA"/>
      <stop offset="100%" stop-color="#00b894"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3044"/>
      <stop offset="100%" stop-color="#162535"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a6a85"/>
    </marker>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="800" height="520" fill="url(#bg)" rx="8"/>
  <rect x="20" y="20" width="760" height="44" rx="4" fill="url(#hdr)"/>
  <text x="400" y="49" text-anchor="middle" fill="#0f1a24" font-weight="700" font-size="16">De-Energized Matter - New v1.1.1.0 Alternate Recipe</text>

  <!-- Input -->
  <rect x="40" y="90" width="220" height="120" rx="8" fill="url(#box)" stroke="#4a90d9" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="150" y="112" text-anchor="middle" fill="#4a90d9" font-weight="700" font-size="13">Inputs</text>
  <text x="150" y="134" text-anchor="middle" fill="#C8D6E8" font-size="11">Energized matter product</text>
  <text x="150" y="152" text-anchor="middle" fill="#C8D6E8" font-size="11">Stabilizer (check card)</text>
  <text x="150" y="170" text-anchor="middle" fill="#C8D6E8" font-size="11">Power (continuous)</text>

  <!-- Converter -->
  <rect x="310" y="90" width="180" height="120" rx="8" fill="#1E3A2E" stroke="#00D4AA" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="130" text-anchor="middle" fill="#00D4AA" font-weight="700" font-size="13">Converter</text>
  <text x="400" y="150" text-anchor="middle" fill="#C8D6E8" font-size="11">Runs continuously</text>
  <text x="400" y="168" text-anchor="middle" fill="#C8D6E8" font-size="11">1 converter per</text>
  <text x="400" y="184" text-anchor="middle" fill="#C8D6E8" font-size="11">stabilizer source</text>

  <!-- Output -->
  <rect x="540" y="90" width="220" height="120" rx="8" fill="url(#box)" stroke="#f0c040" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="650" y="112" text-anchor="middle" fill="#f0c040" font-weight="700" font-size="13">Output</text>
  <text x="650" y="134" text-anchor="middle" fill="#C8D6E8" font-size="11">De-Energized Matter</text>
  <text x="650" y="152" text-anchor="middle" fill="#C8D6E8" font-size="11">Storable + beltable</text>
  <text x="650" y="170" text-anchor="middle" fill="#C8D6E8" font-size="11">No exotic gas needed</text>
  <text x="650" y="188" text-anchor="middle" fill="#6A8AAA" font-size="10">after production</text>

  <line x1="260" y1="150" x2="308" y2="150" stroke="#4a6a85" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="490" y1="150" x2="538" y2="150" stroke="#4a6a85" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Buffer split -->
  <rect x="240" y="250" width="320" height="52" rx="8" fill="url(#box)" stroke="#4a6a85" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="400" y="272" text-anchor="middle" fill="#C8D6E8" font-size="12" font-weight="600">Exotic line output - split 50/50 to start</text>
  <text x="400" y="290" text-anchor="middle" fill="#6A8AAA" font-size="10">Watch Matter Printer starve time, then adjust split</text>

  <!-- Two consumers -->
  <rect x="80" y="340" width="280" height="110" rx="8" fill="url(#box)" stroke="#00D4AA" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="220" y="362" text-anchor="middle" fill="#00D4AA" font-weight="700" font-size="13">Direct Consumers</text>
  <text x="220" y="384" text-anchor="middle" fill="#C8D6E8" font-size="11">Matter Printer bursts</text>
  <text x="220" y="402" text-anchor="middle" fill="#C8D6E8" font-size="11">Advanced recipes</text>
  <text x="220" y="420" text-anchor="middle" fill="#C8D6E8" font-size="11">Live exotic gas feed</text>

  <rect x="440" y="340" width="280" height="110" rx="8" fill="url(#box)" stroke="#f0c040" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="580" y="362" text-anchor="middle" fill="#f0c040" font-weight="700" font-size="13">Buffer Path</text>
  <text x="580" y="384" text-anchor="middle" fill="#C8D6E8" font-size="11">De-Energized buffer</text>
  <text x="580" y="402" text-anchor="middle" fill="#C8D6E8" font-size="11">Bursts draw from buffer</text>
  <text x="580" y="420" text-anchor="middle" fill="#C8D6E8" font-size="11">No live gas dependency</text>

  <line x1="320" y1="276" x2="220" y2="338" stroke="#4a6a85" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="480" y1="276" x2="580" y2="338" stroke="#4a6a85" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="200" y="470" width="400" height="34" rx="8" fill="#1E3A2E" stroke="#00D4AA" stroke-width="1"/>
  <text x="400" y="492" text-anchor="middle" fill="#00D4AA" font-size="12" font-weight="600">Verdict: a buffer enabler, not a throughput booster</text>
</svg>
