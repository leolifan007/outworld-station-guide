<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280">
  <rect width="600" height="280" fill="#1A2533" rx="8"/>
  <text x="300" y="30" fill="#00D4AA" font-family="Arial,sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Buffer Impact on Assembly Uptime</text>

  <!-- Bar chart -->
  <g transform="translate(60, 60)">
    <!-- Y axis -->
    <line x1="30" y1="0" x2="30" y2="160" stroke="#8899AA" stroke-width="1"/>
    <!-- X axis -->
    <line x1="30" y1="160" x2="480" y2="160" stroke="#8899AA" stroke-width="1"/>
    <!-- Y labels -->
    <text x="22" y="162" fill="#8899AA" font-family="Arial,sans-serif" font-size="9" text-anchor="end">0%</text>
    <text x="22" y="82" fill="#8899AA" font-family="Arial,sans-serif" font-size="9" text-anchor="end">50%</text>
    <text x="22" y="2" fill="#8899AA" font-family="Arial,sans-serif" font-size="9" text-anchor="end">100%</text>

    <!-- Group 1: 1 Smelter -> 1 Assembler -->
    <rect x="60" y="14" width="60" height="146" fill="#2A3F55" rx="2" stroke="#8899AA" stroke-width="1"/>
    <text x="90" y="170" fill="#8899AA" font-family="Arial,sans-serif" font-size="9" text-anchor="middle">1:1</text>
    <!-- No buffer bar -->
    <rect x="65" y="128" width="22" height="32" fill="#FF6B35" rx="2" opacity="0.7"/>
    <text x="76" y="126" fill="#FF6B35" font-family="Arial,sans-serif" font-size="8" text-anchor="middle">92</text>
    <!-- Buffer bar -->
    <rect x="93" y="118" width="22" height="42" fill="#00D4AA" rx="2" opacity="0.7"/>
    <text x="104" y="116" fill="#00D4AA" font-family="Arial,sans-serif" font-size="8" text-anchor="middle">97</text>

    <!-- Group 2: 1 Smelter -> 3 Assemblers -->
    <rect x="145" y="14" width="80" height="146" fill="#2A3F55" rx="2" stroke="#8899AA" stroke-width="1"/>
    <text x="185" y="170" fill="#8899AA" font-family="Arial,sans-serif" font-size="9" text-anchor="middle">1:3</text>
    <rect x="152" y="156" width="25" height="4" fill="#FF6B35" rx="2" opacity="0.7"/>
    <text x="165" y="153" fill="#FF6B35" font-family="Arial,sans-serif" font-size="8" text-anchor="middle">61</text>
    <rect x="188" y="118" width="25" height="42" fill="#00D4AA" rx="2" opacity="0.7"/>
    <text x="201" y="116" fill="#00D4AA" font-family="Arial,sans-serif" font-size="8" text-anchor="middle">89</text>

    <!-- Group 3: 2 Smelters -> 6 Assemblers -->
    <rect x="250" y="14" width="80" height="146" fill="#2A3F55" rx="2" stroke="#8899AA" stroke-width="1"/>
    <text x="290" y="170" fill="#8899AA" font-family="Arial,sans-serif" font-size="9" text-anchor="middle">2:6</text>
    <rect x="257" y="163" width="25" height="-3" fill="#FF6B35" rx="2" opacity="0.7"/>
    <text x="270" y="166" fill="#FF6B35" font-family="Arial,sans-serif" font-size="8" text-anchor="middle">55</text>
    <rect x="293" y="119" width="25" height="41" fill="#00D4AA" rx="2" opacity="0.7"/>
    <text x="306" y="116" fill="#00D4AA" font-family="Arial,sans-serif" font-size="8" text-anchor="middle">86</text>

    <!-- Long connector -->
    <rect x="355" y="14" width="100" height="146" fill="#2A3F55" rx="2" stroke="#8899AA" stroke-width="1"/>
    <text x="405" y="170" fill="#8899AA" font-family="Arial,sans-serif" font-size="9" text-anchor="middle">Long Connector</text>
    <rect x="362" y="166" width="25" height="-6" fill="#FF6B35" rx="2" opacity="0.7"/>
    <text x="375" y="171" fill="#FF6B35" font-family="Arial,sans-serif" font-size="8" text-anchor="middle">45</text>
    <rect x="410" y="132" width="25" height="28" fill="#00D4AA" rx="2" opacity="0.7"/>
    <text x="423" y="130" fill="#00D4AA" font-family="Arial,sans-serif" font-size="8" text-anchor="middle">78</text>
  </g>

  <!-- Legend -->
  <g transform="translate(60, 245)">
    <rect x="0" y="0" width="12" height="12" fill="#FF6B35" rx="2" opacity="0.7"/>
    <text x="18" y="10" fill="#B0C4D8" font-family="Arial,sans-serif" font-size="10">No Buffer</text>
    <rect x="120" y="0" width="12" height="12" fill="#00D4AA" rx="2" opacity="0.7"/>
    <text x="138" y="10" fill="#B0C4D8" font-family="Arial,sans-serif" font-size="10">With Buffer</text>
  </g>
</svg>
