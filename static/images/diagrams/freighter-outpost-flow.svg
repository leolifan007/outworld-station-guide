<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" style="background:#1A2533;border-radius:8px;font-family:'Segoe UI',Arial,sans-serif;">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A5F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#162D4A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D4AA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00A8E8;stop-opacity:1" />
    </linearGradient>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00D4AA" />
    </marker>
    <marker id="arrowhead2" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4A9EFF" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="32" text-anchor="middle" fill="#C8D6E8" font-size="18" font-weight="bold">Freighter Mining Outpost Setup</text>

  <!-- Main Station box -->
  <rect x="300" y="55" width="200" height="55" rx="8" fill="url(#boxGrad)" stroke="#00D4AA" stroke-width="2"/>
  <text x="400" y="80" text-anchor="middle" fill="#00D4AA" font-size="14" font-weight="bold">🏠 Main Station</text>
  <text x="400" y="98" text-anchor="middle" fill="#8AACCD" font-size="11">Build the Freighter Dock here</text>

  <!-- Step 1 arrow -->
  <line x1="400" y1="110" x2="400" y2="140" stroke="#00D4AA" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="412" y="128" fill="#6A8AAA" font-size="10">Step 1</text>

  <!-- Freighter Dock box -->
  <rect x="280" y="145" width="240" height="50" rx="8" fill="url(#boxGrad)" stroke="#4A9EFF" stroke-width="2"/>
  <text x="400" y="167" text-anchor="middle" fill="#4A9EFF" font-size="13" font-weight="bold">🚢 Freighter Dock</text>
  <text x="400" y="184" text-anchor="middle" fill="#8AACCD" font-size="11">Assign freighters to the dock</text>

  <!-- Step 2 arrow -->
  <line x1="400" y1="195" x2="400" y2="225" stroke="#00D4AA" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="412" y="213" fill="#6A8AAA" font-size="10">Step 2</text>

  <!-- Import/Export section -->
  <rect x="170" y="230" width="460" height="60" rx="8" fill="url(#boxGrad)" stroke="#FFB347" stroke-width="2"/>
  <text x="400" y="253" text-anchor="middle" fill="#FFB347" font-size="13" font-weight="bold">📦 Import / Export Containers</text>
  <text x="400" y="270" text-anchor="middle" fill="#8AACCD" font-size="11">Import = supplies go OUT | Export = ore comes BACK</text>
  <text x="400" y="283" text-anchor="middle" fill="#6A8AAA" font-size="10">⚠️ Connect miner to Export, not Import!</text>

  <!-- Branch arrows to outposts -->
  <line x1="250" y1="290" x2="170" y2="345" stroke="#4A9EFF" stroke-width="2" marker-end="url(#arrowhead2)"/>
  <line x1="400" y1="290" x2="400" y2="345" stroke="#4A9EFF" stroke-width="2" marker-end="url(#arrowhead2)"/>
  <line x1="550" y1="290" x2="630" y2="345" stroke="#4A9EFF" stroke-width="2" marker-end="url(#arrowhead2)"/>

  <text x="210" y="318" fill="#6A8AAA" font-size="10">Mk3+</text>
  <text x="410" y="318" fill="#6A8AAA" font-size="10">Mk3+</text>
  <text x="580" y="318" fill="#6A8AAA" font-size="10">Mk3+</text>

  <text x="160" y="310" fill="#6A8AAA" font-size="9">Step 3:</text>
  <text x="160" y="322" fill="#6A8AAA" font-size="9">Route</text>

  <!-- Mining Outpost 1 -->
  <rect x="90" y="350" width="160" height="65" rx="8" fill="url(#boxGrad)" stroke="#00D4AA" stroke-width="1.5"/>
  <text x="170" y="373" text-anchor="middle" fill="#00D4AA" font-size="12" font-weight="bold">⛏ Outpost 1</text>
  <text x="170" y="390" text-anchor="middle" fill="#8AACCD" font-size="10">Miner → Export</text>
  <text x="170" y="405" text-anchor="middle" fill="#8AACCD" font-size="10">+ 1 Turret + Ammo</text>

  <!-- Mining Outpost 2 -->
  <rect x="320" y="350" width="160" height="65" rx="8" fill="url(#boxGrad)" stroke="#00D4AA" stroke-width="1.5"/>
  <text x="400" y="373" text-anchor="middle" fill="#00D4AA" font-size="12" font-weight="bold">⛏ Outpost 2</text>
  <text x="400" y="390" text-anchor="middle" fill="#8AACCD" font-size="10">Miner → Export</text>
  <text x="400" y="405" text-anchor="middle" fill="#8AACCD" font-size="10">+ 1 Turret + Ammo</text>

  <!-- Mining Outpost 3 -->
  <rect x="550" y="350" width="160" height="65" rx="8" fill="url(#boxGrad)" stroke="#00D4AA" stroke-width="1.5"/>
  <text x="630" y="373" text-anchor="middle" fill="#00D4AA" font-size="12" font-weight="bold">⛏ Outpost 3</text>
  <text x="630" y="390" text-anchor="middle" fill="#8AACCD" font-size="10">Miner → Export</text>
  <text x="630" y="405" text-anchor="middle" fill="#8AACCD" font-size="10">+ 1 Turret + Ammo</text>

  <!-- Bottom tip -->
  <text x="400" y="450" text-anchor="middle" fill="#6A8AAA" font-size="11">💡 Tip: Start with 1 outpost, then scale to 3+ once freighter routes are stable</text>

  <!-- Footer -->
  <text x="400" y="485" text-anchor="middle" fill="#4A6070" font-size="9">Outworld Station Guide — Freighter Mining Setup Flow</text>
</svg>
