<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A2533"/>
      <stop offset="100%" stop-color="#0f1a24"/>
    </linearGradient>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00D4AA"/>
      <stop offset="100%" stop-color="#00b894"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a6a85"/>
    </marker>
  </defs>
  <rect width="800" height="540" fill="url(#bg)" rx="8"/>
  <rect x="20" y="20" width="760" height="40" rx="4" fill="url(#hdr)"/>
  <text x="400" y="47" text-anchor="middle" fill="#0f1a24" font-weight="700" font-size="15">Station Level 13-20 Endgame Progression</text>
  
  <!-- Level 13 -->
  <rect x="30" y="80" width="110" height="80" rx="6" fill="#1e3044" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="85" y="103" text-anchor="middle" fill="#4a90d9" font-weight="700" font-size="13">Level 13</text>
  <text x="85" y="122" text-anchor="middle" fill="#aabbcc" font-size="10">Enhanced</text>
  <text x="85" y="136" text-anchor="middle" fill="#aabbcc" font-size="10">Containment</text>
  <text x="85" y="153" text-anchor="middle" fill="#8899aa" font-size="9">3,500 TP</text>
  
  <line x1="140" y1="120" x2="155" y2="120" stroke="#4a6a85" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <!-- Level 14 -->
  <rect x="155" y="80" width="110" height="80" rx="6" fill="#1e3044" stroke="#f0c040" stroke-width="1.5"/>
  <text x="210" y="103" text-anchor="middle" fill="#f0c040" font-weight="700" font-size="13">Level 14</text>
  <text x="210" y="122" text-anchor="middle" fill="#aabbcc" font-size="10">Logistics V</text>
  <text x="210" y="136" text-anchor="middle" fill="#aabbcc" font-size="10">+2 CPU ships</text>
  <text x="210" y="153" text-anchor="middle" fill="#8899aa" font-size="9">3,000 TP</text>
  
  <line x1="265" y1="120" x2="280" y2="120" stroke="#4a6a85" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <!-- Level 15 -->
  <rect x="280" y="80" width="110" height="80" rx="6" fill="#1e3044" stroke="#00D4AA" stroke-width="1.5"/>
  <text x="335" y="103" text-anchor="middle" fill="#00D4AA" font-weight="700" font-size="13">Level 15</text>
  <text x="335" y="122" text-anchor="middle" fill="#aabbcc" font-size="10">Exo-Planet</text>
  <text x="335" y="136" text-anchor="middle" fill="#aabbcc" font-size="10">Lifter</text>
  <text x="335" y="153" text-anchor="middle" fill="#8899aa" font-size="9">3,500 TP</text>
  
  <line x1="390" y1="120" x2="405" y2="120" stroke="#4a6a85" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <!-- Level 16 -->
  <rect x="405" y="80" width="110" height="80" rx="6" fill="#1e3044" stroke="#e67e22" stroke-width="1.5"/>
  <text x="460" y="103" text-anchor="middle" fill="#e67e22" font-weight="700" font-size="13">Level 16</text>
  <text x="460" y="122" text-anchor="middle" fill="#aabbcc" font-size="10">Adv Landing</text>
  <text x="460" y="136" text-anchor="middle" fill="#aabbcc" font-size="10">Gear</text>
  <text x="460" y="153" text-anchor="middle" fill="#8899aa" font-size="9">2,800 TP</text>
  
  <line x1="515" y1="120" x2="530" y2="120" stroke="#4a6a85" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <!-- Level 17 -->
  <rect x="530" y="80" width="110" height="80" rx="6" fill="#1e3044" stroke="#9b59b6" stroke-width="1.5"/>
  <text x="585" y="103" text-anchor="middle" fill="#9b59b6" font-weight="700" font-size="13">Level 17</text>
  <text x="585" y="122" text-anchor="middle" fill="#aabbcc" font-size="10">Multi-Planet</text>
  <text x="585" y="136" text-anchor="middle" fill="#aabbcc" font-size="10">Operations</text>
  <text x="585" y="153" text-anchor="middle" fill="#8899aa" font-size="9">4,500 TP</text>
  
  <line x1="640" y1="120" x2="655" y2="120" stroke="#4a6a85" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <!-- Level 18 -->
  <rect x="655" y="80" width="115" height="80" rx="6" fill="#1e3044" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="712" y="103" text-anchor="middle" fill="#e74c3c" font-weight="700" font-size="13">Level 18</text>
  <text x="712" y="122" text-anchor="middle" fill="#aabbcc" font-size="10">Deep Surface</text>
  <text x="712" y="136" text-anchor="middle" fill="#aabbcc" font-size="10">Analysis</text>
  <text x="712" y="153" text-anchor="middle" fill="#8899aa" font-size="9">6,000 TP</text>
  
  <!-- Large drop to 19-20 area -->
  <line x1="712" y1="160" x2="712" y2="185" stroke="#4a6a85" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="200" y1="185" x2="712" y2="185" stroke="#4a6a85" stroke-width="1"/>
  
  <!-- Level 19 -->
  <line x1="200" y1="185" x2="200" y2="205" stroke="#4a6a85" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="145" y="205" width="110" height="80" rx="6" fill="#1e3044" stroke="#f0c040" stroke-width="1.5"/>
  <text x="200" y="228" text-anchor="middle" fill="#f0c040" font-weight="700" font-size="13">Level 19</text>
  <text x="200" y="247" text-anchor="middle" fill="#aabbcc" font-size="10">Automated</text>
  <text x="200" y="261" text-anchor="middle" fill="#aabbcc" font-size="10">Resupply</text>
  <text x="200" y="278" text-anchor="middle" fill="#8899aa" font-size="9">8,000 TP</text>
  
  <line x1="255" y1="245" x2="280" y2="245" stroke="#4a6a85" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <!-- Level 20 -->
  <rect x="280" y="205" width="200" height="80" rx="8" fill="#0d5a4a" stroke="#00D4AA" stroke-width="2"/>
  <text x="380" y="228" text-anchor="middle" fill="#00D4AA" font-weight="700" font-size="14">Level 20</text>
  <text x="380" y="248" text-anchor="middle" fill="#aabbcc" font-size="12">Space Elevator</text>
  <text x="380" y="265" text-anchor="middle" fill="#8899aa" font-size="10">1,000 SA + 400 El + 200 Ti + 50 DM</text>
  <text x="380" y="278" text-anchor="middle" fill="#8899aa" font-size="9">12,000 TP — 30 min research</text>
  
  <!-- Path A / B -->
  <rect x="530" y="200" width="240" height="50" rx="6" fill="#1e3044" stroke="#4a6a85" stroke-width="1"/>
  <text x="650" y="220" text-anchor="middle" fill="#aabbcc" font-size="11">Path A: Exo-Planet → L15 first</text>
  <text x="650" y="238" text-anchor="middle" fill="#8899aa" font-size="10">Path B: Fleet → L14/19 first</text>
  
  <!-- Cost accumulation -->
  <rect x="30" y="310" width="740" height="90" rx="6" fill="#1e3044" stroke="#4a6a85" stroke-width="1"/>
  <text x="400" y="332" text-anchor="middle" fill="#aabbcc" font-size="12">Resource Cost Accumulation (Level 13 → 20)</text>
  
  <rect x="50" y="345" width="690" height="14" rx="4" fill="#162535"/>
  
  <!-- TP bar -->
  <rect x="50" y="345" width="517" height="14" rx="4" fill="#4a90d9" opacity="0.7"/>
  <text x="400" y="355" text-anchor="middle" fill="#fff" font-size="9" font-weight="700">Total Tech Points: 43,300</text>
  
  <rect x="50" y="368" width="690" height="14" rx="4" fill="#162535"/>
  <rect x="50" y="368" width="345" height="14" rx="4" fill="#f0c040" opacity="0.7"/>
  <text x="400" y="378" text-anchor="middle" fill="#fff" font-size="9" font-weight="700">Total Time to Level 20: ~8-10 hours from Level 12</text>
  
  <text x="50" y="393" fill="#8899aa" font-size="9">v1.1 extended the level cap from 12 to 20. The biggest jump in income and capability is at Level 15 (Exo-Planet Lifter).</text>
  
  <!-- Summary -->
  <rect x="30" y="420" width="740" height="95" rx="6" fill="#0d5a4a" stroke="#00D4AA" stroke-width="1"/>
  <text x="400" y="442" text-anchor="middle" fill="#00D4AA" font-size="14" font-weight="700">Key Endgame Milestones</text>
  
  <text x="65" y="465" fill="#4a90d9" font-size="11">Level 13</text>
  <text x="145" y="465" fill="#aabbcc" font-size="11">Containment solves gas supply</text>
  
  <text x="65" y="483" fill="#00D4AA" font-size="11">Level 15</text>
  <text x="145" y="483" fill="#aabbcc" font-size="11">Exo-Planet = 100-150K/hr passive income</text>
  
  <text x="65" y="501" fill="#e74c3c" font-size="11">Level 20</text>
  <text x="145" y="501" fill="#aabbcc" font-size="11">Space Elevator = endgame hub (1K SA + 50 Dark Matter)</text>
</svg>
