<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A2533"/>
      <stop offset="100%" stop-color="#0f1a24"/>
    </linearGradient>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00D4AA"/>
      <stop offset="100%" stop-color="#00b894"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3044"/>
      <stop offset="100%" stop-color="#162535"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a6a85"/>
    </marker>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="800" height="620" fill="url(#bg)" rx="8"/>
  <rect x="20" y="20" width="760" height="44" rx="4" fill="url(#hdr)"/>
  <text x="400" y="49" text-anchor="middle" fill="#0f1a24" font-weight="700" font-size="16">Smelter Running Slow? Five-Step Diagnosis (v1.1.1.0)</text>

  <!-- Step 1 -->
  <rect x="200" y="84" width="400" height="56" rx="8" fill="url(#box)" stroke="#4a90d9" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="400" y="106" text-anchor="middle" fill="#4a90d9" font-weight="700" font-size="13">Step 1: Power Supply</text>
  <text x="400" y="126" text-anchor="middle" fill="#C8D6E8" font-size="11">75-80% speed is often a strained grid - add capacity first</text>
  <line x1="400" y1="140" x2="400" y2="152" stroke="#4a6a85" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2 -->
  <rect x="200" y="156" width="400" height="56" rx="8" fill="url(#box)" stroke="#4a90d9" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="400" y="178" text-anchor="middle" fill="#4a90d9" font-weight="700" font-size="13">Step 2: Input Starvation</text>
  <text x="400" y="198" text-anchor="middle" fill="#C8D6E8" font-size="11">Belt full? Source at full output? Idles between jobs = starvation</text>
  <line x1="400" y1="212" x2="400" y2="224" stroke="#4a6a85" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3 -->
  <rect x="200" y="228" width="400" height="56" rx="8" fill="url(#box)" stroke="#4a90d9" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="400" y="250" text-anchor="middle" fill="#4a90d9" font-weight="700" font-size="13">Step 3: Output Backing Up</text>
  <text x="400" y="270" text-anchor="middle" fill="#C8D6E8" font-size="11">Output belt full or destination storage full? It is correctly slowing</text>
  <line x1="400" y1="284" x2="400" y2="296" stroke="#4a6a85" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 4 -->
  <rect x="200" y="300" width="400" height="56" rx="8" fill="url(#box)" stroke="#4a90d9" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="400" y="322" text-anchor="middle" fill="#4a90d9" font-weight="700" font-size="13">Step 4: Efficiency Setting</text>
  <text x="400" y="342" text-anchor="middle" fill="#C8D6E8" font-size="11">Check the v1.1.1.0 per-minute preset - reset to 100% and retest</text>
  <line x1="400" y1="356" x2="400" y2="368" stroke="#4a6a85" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 5: split -->
  <rect x="200" y="372" width="400" height="56" rx="8" fill="url(#box)" stroke="#4a90d9" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="400" y="394" text-anchor="middle" fill="#4a90d9" font-weight="700" font-size="13">Step 5: All four pass but still slow?</text>
  <text x="400" y="414" text-anchor="middle" fill="#C8D6E8" font-size="11">Known v1.1.1.0 smelter bug - dev is collecting saves</text>

  <!-- Workarounds -->
  <rect x="60" y="448" width="320" height="150" rx="8" fill="url(#box)" stroke="#00D4AA" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="220" y="470" text-anchor="middle" fill="#00D4AA" font-weight="700" font-size="13">Workarounds</text>
  <text x="220" y="494" text-anchor="middle" fill="#C8D6E8" font-size="11">1. Deconstruct + rebuild in place</text>
  <text x="220" y="514" text-anchor="middle" fill="#C8D6E8" font-size="11">2. Move it one tile (position-related?)</text>
  <text x="220" y="534" text-anchor="middle" fill="#C8D6E8" font-size="11">3. Save and reload</text>
  <text x="220" y="560" text-anchor="middle" fill="#6A8AAA" font-size="10">Reclaim upgrade = 90%+ back</text>
  <text x="220" y="578" text-anchor="middle" fill="#6A8AAA" font-size="10">30 sec per smelter</text>

  <!-- Report -->
  <rect x="420" y="448" width="320" height="150" rx="8" fill="url(#box)" stroke="#f0c040" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="580" y="470" text-anchor="middle" fill="#f0c040" font-weight="700" font-size="13">Help the Developer</text>
  <text x="580" y="494" text-anchor="middle" fill="#C8D6E8" font-size="11">1. Save with smelter in view</text>
  <text x="580" y="514" text-anchor="middle" fill="#C8D6E8" font-size="11">2. Note level, MK tier, recipe</text>
  <text x="580" y="534" text-anchor="middle" fill="#C8D6E8" font-size="11">3. Screenshot panel (100% eff, full input)</text>
  <text x="580" y="554" text-anchor="middle" fill="#C8D6E8" font-size="11">4. Send via Steam/Discord</text>
  <text x="580" y="578" text-anchor="middle" fill="#6A8AAA" font-size="10">Back up save first!</text>

  <!-- Verdict -->
  <rect x="200" y="570" width="400" height="34" rx="8" fill="#1E3A2E" stroke="#00D4AA" stroke-width="1"/>
  <text x="400" y="592" text-anchor="middle" fill="#00D4AA" font-size="12" font-weight="600">9/10: fixable in a minute. 1/10: the real bug - rebuild it</text>
</svg>
