<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A2533"/>
      <stop offset="100%" stop-color="#0f1a24"/>
    </linearGradient>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00D4AA"/>
      <stop offset="100%" stop-color="#00b894"/>
    </linearGradient>
  </defs>
  <rect width="800" height="460" fill="url(#bg)" rx="8"/>
  <rect x="20" y="20" width="760" height="40" rx="4" fill="url(#hdr)"/>
  <text x="400" y="47" text-anchor="middle" fill="#0f1a24" font-weight="700" font-size="15">Economy Progression — Four Income Phases</text>
  
  <!-- Phase 1 -->
  <rect x="30" y="80" width="170" height="200" rx="6" fill="#1e3044" stroke="#00D4AA" stroke-width="1.5"/>
  <text x="115" y="105" text-anchor="middle" fill="#00D4AA" font-weight="700" font-size="14">Phase 1</text>
  <text x="115" y="122" text-anchor="middle" fill="#00D4AA" font-size="12">Scrap &amp; Salvage</text>
  <text x="115" y="142" text-anchor="middle" fill="#aabbcc" font-size="11">Levels 1-6</text>
  <text x="115" y="162" text-anchor="middle" fill="#8899aa" font-size="10">Sell scrap debris</text>
  <text x="115" y="178" text-anchor="middle" fill="#8899aa" font-size="10">Trade excess ore</text>
  <text x="115" y="194" text-anchor="middle" fill="#8899aa" font-size="10">Basic contracts</text>
  <text x="115" y="218" fill="#f0c040" font-size="18" font-weight="700">2-5K/hr</text>
  <text x="115" y="238" text-anchor="middle" fill="#4a6a85" font-size="9">Setup: Instant</text>
  <text x="115" y="252" text-anchor="middle" fill="#4a6a85" font-size="9">Risk: Low</text>
  
  <!-- Arrow -->
  <text x="210" y="180" text-anchor="middle" fill="#4a6a85" font-size="16">→</text>
  
  <!-- Phase 2 -->
  <rect x="230" y="80" width="170" height="200" rx="6" fill="#1e3044" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="315" y="105" text-anchor="middle" fill="#4a90d9" font-weight="700" font-size="14">Phase 2</text>
  <text x="315" y="122" text-anchor="middle" fill="#4a90d9" font-size="12">Contracts</text>
  <text x="315" y="142" text-anchor="middle" fill="#aabbcc" font-size="11">Levels 6-9</text>
  <text x="315" y="162" text-anchor="middle" fill="#8899aa" font-size="10">Deliver items</text>
  <text x="315" y="178" text-anchor="middle" fill="#8899aa" font-size="10">Craft-specific orders</text>
  <text x="315" y="194" text-anchor="middle" fill="#8899aa" font-size="10">Explore sectors</text>
  <text x="315" y="218" fill="#f0c040" font-size="18" font-weight="700">8-15K/hr</text>
  <text x="315" y="238" text-anchor="middle" fill="#4a6a85" font-size="9">Setup: 10 min</text>
  <text x="315" y="252" text-anchor="middle" fill="#4a6a85" font-size="9">70% AFK</text>
  
  <text x="410" y="180" text-anchor="middle" fill="#4a6a85" font-size="16">→</text>
  
  <!-- Phase 3 -->
  <rect x="430" y="80" width="170" height="200" rx="6" fill="#1e3044" stroke="#f0c040" stroke-width="1.5"/>
  <text x="515" y="105" text-anchor="middle" fill="#f0c040" font-weight="700" font-size="14">Phase 3</text>
  <text x="515" y="122" text-anchor="middle" fill="#f0c040" font-size="12">CPU Auto-Trade</text>
  <text x="515" y="142" text-anchor="middle" fill="#aabbcc" font-size="11">Levels 9-14</text>
  <text x="515" y="162" text-anchor="middle" fill="#8899aa" font-size="10">Assign freighters</text>
  <text x="515" y="178" text-anchor="middle" fill="#8899aa" font-size="10">Price gap trades</text>
  <text x="515" y="194" text-anchor="middle" fill="#8899aa" font-size="10">Multiple routes</text>
  <text x="515" y="218" fill="#f0c040" font-size="18" font-weight="700">40-60K/hr</text>
  <text x="515" y="238" text-anchor="middle" fill="#4a6a85" font-size="9">Setup: 30 min</text>
  <text x="515" y="252" text-anchor="middle" fill="#4a6a85" font-size="9">95% AFK</text>
  
  <text x="610" y="180" text-anchor="middle" fill="#4a6a85" font-size="16">→</text>
  
  <!-- Phase 4 -->
  <rect x="630" y="80" width="150" height="200" rx="6" fill="#1e3044" stroke="#e67e22" stroke-width="1.5"/>
  <text x="705" y="105" text-anchor="middle" fill="#e67e22" font-weight="700" font-size="14">Phase 4</text>
  <text x="705" y="122" text-anchor="middle" fill="#e67e22" font-size="12">Exo-Planet</text>
  <text x="705" y="142" text-anchor="middle" fill="#aabbcc" font-size="11">Levels 15+</text>
  <text x="705" y="162" text-anchor="middle" fill="#8899aa" font-size="10">Surface ops</text>
  <text x="705" y="178" text-anchor="middle" fill="#8899aa" font-size="10">Rare materials</text>
  <text x="705" y="194" text-anchor="middle" fill="#8899aa" font-size="10">Market cycling</text>
  <text x="705" y="218" fill="#f0c040" font-size="18" font-weight="700">150K+</text>
  <text x="705" y="238" text-anchor="middle" fill="#4a6a85" font-size="9">Setup: 20 min</text>
  <text x="705" y="252" text-anchor="middle" fill="#4a6a85" font-size="9">90% AFK</text>
  
  <!-- Bottom summary -->
  <rect x="30" y="300" width="740" height="60" rx="6" fill="#0d5a4a" stroke="#00D4AA" stroke-width="1"/>
  <text x="400" y="322" text-anchor="middle" fill="#00D4AA" font-size="13">Income scales 10x each phase. Do not skip — each phase builds the infrastructure for the next.</text>
  <text x="400" y="340" text-anchor="middle" fill="#aabbcc" font-size="11">Phase 1 income buys your first Assembler. Phase 2 buys your first Freighter. Phase 3 funds the Exo-Planet Ops Centre.</text>
  <text x="400" y="355" text-anchor="middle" fill="#4a6a85" font-size="9">v1.1.1.0 — market prices fluctuate by faction and sector</text>
  
  <!-- Total bar -->
  <rect x="30" y="380" width="740" height="55" rx="6" fill="#1e3044" stroke="#4a6a85" stroke-width="1"/>
  <text x="400" y="402" text-anchor="middle" fill="#aabbcc" font-size="12">Total Income Potential (Level 1 → Level 20)</text>
  
  <rect x="50" y="415" width="28" height="14" rx="3" fill="#00D4AA" opacity="0.6"/>
  <rect x="150" y="415" width="28" height="14" rx="3" fill="#4a90d9" opacity="0.6"/>
  <rect x="290" y="415" width="28" height="14" rx="3" fill="#f0c040" opacity="0.6"/>
  <rect x="500" y="415" width="28" height="14" rx="3" fill="#e67e22" opacity="0.6"/>
  <text x="82" y="426" text-anchor="middle" fill="#8899aa" font-size="9">2-5K/hr</text>
  <text x="182" y="426" text-anchor="middle" fill="#8899aa" font-size="9">8-15K/hr</text>
  <text x="322" y="426" text-anchor="middle" fill="#8899aa" font-size="9">40-60K/hr</text>
  <text x="532" y="426" text-anchor="middle" fill="#8899aa" font-size="9">100-150K+</text>
  <text x="670" y="426" text-anchor="middle" fill="#f0c040" font-size="9">300-500K/hr</text>
  <text x="670" y="416" text-anchor="middle" fill="#4a6a85" font-size="7">(Market cycling)</text>
</svg>
