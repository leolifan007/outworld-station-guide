<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" style="background:#1A2533;border-radius:8px;font-family:'Segoe UI',Arial,sans-serif;">
  <defs>
    <linearGradient id="sGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2A5A3A;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1E4A2E;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="aGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E4A6A;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#163A5A;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="bGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A3A2A;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#3A2A1A;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="cGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3A1A1A;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#2A0E0E;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="400" y="32" text-anchor="middle" fill="#00D4AA" font-size="18" font-weight="bold">物品评级矩阵 — 100+小时实测</text>

  <!-- Header row -->
  <text x="85" y="72" text-anchor="middle" fill="#C8D6E8" font-size="12" font-weight="bold"></text>
  <text x="230" y="72" text-anchor="middle" fill="#C8D6E8" font-size="12" font-weight="bold">🚀 飞船</text>
  <text x="430" y="72" text-anchor="middle" fill="#C8D6E8" font-size="12" font-weight="bold">🏗 模块</text>
  <text x="630" y="72" text-anchor="middle" fill="#C8D6E8" font-size="12" font-weight="bold">⚙ 生产建筑</text>

  <line x1="20" y1="80" x2="780" y2="80" stroke="#2A3F55" stroke-width="1"/>

  <!-- S Tier -->
  <rect x="15" y="90" width="55" height="65" rx="6" fill="#2A5A3A" stroke="#00D4AA" stroke-width="2"/>
  <text x="42" y="120" text-anchor="middle" fill="#00D4AA" font-size="18" font-weight="bold">S</text>
  <text x="42" y="140" text-anchor="middle" fill="#8AACCD" font-size="9">改变游戏</text>

  <rect x="80" y="90" width="220" height="65" rx="6" fill="url(#sGrad)" stroke="#00D4AA" stroke-width="1.5"/>
  <text x="190" y="113" text-anchor="middle" fill="#00D4AA" font-size="12" font-weight="bold">侦察机 · 货船</text>
  <text x="190" y="131" text-anchor="middle" fill="#8AACCD" font-size="10">速度快 · 高货仓</text>
  <text x="190" y="147" text-anchor="middle" fill="#6A8AAA" font-size="9">每局都造</text>

  <rect x="310" y="90" width="220" height="65" rx="6" fill="url(#sGrad)" stroke="#00D4AA" stroke-width="1.5"/>
  <text x="420" y="113" text-anchor="middle" fill="#00D4AA" font-size="12" font-weight="bold">太阳能板 · 小电池</text>
  <text x="420" y="131" text-anchor="middle" fill="#8AACCD" font-size="10">免费电力 · 夜间生存</text>
  <text x="420" y="147" text-anchor="middle" fill="#6A8AAA" font-size="9">氧气发生器</text>

  <rect x="540" y="90" width="225" height="65" rx="6" fill="url(#sGrad)" stroke="#00D4AA" stroke-width="1.5"/>
  <text x="652" y="113" text-anchor="middle" fill="#00D4AA" font-size="12" font-weight="bold">钻头 · 熔炉 · 组装机</text>
  <text x="652" y="131" text-anchor="middle" fill="#8AACCD" font-size="10">一切生产的基础</text>
  <text x="652" y="147" text-anchor="middle" fill="#6A8AAA" font-size="9">优先建造</text>

  <!-- A Tier -->
  <rect x="15" y="165" width="55" height="65" rx="6" fill="#1E4A6A" stroke="#4A9EFF" stroke-width="2"/>
  <text x="42" y="195" text-anchor="middle" fill="#4A9EFF" font-size="18" font-weight="bold">A</text>
  <text x="42" y="215" text-anchor="middle" fill="#8AACCD" font-size="9">强力推荐</text>

  <rect x="80" y="165" width="220" height="65" rx="6" fill="url(#aGrad)" stroke="#4A9EFF" stroke-width="1.5"/>
  <text x="190" y="188" text-anchor="middle" fill="#4A9EFF" font-size="12" font-weight="bold">采矿船 · 工程船</text>
  <text x="190" y="206" text-anchor="middle" fill="#8AACCD" font-size="10">资源直接采集</text>
  <text x="190" y="222" text-anchor="middle" fill="#6A8AAA" font-size="9">需合同配合</text>

  <rect x="310" y="165" width="220" height="65" rx="6" fill="url(#aGrad)" stroke="#4A9EFF" stroke-width="1.5"/>
  <text x="420" y="188" text-anchor="middle" fill="#4A9EFF" font-size="12" font-weight="bold">反应堆 · 虫洞 · 中型仓储</text>
  <text x="420" y="206" text-anchor="middle" fill="#8AACCD" font-size="10">稳定电力 · 远程资源</text>
  <text x="420" y="222" text-anchor="middle" fill="#6A8AAA" font-size="9">中场核心</text>

  <rect x="540" y="165" width="225" height="65" rx="6" fill="url(#aGrad)" stroke="#4A9EFF" stroke-width="1.5"/>
  <text x="652" y="188" text-anchor="middle" fill="#4A9EFF" font-size="12" font-weight="bold">电子制造 · 化工处理器</text>
  <text x="652" y="206" text-anchor="middle" fill="#8AACCD" font-size="10">聚变燃料 & 高级组件</text>
  <text x="652" y="222" text-anchor="middle" fill="#6A8AAA" font-size="9">中场解锁</text>

  <!-- B Tier -->
  <rect x="15" y="240" width="55" height="65" rx="6" fill="#4A3A2A" stroke="#FFB347" stroke-width="2"/>
  <text x="42" y="270" text-anchor="middle" fill="#FFB347" font-size="18" font-weight="bold">B</text>
  <text x="42" y="290" text-anchor="middle" fill="#8AACCD" font-size="9">视情况</text>

  <rect x="80" y="240" width="220" height="65" rx="6" fill="url(#bGrad)" stroke="#FFB347" stroke-width="1"/>
  <text x="190" y="263" text-anchor="middle" fill="#FFB347" font-size="12" font-weight="bold">战斗船</text>
  <text x="190" y="281" text-anchor="middle" fill="#8AACCD" font-size="10">护送/巡逻合同</text>
  <text x="190" y="297" text-anchor="middle" fill="#6A8AAA" font-size="9">非必须</text>

  <rect x="310" y="240" width="220" height="65" rx="6" fill="url(#bGrad)" stroke="#FFB347" stroke-width="1"/>
  <text x="420" y="263" text-anchor="middle" fill="#FFB347" font-size="12" font-weight="bold">大型仓储 · 无人机港 · 维修站</text>
  <text x="420" y="281" text-anchor="middle" fill="#8AACCD" font-size="10">大型不急需</text>
  <text x="420" y="297" text-anchor="middle" fill="#6A8AAA" font-size="9">无人机配虫洞才强</text>

  <rect x="540" y="240" width="225" height="65" rx="6" fill="url(#bGrad)" stroke="#FFB347" stroke-width="1"/>
  <text x="652" y="263" text-anchor="middle" fill="#FFB347" font-size="12" font-weight="bold">高级合金炉 · 复合材料厂</text>
  <text x="652" y="281" text-anchor="middle" fill="#8AACCD" font-size="10">终局材料</text>
  <text x="652" y="297" text-anchor="middle" fill="#6A8AAA" font-size="9">前中期跳过</text>

  <!-- C-D Tier -->
  <rect x="15" y="315" width="55" height="65" rx="6" fill="#3A1A1A" stroke="#FF6B6B" stroke-width="2"/>
  <text x="42" y="345" text-anchor="middle" fill="#FF6B6B" font-size="18" font-weight="bold">C</text>
  <text x="42" y="365" text-anchor="middle" fill="#8AACCD" font-size="9">陷阱</text>

  <rect x="80" y="315" width="220" height="65" rx="6" fill="url(#cGrad)" stroke="#FF6B6B" stroke-width="1"/>
  <text x="190" y="338" text-anchor="middle" fill="#FF6B6B" font-size="12" font-weight="bold">豪华运输船</text>
  <text x="190" y="356" text-anchor="middle" fill="#8AACCD" font-size="10">高回报但极其小众</text>
  <text x="190" y="372" text-anchor="middle" fill="#6A8AAA" font-size="9">舰队成型后再考虑</text>

  <rect x="310" y="315" width="220" height="65" rx="6" fill="url(#cGrad)" stroke="#FF6B6B" stroke-width="1"/>
  <text x="420" y="338" text-anchor="middle" fill="#FF6B6B" font-size="12" font-weight="bold">装饰模块 · 大型电池</text>
  <text x="420" y="356" text-anchor="middle" fill="#8AACCD" font-size="10">美观零收益 · 大型电池</text>
  <text x="420" y="372" text-anchor="middle" fill="#6A8AAA" font-size="9">用途有限</text>

  <!-- Build Priority section -->
  <rect x="80" y="405" width="650" height="60" rx="8" fill="#1E3A5F" stroke="#6A8AAA" stroke-width="1"/>
  <text x="405" y="425" text-anchor="middle" fill="#C8D6E8" font-size="12" font-weight="bold">建造优先级速查</text>
  <text x="405" y="443" text-anchor="middle" fill="#8AACCD" font-size="10">头2小时: 钻头→熔炉→太阳能→电池 · 2-6小时: 组装机→氧气→侦察机 · 6-12小时: 反应堆→虫洞→货船</text>
  <text x="405" y="458" text-anchor="middle" fill="#6A8AAA" font-size="9">100+小时实测评级 · 不同玩法可能影响评分</text>

  <text x="400" y="492" text-anchor="middle" fill="#4A6070" font-size="9">Outworld Station Guide — Tier List v1.0</text>
</svg>
