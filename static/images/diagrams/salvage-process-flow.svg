<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="100%" height="100%">
  <rect width="600" height="420" fill="#1A2533"/>
  <defs>
    <linearGradient id="salvageGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF5252"/>
      <stop offset="100%" stop-color="#D03030"/>
    </linearGradient>
    <linearGradient id="laserGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#E09000"/>
    </linearGradient>
    <linearGradient id="chunkGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A9EFF"/>
      <stop offset="100%" stop-color="#2A7EDF"/>
    </linearGradient>
    <linearGradient id="procGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00D4AA"/>
      <stop offset="100%" stop-color="#009977"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="300" y="32" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="bold">Salvage &amp; Wreck Harvesting</text>
  <line x1="150" y1="40" x2="450" y2="40" stroke="#FF5252" stroke-width="1.5" opacity="0.5"/>

  <!-- Subtitle -->
  <text x="300" y="55" text-anchor="middle" fill="#8A9BAE" font-family="sans-serif" font-size="11">From derelict wreck to refined materials</text>

  <!-- ===== STEP 1: Wreck ===== -->
  <g transform="translate(25, 75)">
    <rect x="0" y="0" width="130" height="130" rx="8" fill="#0F1A26" stroke="#FF5252" stroke-width="1.5"/>
    <rect x="0" y="0" width="130" height="24" rx="8" fill="url(#salvageGrad)"/>
    <rect x="0" y="16" width="130" height="8" rx="0" fill="url(#salvageGrad)"/>
    <text x="65" y="17" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="10" font-weight="bold">1. Locate Wreck</text>

    <!-- Wreck icon -->
    <g transform="translate(65, 72)">
      <!-- Broken ship shape -->
      <polygon points="-25,-20 15,-20 25,0 20,20 -20,20 -30,0" fill="#2A3D4F" stroke="#FF5252" stroke-width="1.5"/>
      <polygon points="-15,-15 10,-15 15,0 10,15 -15,15 -20,0" fill="#3A4D5F" opacity="0.5"/>
      <!-- Crack -->
      <line x1="0" y1="-20" x2="-5" y2="5" stroke="#FF5252" stroke-width="1" opacity="0.6"/>
      <line x1="-5" y1="5" x2="3" y2="20" stroke="#FF5252" stroke-width="1" opacity="0.6"/>
      <!-- Spark -->
      <circle cx="-8" cy="-10" r="1.5" fill="#FFB300" opacity="0.6"/>
      <circle cx="12" cy="8" r="1" fill="#FFB300" opacity="0.4"/>
      <!-- Debris -->
      <circle cx="-30" cy="-10" r="3" fill="#2A3D4F" stroke="#FF5252" stroke-width="0.5"/>
      <circle cx="30" cy="15" r="2" fill="#2A3D4F" stroke="#FF5252" stroke-width="0.5"/>
    </g>

    <text x="65" y="110" text-anchor="middle" fill="#8A9BAE" font-family="sans-serif" font-size="9">Derelict wreck</text>
    <text x="65" y="123" text-anchor="middle" fill="#8A9BAE" font-family="sans-serif" font-size="8">Found via scanner</text>
  </g>

  <!-- Arrow 1→2 -->
  <g transform="translate(160,140)">
    <line x1="0" y1="0" x2="25" y2="0" stroke="#FF5252" stroke-width="2"/>
    <polygon points="25,0 19,-4 19,4" fill="#FF5252"/>
  </g>

  <!-- ===== STEP 2: Salvage Laser → Chunks ===== -->
  <g transform="translate(190, 75)">
    <rect x="0" y="0" width="130" height="55" rx="8" fill="#0F1A26" stroke="#FFB300" stroke-width="1.5"/>
    <rect x="0" y="0" width="130" height="24" rx="8" fill="url(#laserGrad)"/>
    <rect x="0" y="16" width="130" height="8" rx="0" fill="url(#laserGrad)"/>
    <text x="65" y="17" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="10" font-weight="bold">2. Salvage Laser</text>
    <text x="65" y="40" text-anchor="middle" fill="#B0C4DE" font-family="sans-serif" font-size="9">Cut wreck into sections</text>
    <text x="65" y="52" text-anchor="middle" fill="#8A9BAE" font-family="sans-serif" font-size="8">Time: ~30s per wreck</text>
  </g>

  <!-- Arrow down from laser -->
  <g transform="translate(255,135)">
    <line x1="0" y1="0" x2="0" y2="20" stroke="#FFB300" stroke-width="2"/>
    <polygon points="0,20 -4,14 4,14" fill="#FFB300"/>
  </g>

  <!-- Chunks box -->
  <g transform="translate(190, 160)">
    <rect x="0" y="0" width="130" height="50" rx="8" fill="#0F1A26" stroke="#4A9EFF" stroke-width="1.5"/>
    <rect x="0" y="0" width="130" height="22" rx="8" fill="url(#chunkGrad)"/>
    <rect x="0" y="14" width="130" height="8" rx="0" fill="url(#chunkGrad)"/>
    <text x="65" y="16" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="9" font-weight="bold">📦 Salvage Chunks</text>
    <text x="65" y="38" text-anchor="middle" fill="#B0C4DE" font-family="sans-serif" font-size="8">Raw material blocks</text>
    <text x="65" y="48" text-anchor="middle" fill="#8A9BAE" font-family="sans-serif" font-size="7">3-5 chunks per wreck</text>
  </g>

  <!-- Arrow 2→3 -->
  <g transform="translate(325,125)">
    <line x1="0" y1="0" x2="25" y2="0" stroke="#4A9EFF" stroke-width="2"/>
    <polygon points="25,0 19,-4 19,4" fill="#4A9EFF"/>
  </g>

  <!-- ===== STEP 3: Processor → Materials ===== -->
  <g transform="translate(355, 75)">
    <rect x="0" y="0" width="130" height="55" rx="8" fill="#0F1A26" stroke="#00D4AA" stroke-width="1.5"/>
    <rect x="0" y="0" width="130" height="24" rx="8" fill="url(#procGrad)"/>
    <rect x="0" y="16" width="130" height="8" rx="0" fill="url(#procGrad)"/>
    <text x="65" y="17" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="10" font-weight="bold">3. Processor</text>
    <text x="65" y="40" text-anchor="middle" fill="#B0C4DE" font-family="sans-serif" font-size="9">Recycle into materials</text>
    <text x="65" y="52" text-anchor="middle" fill="#8A9BAE" font-family="sans-serif" font-size="8">Time: ~45s per chunk</text>
  </g>

  <!-- Arrow down from processor -->
  <g transform="translate(420,135)">
    <line x1="0" y1="0" x2="0" y2="20" stroke="#00D4AA" stroke-width="2"/>
    <polygon points="0,20 -4,14 4,14" fill="#00D4AA"/>
  </g>

  <!-- Output materials -->
  <g transform="translate(355, 160)">
    <rect x="0" y="0" width="130" height="110" rx="8" fill="#0F1A26" stroke="#00D4AA" stroke-width="1.5"/>
    <rect x="0" y="0" width="130" height="22" rx="8" fill="url(#procGrad)"/>
    <rect x="0" y="14" width="130" height="8" rx="0" fill="url(#procGrad)"/>
    <text x="65" y="16" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="9" font-weight="bold">📋 Refined Materials</text>

    <rect x="10" y="30" width="110" height="14" rx="3" fill="#1A3D30"/>
    <text x="65" y="41" text-anchor="middle" fill="#00D4AA" font-family="sans-serif" font-size="8">▪ Steel plates (45%)</text>

    <rect x="10" y="48" width="110" height="14" rx="3" fill="#1A2A3D"/>
    <text x="65" y="59" text-anchor="middle" fill="#4A9EFF" font-family="sans-serif" font-size="8">▪ Circuit parts (25%)</text>

    <rect x="10" y="66" width="110" height="14" rx="3" fill="#3D301A"/>
    <text x="65" y="77" text-anchor="middle" fill="#FFB300" font-family="sans-serif" font-size="8">▪ Fuel residue (15%)</text>

    <rect x="10" y="84" width="110" height="14" rx="3" fill="#2A1A1A"/>
    <text x="65" y="95" text-anchor="middle" fill="#FF5252" font-family="sans-serif" font-size="8">▪ Waste/Slag (15%)</text>

    <line x1="10" y1="103" x2="120" y2="103" stroke="#00D4AA" stroke-width="0.5" opacity="0.3"/>
  </g>

  <!-- Bottom summary cards -->
  <rect x="25" y="290" width="540" height="120" rx="8" fill="#0F1A26" stroke="#FF5252" stroke-width="1" opacity="0.7"/>

  <text x="45" y="312" fill="#FF5252" font-family="sans-serif" font-size="12" font-weight="bold">⚙ Salvage Throughput Calculator</text>

  <!-- Per wreck output -->
  <rect x="45" y="325" width="155" height="70" rx="6" fill="#1A2533" stroke="#FF5252" stroke-width="1"/>
  <text x="122" y="343" text-anchor="middle" fill="#FF5252" font-family="sans-serif" font-size="10" font-weight="bold">Per Wreck Output</text>
  <text x="55" y="360" fill="#B0C4DE" font-family="sans-serif" font-size="9">Steel: 180-220</text>
  <text x="55" y="375" fill="#B0C4DE" font-family="sans-serif" font-size="9">Circuits: 40-60</text>
  <text x="55" y="390" fill="#B0C4DE" font-family="sans-serif" font-size="9">Fuel: 25-35</text>

  <!-- Recommended -->
  <rect x="215" y="325" width="155" height="70" rx="6" fill="#1A2533" stroke="#00D4AA" stroke-width="1"/>
  <text x="292" y="343" text-anchor="middle" fill="#00D4AA" font-family="sans-serif" font-size="10" font-weight="bold">★ Recommendation</text>
  <text x="225" y="362" fill="#B0C4DE" font-family="sans-serif" font-size="9">Skip Tier 1 wrecks</text>
  <text x="225" y="378" fill="#B0C4DE" font-family="sans-serif" font-size="9">Focus on Tier 2+ wrecks</text>
  <text x="225" y="394" fill="#B0C4DE" font-family="sans-serif" font-size="9">Near battle zones = best</text>

  <!-- Upgrade bonuses -->
  <rect x="385" y="325" width="165" height="70" rx="6" fill="#1A2533" stroke="#FFB300" stroke-width="1"/>
  <text x="467" y="343" text-anchor="middle" fill="#FFB300" font-family="sans-serif" font-size="10" font-weight="bold">Upgrade Bonuses</text>
  <text x="395" y="362" fill="#B0C4DE" font-family="sans-serif" font-size="9">Laser T2: +35% speed</text>
  <text x="395" y="378" fill="#B0C4DE" font-family="sans-serif" font-size="9">Processor T2: +20% yield</text>
  <text x="395" y="394" fill="#B0C4DE" font-family="sans-serif" font-size="9">Hauler T2: +50% cargo</text>
</svg>