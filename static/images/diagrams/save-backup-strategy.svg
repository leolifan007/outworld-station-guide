<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240">
  <rect width="600" height="240" fill="#1A2533" rx="8"/>
  <text x="300" y="30" fill="#00D4AA" font-family="Arial,sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Save Backup Strategy: Three-Layer Protection</text>

  <!-- Layer 1: Session -->
  <g transform="translate(40, 60)">
    <rect x="0" y="0" width="160" height="70" fill="#2A3F55" rx="6" stroke="#4ECDC4" stroke-width="2"/>
    <text x="80" y="22" fill="#4ECDC4" font-family="Arial,sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Layer 1: Session</text>
    <text x="80" y="40" fill="#B0C4D8" font-family="Arial,sans-serif" font-size="10" text-anchor="middle">After every 3+ hr session</text>
    <text x="80" y="55" fill="#8899AA" font-family="Arial,sans-serif" font-size="9" text-anchor="middle">Local HDD | Keep 10</text>
  </g>

  <!-- Arrow -->
  <line x1="200" y1="95" x2="235" y2="95" stroke="#B0C4D8" stroke-width="2" marker-end="url(#aB)"/>

  <!-- Layer 2: Weekly -->
  <g transform="translate(240, 60)">
    <rect x="0" y="0" width="160" height="70" fill="#2A3F55" rx="6" stroke="#FFD93D" stroke-width="2"/>
    <text x="80" y="22" fill="#FFD93D" font-family="Arial,sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Layer 2: Weekly</text>
    <text x="80" y="40" fill="#B0C4D8" font-family="Arial,sans-serif" font-size="10" text-anchor="middle">Once per week archive</text>
    <text x="80" y="55" fill="#8899AA" font-family="Arial,sans-serif" font-size="9" text-anchor="middle">Cloud Drive | Keep 4</text>
  </g>

  <!-- Arrow -->
  <line x1="400" y1="95" x2="435" y2="95" stroke="#B0C4D8" stroke-width="2" marker-end="url(#aB)"/>

  <!-- Layer 3: Pre-update -->
  <g transform="translate(440, 60)">
    <rect x="0" y="0" width="140" height="70" fill="#2A3F55" rx="6" stroke="#FF6B35" stroke-width="2"/>
    <text x="70" y="22" fill="#FF6B35" font-family="Arial,sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Layer 3: Pre-Update</text>
    <text x="70" y="40" fill="#B0C4D8" font-family="Arial,sans-serif" font-size="10" text-anchor="middle">Before every patch</text>
    <text x="70" y="55" fill="#8899AA" font-family="Arial,sans-serif" font-size="9" text-anchor="middle">External backup</text>
  </g>

  <!-- Bottom notes -->
  <g transform="translate(40, 165)">
    <rect x="0" y="0" width="540" height="50" fill="#1E3045" rx="6" stroke="#8899AA" stroke-width="1"/>
    <text x="270" y="20" fill="#00D4AA" font-family="Arial,sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Auto-Save Warning</text>
    <text x="270" y="38" fill="#B0C4D8" font-family="Arial,sans-serif" font-size="10" text-anchor="middle">5 auto-save slots can all corrupt. Manual backups are your only reliable protection.</text>
  </g>

  <defs>
    <marker id="aB" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto">
      <path d="M0,0 L6,2 L0,4" fill="#B0C4D8"/>
    </marker>
  </defs>
</svg>
