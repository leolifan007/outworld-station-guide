  <line x1="490" y1="135" x2="490" y2="360" stroke="#4a6a85" stroke-width="0.3"/>
  <line x1="540" y1="135" x2="540" y2="360" stroke="#4a6a85" stroke-width="0.3"/>
  <line x1="590" y1="135" x2="590" y2="360" stroke="#4a6a85" stroke-width="0.3"/>
  <line x1="640" y1="135" x2="640" y2="360" stroke="#4a6a85" stroke-width="0.3"/>
  <line x1="690" y1="135" x2="690" y2="360" stroke="#4a6a85" stroke-width="0.3"/>
  <line x1="440" y1="180" x2="740" y2="180" stroke="#4a6a85" stroke-width="0.3"/>
  <line x1="440" y1="225" x2="740" y2="225" stroke="#4a6a85" stroke-width="0.3"/>
  <line x1="440" y1="270" x2="740" y2="270" stroke="#4a6a85" stroke-width="0.3"/>
  <line x1="440" y1="315" x2="740" y2="315" stroke="#4a6a85" stroke-width="0.3"/>
  
  <!-- New buildings - more of them -->
  <rect x="450" y="145" width="28" height="22" rx="3" fill="#00D4AA" opacity="0.7"/>
  <text x="464" y="160" text-anchor="middle" fill="#0f1a24" font-size="7" font-weight="700">S</text>
  <rect x="485" y="145" width="28" height="22" rx="3" fill="#00D4AA" opacity="0.7"/>
  <text x="499" y="160" text-anchor="middle" fill="#0f1a24" font-size="7" font-weight="700">S</text>
  <rect x="520" y="145" width="28" height="22" rx="3" fill="#00D4AA" opacity="0.7"/>
  <text x="534" y="160" text-anchor="middle" fill="#0f1a24" font-size="7" font-weight="700">S</text>
  <rect x="555" y="145" width="28" height="22" rx="3" fill="#00D4AA" opacity="0.7"/>
  <text x="569" y="160" text-anchor="middle" fill="#0f1a24" font-size="7" font-weight="700">S</text>
  <rect x="590" y="145" width="28" height="22" rx="3" fill="#00D4AA" opacity="0.7"/>
  <text x="604" y="160" text-anchor="middle" fill="#0f1a24" font-size="7" font-weight="700">S</text>
  <rect x="625" y="145" width="28" height="22" rx="3" fill="#00D4AA" opacity="0.7"/>
  <text x="639" y="160" text-anchor="middle" fill="#0f1a24" font-size="7" font-weight="700">S</text>
  
  <rect x="450" y="190" width="36" height="30" rx="3" fill="#f0c040" opacity="0.7"/>
  <text x="468" y="209" text-anchor="middle" fill="#0f1a24" font-size="8" font-weight="700">P</text>
  <rect x="495" y="190" width="36" height="30" rx="3" fill="#f0c040" opacity="0.7"/>
  <text x="513" y="209" text-anchor="middle" fill="#0f1a24" font-size="8" font-weight="700">P</text>
  
  <rect x="450" y="240" width="28" height="22" rx="3" fill="#4a90d9" opacity="0.7"/>
  <text x="464" y="255" text-anchor="middle" fill="#fff" font-size="7" font-weight="700">A</text>
  <rect x="485" y="240" width="28" height="22" rx="3" fill="#4a90d9" opacity="0.7"/>
  <text x="499" y="255" text-anchor="middle" fill="#fff" font-size="7" font-weight="700">A</text>
  <rect x="520" y="240" width="28" height="22" rx="3" fill="#4a90d9" opacity="0.7"/>
  <text x="534" y="255" text-anchor="middle" fill="#fff" font-size="7" font-weight="700">A</text>
  <rect x="555" y="240" width="28" height="22" rx="3" fill="#4a90d9" opacity="0.7"/>
  <text x="569" y="255" text-anchor="middle" fill="#fff" font-size="7" font-weight="700">A</text>
  
  <!-- Buffer storage -->
  <rect x="450" y="285" width="30" height="20" rx="2" fill="#4a6a85" opacity="0.6"/>
  <text x="465" y="299" text-anchor="middle" fill="#aabbcc" font-size="7">St</text>
  <rect x="490" y="285" width="30" height="20" rx="2" fill="#4a6a85" opacity="0.6"/>
  <text x="505" y="299" text-anchor="middle" fill="#aabbcc" font-size="7">St</text>
  <rect x="530" y="285" width="30" height="20" rx="2" fill="#4a6a85" opacity="0.6"/>
  <text x="545" y="299" text-anchor="middle" fill="#aabbcc" font-size="7">St</text>
  
  <!-- New label -->
  <text x="590" y="390" text-anchor="middle" fill="#00D4AA" font-size="11">Spacious - 6 Smelters + 2 Forges + logi</text>
  <text x="590" y="405" text-anchor="middle" fill="#00D4AA" font-size="11">Room for buffers, routing, and expansion</text>
  
  <!-- Key stats bar at bottom -->
  <rect x="40" y="430" width="720" height="55" rx="6" fill="url(#box)" stroke="#4a6a85" stroke-width="1" filter="url(#shadow)"/>
  
  <rect x="55" y="438" width="165" height="40" rx="4" fill="#162535"/>
  <text x="137" y="456" text-anchor="middle" fill="#00D4AA" font-weight="700" font-size="18">+125%</text>
  <text x="137" y="471" text-anchor="middle" fill="#8899aa" font-size="10">Tile Area</text>
  
  <rect x="233" y="438" width="165" height="40" rx="4" fill="#162535"/>
  <text x="315" y="456" text-anchor="middle" fill="#f0c040" font-weight="700" font-size="18">+67%</text>
  <text x="315" y="471" text-anchor="middle" fill="#8899aa" font-size="10">Object Limit</text>
  
  <rect x="411" y="438" width="165" height="40" rx="4" fill="#162535"/>
  <text x="493" y="456" text-anchor="middle" fill="#4a90d9" font-weight="700" font-size="18">+100%</text>
  <text x="493" y="471" text-anchor="middle" fill="#8899aa" font-size="10">Production Fit</text>
  
  <rect x="589" y="438" width="160" height="40" rx="4" fill="#162535"/>
  <text x="669" y="456" text-anchor="middle" fill="#e67e22" font-weight="700" font-size="18">2.25x</text>
  <text x="669" y="471" text-anchor="middle" fill="#8899aa" font-size="10">Blueprint Area</text>
  
  <!-- Upgrade priorities -->
  <text x="400" y="520" text-anchor="middle" fill="#aabbcc" font-weight="700" font-size="14">Rebuild Priority</text>
  <text x="400" y="538" text-anchor="middle" fill="#8899aa" font-size="11">1. Superalloy Chain  |  2. Power Grid  |  3. Assembly Block  |  4. Smelting Array</text>
  
  <rect x="40" y="555" width="720" height="40" rx="6" fill="#0d5a4a" stroke="#00D4AA" stroke-width="1"/>
  <text x="400" y="575" text-anchor="middle" fill="#00D4AA" font-size="12">Pro tip: Leave a 1-tile walkway perimeter. Append -v11 to blueprint names to keep old versions as fallback.</text>
  
  <!-- Object budget bar -->
  <rect x="40" y="610" width="720" height="80" rx="6" fill="url(#box)" stroke="#4a6a85" stroke-width="1" filter="url(#shadow)"/>
  <text x="400" y="632" text-anchor="middle" fill="#aabbcc" font-size="12">Object Budget: 200 max per blueprint</text>
  
  <rect x="55" y="645" width="144" height="20" rx="3" fill="#00D4AA" opacity="0.7"/>
  <text x="127" y="659" text-anchor="middle" fill="#0f1a24" font-size="10" font-weight="700">60-80 Production</text>
  <rect x="207" y="645" width="124" height="20" rx="3" fill="#4a90d9" opacity="0.7"/>
  <text x="269" y="659" text-anchor="middle" fill="#fff" font-size="10" font-weight="700">40-50 Storage</text>
  <rect x="339" y="645" width="124" height="20" rx="3" fill="#e67e22" opacity="0.7"/>
  <text x="401" y="659" text-anchor="middle" fill="#fff" font-size="10" font-weight="700">30-40 Piping</text>
  <rect x="471" y="645" width="124" height="20" rx="3" fill="#4a6a85" opacity="0.7"/>
  <text x="533" y="659" text-anchor="middle" fill="#aabbcc" font-size="10" font-weight="700">30-50 Reserve</text>
  
  <rect x="610" y="645" width="140" height="20" rx="3" fill="#f0c040" opacity="0.3" stroke="#f0c040" stroke-width="0.5"/>
  <text x="680" y="659" text-anchor="middle" fill="#f0c040" font-size="10">200 Total</text>
