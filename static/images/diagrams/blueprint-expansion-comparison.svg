<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 720" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A2533"/>
      <stop offset="100%" stop-color="#0f1a24"/>
    </linearGradient>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00D4AA"/>
      <stop offset="100%" stop-color="#00b894"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3044"/>
      <stop offset="100%" stop-color="#162535"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a6a85"/>
    </marker>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="800" height="720" fill="url(#bg)" rx="8"/>
  <rect x="20" y="20" width="760" height="44" rx="4" fill="url(#hdr)"/>
  <text x="400" y="49" text-anchor="middle" fill="#0f1a24" font-weight="700" font-size="16">Blueprint 30x30 Expansion Comparison - Old vs New</text>
  
  <!-- Old limit box -->
  <rect x="40" y="80" width="340" height="300" rx="8" fill="url(#box)" stroke="#e74c3c" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="210" y="105" text-anchor="middle" fill="#e74c3c" font-weight="700" font-size="15">Old Limit (v1.0)</text>
  <text x="210" y="122" text-anchor="middle" fill="#8899aa" font-size="11">20 x 20 tiles - 120 objects</text>
  
  <!-- Old grid -->
  <rect x="60" y="135" width="300" height="225" rx="2" fill="none" stroke="#4a6a85" stroke-width="0.5"/>
  <line x1="110" y1="135" x2="110" y2="360" stroke="#4a6a85" stroke-width="0.3"/>
  <line x1="160" y1="135" x2="160" y2="360" stroke="#4a6a85" stroke-width="0.3"/>
  <line x1="210" y1="135" x2="210" y2="360" stroke="#4a6a85" stroke-width="0.3"/>
  <line x1="260" y1="135" x2="260" y2="360" stroke="#4a6a85" stroke-width="0.3"/>
  <line x1="310" y1="135" x2="310" y2="360" stroke="#4a6a85" stroke-width="0.3"/>
  <line x1="60" y1="180" x2="360" y2="180" stroke="#4a6a85" stroke-width="0.3"/>
  <line x1="60" y1="225" x2="360" y2="225" stroke="#4a6a85" stroke-width="0.3"/>
  <line x1="60" y1="270" x2="360" y2="270" stroke="#4a6a85" stroke-width="0.3"/>
  <line x1="60" y1="315" x2="360" y2="315" stroke="#4a6a85" stroke-width="0.3"/>
  
  <!-- Old buildings -->
  <rect x="72" y="145" width="30" height="25" rx="3" fill="#00D4AA" opacity="0.6"/>
  <text x="87" y="162" text-anchor="middle" fill="#0f1a24" font-size="8" font-weight="700">S</text>
  <rect x="112" y="145" width="30" height="25" rx="3" fill="#00D4AA" opacity="0.6"/>
  <text x="127" y="162" text-anchor="middle" fill="#0f1a24" font-size="8" font-weight="700">S</text>
  <rect x="152" y="145" width="30" height="25" rx="3" fill="#00D4AA" opacity="0.6"/>
  <text x="167" y="162" text-anchor="middle" fill="#0f1a24" font-size="8" font-weight="700">S</text>
