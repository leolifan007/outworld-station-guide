<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A2533"/>
      <stop offset="100%" stop-color="#0f1a24"/>
    </linearGradient>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00D4AA"/>
      <stop offset="100%" stop-color="#00b894"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3044"/>
      <stop offset="100%" stop-color="#162535"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#00D4AA"/>
    </marker>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="800" height="680" fill="url(#bg)" rx="8"/>
  <rect x="20" y="20" width="760" height="44" rx="4" fill="url(#hdr)"/>
  <text x="400" y="49" text-anchor="middle" fill="#0f1a24" font-weight="700" font-size="16">Post-Campaign Endgame Loop (v1.1.2.0)</text>

  <!-- Core loop row -->
  <rect x="40" y="94" width="220" height="76" rx="8" fill="url(#box)" stroke="#4a90d9" stroke-width="1.4" filter="url(#shadow)"/>
  <text x="150" y="120" text-anchor="middle" fill="#4a90d9" font-weight="700" font-size="12">1. Missions</text>
  <text x="150" y="140" text-anchor="middle" fill="#C8D6E8" font-size="10">Arkship Terminal board</text>
  <text x="150" y="156" text-anchor="middle" fill="#8FA8C0" font-size="10">random objectives</text>

  <line x1="260" y1="132" x2="300" y2="132" stroke="#00D4AA" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="305" y="94" width="190" height="76" rx="8" fill="url(#box)" stroke="#00D4AA" stroke-width="1.4" filter="url(#shadow)"/>
  <text x="400" y="120" text-anchor="middle" fill="#00D4AA" font-weight="700" font-size="12">2. Prestige</text>
  <text x="400" y="140" text-anchor="middle" fill="#C8D6E8" font-size="10">points -> levels</text>
  <text x="400" y="156" text-anchor="middle" fill="#8FA8C0" font-size="10">random rewards</text>

  <line x1="495" y1="132" x2="535" y2="132" stroke="#00D4AA" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="540" y="94" width="220" height="76" rx="8" fill="url(#box)" stroke="#FFC65C" stroke-width="1.4" filter="url(#shadow)"/>
  <text x="650" y="120" text-anchor="middle" fill="#FFC65C" font-weight="700" font-size="12">3. Spend</text>
  <text x="650" y="140" text-anchor="middle" fill="#C8D6E8" font-size="10">Decorations + Tech Points</text>
  <text x="650" y="156" text-anchor="middle" fill="#8FA8C0" font-size="10">showcase + research</text>

  <!-- loop back arrow -->
  <path d="M 650 170 C 650 205 400 205 400 170" fill="none" stroke="#4a6a85" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="400" y="200" text-anchor="middle" fill="#6A8AAA" font-size="10">repeat</text>

  <!-- Supporting activities -->
  <text x="400" y="240" text-anchor="middle" fill="#8FA8C0" font-size="11" font-weight="600">Two Supporting Habits</text>

  <rect x="60" y="256" width="320" height="140" rx="8" fill="url(#box)" stroke="#4a90d9" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="220" y="282" text-anchor="middle" fill="#4a90d9" font-weight="700" font-size="12">Showcase Building</text>
  <text x="80" y="308" fill="#C8D6E8" font-size="10">&#8226; Pick one region of the station</text>
  <text x="80" y="328" fill="#C8D6E8" font-size="10">&#8226; Place Decoration Elements there</text>
  <text x="80" y="348" fill="#C8D6E8" font-size="10">&#8226; Build slowly, deliberately</text>
  <text x="80" y="368" fill="#C8D6E8" font-size="10">&#8226; Keep the factory zones clean</text>
  <text x="80" y="386" fill="#8FA8C0" font-size="10" font-style="italic">the creative payoff of finishing</text>

  <rect x="420" y="256" width="320" height="140" rx="8" fill="url(#box)" stroke="#00D4AA" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="580" y="282" text-anchor="middle" fill="#00D4AA" font-weight="700" font-size="12">Factory Cleanup</text>
  <text x="440" y="308" fill="#C8D6E8" font-size="10">&#8226; Retire dead production lines</text>
  <text x="440" y="328" fill="#C8D6E8" font-size="10">&#8226; Re-tune saturated belts (540 cap)</text>
  <text x="440" y="348" fill="#C8D6E8" font-size="10">&#8226; Audit storage filters + buffers</text>
  <text x="440" y="368" fill="#C8D6E8" font-size="10">&#8226; Verify power margins, back up save</text>
  <text x="440" y="386" fill="#8FA8C0" font-size="10" font-style="italic">pays down a hundred hours of debt</text>

  <!-- weekly -->
  <rect x="60" y="424" width="680" height="74" rx="8" fill="#1E2E3A" stroke="#4a90d9" stroke-width="1" filter="url(#shadow)"/>
  <text x="400" y="448" text-anchor="middle" fill="#4a90d9" font-weight="700" font-size="12">A Relaxed Session Rotation</text>
  <text x="400" y="470" text-anchor="middle" fill="#C8D6E8" font-size="11">Read board -&gt; clear automation-friendly missions -&gt; collect + level -&gt; one cleanup or decoration pass</text>
  <text x="400" y="490" text-anchor="middle" fill="#8FA8C0" font-size="10">Your factory does the endgame work - the loop is built to be idle-friendly</text>

  <!-- warning -->
  <rect x="150" y="524" width="500" height="60" rx="8" fill="#3A2E1E" stroke="#FFB347" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="400" y="548" text-anchor="middle" fill="#FFB347" font-weight="700" font-size="12">Beta System - Provisional Numbers</text>
  <text x="400" y="570" text-anchor="middle" fill="#C8D6E8" font-size="10">Missions + Prestige are on the 1.1.2.0 beta branch; values may change before stable</text>

  <text x="400" y="624" text-anchor="middle" fill="#6A8AAA" font-size="10" font-style="italic">Next direction: missions may reward station parts and resource nodes in a future update</text>
</svg>
