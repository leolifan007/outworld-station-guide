<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A2533"/>
      <stop offset="100%" stop-color="#0f1a24"/>
    </linearGradient>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00D4AA"/>
      <stop offset="100%" stop-color="#00b894"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3044"/>
      <stop offset="100%" stop-color="#162535"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a6a85"/>
    </marker>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="800" height="560" fill="url(#bg)" rx="8"/>
  <rect x="20" y="20" width="760" height="44" rx="4" fill="url(#hdr)"/>
  <text x="400" y="49" text-anchor="middle" fill="#0f1a24" font-weight="700" font-size="16">Blueprint Folder Management - From Flat Mess to Paste-Ready Catalog</text>

  <!-- Before -->
  <rect x="30" y="84" width="360" height="180" rx="8" fill="url(#box)" stroke="#e74c3c" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="210" y="108" text-anchor="middle" fill="#e74c3c" font-weight="700" font-size="14">Before v1.1.1.0 (flat list)</text>
  <text x="210" y="135" text-anchor="middle" fill="#C8D6E8" font-size="11">Blueprint 47</text>
  <text x="210" y="155" text-anchor="middle" fill="#C8D6E8" font-size="11">Blueprint 48</text>
  <text x="210" y="175" text-anchor="middle" fill="#C8D6E8" font-size="11">Blueprint 49 ...</text>
  <text x="210" y="200" text-anchor="middle" fill="#6A8AAA" font-size="10">No names. No folders. Endless scrolling.</text>
  <text x="210" y="245" text-anchor="middle" fill="#e74c3c" font-size="11">"Which one was the smelter array?"</text>

  <!-- Arrow -->
  <line x1="390" y1="174" x2="410" y2="174" stroke="#4a6a85" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- After: folders -->
  <rect x="410" y="84" width="360" height="180" rx="8" fill="url(#box)" stroke="#00D4AA" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="590" y="108" text-anchor="middle" fill="#00D4AA" font-weight="700" font-size="14">After v1.1.1.0 (folders + rename)</text>

  <rect x="430" y="122" width="150" height="40" rx="6" fill="#1E3A2E" stroke="#00D4AA" stroke-width="1.5"/>
  <text x="505" y="141" text-anchor="middle" fill="#00D4AA" font-size="11" font-weight="600">Prod</text>
  <text x="505" y="155" text-anchor="middle" fill="#6A8AAA" font-size="9">smelters / assemblers</text>

  <rect x="590" y="122" width="160" height="40" rx="6" fill="#1E3A2E" stroke="#00D4AA" stroke-width="1.5"/>
  <text x="670" y="141" text-anchor="middle" fill="#00D4AA" font-size="11" font-weight="600">Logi</text>
  <text x="670" y="155" text-anchor="middle" fill="#6A8AAA" font-size="9">balancers / buffers</text>

  <rect x="430" y="172" width="150" height="40" rx="6" fill="#1E3A2E" stroke="#00D4AA" stroke-width="1.5"/>
  <text x="505" y="191" text-anchor="middle" fill="#00D4AA" font-size="11" font-weight="600">Ships</text>
  <text x="505" y="205" text-anchor="middle" fill="#6A8AAA" font-size="9">freighter / combat</text>

  <rect x="590" y="172" width="160" height="40" rx="6" fill="#1E3A2E" stroke="#00D4AA" stroke-width="1.5"/>
  <text x="670" y="191" text-anchor="middle" fill="#00D4AA" font-size="11" font-weight="600">Power</text>
  <text x="670" y="205" text-anchor="middle" fill="#6A8AAA" font-size="9">reactor / solar</text>

  <!-- Naming convention -->
  <rect x="200" y="290" width="400" height="52" rx="8" fill="url(#box)" stroke="#f0c040" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="400" y="312" text-anchor="middle" fill="#f0c040" font-weight="700" font-size="12">Naming Convention</text>
  <text x="400" y="330" text-anchor="middle" fill="#C8D6E8" font-size="11">[SIZE][TYPE]-[PURPOSE]  e.g. 30x30 Smelter-Iron, 20x20 Circuit-Carbon</text>

  <!-- Payoff -->
  <rect x="200" y="366" width="400" height="70" rx="8" fill="url(#box)" stroke="#4a6a85" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="400" y="390" text-anchor="middle" fill="#C8D6E8" font-size="12" font-weight="600">The Payoff: Expansion Loop</text>
  <text x="400" y="410" text-anchor="middle" fill="#C8D6E8" font-size="11">Scout planet - paste Prod/Power/Logi blueprints</text>
  <text x="400" y="426" text-anchor="middle" fill="#6A8AAA" font-size="10">Connect power + belts = minutes, not hours</text>

  <!-- Steps -->
  <rect x="200" y="460" width="400" height="80" rx="8" fill="url(#box)" stroke="#4a90d9" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="400" y="482" text-anchor="middle" fill="#4a90d9" font-weight="700" font-size="12">Setup (10 minutes)</text>
  <text x="400" y="502" text-anchor="middle" fill="#C8D6E8" font-size="11">1. New Folder button - name it (Prod/Logi/Ships/Power)</text>
  <text x="400" y="520" text-anchor="middle" fill="#C8D6E8" font-size="11">2. Drag blueprints in (multi-select works)</text>
  <text x="400" y="538" text-anchor="middle" fill="#C8D6E8" font-size="11">3. Rename with prefix - old blueprints migrate fine</text>
</svg>
