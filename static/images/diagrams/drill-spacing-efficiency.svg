<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="100%" height="100%">
  <rect width="600" height="420" fill="#1A2533"/>
  <defs>
    <linearGradient id="drillGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00D4AA"/>
      <stop offset="100%" stop-color="#009977"/>
    </linearGradient>
    <linearGradient id="barGrad2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4A9EFF"/>
      <stop offset="100%" stop-color="#2A7EDF"/>
    </linearGradient>
    <linearGradient id="barGrad3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#E09000"/>
    </linearGradient>
    <linearGradient id="barGrad4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF5252"/>
      <stop offset="100%" stop-color="#D03030"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="300" y="32" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="bold">Drill Spacing &amp; Mining Efficiency</text>
  <line x1="140" y1="40" x2="460" y2="40" stroke="#00D4AA" stroke-width="1.5" opacity="0.5"/>

  <!-- Row 1: 2 apart, 3 drills -->
  <text x="45" y="78" fill="#FFB300" font-family="sans-serif" font-size="11" font-weight="bold">2 tiles</text>
  <rect x="70" y="62" width="24" height="24" rx="3" fill="url(#drillGrad)" stroke="#00D4AA" stroke-width="1"/>
  <rect x="106" y="62" width="24" height="24" rx="3" fill="url(#drillGrad)" stroke="#00D4AA" stroke-width="1"/>
  <rect x="142" y="62" width="24" height="24" rx="3" fill="url(#drillGrad)" stroke="#00D4AA" stroke-width="1"/>
  <line x1="82" y1="74" x2="82" y2="50" stroke="#ffffff" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="106" y1="74" x2="106" y2="50" stroke="#ffffff" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="82" y="48" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="8" opacity="0.7">2</text>
  <text x="106" y="48" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="8" opacity="0.7">2</text>

  <!-- Efficiency bar 1 -->
  <rect x="190" y="66" width="140" height="16" rx="4" fill="#2A3D4F"/>
  <rect x="190" y="66" width="70" height="16" rx="4" fill="url(#barGrad2)" opacity="0.7"/>
  <rect x="190" y="66" width="70" height="16" rx="4" fill="none" stroke="#4A9EFF" stroke-width="1"/>
  <text x="260" y="78" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold">50%</text>
  <text x="350" y="78" fill="#8A9BAE" font-family="sans-serif" font-size="10">Overlap waste: 50%</text>
  <circle cx="370" cy="73" r="4" fill="#FF5252" opacity="0.6"/>

  <!-- Row 2: 3 apart, 2 drills -->
  <line x1="40" y1="108" x2="560" y2="108" stroke="#1F2D3F" stroke-width="1"/>
  <text x="45" y="123" fill="#FFB300" font-family="sans-serif" font-size="11" font-weight="bold">3 tiles</text>
  <rect x="70" y="107" width="24" height="24" rx="3" fill="url(#drillGrad)" stroke="#00D4AA" stroke-width="1"/>
  <rect x="120" y="107" width="24" height="24" rx="3" fill="url(#drillGrad)" stroke="#00D4AA" stroke-width="1"/>
  <line x1="82" y1="119" x2="82" y2="95" stroke="#ffffff" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="120" y1="119" x2="120" y2="95" stroke="#ffffff" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="82" y="93" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="8" opacity="0.7">3</text>
  <text x="120" y="93" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="8" opacity="0.7">3</text>

  <!-- Efficiency bar 2 -->
  <rect x="190" y="111" width="140" height="16" rx="4" fill="#2A3D4F"/>
  <rect x="190" y="111" width="105" height="16" rx="4" fill="url(#barGrad3)" opacity="0.7"/>
  <rect x="190" y="111" width="105" height="16" rx="4" fill="none" stroke="#FFB300" stroke-width="1"/>
  <text x="260" y="123" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold">75%</text>
  <text x="350" y="123" fill="#8A9BAE" font-family="sans-serif" font-size="10">Minimal overlap, good rate</text>
  <circle cx="370" cy="118" r="4" fill="#FFB300" opacity="0.6"/>

  <!-- Row 3: 4 apart, 2 drills -->
  <line x1="40" y1="153" x2="560" y2="153" stroke="#1F2D3F" stroke-width="1"/>
  <text x="45" y="168" fill="#FFB300" font-family="sans-serif" font-size="11" font-weight="bold">4 tiles</text>
  <rect x="70" y="152" width="24" height="24" rx="3" fill="url(#drillGrad)" stroke="#00D4AA" stroke-width="1"/>
  <rect x="132" y="152" width="24" height="24" rx="3" fill="url(#drillGrad)" stroke="#00D4AA" stroke-width="1"/>
  <line x1="82" y1="164" x2="82" y2="140" stroke="#ffffff" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="132" y1="164" x2="132" y2="140" stroke="#ffffff" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="82" y="138" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="8" opacity="0.7">4</text>
  <text x="132" y="138" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="8" opacity="0.7">4</text>

  <!-- Efficiency bar 3 -->
  <rect x="190" y="156" width="140" height="16" rx="4" fill="#2A3D4F"/>
  <rect x="190" y="156" width="129" height="16" rx="4" fill="url(#barGrad2)" opacity="0.7"/>
  <rect x="190" y="156" width="129" height="16" rx="4" fill="none" stroke="#4A9EFF" stroke-width="1"/>
  <text x="260" y="168" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold">92%</text>
  <text x="350" y="168" fill="#8A9BAE" font-family="sans-serif" font-size="10">Near-optimal spacing</text>
  <circle cx="370" cy="163" r="4" fill="#00D4AA" opacity="0.6"/>

  <!-- Row 4: 5 apart, 2 drills -->
  <line x1="40" y1="198" x2="560" y2="198" stroke="#1F2D3F" stroke-width="1"/>
  <text x="45" y="213" fill="#FFB300" font-family="sans-serif" font-size="11" font-weight="bold">5 tiles</text>
  <rect x="70" y="197" width="24" height="24" rx="3" fill="url(#drillGrad)" stroke="#00D4AA" stroke-width="1"/>
  <rect x="144" y="197" width="24" height="24" rx="3" fill="url(#drillGrad)" stroke="#00D4AA" stroke-width="1"/>
  <line x1="82" y1="209" x2="82" y2="185" stroke="#ffffff" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="144" y1="209" x2="144" y2="185" stroke="#ffffff" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="82" y="183" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="8" opacity="0.7">5</text>
  <text x="144" y="183" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="8" opacity="0.7">5</text>

  <!-- Efficiency bar 4 -->
  <rect x="190" y="201" width="140" height="16" rx="4" fill="#2A3D4F"/>
  <rect x="190" y="201" width="140" height="16" rx="4" fill="url(#barGrad4)" opacity="0.3"/>
  <rect x="190" y="201" width="140" height="16" rx="4" fill="none" stroke="#FF5252" stroke-width="1"/>
  <text x="260" y="213" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold">100%</text>
  <text x="350" y="213" fill="#8A9BAE" font-family="sans-serif" font-size="10">Max range, no overlap</text>
  <circle cx="370" cy="208" r="4" fill="#FF5252" opacity="0.6"/>

  <!-- Bottom annotation / tip box -->
  <rect x="40" y="240" width="520" height="80" rx="6" fill="#0F1A26" stroke="#00D4AA" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="60" y="262" fill="#00D4AA" font-family="sans-serif" font-size="12" font-weight="bold">💡 Optimization Tip</text>
  <text x="60" y="282" fill="#B0C4DE" font-family="sans-serif" font-size="11">Each drill covers a 5-tile radius. Spacing at 4 tiles gives 92% coverage per area</text>
  <text x="60" y="298" fill="#B0C4DE" font-family="sans-serif" font-size="11">while keeping drill count manageable. For max throughput use 3 tiles.</text>
  <text x="60" y="314" fill="#B0C4DE" font-family="sans-serif" font-size="11">Spacing 2 = overkill for early game, 5 = minimum viable coverage.</text>

  <!-- Coverage zone visual at bottom -->
  <text x="300" y="352" text-anchor="middle" fill="#8A9BAE" font-family="sans-serif" font-size="10">Coverage Zones (overhead view)</text>
  <circle cx="170" cy="388" r="28" fill="none" stroke="#00D4AA" stroke-width="2" stroke-dasharray="4,2" opacity="0.4"/>
  <circle cx="170" cy="388" r="28" fill="#00D4AA" opacity="0.05"/>
  <circle cx="220" cy="388" r="28" fill="none" stroke="#00D4AA" stroke-width="2" stroke-dasharray="4,2" opacity="0.4"/>
  <circle cx="220" cy="388" r="28" fill="#00D4AA" opacity="0.05"/>
  <rect x="162" y="380" width="16" height="16" rx="3" fill="url(#drillGrad)" stroke="#00D4AA" stroke-width="1"/>
  <rect x="212" y="380" width="16" height="16" rx="3" fill="url(#drillGrad)" stroke="#00D4AA" stroke-width="1"/>
  <text x="170" y="395" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="6">D</text>
  <text x="220" y="395" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="6">D</text>
  <text x="128" y="392" fill="#8A9BAE" font-family="sans-serif" font-size="8">4 tiles</text>

  <circle cx="340" cy="388" r="28" fill="none" stroke="#FF5252" stroke-width="2" stroke-dasharray="4,2" opacity="0.4"/>
  <circle cx="340" cy="388" r="28" fill="#FF5252" opacity="0.05"/>
  <circle cx="410" cy="388" r="28" fill="none" stroke="#FF5252" stroke-width="2" stroke-dasharray="4,2" opacity="0.4"/>
  <circle cx="410" cy="388" r="28" fill="#FF5252" opacity="0.05"/>
  <rect x="332" y="380" width="16" height="16" rx="3" fill="url(#drillGrad)" stroke="#00D4AA" stroke-width="1"/>
  <rect x="402" y="380" width="16" height="16" rx="3" fill="url(#drillGrad)" stroke="#00D4AA" stroke-width="1"/>
  <text x="340" y="395" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="6">D</text>
  <text x="410" y="395" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="6">D</text>
  <text x="290" y="392" fill="#8A9BAE" font-family="sans-serif" font-size="8">5 tiles</text>
  <circle cx="375" cy="388" r="8" fill="#00D4AA" opacity="0.08"/>

  <!-- Legend -->
  <rect x="440" y="240" width="8" height="8" rx="1" fill="url(#drillGrad)"/>
  <text x="452" y="247" fill="#8A9BAE" font-family="sans-serif" font-size="8">Drill</text>
  <rect x="440" y="255" width="8" height="8" rx="1" fill="#2A3D4F"/>
  <text x="452" y="262" fill="#8A9BAE" font-family="sans-serif" font-size="8">Efficiency</text>
</svg>