<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260">
  <rect width="600" height="260" fill="#1A2533" rx="8"/>
  <text x="300" y="28" fill="#00D4AA" font-family="Arial,sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Three Overflow Sink Methods</text>

  <!-- Method 1: Recycling -->
  <g transform="translate(15, 50)">
    <rect x="0" y="0" width="180" height="65" fill="#2A3F55" rx="6" stroke="#8899AA" stroke-width="1"/>
    <text x="90" y="16" fill="#FF6B35" font-family="Arial,sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Method 1: Recycling</text>

    <rect x="6" y="25" width="50" height="25" fill="#1E3045" rx="4" stroke="#8899AA" stroke-width="1"/>
    <text x="31" y="41" fill="#B0C4D8" font-family="Arial,sans-serif" font-size="9" text-anchor="middle">Buffer</text>
    <text x="31" y="52" fill="#8899AA" font-family="Arial,sans-serif" font-size="7" text-anchor="middle">80% full</text>

    <line x1="56" y1="37" x2="72" y2="37" stroke="#FF6B35" stroke-width="1.5" marker-end="url(#ar)"/>

    <rect x="72" y="22" width="50" height="30" fill="#1E3045" rx="4" stroke="#FF6B35" stroke-width="1.5"/>
    <text x="97" y="38" fill="#FF6B35" font-family="Arial,sans-serif" font-size="9" text-anchor="middle">Recycler</text>
    <text x="97" y="50" fill="#8899AA" font-family="Arial,sans-serif" font-size="7" text-anchor="middle">4:1 to scrap</text>

    <line x1="122" y1="37" x2="138" y2="37" stroke="#8899AA" stroke-width="1.5" marker-end="url(#ar)"/>

    <rect x="138" y="27" width="35" height="20" fill="#1E3045" rx="4" stroke="#8899AA" stroke-width="1"/>
    <text x="156" y="40" fill="#8899AA" font-family="Arial,sans-serif" font-size="8" text-anchor="middle">Scrap</text>
  </g>

  <!-- Method 2: Overflow storage -->
  <g transform="translate(15, 130)">
    <rect x="0" y="0" width="180" height="65" fill="#2A3F55" rx="6" stroke="#8899AA" stroke-width="1"/>
    <text x="90" y="16" fill="#FFD93D" font-family="Arial,sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Method 2: Divert to Satellite</text>

    <rect x="6" y="25" width="50" height="25" fill="#1E3045" rx="4" stroke="#8899AA" stroke-width="1"/>
    <text x="31" y="41" fill="#B0C4D8" font-family="Arial,sans-serif" font-size="9" text-anchor="middle">Buffer</text>

    <line x1="56" y1="37" x2="65" y2="22" stroke="#FFD93D" stroke-width="1.5" marker-end="url(#ar)"/>

    <rect x="65" y="22" width="15" height="28" fill="#1E3045" rx="2" stroke="#FFD93D" stroke-width="1.5"/>
    <text x="73" y="40" fill="#FFD93D" font-family="Arial,sans-serif" font-size="7" text-anchor="middle">GT</text>

    <line x1="80" y1="22" x2="92" y2="22" stroke="#FFD93D" stroke-width="1.5" marker-end="url(#ar)"/>

    <rect x="92" y="15" width="35" height="35" fill="#1E3045" rx="4" stroke="#8899AA" stroke-width="1"/>
    <text x="110" y="30" fill="#8899AA" font-family="Arial,sans-serif" font-size="8" text-anchor="middle">Satellite</text>
    <text x="110" y="42" fill="#8899AA" font-family="Arial,sans-serif" font-size="7" text-anchor="middle">Storage</text>

    <!-- Also goes to line main -->
    <line x1="56" y1="37" x2="92" y2="48" stroke="#8899AA" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="70" y="58" fill="#8899AA" font-family="Arial,sans-serif" font-size="7" text-anchor="middle">Production line (normal flow)</text>
  </g>

  <!-- Method 3: Upcycling -->
  <g transform="translate(380, 50)">
    <rect x="0" y="0" width="200" height="145" fill="#2A3F55" rx="6" stroke="#8899AA" stroke-width="1"/>
    <text x="100" y="16" fill="#00D4AA" font-family="Arial,sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Method 3: Upcycling</text>

    <rect x="10" y="28" width="80" height="25" fill="#1E3045" rx="4" stroke="#8899AA" stroke-width="1"/>
    <text x="50" y="44" fill="#B0C4D8" font-family="Arial,sans-serif" font-size="9" text-anchor="middle">Iron (surplus)</text>

    <line x1="90" y1="40" x2="105" y2="40" stroke="#00D4AA" stroke-width="1.5" marker-end="url(#ar)"/>

    <rect x="105" y="25" width="55" height="30" fill="#1E3045" rx="4" stroke="#00D4AA" stroke-width="1.5"/>
    <text x="133" y="40" fill="#00D4AA" font-family="Arial,sans-serif" font-size="9" text-anchor="middle">Converter</text>
    <text x="133" y="52" fill="#8899AA" font-family="Arial,sans-serif" font-size="7" text-anchor="middle">5 iron -> 1 elec</text>

    <line x1="160" y1="40" x2="175" y2="40" stroke="#00D4AA" stroke-width="1.5" marker-end="url(#ar)"/>

    <rect x="175" y="28" width="20" height="24" fill="#1E3045" rx="4" stroke="#4ECDC4" stroke-width="1.5"/>
    <text x="185" y="44" fill="#4ECDC4" font-family="Arial,sans-serif" font-size="8" text-anchor="middle">E!</text>

    <text x="100" y="80" fill="#8899AA" font-family="Arial,sans-serif" font-size="9" text-anchor="middle">Common conversions:</text>
    <text x="12" y="98" fill="#B0C4D8" font-family="Arial,sans-serif" font-size="9">Iron + Copper -> Electronics</text>
    <text x="12" y="114" fill="#B0C4D8" font-family="Arial,sans-serif" font-size="9">Titanium + Tungsten -> Superalloy</text>
    <text x="12" y="130" fill="#B0C4D8" font-family="Arial,sans-serif" font-size="9">Excess Gas -> Nitrox</text>
  </g>

  <!-- Priority Gate label -->
  <g transform="translate(15, 210)">
    <rect x="0" y="0" width="570" height="30" fill="#1E3045" rx="6" stroke="#FFD93D" stroke-width="1"/>
    <text x="285" y="20" fill="#FFD93D" font-family="Arial,sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Key Component: Priority Gate at 80% threshold diverts overflow to the correct sink method</text>
  </g>

  <defs>
    <marker id="ar" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto">
      <path d="M0,0 L6,2 L0,4"/>
    </marker>
  </defs>
</svg>
