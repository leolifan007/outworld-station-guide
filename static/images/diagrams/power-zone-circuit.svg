<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="100%" height="100%">
  <rect width="600" height="420" fill="#1A2533"/>
  <defs>
    <linearGradient id="gradA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00D4AA"/>
      <stop offset="100%" stop-color="#009977"/>
    </linearGradient>
    <linearGradient id="gradB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#E09000"/>
    </linearGradient>
    <linearGradient id="gradC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6B7B8F"/>
      <stop offset="100%" stop-color="#4A5A6E"/>
    </linearGradient>
    <linearGradient id="breakerGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF5252"/>
      <stop offset="100%" stop-color="#D03030"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="300" y="32" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="bold">Circuit Breaker Power Zoning</text>
  <line x1="140" y1="40" x2="460" y2="40" stroke="#FFB300" stroke-width="1.5" opacity="0.5"/>

  <!-- Power Source (top) -->
  <rect x="250" y="55" width="100" height="36" rx="6" fill="#0F1A26" stroke="#FFB300" stroke-width="2"/>
  <text x="300" y="77" text-anchor="middle" fill="#FFB300" font-family="sans-serif" font-size="13" font-weight="bold">⚡ Main Power</text>

  <!-- Main line down -->
  <line x1="300" y1="91" x2="300" y2="140" stroke="#FFB300" stroke-width="3"/>
  <polygon points="300,140 294,128 306,128" fill="#FFB300"/>

  <!-- Circuit Breaker -->
  <rect x="250" y="140" width="100" height="40" rx="6" fill="url(#breakerGrad)" stroke="#FF5252" stroke-width="2"/>
  <text x="300" y="155" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="10" font-weight="bold">CIRCUIT</text>
  <text x="300" y="170" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="10" font-weight="bold">BREAKER</text>

  <!-- Breaker split lines -->
  <line x1="300" y1="180" x2="300" y2="195" stroke="#FF5252" stroke-width="2"/>

  <!-- Split to 3 zones -->
  <line x1="130" y1="195" x2="470" y2="195" stroke="#8A9BAE" stroke-width="2"/>

  <!-- Zone A line (left) -->
  <line x1="130" y1="195" x2="130" y2="240" stroke="#00D4AA" stroke-width="3"/>
  <polygon points="130,240 124,228 136,228" fill="#00D4AA"/>

  <!-- Zone Center line -->
  <line x1="300" y1="195" x2="300" y2="240" stroke="#6B7B8F" stroke-width="3"/>
  <polygon points="300,240 294,228 306,228" fill="#6B7B8F"/>

  <!-- Zone B line (right) -->
  <line x1="470" y1="195" x2="470" y2="240" stroke="#FFB300" stroke-width="3"/>
  <polygon points="470,240 464,228 476,228" fill="#FFB300"/>

  <!-- Label on split lines -->
  <text x="130" y="190" text-anchor="middle" fill="#00D4AA" font-family="sans-serif" font-size="9" font-weight="bold">▲</text>
  <text x="300" y="190" text-anchor="middle" fill="#6B7B8F" font-family="sans-serif" font-size="9" font-weight="bold">▲</text>
  <text x="470" y="190" text-anchor="middle" fill="#FFB300" font-family="sans-serif" font-size="9" font-weight="bold">▲</text>

  <!-- Zone A Box -->
  <rect x="50" y="245" width="160" height="130" rx="8" fill="#0F1A26" stroke="#00D4AA" stroke-width="2"/>
  <rect x="50" y="245" width="160" height="30" rx="8" fill="url(#gradA)"/>
  <rect x="50" y="267" width="160" height="8" rx="0" fill="url(#gradA)"/>
  <text x="130" y="265" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="12" font-weight="bold">ZONE A — Critical</text>

  <text x="65" y="295" fill="#00D4AA" font-family="sans-serif" font-size="11" font-weight="bold">▸ Life Support</text>
  <text x="65" y="312" fill="#B0C4DE" font-family="sans-serif" font-size="10">O2 generators, CO2 scrubbers</text>
  <text x="65" y="330" fill="#00D4AA" font-family="sans-serif" font-size="11" font-weight="bold">▸ Command Center</text>
  <text x="65" y="347" fill="#B0C4DE" font-family="sans-serif" font-size="10">Navigation, comms, sensors</text>
  <rect x="65" y="357" width="130" height="12" rx="3" fill="#1A3D30"/>
  <rect x="65" y="357" width="52" height="12" rx="3" fill="#00D4AA" opacity="0.7"/>
  <text x="130" y="367" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="8">40% allocation</text>

  <!-- Zone B Box -->
  <rect x="390" y="245" width="160" height="130" rx="8" fill="#0F1A26" stroke="#FFB300" stroke-width="2"/>
  <rect x="390" y="245" width="160" height="30" rx="8" fill="url(#gradB)"/>
  <rect x="390" y="267" width="160" height="8" rx="0" fill="url(#gradB)"/>
  <text x="470" y="265" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="12" font-weight="bold">ZONE B — Production</text>

  <text x="405" y="295" fill="#FFB300" font-family="sans-serif" font-size="11" font-weight="bold">▸ Manufacturing</text>
  <text x="405" y="312" fill="#B0C4DE" font-family="sans-serif" font-size="10">Assemblers, refineries</text>
  <text x="405" y="330" fill="#FFB300" font-family="sans-serif" font-size="11" font-weight="bold">▸ Processing</text>
  <text x="405" y="347" fill="#B0C4DE" font-family="sans-serif" font-size="10">Ore processing, recycling</text>
  <rect x="405" y="357" width="130" height="12" rx="3" fill="#3D301A"/>
  <rect x="405" y="357" width="45" height="12" rx="3" fill="#FFB300" opacity="0.7"/>
  <text x="470" y="367" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="8">35% allocation</text>

  <!-- Zone C Box (center) -->
  <rect x="220" y="290" width="160" height="85" rx="8" fill="#0F1A26" stroke="#6B7B8F" stroke-width="2"/>
  <rect x="220" y="290" width="160" height="26" rx="8" fill="url(#gradC)"/>
  <rect x="220" y="308" width="160" height="8" rx="0" fill="url(#gradC)"/>
  <text x="300" y="309" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="11" font-weight="bold">ZONE C — Expansion</text>

  <text x="235" y="332" fill="#8A9BAE" font-family="sans-serif" font-size="10">▸ New construction</text>
  <text x="235" y="348" fill="#8A9BAE" font-family="sans-serif" font-size="10">▸ Idle / standby systems</text>
  <rect x="235" y="358" width="130" height="12" rx="3" fill="#2A3D4F"/>
  <rect x="235" y="358" width="32" height="12" rx="3" fill="#6B7B8F" opacity="0.7"/>
  <text x="300" y="368" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="8">25% allocation</text>

  <!-- Bottom note -->
  <rect x="40" y="390" width="520" height="22" rx="4" fill="#0F1A26" stroke="#FFB300" stroke-width="1" opacity="0.6"/>
  <text x="300" y="405" text-anchor="middle" fill="#8A9BAE" font-family="sans-serif" font-size="9">Circuit breaker enables load shedding — Zone C drops first when power is insufficient</text>
</svg>