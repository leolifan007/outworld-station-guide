<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280">
  <rect width="600" height="280" fill="#1A2533" rx="8"/>
  <text x="300" y="30" fill="#00D4AA" font-family="Arial,sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Tech Point Efficiency Break-Even Analysis</text>
  <!-- Bars -->
  <g transform="translate(50, 60)">
    <!-- X axis label -->
    <text x="200" y="190" fill="#B0C4D8" font-family="Arial,sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Research Cost Before vs After Efficiency Upgrade</text>
    <!-- Level 0 (baseline) -->
    <rect x="20" y="100" width="30" height="60" fill="#8899AA" rx="2"/>
    <text x="35" y="96" fill="#8899AA" font-family="Arial,sans-serif" font-size="10" text-anchor="middle">Base</text>
    <text x="35" y="170" fill="#8899AA" font-family="Arial,sans-serif" font-size="10" text-anchor="middle">100%</text>
    <!-- Level 1 -->
    <rect x="90" y="88" width="30" height="72" fill="#00D4AA" rx="2"/>
    <text x="105" y="84" fill="#00D4AA" font-family="Arial,sans-serif" font-size="10" text-anchor="middle">Lv1</text>
    <text x="105" y="170" fill="#00D4AA" font-family="Arial,sans-serif" font-size="10" text-anchor="middle">110%</text>
    <text x="105" y="182" fill="#8899AA" font-family="Arial,sans-serif" font-size="9" text-anchor="middle">+20% gen</text>
    <!-- Level 2 -->
    <rect x="160" y="76" width="30" height="84" fill="#4ECDC4" rx="2"/>
    <text x="175" y="72" fill="#4ECDC4" font-family="Arial,sans-serif" font-size="10" text-anchor="middle">Lv2</text>
    <text x="175" y="170" fill="#4ECDC4" font-family="Arial,sans-serif" font-size="10" text-anchor="middle">120%</text>
    <text x="175" y="182" fill="#8899AA" font-family="Arial,sans-serif" font-size="9" text-anchor="middle">+40% gen</text>
    <!-- Level 3 -->
    <rect x="230" y="64" width="30" height="96" fill="#FFD93D" rx="2"/>
    <text x="245" y="60" fill="#FFD93D" font-family="Arial,sans-serif" font-size="10" text-anchor="middle">Lv3</text>
    <text x="245" y="170" fill="#FFD93D" font-family="Arial,sans-serif" font-size="10" text-anchor="middle">130%</text>
    <text x="245" y="182" fill="#8899AA" font-family="Arial,sans-serif" font-size="9" text-anchor="middle">+60% gen</text>
  </g>
  <!-- Verdict box -->
  <g transform="translate(340, 60)">
    <rect x="0" y="0" width="220" height="100" fill="#1E3045" rx="8" stroke="#00D4AA" stroke-width="1"/>
    <text x="110" y="22" fill="#00D4AA" font-family="Arial,sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Recommendation</text>
    <text x="110" y="44" fill="#B0C4D8" font-family="Arial,sans-serif" font-size="11" text-anchor="middle">Lv1: Always worth it</text>
    <text x="110" y="62" fill="#B0C4D8" font-family="Arial,sans-serif" font-size="11" text-anchor="middle">Lv2: Worth it for 4+ researches</text>
    <text x="110" y="80" fill="#B0C4D8" font-family="Arial,sans-serif" font-size="11" text-anchor="middle">Lv3+: Only for very long games</text>
  </g>
</svg>
