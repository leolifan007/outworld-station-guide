<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 580" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A2533"/>
      <stop offset="100%" stop-color="#0f1a24"/>
    </linearGradient>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00D4AA"/>
      <stop offset="100%" stop-color="#00b894"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3044"/>
      <stop offset="100%" stop-color="#162535"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a6a85"/>
    </marker>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="800" height="580" fill="url(#bg)" rx="8"/>
  <rect x="20" y="20" width="760" height="44" rx="4" fill="url(#hdr)"/>
  <text x="400" y="49" text-anchor="middle" fill="#0f1a24" font-weight="700" font-size="16">Item Exclusion Filters - Whitelist vs Exclusion (v1.1.1.0)</text>

  <!-- Whitelist -->
  <rect x="30" y="84" width="360" height="200" rx="8" fill="url(#box)" stroke="#FFB347" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="210" y="108" text-anchor="middle" fill="#FFB347" font-weight="700" font-size="14">Whitelist (old way)</text>
  <text x="210" y="130" text-anchor="middle" fill="#C8D6E8" font-size="11">List what MAY enter</text>
  <text x="210" y="150" text-anchor="middle" fill="#C8D6E8" font-size="11">Iron plates</text>
  <text x="210" y="168" text-anchor="middle" fill="#C8D6E8" font-size="11">+ Copper wire</text>
  <text x="210" y="186" text-anchor="middle" fill="#C8D6E8" font-size="11">+ Circuits ...</text>
  <text x="210" y="212" text-anchor="middle" fill="#6A8AAA" font-size="10">Forget to add a new product?</text>
  <text x="210" y="230" text-anchor="middle" fill="#6A8AAA" font-size="10">It never enters. Line starves.</text>
  <text x="210" y="258" text-anchor="middle" fill="#FFB347" font-size="11">Use for: critical one-item buffers</text>
  <text x="210" y="274" text-anchor="middle" fill="#FFB347" font-size="11">Ship loading (control what leaves)</text>

  <!-- Exclusion -->
  <rect x="410" y="84" width="360" height="200" rx="8" fill="url(#box)" stroke="#00D4AA" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="590" y="108" text-anchor="middle" fill="#00D4AA" font-weight="700" font-size="14">Exclusion (v1.1.1.0)</text>
  <text x="590" y="130" text-anchor="middle" fill="#C8D6E8" font-size="11">List what must STAY OUT</text>
  <text x="590" y="150" text-anchor="middle" fill="#C8D6E8" font-size="11">Scrap</text>
  <text x="590" y="168" text-anchor="middle" fill="#C8D6E8" font-size="11">+ Byproducts</text>
  <text x="590" y="186" text-anchor="middle" fill="#C8D6E8" font-size="11">+ Low-value junk</text>
  <text x="590" y="212" text-anchor="middle" fill="#6A8AAA" font-size="10">Everything else flows in freely</text>
  <text x="590" y="230" text-anchor="middle" fill="#6A8AAA" font-size="10">New products auto-accepted</text>
  <text x="590" y="258" text-anchor="middle" fill="#00D4AA" font-size="11">Use for: recycling feeds, buffers,</text>
  <text x="590" y="274" text-anchor="middle" fill="#00D4AA" font-size="11">destination storage, drone stations</text>

  <!-- Killer uses -->
  <rect x="200" y="304" width="400" height="100" rx="8" fill="url(#box)" stroke="#00D4AA" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="400" y="326" text-anchor="middle" fill="#00D4AA" font-weight="700" font-size="13">Three Killer Use Cases</text>
  <text x="400" y="348" text-anchor="middle" fill="#C8D6E8" font-size="11">1. Recycling feed - block 3-4 junk items, everything else in</text>
  <text x="400" y="368" text-anchor="middle" fill="#C8D6E8" font-size="11">2. Buffer storage - exclude byproducts, buffer stays clean</text>
  <text x="400" y="388" text-anchor="middle" fill="#C8D6E8" font-size="11">3. Cargo ships - block junk at loading, ships haul only cargo</text>

  <!-- Best practice -->
  <rect x="200" y="424" width="400" height="60" rx="8" fill="url(#box)" stroke="#4a90d9" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="400" y="446" text-anchor="middle" fill="#4a90d9" font-weight="700" font-size="12">Best Practice</text>
  <text x="400" y="466" text-anchor="middle" fill="#C8D6E8" font-size="11">Source = whitelist. Destination = exclusion.</text>
  <text x="400" y="482" text-anchor="middle" fill="#6A8AAA" font-size="10">One exclusion often replaces five whitelist entries</text>

  <!-- Warning -->
  <rect x="200" y="504" width="400" height="56" rx="8" fill="#3A2E1E" stroke="#FFB347" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="400" y="526" text-anchor="middle" fill="#FFB347" font-size="11" font-weight="600">Mistake: excluding 10+ items? Fix the source upstream</text>
  <text x="400" y="546" text-anchor="middle" fill="#6A8AAA" font-size="10">Clean production routing, then exclusion list shrinks to 2-3</text>
</svg>
