<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280">
  <rect width="600" height="280" fill="#1A2533" rx="8"/>
  <text x="300" y="35" fill="#00D4AA" font-family="Arial,sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Cargo Drone Delivery Cycle</text>
  <!-- Station -->
  <rect x="250" y="55" width="80" height="45" fill="#2A3F55" rx="6" stroke="#00D4AA" stroke-width="2"/>
  <text x="290" y="82" fill="#00D4AA" font-family="Arial,sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Drone Station</text>
  <!-- Supply building -->
  <rect x="70" y="150" width="80" height="45" fill="#2A3F55" rx="6" stroke="#4ECDC4" stroke-width="2"/>
  <text x="110" y="180" fill="#4ECDC4" font-family="Arial,sans-serif" font-size="10" text-anchor="middle">Supply Zone</text>
  <!-- Request building -->
  <rect x="430" y="150" width="80" height="45" fill="#2A3F55" rx="6" stroke="#FF6B35" stroke-width="2"/>
  <text x="470" y="180" fill="#FF6B35" font-family="Arial,sans-serif" font-size="10" text-anchor="middle">Request Zone</text>
  <!-- Step 1: Detect -->
  <line x1="290" y1="100" x2="110" y2="150" stroke="#8899AA" stroke-width="2" marker-end="url(#arrowGray)" stroke-dasharray="5,3"/>
  <text x="150" y="116" fill="#8899AA" font-family="Arial,sans-serif" font-size="10">1. Detect shortage</text>
  <!-- Step 2: Pickup -->
  <line x1="150" y1="150" x2="150" y2="120" stroke="#4ECDC4" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <!-- Step 3: Deliver -->
  <line x1="330" y1="78" x2="470" y2="150" stroke="#FF6B35" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="390" y="116" fill="#FF6B35" font-family="Arial,sans-serif" font-size="10">3. Deliver items</text>
  <!-- Step 4: Return -->
  <line x1="510" y1="170" x2="330" y2="80" stroke="#FFD93D" stroke-width="2" marker-end="url(#arrowYellow)" stroke-dasharray="5,3"/>
  <text x="450" y="220" fill="#FFD93D" font-family="Arial,sans-serif" font-size="10">4. Return + recharge</text>
  <defs>
    <marker id="arrowGray" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#8899AA"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#4ECDC4"/>
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#FF6B35"/>
    </marker>
    <marker id="arrowYellow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#FFD93D"/>
    </marker>
  </defs>
  <!-- Battery indicator -->
  <g transform="translate(180, 235)">
    <rect x="0" y="0" width="120" height="28" fill="#2A3F55" rx="6" stroke="#8899AA" stroke-width="1"/>
    <text x="60" y="18" fill="#B0C4D8" font-family="Arial,sans-serif" font-size="10" text-anchor="middle">Battery: 8-10 trips / charge</text>
  </g>
</svg>
