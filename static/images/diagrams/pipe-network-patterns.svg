<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="100%" height="100%">
  <rect width="600" height="420" fill="#1A2533"/>
  <defs>
    <linearGradient id="pipeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A9EFF"/>
      <stop offset="100%" stop-color="#2A7EDF"/>
    </linearGradient>
    <linearGradient id="tankGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6B7B8F"/>
      <stop offset="100%" stop-color="#4A5A6E"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="300" y="32" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="bold">Pipe Layout Patterns</text>
  <line x1="160" y1="40" x2="440" y2="40" stroke="#4A9EFF" stroke-width="1.5" opacity="0.5"/>

  <!-- ====== LAYOUT 1: Linear Feed ====== -->
  <g transform="translate(0,0)">
    <rect x="15" y="55" width="180" height="160" rx="8" fill="#0F1A26" stroke="#4A9EFF" stroke-width="1.5"/>

    <!-- Title -->
    <rect x="15" y="55" width="180" height="24" rx="8" fill="url(#pipeGrad)"/>
    <rect x="15" y="71" width="180" height="8" rx="0" fill="url(#pipeGrad)"/>
    <text x="105" y="71" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="11" font-weight="bold">Linear Feed</text>

    <!-- Source tank -->
    <rect x="50" y="90" width="110" height="20" rx="4" fill="url(#tankGrad)" stroke="#6B7B8F" stroke-width="1"/>
    <text x="105" y="104" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="8">Pump Station</text>

    <!-- Main line -->
    <line x1="105" y1="110" x2="105" y2="130" stroke="#4A9EFF" stroke-width="2"/>

    <!-- Pipe horizontal -->
    <line x1="40" y1="130" x2="170" y2="130" stroke="#4A9EFF" stroke-width="2.5"/>

    <!-- Valves connected to main line -->
    <rect x="55" y="122" width="12" height="16" rx="2" fill="#FF5252" opacity="0.7"/>
    <rect x="94" y="122" width="12" height="16" rx="2" fill="#00D4AA" opacity="0.7"/>
    <rect x="133" y="122" width="12" height="16" rx="2" fill="#00D4AA" opacity="0.7"/>

    <!-- Drop lines to consumers -->
    <line x1="61" y1="138" x2="61" y2="165" stroke="#4A9EFF" stroke-width="1.5" stroke-dasharray="3,2"/>
    <line x1="100" y1="138" x2="100" y2="165" stroke="#4A9EFF" stroke-width="1.5" stroke-dasharray="3,2"/>
    <line x1="139" y1="138" x2="139" y2="165" stroke="#4A9EFF" stroke-width="1.5" stroke-dasharray="3,2"/>

    <!-- Consumer nodes -->
    <rect x="49" y="165" width="24" height="16" rx="3" fill="#0F1A26" stroke="#4A9EFF" stroke-width="1"/>
    <text x="61" y="176" text-anchor="middle" fill="#4A9EFF" font-family="sans-serif" font-size="7">C1</text>
    <rect x="88" y="165" width="24" height="16" rx="3" fill="#0F1A26" stroke="#4A9EFF" stroke-width="1"/>
    <text x="100" y="176" text-anchor="middle" fill="#4A9EFF" font-family="sans-serif" font-size="7">C2</text>
    <rect x="127" y="165" width="24" height="16" rx="3" fill="#0F1A26" stroke="#4A9EFF" stroke-width="1"/>
    <text x="139" y="176" text-anchor="middle" fill="#4A9EFF" font-family="sans-serif" font-size="7">C3</text>

    <!-- Flow arrow on main line -->
    <polygon points="170,130 162,124 162,136" fill="#4A9EFF"/>
    <text x="85" y="145" fill="#4A9EFF" font-family="sans-serif" font-size="7">→</text>

    <!-- Pros/cons -->
    <text x="25" y="200" fill="#00D4AA" font-family="sans-serif" font-size="8">✓ Simple, low cost</text>
    <text x="25" y="212" fill="#FF5252" font-family="sans-serif" font-size="8">✗ End pressure drops</text>
  </g>

  <!-- ====== LAYOUT 2: Loop Feed ====== -->
  <g transform="translate(200,0)">
    <rect x="5" y="55" width="190" height="160" rx="8" fill="#0F1A26" stroke="#4A9EFF" stroke-width="1.5"/>

    <rect x="5" y="55" width="190" height="24" rx="8" fill="url(#pipeGrad)"/>
    <rect x="5" y="71" width="190" height="8" rx="0" fill="url(#pipeGrad)"/>
    <text x="100" y="71" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="11" font-weight="bold">Loop (Ring) Feed</text>

    <!-- Source -->
    <rect x="55" y="88" width="90" height="18" rx="4" fill="url(#tankGrad)" stroke="#6B7B8F" stroke-width="1"/>
    <text x="100" y="100" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="8">Pump Station</text>

    <line x1="100" y1="106" x2="100" y2="118" stroke="#4A9EFF" stroke-width="2"/>

    <!-- Loop ring -->
    <rect x="30" y="118" width="140" height="60" rx="4" fill="none" stroke="#4A9EFF" stroke-width="2"/>

    <!-- Inline valves/consumers on loop -->
    <rect x="45" y="132" width="14" height="16" rx="2" fill="#00D4AA" opacity="0.7"/>
    <rect x="80" y="132" width="14" height="16" rx="2" fill="#00D4AA" opacity="0.7"/>
    <rect x="115" y="132" width="14" height="16" rx="2" fill="#FF5252" opacity="0.7"/>
    <rect x="150" y="132" width="14" height="16" rx="2" fill="#00D4AA" opacity="0.7"/>

    <rect x="45" y="150" width="14" height="16" rx="2" fill="#00D4AA" opacity="0.7"/>
    <rect x="80" y="150" width="14" height="16" rx="2" fill="#00D4AA" opacity="0.7"/>
    <rect x="115" y="150" width="14" height="16" rx="2" fill="#00D4AA" opacity="0.7"/>
    <rect x="150" y="150" width="14" height="16" rx="2" fill="#FF5252" opacity="0.7"/>

    <!-- Flow arrows on loop -->
    <polygon points="30,130 36,126 36,134" fill="#4A9EFF" opacity="0.6"/>
    <polygon points="170,130 164,126 164,134" fill="#4A9EFF" opacity="0.6"/>
    <polygon points="30,182 36,178 36,186" fill="#4A9EFF" opacity="0.6"/>
    <polygon points="170,182 164,178 164,186" fill="#4A9EFF" opacity="0.6"/>

    <!-- Center label -->
    <text x="100" y="155" text-anchor="middle" fill="#4A9EFF" font-family="sans-serif" font-size="9" opacity="0.6">↻ dual flow</text>

    <!-- Pros/cons -->
    <text x="15" y="200" fill="#00D4AA" font-family="sans-serif" font-size="8">✓ Redundant paths</text>
    <text x="15" y="212" fill="#00D4AA" font-family="sans-serif" font-size="8">✓ Balanced pressure</text>
  </g>

  <!-- ====== LAYOUT 3: Tiered Pressure ====== -->
  <g transform="translate(410,0)">
    <rect x="-10" y="55" width="190" height="160" rx="8" fill="#0F1A26" stroke="#FFB300" stroke-width="1.5"/>

    <rect x="-10" y="55" width="190" height="24" rx="8" fill="#FFB300" stroke="#FFB300" stroke-width="1"/>
    <rect x="-10" y="71" width="190" height="8" rx="0" fill="#FFB300"/>
    <text x="85" y="71" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="11" font-weight="bold">Tiered Pressure</text>

    <!-- High pressure tier -->
    <rect x="5" y="90" width="165" height="20" rx="4" fill="#FF5252" opacity="0.15" stroke="#FF5252" stroke-width="1"/>
    <text x="15" y="104" fill="#FF5252" font-family="sans-serif" font-size="9" font-weight="bold">HIGH ▸ 150 psi</text>

    <!-- High pipe -->
    <line x1="15" y1="110" x2="160" y2="110" stroke="#FF5252" stroke-width="3"/>
    <rect x="35" y="106" width="10" height="8" rx="1" fill="#FF5252" opacity="0.5"/>
    <rect x="85" y="106" width="10" height="8" rx="1" fill="#FF5252" opacity="0.5"/>
    <rect x="135" y="106" width="10" height="8" rx="1" fill="#FF5252" opacity="0.5"/>

    <!-- Pressure reducer -->
    <polygon points="85,118 77,114 93,114" fill="#FFB300"/>
    <rect x="75" y="114" width="20" height="8" rx="2" fill="#FFB300"/>
    <text x="85" y="116" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="6" font-weight="bold">PRV</text>
    <line x1="85" y1="122" x2="85" y2="130" stroke="#FFB300" stroke-width="1.5"/>

    <!-- Medium pressure tier -->
    <rect x="5" y="130" width="165" height="20" rx="4" fill="#FFB300" opacity="0.15" stroke="#FFB300" stroke-width="1"/>
    <text x="15" y="144" fill="#FFB300" font-family="sans-serif" font-size="9" font-weight="bold">MED ▸ 80 psi</text>
    <line x1="15" y1="150" x2="160" y2="150" stroke="#FFB300" stroke-width="2.5"/>
    <rect x="35" y="146" width="10" height="8" rx="1" fill="#FFB300" opacity="0.5"/>
    <rect x="135" y="146" width="10" height="8" rx="1" fill="#FFB300" opacity="0.5"/>

    <!-- Pros/cons -->
    <text x="0" y="200" fill="#00D4AA" font-family="sans-serif" font-size="8">✓ Different pressure needs</text>
    <text x="0" y="212" fill="#FF5252" font-family="sans-serif" font-size="8">✗ More complex setup</text>
  </g>

  <!-- Bottom legend -->
  <rect x="40" y="230" width="520" height="40" rx="6" fill="#0F1A26" stroke="#4A9EFF" stroke-width="0.5"/>

  <!-- Legend items -->
  <rect x="55" y="240" width="116" height="20" rx="4" fill="none" stroke="#4A9EFF" stroke-width="1"/>
  <line x1="60" y1="250" x2="90" y2="250" stroke="#4A9EFF" stroke-width="2"/>
  <polygon points="90,250 86,246 86,254" fill="#4A9EFF"/>
  <text x="100" y="254" fill="#4A9EFF" font-family="sans-serif" font-size="9">Pipe</text>
  <rect x="78" y="244" width="10" height="12" rx="1" fill="#00D4AA" opacity="0.7"/>

  <rect x="185" y="240" width="8" height="8" rx="1" fill="#00D4AA"/>
  <text x="197" y="248" fill="#8A9BAE" font-family="sans-serif" font-size="9">Valve</text>
  <rect x="185" y="252" width="8" height="8" rx="1" fill="#FF5252"/>
  <text x="197" y="260" fill="#8A9BAE" font-family="sans-serif" font-size="9">Shutoff</text>

  <rect x="285" y="240" width="8" height="8" rx="2" fill="#FFB300"/>
  <text x="297" y="248" fill="#8A9BAE" font-family="sans-serif" font-size="9">PRV</text>
  <rect x="285" y="252" width="8" height="8" rx="2" fill="url(#tankGrad)"/>
  <text x="297" y="260" fill="#8A9BAE" font-family="sans-serif" font-size="9">Tank</text>

  <rect x="380" y="240" width="8" height="8" rx="2" fill="#0F1A26" stroke="#4A9EFF" stroke-width="1"/>
  <text x="392" y="248" fill="#8A9BAE" font-family="sans-serif" font-size="9">Consumer</text>

  <!-- Recommendation -->
  <text x="300" y="290" text-anchor="middle" fill="#FFB300" font-family="sans-serif" font-size="10" font-weight="bold">★ Recommended: Loop Feed + Tiered Pressure for mid-game stations</text>
</svg>