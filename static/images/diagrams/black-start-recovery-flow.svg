<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350">
  <rect width="600" height="350" fill="#1A2533" rx="8"/>
  <text x="300" y="30" fill="#00D4AA" font-family="Arial,sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Black Start Recovery Flow</text>
  <!-- Phase 1 -->
  <rect x="210" y="50" width="180" height="36" fill="#FF6B35" rx="6" opacity="0.9"/>
  <text x="300" y="73" fill="#fff" font-family="Arial,sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Phase 1: Isolate & Assess</text>
  <line x1="300" y1="86" x2="300" y2="110" stroke="#8899AA" stroke-width="2" marker-end="url(#arrowG)"/>
  <!-- Phase 2 -->
  <rect x="210" y="110" width="180" height="36" fill="#FFD93D" rx="6" opacity="0.9"/>
  <text x="300" y="133" fill="#1A2533" font-family="Arial,sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Phase 2: Bootstrap</text>
  <line x1="300" y1="146" x2="300" y2="170" stroke="#8899AA" stroke-width="2" marker-end="url(#arrowG)"/>
  <!-- Phase 3 -->
  <rect x="210" y="170" width="180" height="36" fill="#4ECDC4" rx="6" opacity="0.9"/>
  <text x="300" y="193" fill="#1A2533" font-family="Arial,sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Phase 3: First Reactor</text>
  <line x1="300" y1="206" x2="300" y2="230" stroke="#8899AA" stroke-width="2" marker-end="url(#arrowG)"/>
  <!-- Phase 4 -->
  <rect x="210" y="230" width="180" height="36" fill="#00D4AA" rx="6" opacity="0.9"/>
  <text x="300" y="253" fill="#1A2533" font-family="Arial,sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Phase 4: Load Addition</text>
  <line x1="300" y1="266" x2="300" y2="290" stroke="#8899AA" stroke-width="2" marker-end="url(#arrowG)"/>
  <!-- Phase 5 -->
  <rect x="210" y="290" width="180" height="36" fill="#00D4AA" rx="6" opacity="0.7"/>
  <text x="300" y="313" fill="#1A2533" font-family="Arial,sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Phase 5: Grid Rebalance</text>
  <!-- Key details in sidebar -->
  <g transform="translate(30, 60)">
    <rect x="0" y="0" width="170" height="100" fill="#1E3045" rx="6" stroke="#8899AA" stroke-width="1"/>
    <text x="85" y="18" fill="#B0C4D8" font-family="Arial,sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Phase 1 Details</text>
    <text x="8" y="36" fill="#8899AA" font-family="Arial,sans-serif" font-size="10">Disconnect all consumers</text>
    <text x="8" y="52" fill="#8899AA" font-family="Arial,sans-serif" font-size="10">Disconnect all reactors</text>
    <text x="8" y="68" fill="#8899AA" font-family="Arial,sans-serif" font-size="10">Check battery levels</text>
    <text x="8" y="84" fill="#8899AA" font-family="Arial,sans-serif" font-size="10">Check fuel remaining</text>
  </g>
  <g transform="translate(400, 60)">
    <rect x="0" y="0" width="170" height="100" fill="#1E3045" rx="6" stroke="#8899AA" stroke-width="1"/>
    <text x="85" y="18" fill="#B0C4D8" font-family="Arial,sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Phase 4 Priority</text>
    <text x="8" y="36" fill="#00D4AA" font-family="Arial,sans-serif" font-size="10">1. Fuel pumps</text>
    <text x="8" y="52" fill="#B0C4D8" font-family="Arial,sans-serif" font-size="10">2. Research Lab</text>
    <text x="8" y="68" fill="#B0C4D8" font-family="Arial,sans-serif" font-size="10">3. Drills + Smelters</text>
    <text x="8" y="84" fill="#B0C4D8" font-family="Arial,sans-serif" font-size="10">4. Assemblers</text>
  </g>
  <defs>
    <marker id="arrowG" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#8899AA"/>
    </marker>
  </defs>
</svg>
