<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>text { font-family: 'Segoe UI', Arial, sans-serif; }</style>
    <linearGradient id="bgv" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f1923"/>
      <stop offset="100%" stop-color="#1a2533"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bgv)" rx="12"/>

  <text x="400" y="32" text-anchor="middle" fill="#00D4AA" font-size="18" font-weight="700">Where to Place One-Way Valves</text>
  <text x="400" y="52" text-anchor="middle" fill="#90A4AE" font-size="12">Decision flowchart: every time you route a pipe, check these 3 conditions</text>

  <!-- Start node -->
  <ellipse cx="400" cy="90" rx="90" ry="28" fill="#1B5E20" stroke="#4CAF50" stroke-width="2"/>
  <text x="400" y="95" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="600">Pipe Junction?</text>

  <!-- Q1: After buffer tank? -->
  <line x1="400" y1="118" x2="400" y2="148" stroke="#4FC3F7" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <rect x="270" y="148" width="260" height="56" rx="10" fill="#1565C0" stroke="#4FC3F7" stroke-width="2"/>
  <text x="400" y="168" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700">Is this pipe AFTER a buffer tank?</text>
  <text x="400" y="186" text-anchor="middle" fill="#90CAF9" font-size="10">(gas can backflow into empty buffer)</text>

  <!-- YES Q1 -->
  <line x1="270" y1="176" x2="130" y2="176" stroke="#4CAF50" stroke-width="2.5"/>
  <polygon points="120,171 110,176 120,181" fill="#4CAF50"/>
  <rect x="20" y="150" width="110" height="52" rx="8" fill="#2E7D32" stroke="#4CAF50" stroke-width="2"/>
  <text x="75" y="170" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="600">YES</text>
  <text x="75" y="188" text-anchor="middle" fill="#A5D6A7" font-size="9">Place valve here</text>
  <!-- Icon for valve YES -->
  <line x1="60" y1="205" x2="90" y2="205" stroke="#4CAF50" stroke-width="2"/>

  <!-- NO Q1 -->
  <line x1="530" y1="176" x2="600" y2="176" stroke="#FF5252" stroke-width="2.5"/>
  <polygon points="610,171 620,176 610,181" fill="#FF5252"/>
  <rect x="530" y="148" width="120" height="56" rx="8" fill="#263238" stroke="#455A64" stroke-width="1.5"/>
  <text x="590" y="168" text-anchor="middle" fill="#B0BEC5" font-size="11" font-weight="600">NO</text>
  <text x="590" y="186" text-anchor="middle" fill="#78909C" font-size="9">Check next rule</text>

  <!-- Q2: Into a reactor/consumer? -->
  <line x1="400" y1="204" x2="400" y2="234" stroke="#4FC3F7" stroke-width="2.5"/>
  <rect x="270" y="234" width="260" height="56" rx="10" fill="#1565C0" stroke="#4FC3F7" stroke-width="2"/>
  <text x="400" y="254" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700">Is this pipe going INTO a reactor?</text>
  <text x="400" y="272" text-anchor="middle" fill="#90CAF9" font-size="10">(or any consumer building)</text>

  <!-- YES Q2 -->
  <line x1="270" y1="262" x2="130" y2="262" stroke="#4CAF50" stroke-width="2.5"/>
  <polygon points="120,257 110,262 120,267" fill="#4CAF50"/>
  <rect x="20" y="236" width="110" height="52" rx="8" fill="#2E7D32" stroke="#4CAF50" stroke-width="2"/>
  <text x="75" y="256" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="600">YES</text>
  <text x="75" y="274" text-anchor="middle" fill="#A5D6A7" font-size="9">Place valve here</text>

  <!-- NO Q2 -->
  <line x1="530" y1="262" x2="600" y2="262" stroke="#FF5252" stroke-width="2.5"/>
  <polygon points="610,257 620,262 610,267" fill="#FF5252"/>
  <rect x="530" y="234" width="120" height="56" rx="8" fill="#263238" stroke="#455A64" stroke-width="1.5"/>
  <text x="590" y="254" text-anchor="middle" fill="#B0BEC5" font-size="11" font-weight="600">NO</text>
  <text x="590" y="272" text-anchor="middle" fill="#78909C" font-size="9">Check next rule</text>

  <!-- Q3: Dead-end T-junction? -->
  <line x1="400" y1="290" x2="400" y2="320" stroke="#4FC3F7" stroke-width="2.5"/>
  <rect x="270" y="320" width="260" height="56" rx="10" fill="#1565C0" stroke="#4FC3F7" stroke-width="2"/>
  <text x="400" y="340" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700">Dead-end branch T-junction?</text>
  <text x="400" y="358" text-anchor="middle" fill="#90CAF9" font-size="10">(pipe tees off with no loop back)</text>

  <!-- YES Q3 -->
  <line x1="270" y1="348" x2="130" y2="348" stroke="#4CAF50" stroke-width="2.5"/>
  <polygon points="120,343 110,348 120,353" fill="#4CAF50"/>
  <rect x="20" y="322" width="110" height="52" rx="8" fill="#2E7D32" stroke="#4CAF50" stroke-width="2"/>
  <text x="75" y="342" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="600">YES</text>
  <text x="75" y="360" text-anchor="middle" fill="#A5D6A7" font-size="9">Place valve here</text>

  <!-- NO Q3 -->
  <line x1="530" y1="348" x2="600" y2="348" stroke="#FF5252" stroke-width="2.5"/>
  <polygon points="610,343 620,348 610,353" fill="#FF5252"/>
  <rect x="530" y="320" width="120" height="56" rx="8" fill="#263238" stroke="#455A64" stroke-width="1.5"/>
  <text x="590" y="340" text-anchor="middle" fill="#B0BEC5" font-size="11" font-weight="600">NO</text>
  <text x="590" y="358" text-anchor="middle" fill="#78909C" font-size="9">No valve needed</text>

  <!-- End / Cost info -->
  <line x1="400" y1="376" x2="400" y2="406" stroke="#90A4AE" stroke-width="2" stroke-dasharray="4,3"/>
  <rect x="290" y="406" width="220" height="60" rx="10" fill="#263238" stroke="#FF9800" stroke-width="2"/>
  <text x="400" y="428" text-anchor="middle" fill="#FF9800" font-size="13" font-weight="700">Valve Cost: 5 Iron Plates each</text>
  <text x="400" y="448" text-anchor="middle" fill="#FFB74D" font-size="10">Cheap insurance against backflow</text>

  <!-- Pipe diagram: after buffer -->
  <rect x="20" y="470" width="760" height="80" rx="8" fill="#1A2533" stroke="#2A3A4A" stroke-width="1"/>
  <text x="400" y="488" text-anchor="middle" fill="#00D4AA" font-size="11" font-weight="600">Quick Reference: Valve Position in Pipe Layout</text>

  <!-- After buffer -->
  <rect x="40" y="500" width="60" height="30" rx="4" fill="#455A64" stroke="#90A4AE" stroke-width="1"/>
  <text x="70" y="519" text-anchor="middle" fill="#E0E0E0" font-size="9">Buffer</text>
  <line x1="100" y1="515" x2="155" y2="515" stroke="#4FC3F7" stroke-width="3"/>
  <rect x="155" y="503" width="30" height="24" rx="4" fill="#2E7D32" stroke="#4CAF50" stroke-width="2"/>
  <text x="170" y="518" text-anchor="middle" fill="#FFFFFF" font-size="7">VALVE</text>
  <line x1="185" y1="515" x2="260" y2="515" stroke="#4FC3F7" stroke-width="3"/>
  <rect x="260" y="500" width="60" height="30" rx="4" fill="#455A64" stroke="#90A4AE" stroke-width="1"/>
  <text x="290" y="519" text-anchor="middle" fill="#E0E0E0" font-size="9">Reactor</text>
  <text x="150" y="496" text-anchor="middle" fill="#90CAF9" font-size="8">After buffer</text>

  <!-- Into reactor -->
  <line x1="340" y1="515" x2="400" y2="515" stroke="#4FC3F7" stroke-width="3"/>
  <rect x="400" y="503" width="30" height="24" rx="4" fill="#2E7D32" stroke="#4CAF50" stroke-width="2"/>
  <text x="415" y="518" text-anchor="middle" fill="#FFFFFF" font-size="7">VALVE</text>
  <line x1="430" y1="515" x2="500" y2="515" stroke="#4FC3F7" stroke-width="3"/>
  <rect x="500" y="500" width="60" height="30" rx="4" fill="#455A64" stroke="#90A4AE" stroke-width="1"/>
  <text x="530" y="519" text-anchor="middle" fill="#E0E0E0" font-size="9">Reactor</text>
  <text x="415" y="496" text-anchor="middle" fill="#90CAF9" font-size="8">Into reactor</text>

  <!-- Dead-end T -->
  <line x1="570" y1="490" x2="610" y2="515" stroke="#4FC3F7" stroke-width="3"/>
  <line x1="610" y1="515" x2="670" y2="515" stroke="#4FC3F7" stroke-width="3"/>
  <line x1="610" y1="515" x2="610" y2="545" stroke="#4FC3F7" stroke-width="3"/>
  <rect x="607" y="543" width="20" height="16" rx="3" fill="#2E7D32" stroke="#4CAF50" stroke-width="2"/>
  <text x="617" y="555" text-anchor="middle" fill="#FFFFFF" font-size="6">V</text>
  <text x="610" y="566" text-anchor="middle" fill="#E0E0E0" font-size="8">Dead</text>
  <text x="610" y="483" text-anchor="middle" fill="#90CAF9" font-size="8">Dead-end T</text>
</svg>
