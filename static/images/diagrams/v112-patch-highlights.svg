<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A2533"/>
      <stop offset="100%" stop-color="#0f1a24"/>
    </linearGradient>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00D4AA"/>
      <stop offset="100%" stop-color="#00b894"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3044"/>
      <stop offset="100%" stop-color="#162535"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a6a85"/>
    </marker>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="800" height="700" fill="url(#bg)" rx="8"/>
  <rect x="20" y="20" width="760" height="44" rx="4" fill="url(#hdr)"/>
  <text x="400" y="49" text-anchor="middle" fill="#0f1a24" font-weight="700" font-size="16">v1.1.2.0 Beta Highlights - September 23, 2026</text>

  <!-- Features column -->
  <rect x="30" y="84" width="360" height="330" rx="8" fill="url(#box)" stroke="#00D4AA" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="210" y="108" text-anchor="middle" fill="#00D4AA" font-weight="700" font-size="14">5 New Features</text>
  <text x="48" y="132" fill="#C8D6E8" font-size="11">&#8226; Arkship Terminal missions (endgame)</text>
  <text x="48" y="152" fill="#C8D6E8" font-size="11">&#8226; Station Prestige Points + Levels</text>
  <text x="48" y="172" fill="#C8D6E8" font-size="11">&#8226; Pipe gas/liquid switch, no venting</text>
  <text x="48" y="192" fill="#C8D6E8" font-size="11">&#8226; Factory output gating (no over-produce)</text>
  <text x="48" y="212" fill="#C8D6E8" font-size="11">&#8226; Bio-Extractor scales with Miner tech</text>
  <text x="48" y="244" fill="#6A8AAA" font-size="10" font-style="italic">Prestige rewards include:</text>
  <text x="48" y="264" fill="#C8D6E8" font-size="11">&#8226; New Decoration Elements</text>
  <text x="48" y="284" fill="#C8D6E8" font-size="11">&#8226; Tech Points</text>
  <text x="48" y="304" fill="#C8D6E8" font-size="11">&#8226; Further random rewards</text>
  <text x="48" y="336" fill="#6A8AAA" font-size="10" font-style="italic">Quality-of-life included:</text>
  <text x="48" y="356" fill="#C8D6E8" font-size="11">&#8226; Better drag-area multi-select</text>

  <!-- Fixes column -->
  <rect x="410" y="84" width="360" height="330" rx="8" fill="url(#box)" stroke="#4a90d9" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="590" y="108" text-anchor="middle" fill="#4a90d9" font-weight="700" font-size="14">10 Bug Fixes</text>
  <text x="428" y="132" fill="#C8D6E8" font-size="11">&#8226; Rotating dishes stop respawning</text>
  <text x="428" y="152" fill="#C8D6E8" font-size="11">&#8226; Tugs: Large Ship Component + filter</text>
  <text x="428" y="172" fill="#C8D6E8" font-size="11">&#8226; CTRL+V pastes module links</text>
  <text x="428" y="192" fill="#C8D6E8" font-size="11">&#8226; No over-produce on full Output</text>
  <text x="428" y="212" fill="#C8D6E8" font-size="11">&#8226; Un-highlight after Servitor repair</text>
  <text x="428" y="232" fill="#C8D6E8" font-size="11">&#8226; Upgraded smelter rate defaults</text>
  <text x="428" y="252" fill="#C8D6E8" font-size="11">&#8226; Freighter rename updates panel</text>
  <text x="428" y="272" fill="#C8D6E8" font-size="11">&#8226; Upgrades count Quantum Storage</text>
  <text x="428" y="292" fill="#C8D6E8" font-size="11">&#8226; Adv. freighter settings transfer</text>
  <text x="428" y="312" fill="#C8D6E8" font-size="11">&#8226; Filters &gt; Copy To All fixed</text>

  <!-- Status callout -->
  <rect x="30" y="434" width="740" height="80" rx="8" fill="#3A2E1E" stroke="#FFB347" stroke-width="1" filter="url(#shadow)"/>
  <text x="400" y="458" text-anchor="middle" fill="#FFB347" font-weight="700" font-size="13">BETA BRANCH NOW - STABLE EXPECTED EARLY OCTOBER</text>
  <text x="400" y="480" text-anchor="middle" fill="#C8D6E8" font-size="11">Previous cycle: 1.1.1.0 Beta July 8 -&gt; stable July 22 (about 2 weeks)</text>
  <text x="400" y="500" text-anchor="middle" fill="#6A8AAA" font-size="10">Tuning may change before stable - do not rebuild your factory around provisional numbers</text>

  <!-- Flow -->
  <rect x="140" y="544" width="230" height="46" rx="8" fill="url(#box)" stroke="#4a6a85" stroke-width="1" filter="url(#shadow)"/>
  <text x="255" y="565" text-anchor="middle" fill="#C8D6E8" font-size="12" font-weight="600">Still Present</text>
  <text x="255" y="581" text-anchor="middle" fill="#FF9B9B" font-size="10">540/min cap + smelter bug</text>

  <rect x="430" y="544" width="230" height="46" rx="8" fill="url(#box)" stroke="#4a6a85" stroke-width="1" filter="url(#shadow)"/>
  <text x="545" y="565" text-anchor="middle" fill="#C8D6E8" font-size="12" font-weight="600">Not Changed</text>
  <text x="545" y="581" text-anchor="middle" fill="#00D4AA" font-size="10">Recipe values / your ratios</text>

  <rect x="140" y="612" width="520" height="46" rx="8" fill="url(#box)" stroke="#00D4AA" stroke-width="1" filter="url(#shadow)"/>
  <text x="400" y="633" text-anchor="middle" fill="#C8D6E8" font-size="12" font-weight="600">Same-Patch Guides</text>
  <text x="400" y="649" text-anchor="middle" fill="#00D4AA" font-size="10">Arkship Missions | Prestige Levels | Pipe Gas Switching</text>

  <line x1="400" y1="594" x2="400" y2="610" stroke="#4a6a85" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
