<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A2533"/>
      <stop offset="100%" stop-color="#0f1a24"/>
    </linearGradient>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00D4AA"/>
      <stop offset="100%" stop-color="#00b894"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3044"/>
      <stop offset="100%" stop-color="#162535"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a6a85"/>
    </marker>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="800" height="900" fill="url(#bg)" rx="8"/>
  <rect x="20" y="20" width="760" height="44" rx="4" fill="url(#hdr)"/>
  <text x="400" y="49" text-anchor="middle" fill="#0f1a24" font-weight="700" font-size="16">Enhanced Containment System Flow</text>
  
  <!-- Step 1: Station Level -->
  <rect x="250" y="80" width="300" height="54" rx="6" fill="url(#box)" stroke="#00D4AA" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="400" y="105" text-anchor="middle" fill="#00D4AA" font-weight="700" font-size="13">Station Level 13</text>
  <text x="400" y="122" text-anchor="middle" fill="#8899aa" font-size="11">Command Tree - 3,500 Tech Points</text>
  <line x1="400" y1="134" x2="400" y2="155" stroke="#4a6a85" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <!-- Step 2: Containment Bay -->
  <rect x="225" y="155" width="350" height="54" rx="6" fill="url(#box)" stroke="#f0c040" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="400" y="180" text-anchor="middle" fill="#f0c040" font-weight="700" font-size="13">Build Containment Bay Module</text>
  <text x="400" y="197" text-anchor="middle" fill="#8899aa" font-size="11">100 Steel + 40 Electronics + 15 Superalloy</text>
  <line x1="400" y1="209" x2="400" y2="230" stroke="#4a6a85" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <!-- Step 3: Scan -->
  <rect x="225" y="230" width="350" height="54" rx="6" fill="url(#box)" stroke="#4a90d9" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="400" y="255" text-anchor="middle" fill="#4a90d9" font-weight="700" font-size="13">Scan for Capturable Asteroids</text>
  <text x="400" y="272" text-anchor="middle" fill="#8899aa" font-size="11">Station Scanner - Look for [Capturable] icon</text>
  <line x1="400" y1="284" x2="400" y2="305" stroke="#4a6a85" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <!-- Step 4: Capture -->
  <rect x="225" y="305" width="350" height="54" rx="6" fill="url(#box)" stroke="#e74c3c" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="400" y="330" text-anchor="middle" fill="#e74c3c" font-weight="700" font-size="13">Capture with Tractor Beam Ship</text>
  <text x="400" y="347" text-anchor="middle" fill="#8899aa" font-size="11">Freighter + Tractor Beam module - ~30s tow</text>
  <line x1="400" y1="359" x2="400" y2="380" stroke="#4a6a85" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <!-- Step 5: Dock -->
  <rect x="225" y="380" width="350" height="54" rx="6" fill="url(#box)" stroke="#9b59b6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="400" y="405" text-anchor="middle" fill="#9b59b6" font-weight="700" font-size="13">Dock Asteroid to Containment Bay</text>
  <text x="400" y="422" text-anchor="middle" fill="#8899aa" font-size="11">Auto-docks - New asteroid tab in Bay UI</text>
  <line x1="400" y1="434" x2="400" y2="455" stroke="#4a6a85" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <!-- Split to 3 asteroid types -->
  <rect x="400" y="455" width="12" height="20" rx="2" fill="#4a6a85"/>
  
  <!-- Gas -->
  <line x1="140" y1="475" x2="140" y2="495" stroke="#4a6a85" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="475" x2="140" y2="475" stroke="#4a6a85" stroke-width="1.5"/>
  <rect x="40" y="495" width="200" height="70" rx="6" fill="url(#box)" stroke="#00D4AA" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="140" y="518" text-anchor="middle" fill="#00D4AA" font-weight="700" font-size="13">Gas Asteroid</text>
  <text x="140" y="535" text-anchor="middle" fill="#aabbcc" font-size="11">Nitrox 12/min + H 8/min</text>
  <text x="140" y="552" text-anchor="middle" fill="#8899aa" font-size="10">Best for v1.1 recipe changes</text>
  
  <!-- Mineral -->
  <line x1="400" y1="475" x2="400" y2="495" stroke="#4a6a85" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="300" y="495" width="200" height="70" rx="6" fill="url(#box)" stroke="#f0c040" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="400" y="518" text-anchor="middle" fill="#f0c040" font-weight="700" font-size="13">Mineral Asteroid</text>
  <text x="400" y="535" text-anchor="middle" fill="#aabbcc" font-size="11">Titanium 8/min + Silicon 6/min</text>
  <text x="400" y="552" text-anchor="middle" fill="#8899aa" font-size="10">Supplement Superalloy production</text>
  
  <!-- Mixed -->
  <line x1="660" y1="475" x2="660" y2="495" stroke="#4a6a85" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="475" x2="660" y2="475" stroke="#4a6a85" stroke-width="1.5"/>
  <rect x="560" y="495" width="200" height="70" rx="6" fill="url(#box)" stroke="#4a90d9" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="660" y="518" text-anchor="middle" fill="#4a90d9" font-weight="700" font-size="13">Mixed Asteroid</text>
  <text x="660" y="535" text-anchor="middle" fill="#aabbcc" font-size="11">Gas 5/min + Minerals 4/min</text>
  <text x="660" y="552" text-anchor="middle" fill="#8899aa" font-size="10">Skip - rates too low</text>
  
  <!-- Merge back from all 3 -->
  <line x1="140" y1="565" x2="140" y2="595" stroke="#4a6a85" stroke-width="1.5"/>
  <line x1="400" y1="565" x2="400" y2="595" stroke="#4a6a85" stroke-width="1.5"/>
  <line x1="660" y1="565" x2="660" y2="595" stroke="#4a6a85" stroke-width="1.5"/>
  <line x1="140" y1="595" x2="660" y2="595" stroke="#4a6a85" stroke-width="1.5"/>
  <line x1="400" y1="595" x2="400" y2="615" stroke="#4a6a85" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <!-- Step 6: Configure -->
  <rect x="225" y="615" width="350" height="54" rx="6" fill="url(#box)" stroke="#e67e22" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="400" y="640" text-anchor="middle" fill="#e67e22" font-weight="700" font-size="13">Configure Extraction & Routing</text>
  <text x="400" y="657" text-anchor="middle" fill="#8899aa" font-size="11">Set extraction ratios + Pair outputs</text>
  <line x1="400" y1="669" x2="400" y2="690" stroke="#4a6a85" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <!-- Step 7: Production output -->
  <rect x="225" y="690" width="350" height="54" rx="6" fill="url(#box)" stroke="#00D4AA" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="400" y="715" text-anchor="middle" fill="#00D4AA" font-weight="700" font-size="13">Passive Resource Generation</text>
  <text x="400" y="732" text-anchor="middle" fill="#8899aa" font-size="11">Continuous output - 4 paired slots per bay</text>
  <line x1="400" y1="744" x2="400" y2="765" stroke="#4a6a85" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <!-- Result -->
  <rect x="200" y="765" width="400" height="50" rx="8" fill="#0d5a4a" stroke="#00D4AA" stroke-width="1.5"/>
  <text x="400" y="789" text-anchor="middle" fill="#00D4AA" font-weight="700" font-size="14">Break Through Mid-Game Resource Wall</text>
  <text x="400" y="804" text-anchor="middle" fill="#8899aa" font-size="10">Route output to Diamond, Nitronic Acid, or Superalloy lines</text>
  
  <!-- Capacity note -->
  <rect x="225" y="830" width="350" height="28" rx="4" fill="#162535" stroke="#4a6a85" stroke-width="1"/>
  <text x="400" y="849" text-anchor="middle" fill="#4a6a85" font-size="10">Capacity: 2 asteroids per Bay | Max 2 Bays | Advanced Containment at Lv15 (+30%)</text>
</svg>
