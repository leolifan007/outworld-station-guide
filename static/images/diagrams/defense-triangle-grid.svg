<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="100%" height="100%">
  <rect width="600" height="420" fill="#1A2533"/>
  <defs>
    <radialGradient id="missileZone" cx="50%" cy="50%" r="50%">
      <stop offset="30%" stop-color="#FF5252" stop-opacity="0.18"/>
      <stop offset="70%" stop-color="#FF5252" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FF5252" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="laserZone" cx="50%" cy="50%" r="50%">
      <stop offset="30%" stop-color="#00D4AA" stop-opacity="0.18"/>
      <stop offset="70%" stop-color="#00D4AA" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#00D4AA" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="missileGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF5252"/>
      <stop offset="100%" stop-color="#D03030"/>
    </linearGradient>
    <linearGradient id="laserGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00D4AA"/>
      <stop offset="100%" stop-color="#009977"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="300" y="32" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="bold">Triangle Defense Grid</text>
  <line x1="160" y1="40" x2="440" y2="40" stroke="#FF5252" stroke-width="1.5" opacity="0.5"/>

  <!-- Grid pattern hex background -->
  <g opacity="0.06" stroke="#fff" stroke-width="1">
    <line x1="80" y1="80" x2="520" y2="80"/><line x1="80" y1="120" x2="520" y2="120"/>
    <line x1="80" y1="160" x2="520" y2="160"/>
    <line x1="80" y1="200" x2="520" y2="200"/>
    <line x1="80" y1="240" x2="520" y2="240"/>
    <line x1="80" y1="280" x2="520" y2="280"/>
    <line x1="80" y1="320" x2="520" y2="320"/>
    <line x1="160" y1="80" x2="160" y2="360"/>
    <line x1="230" y1="80" x2="230" y2="360"/>
    <line x1="300" y1="80" x2="300" y2="360"/>
    <line x1="370" y1="80" x2="370" y2="360"/>
    <line x1="440" y1="80" x2="440" y2="360"/>
  </g>

  <!-- Triangle connection lines between all 4 turrets -->
  <!-- Outer triangle: 2 missile turrets + top -->
  <line x1="190" y1="340" x2="410" y2="340" stroke="#FF5252" stroke-width="2" stroke-dasharray="8,4" opacity="0.5"/>
  <line x1="190" y1="340" x2="300" y2="140" stroke="#FF5252" stroke-width="2" stroke-dasharray="8,4" opacity="0.5"/>
  <line x1="410" y1="340" x2="300" y2="140" stroke="#FF5252" stroke-width="2" stroke-dasharray="8,4" opacity="0.5"/>

  <!-- Inner triangle: 2 laser turrets -->
  <line x1="240" y1="290" x2="360" y2="290" stroke="#00D4AA" stroke-width="2" stroke-dasharray="6,3" opacity="0.5"/>
  <line x1="240" y1="290" x2="300" y2="210" stroke="#00D4AA" stroke-width="2" stroke-dasharray="6,3" opacity="0.5"/>
  <line x1="360" y1="290" x2="300" y2="210" stroke="#00D4AA" stroke-width="2" stroke-dasharray="6,3" opacity="0.5"/>

  <!-- Cross-links between layers -->
  <line x1="190" y1="340" x2="240" y2="290" stroke="#8A9BAE" stroke-width="1" stroke-dasharray="3,3" opacity="0.3"/>
  <line x1="410" y1="340" x2="360" y2="290" stroke="#8A9BAE" stroke-width="1" stroke-dasharray="3,3" opacity="0.3"/>
  <line x1="300" y1="140" x2="300" y2="210" stroke="#8A9BAE" stroke-width="1" stroke-dasharray="3,3" opacity="0.3"/>

  <!-- Fire zones (circles) - Missile Turret Left -->
  <circle cx="190" cy="340" r="95" fill="url(#missileZone)" stroke="#FF5252" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.5"/>

  <!-- Fire zones - Missile Turret Right -->
  <circle cx="410" cy="340" r="95" fill="url(#missileZone)" stroke="#FF5252" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.5"/>

  <!-- Fire zones - Laser Turret Inner Left -->
  <circle cx="240" cy="290" r="65" fill="url(#laserZone)" stroke="#00D4AA" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.5"/>

  <!-- Fire zones - Laser Turret Inner Right -->
  <circle cx="360" cy="290" r="65" fill="url(#laserZone)" stroke="#00D4AA" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.5"/>

  <!-- Overlap highlighting - inner kill zone -->
  <ellipse cx="300" cy="290" rx="35" ry="25" fill="#FF5252" opacity="0.08"/>

  <!-- Turret icons -->

  <!-- Missile Turret Left -->
  <g transform="translate(190,340)">
    <rect x="-14" y="-14" width="28" height="28" rx="6" fill="url(#missileGrad)" stroke="#FF5252" stroke-width="2"/>
    <line x1="-6" y1="0" x2="6" y2="0" stroke="#fff" stroke-width="2"/>
    <line x1="0" y1="-6" x2="0" y2="6" stroke="#fff" stroke-width="2"/>
    <polygon points="0,-9 -4,-4 4,-4" fill="#fff"/>
    <text x="-20" y="24" fill="#FF5252" font-family="sans-serif" font-size="9" font-weight="bold">Missile</text>
    <circle cx="0" cy="0" r="20" fill="none" stroke="#FF5252" stroke-width="1" stroke-dasharray="3,3" opacity="0.3"/>
  </g>

  <!-- Missile Turret Right -->
  <g transform="translate(410,340)">
    <rect x="-14" y="-14" width="28" height="28" rx="6" fill="url(#missileGrad)" stroke="#FF5252" stroke-width="2"/>
    <line x1="-6" y1="0" x2="6" y2="0" stroke="#fff" stroke-width="2"/>
    <line x1="0" y1="-6" x2="0" y2="6" stroke="#fff" stroke-width="2"/>
    <polygon points="0,-9 -4,-4 4,-4" fill="#fff"/>
    <text x="-18" y="24" fill="#FF5252" font-family="sans-serif" font-size="9" font-weight="bold">Missile</text>
    <circle cx="0" cy="0" r="20" fill="none" stroke="#FF5252" stroke-width="1" stroke-dasharray="3,3" opacity="0.3"/>
  </g>

  <!-- Laser Turret Inner Left -->
  <g transform="translate(240,290)">
    <rect x="-11" y="-11" width="22" height="22" rx="5" fill="url(#laserGrad)" stroke="#00D4AA" stroke-width="2"/>
    <line x1="0" y1="-6" x2="0" y2="6" stroke="#fff" stroke-width="2"/>
    <circle cx="0" cy="0" r="3" fill="#fff"/>
    <text x="-15" y="20" fill="#00D4AA" font-family="sans-serif" font-size="9" font-weight="bold">Laser</text>
  </g>

  <!-- Laser Turret Inner Right -->
  <g transform="translate(360,290)">
    <rect x="-11" y="-11" width="22" height="22" rx="5" fill="url(#laserGrad)" stroke="#00D4AA" stroke-width="2"/>
    <line x1="0" y1="-6" x2="0" y2="6" stroke="#fff" stroke-width="2"/>
    <circle cx="0" cy="0" r="3" fill="#fff"/>
    <text x="-15" y="20" fill="#00D4AA" font-family="sans-serif" font-size="9" font-weight="bold">Laser</text>
  </g>

  <!-- Kill zone label -->
  <g transform="translate(300,252)">
    <rect x="-52" y="-10" width="104" height="18" rx="4" fill="#1A2533" stroke="#FF5252" stroke-width="1" opacity="0.9"/>
    <text x="0" y="4" text-anchor="middle" fill="#FF5252" font-family="sans-serif" font-size="10" font-weight="bold">☠ KILL ZONE</text>
  </g>

  <!-- Annotations -->
  <line x1="300" y1="140" x2="300" y2="100" stroke="#8A9BAE" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="300" y="95" text-anchor="middle" fill="#8A9BAE" font-family="sans-serif" font-size="10">Defense HQ (triangle vertex)</text>

  <!-- Bottom legend -->
  <rect x="40" y="380" width="520" height="30" rx="4" fill="#0F1A26"/>
  <circle cx="70" cy="395" r="6" fill="#FF5252" opacity="0.4"/>
  <circle cx="70" cy="395" r="6" fill="none" stroke="#FF5252" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="82" y="399" fill="#8A9BAE" font-family="sans-serif" font-size="9">Missile zone (long range)</text>
  <circle cx="210" cy="395" r="6" fill="#00D4AA" opacity="0.4"/>
  <circle cx="210" cy="395" r="6" fill="none" stroke="#00D4AA" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="222" y="399" fill="#8A9BAE" font-family="sans-serif" font-size="9">Laser zone (close defense)</text>
  <rect x="370" y="390" width="10" height="10" rx="2" fill="#FF5252"/>
  <text x="384" y="399" fill="#8A9BAE" font-family="sans-serif" font-size="9">Turret</text>
</svg>