<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="100%" height="100%">
  <rect width="600" height="420" fill="#1A2533"/>
  <defs>
    <linearGradient id="phase1Grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4A9EFF"/>
      <stop offset="100%" stop-color="#2A7EDF"/>
    </linearGradient>
    <linearGradient id="phase2Grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#E09000"/>
    </linearGradient>
    <linearGradient id="phase3Grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF5252"/>
      <stop offset="100%" stop-color="#D03030"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00D4AA"/>
      <stop offset="100%" stop-color="#009977"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="300" y="32" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="bold">Speedrun Route — Station Level 5 in 2 Hours</text>
  <line x1="100" y1="40" x2="500" y2="40" stroke="#FFB300" stroke-width="1.5" opacity="0.5"/>
  <text x="300" y="56" text-anchor="middle" fill="#8A9BAE" font-family="sans-serif" font-size="10">Optimal path assuming 1.5x game speed, no major setbacks</text>

  <!-- Outer timeline box -->
  <rect x="30" y="70" width="540" height="310" rx="10" fill="#0F1A26" stroke="#4A9EFF" stroke-width="1" opacity="0.5"/>

  <!-- Horizontal timeline -->
  <line x1="60" y1="180" x2="540" y2="180" stroke="#ffffff" stroke-width="3" opacity="0.3"/>
  <line x1="60" y1="180" x2="540" y2="180" stroke="#4A9EFF" stroke-width="3" stroke-dasharray="106,0" opacity="1"/>

  <!-- Time markers -->
  <text x="60" y="175" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold">0</text>
  <text x="180" y="175" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="10">15</text>
  <text x="300" y="175" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="10">30</text>
  <text x="420" y="175" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="10">60</text>
  <text x="540" y="175" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="10">120 min</text>

  <!-- Tick marks -->
  <line x1="60" y1="185" x2="60" y2="195" stroke="#ffffff" stroke-width="1" opacity="0.4"/>
  <line x1="180" y1="185" x2="180" y2="195" stroke="#ffffff" stroke-width="1" opacity="0.4"/>
  <line x1="300" y1="185" x2="300" y2="195" stroke="#ffffff" stroke-width="1" opacity="0.4"/>
  <line x1="420" y1="185" x2="420" y2="195" stroke="#ffffff" stroke-width="1" opacity="0.4"/>
  <line x1="540" y1="185" x2="540" y2="195" stroke="#ffffff" stroke-width="1" opacity="0.4"/>

  <!-- Intermediate ticks -->
  <line x1="120" y1="185" x2="120" y2="192" stroke="#ffffff" stroke-width="0.5" opacity="0.2"/>
  <line x1="240" y1="185" x2="240" y2="192" stroke="#ffffff" stroke-width="0.5" opacity="0.2"/>
  <line x1="360" y1="185" x2="360" y2="192" stroke="#ffffff" stroke-width="0.5" opacity="0.2"/>
  <line x1="480" y1="185" x2="480" y2="192" stroke="#ffffff" stroke-width="0.5" opacity="0.2"/>

  <!-- ===== PHASE 1: 0-15min ===== -->
  <rect x="60" y="135" width="120" height="30" rx="6" fill="url(#phase1Grad)" opacity="0.8"/>
  <text x="120" y="154" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="10" font-weight="bold">Phase 1: Setup</text>

  <!-- Phase 1 details -->
  <rect x="60" y="100" width="120" height="30" rx="4" fill="#1A2A3D" stroke="#4A9EFF" stroke-width="0.5"/>
  <text x="120" y="112" text-anchor="middle" fill="#B0C4DE" font-family="sans-serif" font-size="8">Build basic mining</text>
  <text x="120" y="124" text-anchor="middle" fill="#B0C4DE" font-family="sans-serif" font-size="8">Deploy first drills</text>

  <!-- ===== PHASE 2: 15-45min ===== -->
  <rect x="180" y="135" width="120" height="30" rx="6" fill="url(#phase2Grad)" opacity="0.8"/>
  <text x="240" y="154" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="10" font-weight="bold">Phase 2: Growth</text>

  <!-- Phase 2 details -->
  <rect x="180" y="100" width="120" height="30" rx="4" fill="#3D301A" stroke="#FFB300" stroke-width="0.5"/>
  <text x="240" y="112" text-anchor="middle" fill="#B0C4DE" font-family="sans-serif" font-size="8">Expand production</text>
  <text x="240" y="124" text-anchor="middle" fill="#B0C4DE" font-family="sans-serif" font-size="8">Start research</text>

  <!-- ===== PHASE 3: 45-120min ===== -->
  <rect x="300" y="135" width="240" height="30" rx="6" fill="url(#phase3Grad)" opacity="0.8"/>
  <text x="420" y="154" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="10" font-weight="bold">Phase 3: Rush to Level 5</text>

  <!-- Phase 3 details -->
  <rect x="300" y="100" width="240" height="30" rx="4" fill="#2A1A1A" stroke="#FF5252" stroke-width="0.5"/>
  <text x="420" y="112" text-anchor="middle" fill="#B0C4DE" font-family="sans-serif" font-size="8">High-yield mining, salvage ops, complex assembly</text>
  <text x="420" y="124" text-anchor="middle" fill="#B0C4DE" font-family="sans-serif" font-size="8">Multi-tasking between power, resources, upgrades</text>

  <!-- ===== MILESTONE BADGES ===== -->

  <!-- Level 2 @ ~10 min -->
  <g transform="translate(100, 205)">
    <circle cx="0" cy="0" r="18" fill="#0F1A26" stroke="#00D4AA" stroke-width="2"/>
    <text x="0" y="4" text-anchor="middle" fill="#00D4AA" font-family="sans-serif" font-size="10" font-weight="bold">L2</text>
    <text x="0" y="28" text-anchor="middle" fill="#8A9BAE" font-family="sans-serif" font-size="8">~10 min</text>
    <line x1="-12" y1="0" x2="12" y2="0" stroke="#00D4AA" stroke-width="0.5" opacity="0.5"/>
  </g>

  <!-- Arrow to L2 -->
  <line x1="100" y1="195" x2="100" y2="205" stroke="#00D4AA" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Level 3 @ ~30 min -->
  <g transform="translate(220, 205)">
    <circle cx="0" cy="0" r="18" fill="#0F1A26" stroke="#FFB300" stroke-width="2"/>
    <text x="0" y="4" text-anchor="middle" fill="#FFB300" font-family="sans-serif" font-size="10" font-weight="bold">L3</text>
    <text x="0" y="28" text-anchor="middle" fill="#8A9BAE" font-family="sans-serif" font-size="8">~30 min</text>
  </g>

  <line x1="220" y1="195" x2="220" y2="205" stroke="#FFB300" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Level 4 @ ~60 min -->
  <g transform="translate(380, 205)">
    <circle cx="0" cy="0" r="18" fill="#0F1A26" stroke="#FF5252" stroke-width="2"/>
    <text x="0" y="4" text-anchor="middle" fill="#FF5252" font-family="sans-serif" font-size="10" font-weight="bold">L4</text>
    <text x="0" y="28" text-anchor="middle" fill="#8A9BAE" font-family="sans-serif" font-size="8">~60 min</text>
  </g>

  <line x1="380" y1="195" x2="380" y2="205" stroke="#FF5252" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Level 5 @ ~120 min -->
  <g transform="translate(520, 205)">
    <circle cx="0" cy="0" r="20" fill="#0F1A26" stroke="#FFB300" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="24" fill="none" stroke="#FFB300" stroke-width="1" stroke-dasharray="3,3" opacity="0.4"/>
    <text x="0" y="5" text-anchor="middle" fill="#FFB300" font-family="sans-serif" font-size="12" font-weight="bold">L5</text>
    <text x="0" y="32" text-anchor="middle" fill="#FFB300" font-family="sans-serif" font-size="9" font-weight="bold">🎯 ~120 min</text>
  </g>

  <line x1="520" y1="195" x2="520" y2="205" stroke="#FFB300" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- ===== LOWER SECTION: Step-by-step ===== -->

  <rect x="50" y="250" width="500" height="115" rx="6" fill="#0F1A26" stroke="#4A9EFF" stroke-width="0.5" opacity="0.8"/>

  <text x="65" y="270" fill="#4A9EFF" font-family="sans-serif" font-size="10" font-weight="bold">Route Milestones</text>

  <!-- Step boxes -->
  <g transform="translate(60, 280)">
    <rect x="0" y="0" width="140" height="36" rx="4" fill="#1A2A3D" stroke="#4A9EFF" stroke-width="1"/>
    <text x="70" y="16" text-anchor="middle" fill="#B0C4DE" font-family="sans-serif" font-size="8">① Build 4 drills</text>
    <text x="70" y="30" text-anchor="middle" fill="#8A9BAE" font-family="sans-serif" font-size="7">Basic power</text>
  </g>

  <path d="M 200,298 L 215,298" stroke="#FFB300" stroke-width="1.5"/>
  <polygon points="215,298 209,295 209,301" fill="#FFB300"/>

  <g transform="translate(220, 280)">
    <rect x="0" y="0" width="140" height="36" rx="4" fill="#3D301A" stroke="#FFB300" stroke-width="1"/>
    <text x="70" y="16" text-anchor="middle" fill="#B0C4DE" font-family="sans-serif" font-size="8">② Setup refining</text>
    <text x="70" y="30" text-anchor="middle" fill="#8A9BAE" font-family="sans-serif" font-size="7">Auto-mining, haulers</text>
  </g>

  <path d="M 360,298 L 375,298" stroke="#FF5252" stroke-width="1.5"/>
  <polygon points="375,298 369,295 369,301" fill="#FF5252"/>

  <g transform="translate(380, 280)">
    <rect x="0" y="0" width="140" height="36" rx="4" fill="#2A1A1A" stroke="#FF5252" stroke-width="1"/>
    <text x="70" y="16" text-anchor="middle" fill="#B0C4DE" font-family="sans-serif" font-size="8">③ Rush L5 reqs</text>
    <text x="70" y="30" text-anchor="middle" fill="#8A9BAE" font-family="sans-serif" font-size="7">Research, complex parts</text>
  </g>

  <!-- Warning -->
  <rect x="60" y="330" width="480" height="22" rx="4" fill="#1A1A1A" stroke="#FF5252" stroke-width="0.5" opacity="0.7"/>
  <text x="75" y="344" fill="#FF5252" font-family="sans-serif" font-size="8" font-weight="bold">⚠</text>
  <text x="90" y="344" fill="#FF5252" font-family="sans-serif" font-size="8">Don't over-expand. Focus on upgrading existing infrastructure before building new.</text>
</svg>