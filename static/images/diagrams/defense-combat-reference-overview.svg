<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A2533"/>
      <stop offset="100%" stop-color="#0f1a24"/>
    </linearGradient>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00D4AA"/>
      <stop offset="100%" stop-color="#00b894"/>
    </linearGradient>
  </defs>
  <rect width="800" height="470" fill="url(#bg)" rx="8"/>
  <rect x="20" y="20" width="760" height="40" rx="4" fill="url(#hdr)"/>
  <text x="400" y="47" text-anchor="middle" fill="#0f1a24" font-weight="700" font-size="15">Defense and Combat Reference — Three Defense Layers</text>
  
  <!-- Layer 1 -->
  <rect x="30" y="80" width="240" height="200" rx="6" fill="#1e3044" stroke="#00D4AA" stroke-width="1.5"/>
  <text x="150" y="105" text-anchor="middle" fill="#00D4AA" font-weight="700" font-size="15">Layer 1: Turrets</text>
  <text x="150" y="122" text-anchor="middle" fill="#aabbcc" font-size="11">Close range, automated</text>
  
  <rect x="45" y="138" width="210" height="30" rx="3" fill="#162535" stroke="#4a6a85" stroke-width="0.5"/>
  <text x="150" y="152" text-anchor="middle" fill="#00D4AA" font-size="10">Basic: 8 DPS, 100m, Lv3+</text>
  <rect x="45" y="173" width="210" height="30" rx="3" fill="#162535" stroke="#4a6a85" stroke-width="0.5"/>
  <text x="150" y="187" text-anchor="middle" fill="#4a90d9" font-size="10">Advanced: 18 DPS, 150m, Lv7+</text>
  <rect x="45" y="208" width="210" height="30" rx="3" fill="#162535" stroke="#4a6a85" stroke-width="0.5"/>
  <text x="150" y="222" text-anchor="middle" fill="#f0c040" font-size="10">Pulse: 35 DPS, 200m, Lv10+</text>
  <rect x="45" y="243" width="210" height="30" rx="3" fill="#162535" stroke="#4a6a85" stroke-width="0.5"/>
  <text x="150" y="257" text-anchor="middle" fill="#e74c3c" font-size="10">Flak: 12 AOE, swarms</text>
  
  <!-- Layer 2 -->
  <rect x="280" y="80" width="240" height="200" rx="6" fill="#1e3044" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="400" y="105" text-anchor="middle" fill="#4a90d9" font-weight="700" font-size="15">Layer 2: Ship Patrols</text>
  <text x="400" y="122" text-anchor="middle" fill="#aabbcc" font-size="11">Mid range, CPU-controlled</text>
  
  <rect x="295" y="138" width="210" height="30" rx="3" fill="#162535" stroke="#4a6a85" stroke-width="0.5"/>
  <text x="400" y="152" text-anchor="middle" fill="#aabbcc" font-size="10">Corvette: Light patrol, Lv6+</text>
  <rect x="295" y="173" width="210" height="30" rx="3" fill="#162535" stroke="#4a6a85" stroke-width="0.5"/>
  <text x="400" y="187" text-anchor="middle" fill="#aabbcc" font-size="10">Frigate: Main defense, Lv8+</text>
  <rect x="295" y="208" width="210" height="30" rx="3" fill="#162535" stroke="#4a6a85" stroke-width="0.5"/>
  <text x="400" y="222" text-anchor="middle" fill="#aabbcc" font-size="10">Destroyer: Heavy, Lv12+</text>
  <rect x="295" y="243" width="210" height="30" rx="3" fill="#162535" stroke="#4a6a85" stroke-width="0.5"/>
  <text x="400" y="257" text-anchor="middle" fill="#aabbcc" font-size="10">Servitor: Field repair</text>
  
  <!-- Layer 3 -->
  <rect x="530" y="80" width="240" height="200" rx="6" fill="#1e3044" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="650" y="105" text-anchor="middle" fill="#e74c3c" font-weight="700" font-size="15">Layer 3: Station Hull</text>
  <text x="650" y="122" text-anchor="middle" fill="#aabbcc" font-size="11">Last resort, structural</text>
  
  <rect x="545" y="138" width="210" height="30" rx="3" fill="#162535" stroke="#4a6a85" stroke-width="0.5"/>
  <text x="650" y="152" text-anchor="middle" fill="#aabbcc" font-size="10">Auto-Repair Module: Lv10+</text>
  <rect x="545" y="173" width="210" height="30" rx="3" fill="#162535" stroke="#4a6a85" stroke-width="0.5"/>
  <text x="650" y="187" text-anchor="middle" fill="#aabbcc" font-size="10">Servitor Station: Lv8+</text>
  <rect x="545" y="208" width="210" height="30" rx="3" fill="#162535" stroke="#4a6a85" stroke-width="0.5"/>
  <text x="650" y="222" text-anchor="middle" fill="#aabbcc" font-size="10">Manual Repair: 10 Steel/10%</text>
  <rect x="545" y="243" width="210" height="30" rx="3" fill="#162535" stroke="#4a6a85" stroke-width="0.5"/>
  <text x="650" y="257" text-anchor="middle" fill="#aabbcc" font-size="10">Hull upgrades: Lv15+</text>
  
  <!-- Threat level by level -->
  <rect x="30" y="300" width="740" height="65" rx="6" fill="#0d5a4a" stroke="#00D4AA" stroke-width="1"/>
  <text x="400" y="322" text-anchor="middle" fill="#00D4AA" font-size="13">Enemy Threat by Station Level</text>
  
  <rect x="45" y="336" width="80" height="22" rx="3" fill="#00D4AA" opacity="0.3"/>
  <text x="85" y="351" text-anchor="middle" fill="#00D4AA" font-size="9">Lv1-3: Drones</text>
  <rect x="130" y="336" width="80" height="22" rx="3" fill="#00D4AA" opacity="0.3"/>
  <text x="170" y="351" text-anchor="middle" fill="#00D4AA" font-size="9">Lv4-6: Anomalies</text>
  <rect x="215" y="336" width="80" height="22" rx="3" fill="#4a90d9" opacity="0.3"/>
  <text x="255" y="351" text-anchor="middle" fill="#4a90d9" font-size="9">Lv7-9: Attack Drone</text>
  <rect x="300" y="336" width="90" height="22" rx="3" fill="#4a90d9" opacity="0.3"/>
  <text x="345" y="351" text-anchor="middle" fill="#4a90d9" font-size="9">Lv10-12: Void Anomaly</text>
  <rect x="395" y="336" width="100" height="22" rx="3" fill="#e74c3c" opacity="0.3"/>
  <text x="445" y="351" text-anchor="middle" fill="#e74c3c" font-size="9">Lv13-15: Corrupted Ship</text>
  <rect x="500" y="336" width="105" height="22" rx="3" fill="#e74c3c" opacity="0.3"/>
  <text x="552" y="351" text-anchor="middle" fill="#e74c3c" font-size="9">Lv16-18: Armored Leviathan</text>
  <rect x="610" y="336" width="105" height="22" rx="3" fill="#e74c3c" opacity="0.3"/>
  <text x="662" y="351" text-anchor="middle" fill="#e74c3c" font-size="9">Lv19-20: Void Behemoth</text>
  
  <!-- Defense setup per phase -->
  <rect x="30" y="385" width="740" height="60" rx="6" fill="#1e3044" stroke="#4a6a85" stroke-width="1"/>
  <text x="400" y="405" text-anchor="middle" fill="#aabbcc" font-size="12">Recommended Defense Setup per Phase</text>
  
  <rect x="50" y="418" width="145" height="20" rx="3" fill="#1e3044" stroke="#00D4AA" stroke-width="0.5"/>
  <text x="122" y="433" text-anchor="middle" fill="#00D4AA" font-size="9">Early: 2-4 Basic Turrets</text>
  <rect x="205" y="418" width="155" height="20" rx="3" fill="#1e3044" stroke="#4a90d9" stroke-width="0.5"/>
  <text x="282" y="433" text-anchor="middle" fill="#4a90d9" font-size="9">Mid: 2 Adv + 1 Flak + Corvette</text>
  <rect x="370" y="418" width="185" height="20" rx="3" fill="#1e3044" stroke="#e74c3c" stroke-width="0.5"/>
  <text x="462" y="433" text-anchor="middle" fill="#e74c3c" font-size="9">Late: 3 Pulse + 1 Missile + Destroyer</text>
  <rect x="565" y="418" width="190" height="20" rx="3" fill="#1e3044" stroke="#f0c040" stroke-width="0.5"/>
  <text x="660" y="433" text-anchor="middle" fill="#f0c040" font-size="9">Endgame: 4 Pulse + 2 Missile + Patrol</text>
</svg>
