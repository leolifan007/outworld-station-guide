<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A2533"/>
      <stop offset="100%" stop-color="#0f1a24"/>
    </linearGradient>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00D4AA"/>
      <stop offset="100%" stop-color="#00b894"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3044"/>
      <stop offset="100%" stop-color="#162535"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a6a85"/>
    </marker>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="800" height="560" fill="url(#bg)" rx="8"/>
  <rect x="20" y="20" width="760" height="44" rx="4" fill="url(#hdr)"/>
  <text x="400" y="49" text-anchor="middle" fill="#0f1a24" font-weight="700" font-size="16">Quantum Rift Extractor - Safe Harvesting in v1.1.1.0</text>

  <!-- Before/After -->
  <rect x="30" y="84" width="360" height="140" rx="8" fill="url(#box)" stroke="#e74c3c" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="210" y="108" text-anchor="middle" fill="#e74c3c" font-weight="700" font-size="14">Before v1.1.1.0</text>
  <text x="210" y="132" text-anchor="middle" fill="#C8D6E8" font-size="11">Rift extractor = RADIATION</text>
  <text x="210" y="152" text-anchor="middle" fill="#C8D6E8" font-size="11">Containment walls required</text>
  <text x="210" y="172" text-anchor="middle" fill="#C8D6E8" font-size="11">Radiation research required</text>
  <text x="210" y="192" text-anchor="middle" fill="#C8D6E8" font-size="11">Constant hazmat monitoring</text>
  <text x="210" y="212" text-anchor="middle" fill="#e74c3c" font-size="10" font-weight="600">A whole side-project per node</text>

  <rect x="410" y="84" width="360" height="140" rx="8" fill="url(#box)" stroke="#00D4AA" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="590" y="108" text-anchor="middle" fill="#00D4AA" font-weight="700" font-size="14">After v1.1.1.0</text>
  <text x="590" y="132" text-anchor="middle" fill="#C8D6E8" font-size="11">Zero radiation from extractors</text>
  <text x="590" y="152" text-anchor="middle" fill="#C8D6E8" font-size="11">No containment, no hazmat</text>
  <text x="590" y="172" text-anchor="middle" fill="#C8D6E8" font-size="11">No radiation research needed</text>
  <text x="590" y="192" text-anchor="middle" fill="#C8D6E8" font-size="11">A normal mining operation</text>
  <text x="590" y="212" text-anchor="middle" fill="#00D4AA" font-size="10" font-weight="600">Listed among the 17 fixes</text>

  <!-- 5 steps -->
  <rect x="200" y="244" width="400" height="150" rx="8" fill="url(#box)" stroke="#4a90d9" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="400" y="266" text-anchor="middle" fill="#4a90d9" font-weight="700" font-size="13">Build a Rift Harvester - 5 Steps</text>
  <text x="400" y="290" text-anchor="middle" fill="#C8D6E8" font-size="11">1. Find a rift (scan - positions accurate now)</text>
  <text x="400" y="310" text-anchor="middle" fill="#C8D6E8" font-size="11">2. Place extractor directly on the rift node</text>
  <text x="400" y="330" text-anchor="middle" fill="#C8D6E8" font-size="11">3. Power it (local gen - see cross-planet power)</text>
  <text x="400" y="350" text-anchor="middle" fill="#C8D6E8" font-size="11">4. Protect it (turrets + repair station)</text>
  <text x="400" y="370" text-anchor="middle" fill="#C8D6E8" font-size="11">5. Collect - buffer + exclusion filter + freighter</text>
  <text x="400" y="388" text-anchor="middle" fill="#6A8AAA" font-size="10">No containment walls. No radiation tech.</text>

  <!-- New chain -->
  <rect x="200" y="414" width="400" height="100" rx="8" fill="#1E3A2E" stroke="#00D4AA" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="400" y="436" text-anchor="middle" fill="#00D4AA" font-weight="700" font-size="13">New Exotic-Tier Supply Chain</text>
  <text x="400" y="458" text-anchor="middle" fill="#C8D6E8" font-size="11">Rift extractor - exotic material - Matter Printer / advanced</text>
  <text x="400" y="478" text-anchor="middle" fill="#C8D6E8" font-size="11">+ De-Energized buffer for bursts (new v1.1.1.0 recipe)</text>
  <text x="400" y="498" text-anchor="middle" fill="#C8D6E8" font-size="11">Carbon line - Carbon Nano-Conductors - circuits (bulk)</text>

  <!-- Caveat -->
  <rect x="200" y="534" width="400" height="20" rx="4" fill="none" stroke="none"/>
  <text x="400" y="548" text-anchor="middle" fill="#FFB347" font-size="10">Caveat: pre-update builds - deconstruct + rebuild once for clean state</text>
</svg>
