<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340">
  <rect width="600" height="340" fill="#1A2533" rx="8"/>
  <text x="300" y="30" fill="#00D4AA" font-family="Arial,sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Mid-Game Resource Priority Pyramid</text>

  <!-- Tier 1 - Base (largest) -->
  <polygon points="140,230 460,230 400,175 200,175" fill="#2A3F55" stroke="#FF6B35" stroke-width="2.5" opacity="0.95"/>
  <text x="300" y="200" fill="#FF6B35" font-family="Arial,sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Tier 1: Foundation</text>
  <text x="300" y="218" fill="#B0C4D8" font-family="Arial,sans-serif" font-size="11" text-anchor="middle">Iron Plate | Copper Ingot | Iron Ore</text>

  <!-- Tier 2 - Middle -->
  <polygon points="190,175 410,175 360,125 240,125" fill="#2A3F55" stroke="#00D4AA" stroke-width="2.5" opacity="0.95"/>
  <text x="300" y="148" fill="#00D4AA" font-family="Arial,sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Tier 2: Core</text>
  <text x="300" y="166" fill="#B0C4D8" font-family="Arial,sans-serif" font-size="11" text-anchor="middle">Electronics | Superalloy | Circuits</text>

  <!-- Tier 3 - Upper -->
  <polygon points="235,125 365,125 325,80 275,80" fill="#2A3F55" stroke="#4ECDC4" stroke-width="2.5" opacity="0.95"/>
  <text x="300" y="102" fill="#4ECDC4" font-family="Arial,sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Tier 3: Advanced</text>
  <text x="300" y="119" fill="#B0C4D8" font-family="Arial,sans-serif" font-size="10" text-anchor="middle">Titanium | Tungsten | Chemicals</text>

  <!-- Tier 4 - Top -->
  <polygon points="265,80 335,80 310,45 290,45" fill="#2A3F55" stroke="#8899AA" stroke-width="2" opacity="0.7"/>
  <text x="300" y="65" fill="#8899AA" font-family="Arial,sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Tier 4: Niche</text>

  <!-- Right side - priority rules -->
  <g transform="translate(430, 65)">
    <rect x="0" y="0" width="155" height="180" fill="#1E3045" rx="6" stroke="#8899AA" stroke-width="1"/>
    <text x="78" y="18" fill="#B0C4D8" font-family="Arial,sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Priority Rules</text>
    <text x="8" y="36" fill="#FF6B35" font-family="Arial,sans-serif" font-size="10">Tier 1: Always build first</text>
    <text x="8" y="54" fill="#00D4AA" font-family="Arial,sans-serif" font-size="10">Tier 2: Dedicated lines</text>
    <text x="8" y="72" fill="#4ECDC4" font-family="Arial,sans-serif" font-size="10">Tier 3: On-demand only</text>
    <text x="8" y="90" fill="#8899AA" font-family="Arial,sans-serif" font-size="10">Tier 4: Skip until stable</text>
    <line x1="8" y1="100" x2="148" y2="100" stroke="#2A3F55" stroke-width="1"/>
    <text x="8" y="118" fill="#B0C4D8" font-family="Arial,sans-serif" font-size="11" font-weight="bold">80% Rule</text>
    <text x="8" y="136" fill="#8899AA" font-family="Arial,sans-serif" font-size="10">If T1 buffer is below</text>
    <text x="8" y="152" fill="#8899AA" font-family="Arial,sans-serif" font-size="10">80%, stop building</text>
    <text x="8" y="168" fill="#8899AA" font-family="Arial,sans-serif" font-size="10">T3-4 until recovery.</text>
  </g>
</svg>
