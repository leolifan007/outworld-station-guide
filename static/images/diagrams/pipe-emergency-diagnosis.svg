<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>text { font-family: 'Segoe UI', Arial, sans-serif; }</style>
    <linearGradient id="bge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f1923"/>
      <stop offset="100%" stop-color="#1a2533"/>
    </linearGradient>
    <marker id="arrBlue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#4FC3F7"/>
    </marker>
  </defs>
  <rect width="800" height="600" fill="url(#bge)" rx="12"/>

  <text x="400" y="32" text-anchor="middle" fill="#00D4AA" font-size="18" font-weight="700">Emergency Procedure: Pipe Network Diagnosis</text>
  <text x="400" y="52" text-anchor="middle" fill="#90A4AE" font-size="12">Follow this decision tree when a consumer is starving despite adequate production</text>

  <!-- START -->
  <ellipse cx="400" cy="85" rx="130" ry="28" fill="#B71C1C" stroke="#FF5252" stroke-width="2"/>
  <text x="400" y="90" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="600">Consumer Starving?</text>
  <text x="400" y="103" text-anchor="middle" fill="#FFCDD2" font-size="9">("adequate production" confirmed)</text>

  <!-- Step 1 -->
  <line x1="400" y1="113" x2="400" y2="148" stroke="#4FC3F7" stroke-width="2.5" marker-end="url(#arrBlue)"/>
  <rect x="280" y="148" width="240" height="68" rx="10" fill="#0D47A1" stroke="#4FC3F7" stroke-width="2"/>
  <text x="400" y="168" text-anchor="middle" fill="#4FC3F7" font-size="11" font-weight="700">STEP 1: Check Pipe Segment Length</text>
  <text x="400" y="186" text-anchor="middle" fill="#E0E0E0" font-size="10">Measure the distance from last buffer</text>
  <text x="400" y="202" text-anchor="middle" fill="#90CAF9" font-size="10">to the starving consumer</text>
  <!-- Decision box -->
  <line x1="400" y1="216" x2="400" y2="240" stroke="#4FC3F7" stroke-width="2.5" marker-end="url(#arrBlue)"/>
  <rect x="320" y="240" width="160" height="32" rx="6" fill="#1B5E20" stroke="#4CAF50" stroke-width="2"/>
  <text x="400" y="256" text-anchor="middle" fill="#FFFFFF" font-size="10">Over 10 tiles?</text>
  <!-- YES -->
  <line x1="320" y1="256" x2="200" y2="256" stroke="#4CAF50" stroke-width="2.5"/>
  <polygon points="190,251 180,256 190,261" fill="#4CAF50"/>
  <rect x="30" y="228" width="170" height="56" rx="8" fill="#2E7D32" stroke="#4CAF50" stroke-width="2"/>
  <text x="115" y="248" text-anchor="middle" fill="#A5D6A7" font-size="10" font-weight="600">FIX: Upgrade to</text>
  <text x="115" y="262" text-anchor="middle" fill="#A5D6A7" font-size="10" font-weight="600">Reinforced Pipe segment</text>
  <text x="115" y="276" text-anchor="middle" fill="#4CAF50" font-size="9">or add buffer tank closer</text>
  <!-- NO -->
  <line x1="480" y1="256" x2="560" y2="256" stroke="#FF5252" stroke-width="2.5"/>
  <polygon points="570,251 580,256 570,261" fill="#FF5252"/>

  <!-- Step 2 -->
  <line x1="580" y1="256" x2="620" y2="310" stroke="#FF5252" stroke-width="2.5"/>
  <rect x="500" y="310" width="240" height="68" rx="10" fill="#0D47A1" stroke="#4FC3F7" stroke-width="2"/>
  <text x="620" y="330" text-anchor="middle" fill="#4FC3F7" font-size="11" font-weight="700">STEP 2: Find Hidden T-Junctions</text>
  <text x="620" y="348" text-anchor="middle" fill="#E0E0E0" font-size="10">Look for unmarked branch pipes</text>
  <text x="620" y="364" text-anchor="middle" fill="#90CAF9" font-size="10">you may have missed during construction</text>
  <line x1="620" y1="378" x2="620" y2="400" stroke="#4FC3F7" stroke-width="2.5" marker-end="url(#arrBlue)"/>
  <rect x="540" y="400" width="160" height="28" rx="6" fill="#1B5E20" stroke="#4CAF50" stroke-width="2"/>
  <text x="620" y="418" text-anchor="middle" fill="#FFFFFF" font-size="10">Found a branch?</text>
  <line x1="540" y1="414" x2="430" y2="414" stroke="#4CAF50" stroke-width="2.5"/>
  <polygon points="420,409 410,414 420,419" fill="#4CAF50"/>
  <rect x="270" y="386" width="160" height="56" rx="8" fill="#2E7D32" stroke="#4CAF50" stroke-width="2"/>
  <text x="350" y="406" text-anchor="middle" fill="#A5D6A7" font-size="10" font-weight="600">FIX: Seal branch or</text>
  <text x="350" y="420" text-anchor="middle" fill="#A5D6A7" font-size="10" font-weight="600">add valve before it</text>
  <line x1="700" y1="414" x2="740" y2="414" stroke="#FF5252" stroke-width="2.5"/>
  <polygon points="750,409 760,414 750,419" fill="#FF5252"/>

  <!-- Step 3 -->
  <line x1="740" y1="414" x2="740" y2="470" stroke="#FF5252" stroke-width="2.5"/>
  <rect x="620" y="470" width="240" height="68" rx="10" fill="#0D47A1" stroke="#4FC3F7" stroke-width="2"/>
  <text x="740" y="490" text-anchor="middle" fill="#4FC3F7" font-size="11" font-weight="700">STEP 3: Verify Valve Direction</text>
  <text x="740" y="508" text-anchor="middle" fill="#E0E0E0" font-size="10">One-way valve arrows must point</text>
  <text x="740" y="524" text-anchor="middle" fill="#90CAF9" font-size="10">FROM source TO consumer</text>
  <line x1="740" y1="538" x2="740" y2="560" stroke="#4FC3F7" stroke-width="2.5" marker-end="url(#arrBlue)"/>
  <rect x="660" y="560" width="160" height="28" rx="6" fill="#1B5E20" stroke="#4CAF50" stroke-width="2"/>
  <text x="740" y="578" text-anchor="middle" fill="#FFFFFF" font-size="10">Arrow wrong?</text>
  <line x1="660" y1="574" x2="580" y2="574" stroke="#4CAF50" stroke-width="2.5"/>
  <polygon points="570,569 560,574 570,579" fill="#4CAF50"/>
  <rect x="400" y="548" width="160" height="56" rx="8" fill="#2E7D32" stroke="#4CAF50" stroke-width="2"/>
  <text x="480" y="568" text-anchor="middle" fill="#A5D6A7" font-size="10" font-weight="600">FIX: Rotate valve</text>
  <text x="480" y="582" text-anchor="middle" fill="#A5D6A7" font-size="10" font-weight="600">180° to fix direction</text>
  <line x1="820" y1="574" x2="820" y2="574" stroke="#FF5252" stroke-width="2.5"/>

  <!-- Summary box -->
  <rect x="30" y="148" width="220" height="170" rx="10" fill="#263238" stroke="#455A64" stroke-width="1.5"/>
  <text x="140" y="170" text-anchor="middle" fill="#FF9800" font-size="11" font-weight="700">Quick Checklist</text>
  <line x1="40" y1="180" x2="240" y2="180" stroke="#455A64" stroke-width="1"/>
  <text x="48" y="198" fill="#4FC3F7" font-size="10" font-weight="600">1.</text>
  <text x="62" y="198" fill="#E0E0E0" font-size="10">Pipe segment &gt;10 tiles?</text>
  <text x="48" y="216" fill="#4FC3F7" font-size="10" font-weight="600">2.</text>
  <text x="62" y="216" fill="#E0E0E0" font-size="10">Hidden T-junction found?</text>
  <text x="48" y="234" fill="#4FC3F7" font-size="10" font-weight="600">3.</text>
  <text x="62" y="234" fill="#E0E0E0" font-size="10">Valve arrows correct?</text>
  <text x="48" y="252" fill="#4FC3F7" font-size="10" font-weight="600">4.</text>
  <text x="62" y="252" fill="#E0E0E0" font-size="10">Buffer tank has gas?</text>
  <text x="48" y="270" fill="#4FC3F7" font-size="10" font-weight="600">5.</text>
  <text x="62" y="270" fill="#E0E0E0" font-size="10">Upstream production OK?</text>
  <line x1="40" y1="282" x2="240" y2="282" stroke="#455A64" stroke-width="1"/>
  <text x="140" y="300" text-anchor="middle" fill="#FF9800" font-size="10" font-weight="600">Last resort: Replace with</text>
  <text x="140" y="314" text-anchor="middle" fill="#FF9800" font-size="10" font-weight="600">Reinforced Pipe segment</text>
</svg>
