<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A2533"/>
      <stop offset="100%" stop-color="#0f1a24"/>
    </linearGradient>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00D4AA"/>
      <stop offset="100%" stop-color="#00b894"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3044"/>
      <stop offset="100%" stop-color="#162535"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a6a85"/>
    </marker>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#bg)" rx="8"/>
  <rect x="20" y="20" width="760" height="44" rx="4" fill="url(#hdr)"/>
  <text x="400" y="49" text-anchor="middle" fill="#0f1a24" font-weight="700" font-size="16">Cross-Planet Power - No Transmission, Three Strategies</text>

  <!-- Rule -->
  <rect x="180" y="84" width="440" height="50" rx="8" fill="#3A2E1E" stroke="#FFB347" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="400" y="106" text-anchor="middle" fill="#FFB347" font-weight="700" font-size="13">Rule: Power does NOT transmit between planets</text>
  <text x="400" y="124" text-anchor="middle" fill="#C8D6E8" font-size="11">Every planet/outpost generates its own - unchanged in v1.1.1.0</text>

  <!-- Strategy 1 -->
  <rect x="30" y="154" width="240" height="180" rx="8" fill="url(#box)" stroke="#00D4AA" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="150" y="176" text-anchor="middle" fill="#00D4AA" font-weight="700" font-size="13">1. Local Generation</text>
  <text x="150" y="200" text-anchor="middle" fill="#C8D6E8" font-size="11">Sun-rich - solar fields</text>
  <text x="150" y="220" text-anchor="middle" fill="#C8D6E8" font-size="11">Gas giant - gas reactors</text>
  <text x="150" y="240" text-anchor="middle" fill="#C8D6E8" font-size="11">Asteroid - ship fuel in</text>
  <text x="150" y="268" text-anchor="middle" fill="#6A8AAA" font-size="10">Match generator to</text>
  <text x="150" y="284" text-anchor="middle" fill="#6A8AAA" font-size="10">planetary resources</text>
  <text x="150" y="312" text-anchor="middle" fill="#00D4AA" font-size="10" font-weight="600">The default choice</text>

  <!-- Strategy 2 -->
  <rect x="280" y="154" width="240" height="180" rx="8" fill="url(#box)" stroke="#4a90d9" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="400" y="176" text-anchor="middle" fill="#4a90d9" font-weight="700" font-size="13">2. Fuel Logistics</text>
  <text x="400" y="200" text-anchor="middle" fill="#C8D6E8" font-size="11">Demand x run time</text>
  <text x="400" y="220" text-anchor="middle" fill="#C8D6E8" font-size="11">= fuel needed per trip</text>
  <text x="400" y="240" text-anchor="middle" fill="#C8D6E8" font-size="11">Buffer covers 20+ min</text>
  <text x="400" y="268" text-anchor="middle" fill="#6A8AAA" font-size="10">The critical path - most</text>
  <text x="400" y="284" text-anchor="middle" fill="#6A8AAA" font-size="10">players fail here</text>
  <text x="400" y="312" text-anchor="middle" fill="#4a90d9" font-size="10" font-weight="600">Buffer first, then route</text>

  <!-- Strategy 3 -->
  <rect x="530" y="154" width="240" height="180" rx="8" fill="url(#box)" stroke="#f0c040" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="650" y="176" text-anchor="middle" fill="#f0c040" font-weight="700" font-size="13">3. Fallback Bank</text>
  <text x="650" y="200" text-anchor="middle" fill="#C8D6E8" font-size="11">Battery sized for</text>
  <text x="650" y="220" text-anchor="middle" fill="#C8D6E8" font-size="11">~10 min full demand</text>
  <text x="650" y="240" text-anchor="middle" fill="#C8D6E8" font-size="11">Absorbs late shipments</text>
  <text x="650" y="268" text-anchor="middle" fill="#6A8AAA" font-size="10">Safety net, not a</text>
  <text x="650" y="284" text-anchor="middle" fill="#6A8AAA" font-size="10">replacement</text>
  <text x="650" y="312" text-anchor="middle" fill="#f0c040" font-size="10" font-weight="600">Reliable since v1.1.1.0</text>

  <!-- Checklist -->
  <rect x="30" y="360" width="740" height="160" rx="8" fill="url(#box)" stroke="#00D4AA" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="400" y="384" text-anchor="middle" fill="#00D4AA" font-weight="700" font-size="13">Outpost Power Checklist - before placing a single building</text>
  <text x="400" y="408" text-anchor="middle" fill="#C8D6E8" font-size="11">1. Budget demand: sum all draws + 30% headroom</text>
  <text x="400" y="428" text-anchor="middle" fill="#C8D6E8" font-size="11">2. Choose generation: what can this planet fuel?</text>
  <text x="400" y="448" text-anchor="middle" fill="#C8D6E8" font-size="11">3. Build generation FIRST - power before production</text>
  <text x="400" y="468" text-anchor="middle" fill="#C8D6E8" font-size="11">4. Add fallback bank - 10 min of full-demand battery</text>
  <text x="400" y="488" text-anchor="middle" fill="#C8D6E8" font-size="11">5. Set up fuel logistics - route + buffer, verified in freighter view</text>
  <text x="400" y="508" text-anchor="middle" fill="#C8D6E8" font-size="11">6. Test failure: disconnect fuel 10 min - does the bank hold?</text>

  <!-- Verdict -->
  <rect x="200" y="540" width="400" height="40" rx="8" fill="#1E3A2E" stroke="#00D4AA" stroke-width="1"/>
  <text x="400" y="565" text-anchor="middle" fill="#00D4AA" font-size="12" font-weight="600">Generate locally + ship fuel + fallback = never brown out</text>
</svg>
