<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" style="background:#1A2533;border-radius:8px;font-family:'Segoe UI',Arial,sans-serif;">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A5F;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#162D4A;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="oldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A2A2A;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#3A1E1E;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="newGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2A4A3A;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1E3A2E;stop-opacity:1"/>
    </linearGradient>
    <marker id="arrowCyan" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00D4AA"/>
    </marker>
  </defs>
  <text x="360" y="30" text-anchor="middle" fill="#00D4AA" font-size="16" font-weight="bold">v1.0 vs v1.1 Recipe Comparison</text>

  <!-- Column headers -->
  <text x="260" y="55" text-anchor="middle" fill="#FF6B6B" font-size="12" font-weight="bold">v1.0 (Old)</text>
  <text x="460" y="55" text-anchor="middle" fill="#00D4AA" font-size="12" font-weight="bold">v1.1 (New)</text>

  <!-- Diamond -->
  <rect x="30" y="68" width="660" height="52" rx="8" fill="url(#boxGrad)" stroke="#6A8AAA" stroke-width="1"/>
  <text x="50" y="90" fill="#C8D6E8" font-size="12" font-weight="bold">Diamond</text>
  <rect x="140" y="75" width="200" height="32" rx="6" fill="url(#oldGrad)" stroke="#FF6B6B" stroke-width="1"/>
  <text x="240" y="95" text-anchor="middle" fill="#FF6B6B" font-size="10">Carbon → 15/min</text>
  <line x1="350" y1="91" x2="370" y2="91" stroke="#00D4AA" stroke-width="2" marker-end="url(#arrowCyan)"/>
  <rect x="380" y="75" width="220" height="32" rx="6" fill="url(#newGrad)" stroke="#00D4AA" stroke-width="1"/>
  <text x="490" y="95" text-anchor="middle" fill="#00D4AA" font-size="10">Carbon + Nitrox → 20/min</text>

  <!-- Nitronic Acid -->
  <rect x="30" y="128" width="660" height="52" rx="8" fill="url(#boxGrad)" stroke="#6A8AAA" stroke-width="1"/>
  <text x="50" y="150" fill="#C8D6E8" font-size="12" font-weight="bold">Nitronic Acid</text>
  <rect x="140" y="135" width="200" height="32" rx="6" fill="url(#oldGrad)" stroke="#FF6B6B" stroke-width="1"/>
  <text x="240" y="155" text-anchor="middle" fill="#FF6B6B" font-size="10">Hydrogen + Sulfur → 10/min</text>
  <line x1="350" y1="151" x2="370" y2="151" stroke="#00D4AA" stroke-width="2" marker-end="url(#arrowCyan)"/>
  <rect x="380" y="135" width="220" height="32" rx="6" fill="url(#newGrad)" stroke="#00D4AA" stroke-width="1"/>
  <text x="490" y="155" text-anchor="middle" fill="#00D4AA" font-size="10">Hydrogen + Nitrox → 12/min</text>

  <!-- Oxygen -->
  <rect x="30" y="188" width="660" height="52" rx="8" fill="url(#boxGrad)" stroke="#6A8AAA" stroke-width="1"/>
  <text x="50" y="210" fill="#C8D6E8" font-size="12" font-weight="bold">Oxygen</text>
  <rect x="140" y="195" width="200" height="32" rx="6" fill="url(#oldGrad)" stroke="#FF6B6B" stroke-width="1"/>
  <text x="240" y="215" text-anchor="middle" fill="#FF6B6B" font-size="10">2 Hydrogen → 3 Oxygen</text>
  <line x1="350" y1="211" x2="370" y2="211" stroke="#00D4AA" stroke-width="2" marker-end="url(#arrowCyan)"/>
  <rect x="380" y="195" width="220" height="32" rx="6" fill="url(#newGrad)" stroke="#00D4AA" stroke-width="1"/>
  <text x="490" y="215" text-anchor="middle" fill="#00D4AA" font-size="10">2 Hydrogen → 5 Oxygen (+67%)</text>

  <!-- Superalloy -->
  <rect x="30" y="248" width="660" height="52" rx="8" fill="url(#boxGrad)" stroke="#6A8AAA" stroke-width="1"/>
  <text x="50" y="270" fill="#C8D6E8" font-size="12" font-weight="bold">Superalloy</text>
  <rect x="140" y="255" width="200" height="32" rx="6" fill="url(#oldGrad)" stroke="#FF6B6B" stroke-width="1"/>
  <text x="240" y="275" text-anchor="middle" fill="#FF6B6B" font-size="10">Tungsten + Titanium only</text>
  <line x1="350" y1="271" x2="370" y2="271" stroke="#00D4AA" stroke-width="2" marker-end="url(#arrowCyan)"/>
  <rect x="380" y="255" width="220" height="32" rx="6" fill="url(#newGrad)" stroke="#00D4AA" stroke-width="1"/>
  <text x="490" y="275" text-anchor="middle" fill="#00D4AA" font-size="10">Steel + Nitrox alt recipe added</text>

  <!-- Balance changes -->
  <rect x="30" y="310" width="660" height="85" rx="8" fill="#1E3A5F" stroke="#6A8AAA" stroke-width="1"/>
  <text x="360" y="332" text-anchor="middle" fill="#C8D6E8" font-size="12" font-weight="bold">v1.1 Balance Changes</text>
  <text x="50" y="352" fill="#00D4AA" font-size="11">Hub throughput:</text>
  <text x="170" y="352" fill="#8AACCD" font-size="11">60 → 90 items/min per channel  (+50%)</text>
  <text x="50" y="370" fill="#FF6B6B" font-size="11">Molecular Recombination:</text>
  <text x="200" y="370" fill="#FF6B6B" font-size="11">5/min → ~2/min output  (halved)</text>
  <text x="50" y="388" fill="#FFB347" font-size="11">Servitor Station:</text>
  <text x="170" y="388" fill="#8AACCD" font-size="11">Unlocked at Level 8 (was Level 10)</text>

  <text x="360" y="412" text-anchor="middle" fill="#4A6070" font-size="9">Outworld Station Guide - Recipe Changes v1.1</text>
</svg>