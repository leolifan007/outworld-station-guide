<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 720" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A2533"/>
      <stop offset="100%" stop-color="#0f1a24"/>
    </linearGradient>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00D4AA"/>
      <stop offset="100%" stop-color="#00b894"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3044"/>
      <stop offset="100%" stop-color="#162535"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#00D4AA"/>
    </marker>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="800" height="720" fill="url(#bg)" rx="8"/>
  <rect x="20" y="20" width="760" height="44" rx="4" fill="url(#hdr)"/>
  <text x="400" y="49" text-anchor="middle" fill="#0f1a24" font-weight="700" font-size="16">Arkship Terminal Mission Loop (v1.1.2.0)</text>

  <!-- Unlock -->
  <rect x="250" y="88" width="300" height="58" rx="8" fill="url(#box)" stroke="#00D4AA" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="400" y="112" text-anchor="middle" fill="#00D4AA" font-weight="700" font-size="13">1. Unlock</text>
  <text x="400" y="132" text-anchor="middle" fill="#C8D6E8" font-size="11">Launch Arkship + finish campaign</text>

  <line x1="400" y1="146" x2="400" y2="176" stroke="#00D4AA" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Accept -->
  <rect x="250" y="178" width="300" height="58" rx="8" fill="url(#box)" stroke="#4a6a85" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="400" y="202" text-anchor="middle" fill="#C8D6E8" font-weight="700" font-size="13">2. Accept a Mission</text>
  <text x="400" y="222" text-anchor="middle" fill="#8FA8C0" font-size="11">Randomly generated at the Terminal</text>

  <line x1="400" y1="236" x2="400" y2="266" stroke="#00D4AA" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Complete -->
  <rect x="250" y="268" width="300" height="58" rx="8" fill="url(#box)" stroke="#4a6a85" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="400" y="292" text-anchor="middle" fill="#C8D6E8" font-weight="700" font-size="13">3. Complete Objective</text>
  <text x="400" y="312" text-anchor="middle" fill="#8FA8C0" font-size="11">Best if automation does the work</text>

  <line x1="400" y1="326" x2="400" y2="356" stroke="#00D4AA" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Prestige -->
  <rect x="250" y="358" width="300" height="58" rx="8" fill="url(#box)" stroke="#00D4AA" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="400" y="382" text-anchor="middle" fill="#00D4AA" font-weight="700" font-size="13">4. Earn Prestige Points</text>
  <text x="400" y="402" text-anchor="middle" fill="#C8D6E8" font-size="11">Accumulate toward next level</text>

  <line x1="400" y1="416" x2="400" y2="446" stroke="#00D4AA" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Level up -->
  <rect x="250" y="448" width="300" height="58" rx="8" fill="url(#box)" stroke="#FFC65C" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="400" y="472" text-anchor="middle" fill="#FFC65C" font-weight="700" font-size="13">5. Level Up: Station Prestige</text>
  <text x="400" y="492" text-anchor="middle" fill="#C8D6E8" font-size="11">Random reward rolled</text>

  <!-- Rewards -->
  <rect x="60" y="540" width="210" height="70" rx="8" fill="url(#box)" stroke="#4a90d9" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="165" y="566" text-anchor="middle" fill="#4a90d9" font-weight="700" font-size="12">Decoration Elements</text>
  <text x="165" y="586" text-anchor="middle" fill="#8FA8C0" font-size="10">New cosmetic parts</text>

  <rect x="295" y="540" width="210" height="70" rx="8" fill="url(#box)" stroke="#00D4AA" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="400" y="566" text-anchor="middle" fill="#00D4AA" font-weight="700" font-size="12">Tech Points</text>
  <text x="400" y="586" text-anchor="middle" fill="#8FA8C0" font-size="10">Research currency</text>

  <rect x="530" y="540" width="210" height="70" rx="8" fill="url(#box)" stroke="#FFC65C" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="635" y="566" text-anchor="middle" fill="#FFC65C" font-weight="700" font-size="12">Random Rewards</text>
  <text x="635" y="586" text-anchor="middle" fill="#8FA8C0" font-size="10">More rolled on level-up</text>

  <!-- loop back -->
  <path d="M 250 477 C 120 477 90 400 120 300 C 140 230 200 207 250 205" fill="none" stroke="#4a6a85" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="118" y="345" fill="#6A8AAA" font-size="10" transform="rotate(-90 118 345)">repeat endlessly</text>

  <text x="400" y="668" text-anchor="middle" fill="#6A8AAA" font-size="10" font-style="italic">Beta branch, September 2026 - reward tables provisional until stable release</text>
</svg>
