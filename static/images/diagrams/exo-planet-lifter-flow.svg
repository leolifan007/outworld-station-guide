<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 780" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A2533"/>
      <stop offset="100%" stop-color="#0f1a24"/>
    </linearGradient>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00D4AA"/>
      <stop offset="100%" stop-color="#00b894"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3044"/>
      <stop offset="100%" stop-color="#162535"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a6a85"/>
    </marker>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="800" height="780" fill="url(#bg)" rx="8"/>
  <rect x="20" y="20" width="760" height="44" rx="4" fill="url(#hdr)"/>
  <text x="400" y="49" text-anchor="middle" fill="#0f1a24" font-weight="700" font-size="16">Exo-Planet Lifter Operations Flow</text>
  
  <!-- Step 1 -->
  <rect x="225" y="80" width="350" height="50" rx="6" fill="url(#box)" stroke="#4a90d9" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="400" y="103" text-anchor="middle" fill="#4a90d9" font-weight="700" font-size="13">Station Level 15 - Command Tree</text>
  <text x="400" y="120" text-anchor="middle" fill="#8899aa" font-size="11">3,500 Tech Points - 8 min research</text>
  <line x1="400" y1="130" x2="400" y2="155" stroke="#4a6a85" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <!-- Step 2 -->
  <rect x="200" y="155" width="400" height="50" rx="6" fill="url(#box)" stroke="#f0c040" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="400" y="178" text-anchor="middle" fill="#f0c040" font-weight="700" font-size="13">Build Exo-Planet Ops Centre</text>
  <text x="400" y="195" text-anchor="middle" fill="#8899aa" font-size="11">150 Superalloy + 60 Electronics + 20 Titanium</text>
  <line x1="400" y1="205" x2="400" y2="230" stroke="#4a6a85" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <!-- Step 3 -->
  <rect x="200" y="230" width="400" height="50" rx="6" fill="url(#box)" stroke="#00D4AA" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="400" y="253" text-anchor="middle" fill="#00D4AA" font-weight="700" font-size="13">Scan for Extractable Exo-Planets</text>
  <text x="400" y="270" text-anchor="middle" fill="#8899aa" font-size="11">Gold [Exo-Planet: Extractable] icon</text>
  <line x1="400" y1="280" x2="400" y2="305" stroke="#4a6a85" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <!-- Planet quality split -->
  <rect x="400" y="305" width="12" height="20" rx="2" fill="#4a6a85"/>
  
  <line x1="160" y1="325" x2="160" y2="345" stroke="#4a6a85" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="325" x2="160" y2="325" stroke="#4a6a85" stroke-width="1.5"/>
  <rect x="40" y="345" width="240" height="65" rx="6" fill="url(#box)" stroke="#00D4AA" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="160" y="368" text-anchor="middle" fill="#00D4AA" font-weight="700" font-size="13">Low / Medium</text>
  <text x="160" y="385" text-anchor="middle" fill="#aabbcc" font-size="11">8-25K credits per haul</text>
  <text x="160" y="400" text-anchor="middle" fill="#8899aa" font-size="10">30-90s transit time</text>
  
  <line x1="400" y1="325" x2="640" y2="325" stroke="#4a6a85" stroke-width="1.5"/>
  <line x1="640" y1="325" x2="640" y2="345" stroke="#4a6a85" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="520" y="345" width="240" height="65" rx="6" fill="url(#box)" stroke="#f0c040" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="640" y="368" text-anchor="middle" fill="#f0c040" font-weight="700" font-size="13">High / Rich</text>
  <text x="640" y="385" text-anchor="middle" fill="#aabbcc" font-size="11">30-55K credits per haul</text>
  <text x="640" y="400" text-anchor="middle" fill="#8899aa" font-size="10">90-180s transit time</text>
  
  <!-- Merge -->
  <line x1="160" y1="410" x2="160" y2="435" stroke="#4a6a85" stroke-width="1.5"/>
  <line x1="640" y1="410" x2="640" y2="435" stroke="#4a6a85" stroke-width="1.5"/>
  <line x1="160" y1="435" x2="640" y2="435" stroke="#4a6a85" stroke-width="1.5"/>
  <line x1="400" y1="435" x2="400" y2="460" stroke="#4a6a85" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <!-- Step 4 -->
  <rect x="200" y="460" width="400" height="50" rx="6" fill="url(#box)" stroke="#e74c3c" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="400" y="483" text-anchor="middle" fill="#e74c3c" font-weight="700" font-size="13">Assign Frigate/Destroyer via CPU</text>
  <text x="400" y="500" text-anchor="middle" fill="#8899aa" font-size="11">ExoPlanet Ops task - check fuel first</text>
  <line x1="400" y1="510" x2="400" y2="535" stroke="#4a6a85" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <!-- Step 5 -->
  <rect x="200" y="535" width="400" height="50" rx="6" fill="url(#box)" stroke="#9b59b6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="400" y="558" text-anchor="middle" fill="#9b59b6" font-weight="700" font-size="13">Ship Lands + Deploys Extractors</text>
  <text x="400" y="575" text-anchor="middle" fill="#8899aa" font-size="11">5-10 min extraction per run</text>
  <line x1="400" y1="585" x2="400" y2="610" stroke="#4a6a85" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <!-- Step 6 -->
  <rect x="200" y="610" width="400" height="50" rx="6" fill="url(#box)" stroke="#e67e22" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="400" y="633" text-anchor="middle" fill="#e67e22" font-weight="700" font-size="13">Ship Returns with Resources</text>
  <text x="400" y="650" text-anchor="middle" fill="#8899aa" font-size="11">Unload via Ops Centre output storage</text>
  <line x1="400" y1="660" x2="400" y2="685" stroke="#4a6a85" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <!-- Result -->
  <rect x="200" y="685" width="400" height="50" rx="8" fill="#0d5a4a" stroke="#00D4AA" stroke-width="1.5"/>
  <text x="400" y="709" text-anchor="middle" fill="#00D4AA" font-weight="700" font-size="14">100-150K Credits/Hour Passive Income</text>
  <text x="400" y="724" text-anchor="middle" fill="#8899aa" font-size="10">Best passive income in mid-to-late game</text>
  
  <!-- Note at bottom -->
  <rect x="225" y="745" width="350" height="24" rx="4" fill="#162535" stroke="#4a6a85" stroke-width="1"/>
  <text x="400" y="762" text-anchor="middle" fill="#4a6a85" font-size="10">Upgrade: Multi-Planet Ops (Lv17) for 2 simultaneous missions</text>
</svg>
