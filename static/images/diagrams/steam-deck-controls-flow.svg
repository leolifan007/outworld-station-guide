<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A2533"/>
      <stop offset="100%" stop-color="#0f1a24"/>
    </linearGradient>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00D4AA"/>
      <stop offset="100%" stop-color="#00b894"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3044"/>
      <stop offset="100%" stop-color="#162535"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a6a85"/>
    </marker>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="800" height="620" fill="url(#bg)" rx="8"/>
  <rect x="20" y="20" width="760" height="44" rx="4" fill="url(#hdr)"/>
  <text x="400" y="49" text-anchor="middle" fill="#0f1a24" font-weight="700" font-size="16">Steam Deck Controls Fix - Symptoms and the Beta Branch Path</text>

  <!-- Symptoms column -->
  <rect x="30" y="84" width="230" height="250" rx="8" fill="url(#box)" stroke="#e74c3c" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="145" y="110" text-anchor="middle" fill="#e74c3c" font-weight="700" font-size="13">Symptoms after Early Access</text>
  <text x="48" y="140" fill="#C8D6E8" font-size="10">X  Right stick loses aim on touch</text>
  <text x="48" y="164" fill="#C8D6E8" font-size="10">X  Menus will not respond to clicks</text>
  <text x="48" y="188" fill="#C8D6E8" font-size="10">X  Forced into gamepad mode</text>
  <text x="48" y="212" fill="#C8D6E8" font-size="10">X  Trackpads and touch ignored</text>
  <text x="48" y="236" fill="#C8D6E8" font-size="10">X  Layout resets every launch</text>
  <rect x="48" y="258" width="194" height="60" rx="6" fill="#22182A" stroke="#FFB347" stroke-width="1.2"/>
  <text x="145" y="280" text-anchor="middle" fill="#FFB347" font-size="10">Not a broken Deck and not</text>
  <text x="145" y="296" text-anchor="middle" fill="#FFB347" font-size="10">a bad install. Do not</text>
  <text x="145" y="312" text-anchor="middle" fill="#FFB347" font-size="10">reinstall the game.</text>

  <!-- Arrow -->
  <line x1="262" y1="209" x2="298" y2="209" stroke="#4a6a85" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Fix flow -->
  <rect x="300" y="84" width="470" height="250" rx="8" fill="url(#box)" stroke="#00D4AA" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="535" y="110" text-anchor="middle" fill="#00D4AA" font-weight="700" font-size="13">Fix path (in order)</text>

  <rect x="320" y="124" width="200" height="56" rx="6" fill="#1E3A2E" stroke="#00D4AA" stroke-width="1.4"/>
  <text x="420" y="146" text-anchor="middle" fill="#00D4AA" font-size="11" font-weight="600">1. Beta branch</text>
  <text x="420" y="166" text-anchor="middle" fill="#6A8AAA" font-size="9">Properties - Betas - PC controls</text>

  <line x1="524" y1="152" x2="546" y2="152" stroke="#4a6a85" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="548" y="124" width="200" height="56" rx="6" fill="#162535" stroke="#4a90d9" stroke-width="1.4"/>
  <text x="648" y="146" text-anchor="middle" fill="#4a90d9" font-size="11" font-weight="600">2. Desktop layout</text>
  <text x="648" y="166" text-anchor="middle" fill="#6A8AAA" font-size="9">keyboard + mouse template</text>

  <rect x="320" y="196" width="200" height="56" rx="6" fill="#162535" stroke="#4a90d9" stroke-width="1.4"/>
  <text x="420" y="218" text-anchor="middle" fill="#4a90d9" font-size="11" font-weight="600">3. Force mouse input</text>
  <text x="420" y="238" text-anchor="middle" fill="#6A8AAA" font-size="9">trackpad = pointer, no gamepad</text>

  <line x1="524" y1="224" x2="546" y2="224" stroke="#4a6a85" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="548" y="196" width="200" height="56" rx="6" fill="#162535" stroke="#00D4AA" stroke-width="1.4"/>
  <text x="648" y="218" text-anchor="middle" fill="#00D4AA" font-size="11" font-weight="600">4. Deck settings</text>
  <text x="648" y="238" text-anchor="middle" fill="#6A8AAA" font-size="9">cap FPS, lower res scale</text>

  <text x="535" y="288" text-anchor="middle" fill="#C8D6E8" font-size="10">Developer publicly responded on Steam discussions with this branch.</text>

  <!-- Bottom: settings table style -->
  <rect x="30" y="352" width="740" height="246" rx="8" fill="url(#box)" stroke="#4a6a85" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="400" y="378" text-anchor="middle" fill="#C8D6E8" font-weight="700" font-size="13">Recommended Deck settings and when to use the branch</text>

  <rect x="60" y="394" width="330" height="180" rx="6" fill="#162535" stroke="#4a90d9" stroke-width="1.2"/>
  <text x="225" y="418" text-anchor="middle" fill="#4a90d9" font-size="11" font-weight="600">Deck-friendly settings</text>
  <text x="80" y="444" fill="#C8D6E8" font-size="10">Resolution scale - one step below native</text>
  <text x="80" y="466" fill="#C8D6E8" font-size="10">Frame limit - cap at 30 or 40 FPS</text>
  <text x="80" y="488" fill="#C8D6E8" font-size="10">VSync - on, paired with the cap</text>
  <text x="80" y="510" fill="#C8D6E8" font-size="10">Background / vignette effects - off</text>
  <text x="80" y="532" fill="#C8D6E8" font-size="10">Windowed vs fullscreen - fullscreen</text>

  <rect x="410" y="394" width="330" height="180" rx="6" fill="#1E3A2E" stroke="#00D4AA" stroke-width="1.2"/>
  <text x="575" y="418" text-anchor="middle" fill="#00D4AA" font-size="11" font-weight="600">Just use the beta branch when...</text>
  <text x="430" y="444" fill="#C8D6E8" font-size="10">You want the least fiddling on Deck</text>
  <text x="430" y="466" fill="#C8D6E8" font-size="10">Symptoms return after a game update</text>
  <text x="430" y="488" fill="#C8D6E8" font-size="10">You mostly play solo</text>
  <text x="430" y="516" fill="#6A8AAA" font-size="10">Stay on stable only if you need</text>
  <text x="430" y="532" fill="#6A8AAA" font-size="10">version parity for co-op.</text>
  <text x="400" y="588" text-anchor="middle" fill="#FFB347" font-size="10">Beta branch = not stable build. Back up saves before long sessions.</text>
</svg>
