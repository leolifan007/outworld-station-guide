<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A2533"/>
      <stop offset="100%" stop-color="#0f1a24"/>
    </linearGradient>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFC65C"/>
      <stop offset="100%" stop-color="#E8983E"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3044"/>
      <stop offset="100%" stop-color="#162535"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FFC65C"/>
    </marker>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="800" height="640" fill="url(#bg)" rx="8"/>
  <rect x="20" y="20" width="760" height="44" rx="4" fill="url(#hdr)"/>
  <text x="400" y="49" text-anchor="middle" fill="#0f1a24" font-weight="700" font-size="16">Station Prestige Progression (v1.1.2.0)</text>

  <!-- Points source -->
  <rect x="40" y="90" width="250" height="90" rx="8" fill="url(#box)" stroke="#4a90d9" stroke-width="1.4" filter="url(#shadow)"/>
  <text x="165" y="118" text-anchor="middle" fill="#4a90d9" font-weight="700" font-size="13">Prestige Points</text>
  <text x="165" y="140" text-anchor="middle" fill="#C8D6E8" font-size="11">Only from Arkship missions</text>
  <text x="165" y="160" text-anchor="middle" fill="#8FA8C0" font-size="10">No passive trickle - not convertible</text>

  <line x1="290" y1="135" x2="360" y2="135" stroke="#FFC65C" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Bar -->
  <rect x="365" y="100" width="395" height="70" rx="8" fill="url(#box)" stroke="#FFC65C" stroke-width="1.4" filter="url(#shadow)"/>
  <text x="562" y="124" text-anchor="middle" fill="#FFC65C" font-weight="700" font-size="13">Station Prestige Level</text>
  <rect x="385" y="136" width="355" height="16" rx="8" fill="#16202c" stroke="#4a6a85" stroke-width="1"/>
  <rect x="385" y="136" width="190" height="16" rx="8" fill="url(#hdr)"/>
  <text x="562" y="163" text-anchor="middle" fill="#8FA8C0" font-size="10">early levels fast - later levels slow (long tail)</text>

  <line x1="562" y1="170" x2="562" y2="214" stroke="#FFC65C" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Rewards -->
  <text x="400" y="240" text-anchor="middle" fill="#C8D6E8" font-size="12" font-weight="700">Random Reward on Level-Up</text>

  <rect x="60" y="258" width="210" height="84" rx="8" fill="url(#box)" stroke="#4a90d9" stroke-width="1.3" filter="url(#shadow)"/>
  <text x="165" y="286" text-anchor="middle" fill="#4a90d9" font-weight="700" font-size="12">Decoration Elements</text>
  <text x="165" y="308" text-anchor="middle" fill="#8FA8C0" font-size="10">Cosmetic parts for a</text>
  <text x="165" y="324" text-anchor="middle" fill="#8FA8C0" font-size="10">finished, showcase base</text>

  <rect x="295" y="258" width="210" height="84" rx="8" fill="url(#box)" stroke="#00D4AA" stroke-width="1.3" filter="url(#shadow)"/>
  <text x="400" y="286" text-anchor="middle" fill="#00D4AA" font-weight="700" font-size="12">Tech Points</text>
  <text x="400" y="308" text-anchor="middle" fill="#8FA8C0" font-size="10">Backfill leftover research</text>
  <text x="400" y="324" text-anchor="middle" fill="#8FA8C0" font-size="10">after rushing the campaign</text>

  <rect x="530" y="258" width="210" height="84" rx="8" fill="url(#box)" stroke="#FFC65C" stroke-width="1.3" filter="url(#shadow)"/>
  <text x="635" y="286" text-anchor="middle" fill="#FFC65C" font-weight="700" font-size="12">Random Rewards</text>
  <text x="635" y="308" text-anchor="middle" fill="#8FA8C0" font-size="10">Further rolled payouts</text>
  <text x="635" y="324" text-anchor="middle" fill="#8FA8C0" font-size="10">(hint: resource nodes?)</text>

  <!-- decision -->
  <rect x="140" y="380" width="520" height="60" rx="8" fill="#1E3A2E" stroke="#00D4AA" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="400" y="404" text-anchor="middle" fill="#00D4AA" font-weight="700" font-size="12">Optional By Design - No Fail State, No Penalty For Skipping</text>
  <text x="400" y="426" text-anchor="middle" fill="#C8D6E8" font-size="11">Engage for cosmetics + passive research, or ignore it entirely</text>

  <!-- routine -->
  <text x="400" y="480" text-anchor="middle" fill="#8FA8C0" font-size="11" font-weight="600">Efficient Routine</text>
  <rect x="60" y="496" width="150" height="50" rx="8" fill="url(#box)" stroke="#4a6a85" stroke-width="1" filter="url(#shadow)"/>
  <text x="135" y="526" text-anchor="middle" fill="#C8D6E8" font-size="10">Check board first</text>

  <rect x="228" y="496" width="150" height="50" rx="8" fill="url(#box)" stroke="#4a6a85" stroke-width="1" filter="url(#shadow)"/>
  <text x="303" y="526" text-anchor="middle" fill="#C8D6E8" font-size="10">Let automation clear it</text>

  <rect x="396" y="496" width="150" height="50" rx="8" fill="url(#box)" stroke="#4a6a85" stroke-width="1" filter="url(#shadow)"/>
  <text x="471" y="526" text-anchor="middle" fill="#C8D6E8" font-size="10">Collect + level</text>

  <rect x="564" y="496" width="150" height="50" rx="8" fill="url(#box)" stroke="#4a6a85" stroke-width="1" filter="url(#shadow)"/>
  <text x="639" y="526" text-anchor="middle" fill="#C8D6E8" font-size="10">Spend on showcase</text>

  <text x="400" y="588" text-anchor="middle" fill="#6A8AAA" font-size="10" font-style="italic">Beta build - curve and reward tables provisional until the stable 1.1.2.0 release</text>
</svg>
