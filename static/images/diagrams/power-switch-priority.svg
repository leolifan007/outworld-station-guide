<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A2533"/>
      <stop offset="100%" stop-color="#0f1a24"/>
    </linearGradient>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00D4AA"/>
      <stop offset="100%" stop-color="#00b894"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3044"/>
      <stop offset="100%" stop-color="#162535"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a6a85"/>
    </marker>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="800" height="620" fill="url(#bg)" rx="8"/>
  <rect x="20" y="20" width="760" height="44" rx="4" fill="url(#hdr)"/>
  <text x="400" y="49" text-anchor="middle" fill="#0f1a24" font-weight="700" font-size="16">Power Switch and Priority - Missing Features and Layout Fixes</text>

  <!-- Wrong panel -->
  <rect x="30" y="84" width="360" height="200" rx="8" fill="url(#box)" stroke="#e74c3c" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="210" y="110" text-anchor="middle" fill="#e74c3c" font-weight="700" font-size="14">What the game does NOT have</text>
  <text x="55" y="138" fill="#C8D6E8" font-size="11">X  No on/off switch item</text>
  <text x="55" y="160" fill="#C8D6E8" font-size="11">X  No per-zone power cut toggle</text>
  <text x="55" y="182" fill="#C8D6E8" font-size="11">X  No per-pipe or per-cable isolation</text>
  <text x="55" y="204" fill="#C8D6E8" font-size="11">X  No consumer priority setting</text>
  <text x="55" y="226" fill="#C8D6E8" font-size="11">X  No automatic load shedding</text>
  <text x="210" y="258" text-anchor="middle" fill="#FFB347" font-size="11">Blackout = manual disconnect, one by one</text>

  <!-- Right panel -->
  <rect x="410" y="84" width="360" height="200" rx="8" fill="url(#box)" stroke="#00D4AA" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="590" y="110" text-anchor="middle" fill="#00D4AA" font-weight="700" font-size="14">What you control instead</text>
  <text x="435" y="138" fill="#C8D6E8" font-size="11">+  Which buildings share a branch</text>
  <text x="435" y="160" fill="#C8D6E8" font-size="11">+  Where circuit breakers sit</text>
  <text x="435" y="182" fill="#C8D6E8" font-size="11">+  Which tier is shed first</text>
  <text x="435" y="204" fill="#C8D6E8" font-size="11">+  Which bus is never shed</text>
  <text x="435" y="226" fill="#C8D6E8" font-size="11">+  Manual bypass for restart</text>
  <text x="590" y="258" text-anchor="middle" fill="#00D4AA" font-size="11">Priority = topology, not a menu</text>

  <!-- Shed order flow -->
  <rect x="30" y="304" width="740" height="66" rx="8" fill="url(#box)" stroke="#4a90d9" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="400" y="328" text-anchor="middle" fill="#4a90d9" font-weight="700" font-size="13">Load-shed order - disconnect in this sequence</text>
  <rect x="50" y="338" width="130" height="22" rx="4" fill="#162535" stroke="#e74c3c" stroke-width="1.2"/>
  <text x="115" y="353" text-anchor="middle" fill="#e74c3c" font-size="10">1 Decor / comfort</text>
  <rect x="200" y="338" width="140" height="22" rx="4" fill="#162535" stroke="#FFB347" stroke-width="1.2"/>
  <text x="270" y="353" text-anchor="middle" fill="#FFB347" font-size="10">2 Sacrificial production</text>
  <rect x="360" y="338" width="130" height="22" rx="4" fill="#162535" stroke="#FFB347" stroke-width="1.2"/>
  <text x="425" y="353" text-anchor="middle" fill="#FFB347" font-size="10">3 Expansion builds</text>
  <rect x="510" y="338" width="140" height="22" rx="4" fill="#162535" stroke="#4a90d9" stroke-width="1.2"/>
  <text x="580" y="353" text-anchor="middle" fill="#4a90d9" font-size="10">4 Production line (last)</text>
  <rect x="670" y="338" width="80" height="22" rx="4" fill="#1E3A2E" stroke="#00D4AA" stroke-width="1.2"/>
  <text x="710" y="353" text-anchor="middle" fill="#00D4AA" font-size="10">Critical: never</text>

  <!-- Tier diagram -->
  <rect x="30" y="390" width="740" height="210" rx="8" fill="url(#box)" stroke="#4a6a85" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="400" y="414" text-anchor="middle" fill="#C8D6E8" font-weight="700" font-size="13">Simulate priority with three tiers</text>

  <rect x="70" y="432" width="200" height="70" rx="6" fill="#1E3A2E" stroke="#00D4AA" stroke-width="1.5"/>
  <text x="170" y="456" text-anchor="middle" fill="#00D4AA" font-size="12" font-weight="600">Critical bus</text>
  <text x="170" y="476" text-anchor="middle" fill="#6A8AAA" font-size="10">oxygen, reactor cooling,</text>
  <text x="170" y="490" text-anchor="middle" fill="#6A8AAA" font-size="10">controls</text>

  <rect x="300" y="432" width="200" height="70" rx="6" fill="#162535" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="400" y="456" text-anchor="middle" fill="#4a90d9" font-size="12" font-weight="600">Production branch</text>
  <text x="400" y="476" text-anchor="middle" fill="#6A8AAA" font-size="10">smelters, assemblers,</text>
  <text x="400" y="490" text-anchor="middle" fill="#6A8AAA" font-size="10">main belts</text>

  <rect x="530" y="432" width="200" height="70" rx="6" fill="#3A2E1E" stroke="#FFB347" stroke-width="1.5"/>
  <text x="630" y="456" text-anchor="middle" fill="#FFB347" font-size="12" font-weight="600">Sacrificial branch</text>
  <text x="630" y="476" text-anchor="middle" fill="#6A8AAA" font-size="10">decor, backup production,</text>
  <text x="630" y="490" text-anchor="middle" fill="#6A8AAA" font-size="10">new builds</text>

  <text x="400" y="535" text-anchor="middle" fill="#C8D6E8" font-size="11">Separate branches, each behind a breaker. Disconnect the branch you can afford to lose.</text>
  <text x="400" y="558" text-anchor="middle" fill="#6A8AAA" font-size="10">Never put a shed-able block in series with the critical bus. Reconnect in reverse order.</text>
  <text x="400" y="582" text-anchor="middle" fill="#00D4AA" font-size="10">Higher priority = further from the shed-first branch</text>
</svg>
