<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 760" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A2533"/>
      <stop offset="100%" stop-color="#0f1a24"/>
    </linearGradient>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00D4AA"/>
      <stop offset="100%" stop-color="#00b894"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3044"/>
      <stop offset="100%" stop-color="#162535"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a6a85"/>
    </marker>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="800" height="760" fill="url(#bg)" rx="8"/>
  <rect x="20" y="20" width="760" height="44" rx="4" fill="url(#hdr)"/>
  <text x="400" y="49" text-anchor="middle" fill="#0f1a24" font-weight="700" font-size="16">v1.1.1.0 Patch Highlights - July 22, 2026</text>

  <!-- Fixes column -->
  <rect x="30" y="84" width="360" height="330" rx="8" fill="url(#box)" stroke="#4a90d9" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="210" y="108" text-anchor="middle" fill="#4a90d9" font-weight="700" font-size="14">17 Bug Fixes</text>
  <text x="48" y="132" fill="#C8D6E8" font-size="11">&#8226; Save/load: ship icons persist</text>
  <text x="48" y="152" fill="#C8D6E8" font-size="11">&#8226; Save/load: no phantom reactor anim</text>
  <text x="48" y="172" fill="#C8D6E8" font-size="11">&#8226; Save/load: quantum filters persist</text>
  <text x="48" y="192" fill="#C8D6E8" font-size="11">&#8226; Radioactive objects stop radiating</text>
  <text x="48" y="212" fill="#C8D6E8" font-size="11">&#8226; Multiplayer: grab/waypoint/copy sync</text>
  <text x="48" y="232" fill="#C8D6E8" font-size="11">&#8226; Pipe conflicts no longer corrupt</text>
  <text x="48" y="252" fill="#C8D6E8" font-size="11">&#8226; Pipe connectors orientation fixed</text>
  <text x="48" y="272" fill="#C8D6E8" font-size="11">&#8226; Building no longer detonates shells</text>
  <text x="48" y="292" fill="#C8D6E8" font-size="11">&#8226; Void spawns at correct positions</text>
  <text x="48" y="312" fill="#C8D6E8" font-size="11">&#8226; Off-screen markers accurate</text>
  <text x="48" y="332" fill="#C8D6E8" font-size="11">&#8226; UI titles + distant glass flicker</text>
  <text x="48" y="352" fill="#C8D6E8" font-size="11">&#8226; Italian language added</text>
  <text x="48" y="380" fill="#6A8AAA" font-size="10" font-style="italic">+ more minor stability fixes</text>

  <!-- Features column -->
  <rect x="410" y="84" width="360" height="330" rx="8" fill="url(#box)" stroke="#00D4AA" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="590" y="108" text-anchor="middle" fill="#00D4AA" font-weight="700" font-size="14">9 New Features</text>
  <text x="428" y="132" fill="#C8D6E8" font-size="11">&#8226; Blueprint folders + renaming</text>
  <text x="428" y="152" fill="#C8D6E8" font-size="11">&#8226; Advanced freighter overview view</text>
  <text x="428" y="172" fill="#C8D6E8" font-size="11">&#8226; Item EXCLUSION filters</text>
  <text x="428" y="192" fill="#C8D6E8" font-size="11">&#8226; Per-minute rate presets</text>
  <text x="428" y="212" fill="#C8D6E8" font-size="11">&#8226; Calculator copy-to-clipboard</text>
  <text x="428" y="232" fill="#C8D6E8" font-size="11">&#8226; NEW: De-Energized Matter recipe</text>
  <text x="428" y="252" fill="#C8D6E8" font-size="11">&#8226; NEW: Carbon Nano-Conductors</text>
  <text x="428" y="272" fill="#C8D6E8" font-size="11">&#8226; Factory sound volume slider</text>
  <text x="428" y="292" fill="#C8D6E8" font-size="11">&#8226; Rift extractors: no radiation</text>

  <!-- Bottom callout -->
  <rect x="30" y="434" width="740" height="80" rx="8" fill="#1E3A2E" stroke="#00D4AA" stroke-width="1" filter="url(#shadow)"/>
  <text x="400" y="458" text-anchor="middle" fill="#00D4AA" font-weight="700" font-size="13">No Recipe Rebalance - Your v1.1 Ratios Are Still Correct</text>
  <text x="400" y="480" text-anchor="middle" fill="#C8D6E8" font-size="11">Diamond, Nitronic, Oxygen, Superalloy, Hub 90/min, Recycler pool - all unchanged</text>
  <text x="400" y="500" text-anchor="middle" fill="#6A8AAA" font-size="10">Still present: 540 items/min logistics cap + smelter speed bug (dev investigating)</text>

  <!-- Flow -->
  <rect x="200" y="540" width="400" height="46" rx="8" fill="url(#box)" stroke="#4a6a85" stroke-width="1" filter="url(#shadow)"/>
  <text x="400" y="561" text-anchor="middle" fill="#C8D6E8" font-size="12" font-weight="600">Should You Update?</text>
  <text x="400" y="577" text-anchor="middle" fill="#00D4AA" font-size="11">YES - back up save, then update</text>

  <rect x="200" y="610" width="400" height="46" rx="8" fill="url(#box)" stroke="#4a6a85" stroke-width="1" filter="url(#shadow)"/>
  <text x="400" y="631" text-anchor="middle" fill="#C8D6E8" font-size="12" font-weight="600">What's Next</text>
  <text x="400" y="647" text-anchor="middle" fill="#C8D6E8" font-size="11">GeForce NOW live Aug 6 - smelter fix in v1.1.1.1/v1.2?</text>

  <line x1="400" y1="586" x2="400" y2="608" stroke="#4a6a85" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
