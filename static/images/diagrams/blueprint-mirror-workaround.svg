<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A2533"/>
      <stop offset="100%" stop-color="#0f1a24"/>
    </linearGradient>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00D4AA"/>
      <stop offset="100%" stop-color="#00b894"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3044"/>
      <stop offset="100%" stop-color="#162535"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a6a85"/>
    </marker>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="800" height="620" fill="url(#bg)" rx="8"/>
  <rect x="20" y="20" width="760" height="44" rx="4" fill="url(#hdr)"/>
  <text x="400" y="49" text-anchor="middle" fill="#0f1a24" font-weight="700" font-size="16">Blueprint Mirror Guide - No Flip, Only Rotation</text>

  <!-- Panel 1: Wrong -->
  <rect x="30" y="84" width="360" height="230" rx="8" fill="url(#box)" stroke="#e74c3c" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="210" y="110" text-anchor="middle" fill="#e74c3c" font-weight="700" font-size="14">Wrong: paste and rotate only</text>

  <rect x="60" y="132" width="120" height="70" rx="6" fill="#22182A" stroke="#4a6a85" stroke-width="1.2"/>
  <text x="120" y="160" text-anchor="middle" fill="#C8D6E8" font-size="11">Left half</text>
  <text x="120" y="178" text-anchor="middle" fill="#00D4AA" font-size="10">ports point IN</text>

  <rect x="240" y="132" width="120" height="70" rx="6" fill="#22182A" stroke="#e74c3c" stroke-width="1.2"/>
  <text x="300" y="160" text-anchor="middle" fill="#C8D6E8" font-size="11">Right half</text>
  <text x="300" y="178" text-anchor="middle" fill="#e74c3c" font-size="10">ports point OUT</text>

  <line x1="180" y1="167" x2="240" y2="167" stroke="#4a6a85" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="210" y="228" text-anchor="middle" fill="#6A8AAA" font-size="10">Rotation turns the stamp 90 deg; it never</text>
  <text x="210" y="244" text-anchor="middle" fill="#6A8AAA" font-size="10">reverses handedness. Belts/ports stay backwards.</text>
  <text x="210" y="278" text-anchor="middle" fill="#e74c3c" font-size="11">Result: one half feeds into the void</text>

  <!-- Panel 2: Right -->
  <rect x="410" y="84" width="360" height="230" rx="8" fill="url(#box)" stroke="#00D4AA" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="590" y="110" text-anchor="middle" fill="#00D4AA" font-weight="700" font-size="14">Right: pre-bake L and R stamps</text>

  <rect x="440" y="132" width="120" height="70" rx="6" fill="#1E3A2E" stroke="#00D4AA" stroke-width="1.2"/>
  <text x="500" y="158" text-anchor="middle" fill="#00D4AA" font-size="11" font-weight="600">Smelter-L</text>
  <text x="500" y="176" text-anchor="middle" fill="#6A8AAA" font-size="9">ports point IN</text>

  <rect x="620" y="132" width="120" height="70" rx="6" fill="#1E3A2E" stroke="#00D4AA" stroke-width="1.2"/>
  <text x="680" y="158" text-anchor="middle" fill="#00D4AA" font-size="11" font-weight="600">Smelter-R</text>
  <text x="680" y="176" text-anchor="middle" fill="#6A8AAA" font-size="9">ports point IN</text>

  <line x1="560" y1="167" x2="620" y2="167" stroke="#4a6a85" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="590" y="228" text-anchor="middle" fill="#6A8AAA" font-size="10">Fix handedness once, save each half,</text>
  <text x="590" y="244" text-anchor="middle" fill="#6A8AAA" font-size="10">then paste both with no fixing ever again.</text>
  <text x="590" y="278" text-anchor="middle" fill="#00D4AA" font-size="11">Result: symmetric block in two pastes</text>

  <!-- Middle arrow -->
  <line x1="330" y1="330" x2="470" y2="330" stroke="#4a6a85" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Decision tree -->
  <rect x="30" y="348" width="740" height="250" rx="8" fill="url(#box)" stroke="#4a90d9" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="400" y="374" text-anchor="middle" fill="#4a90d9" font-weight="700" font-size="14">Decision Tree: which workaround to use</text>

  <rect x="60" y="392" width="200" height="64" rx="6" fill="#162535" stroke="#4a6a85" stroke-width="1.2"/>
  <text x="160" y="414" text-anchor="middle" fill="#C8D6E8" font-size="11" font-weight="600">Will you paste it 2+ times?</text>
  <text x="160" y="434" text-anchor="middle" fill="#6A8AAA" font-size="10">smelter halls, battery rows,</text>
  <text x="160" y="448" text-anchor="middle" fill="#6A8AAA" font-size="10">turret lines</text>

  <line x1="260" y1="412" x2="300" y2="412" stroke="#4a6a85" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="280" y="404" text-anchor="middle" fill="#00D4AA" font-size="9">yes</text>

  <rect x="300" y="392" width="200" height="64" rx="6" fill="#1E3A2E" stroke="#00D4AA" stroke-width="1.5"/>
  <text x="400" y="416" text-anchor="middle" fill="#00D4AA" font-size="11" font-weight="600">Pre-bake L/R halves</text>
  <text x="400" y="436" text-anchor="middle" fill="#6A8AAA" font-size="10">2 blueprints, paste-ready</text>

  <line x1="160" y1="456" x2="160" y2="486" stroke="#4a6a85" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="176" y="478" fill="#e74c3c" font-size="9">no</text>

  <rect x="60" y="486" width="200" height="60" rx="6" fill="#162535" stroke="#FFB347" stroke-width="1.5"/>
  <text x="160" y="510" text-anchor="middle" fill="#FFB347" font-size="11" font-weight="600">Manual mirror</text>
  <text x="160" y="530" text-anchor="middle" fill="#6A8AAA" font-size="10">rotate, then fix ports by hand</text>

  <rect x="540" y="392" width="200" height="64" rx="6" fill="#162535" stroke="#4a90d9" stroke-width="1.2"/>
  <text x="640" y="414" text-anchor="middle" fill="#C8D6E8" font-size="11" font-weight="600">Do halves do different jobs?</text>
  <text x="640" y="434" text-anchor="middle" fill="#6A8AAA" font-size="10">smelt vs assemble,</text>
  <text x="640" y="448" text-anchor="middle" fill="#6A8AAA" font-size="10">pipe-heavy layouts</text>

  <rect x="560" y="486" width="200" height="60" rx="6" fill="#162535" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="660" y="510" text-anchor="middle" fill="#4a90d9" font-size="11" font-weight="600">Asymmetric-but-balanced</text>
  <text x="660" y="530" text-anchor="middle" fill="#6A8AAA" font-size="10">match output rate, not shape</text>

  <line x1="640" y1="456" x2="640" y2="486" stroke="#4a6a85" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="614" y="560" text-anchor="middle" fill="#6A8AAA" font-size="10">Keep each L/R pair in one v1.1.1.0 blueprint folder so mirrored variants never mix.</text>
</svg>
