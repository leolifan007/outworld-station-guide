<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A2533"/>
      <stop offset="100%" stop-color="#0f1a24"/>
    </linearGradient>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00D4AA"/>
      <stop offset="100%" stop-color="#00b894"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3044"/>
      <stop offset="100%" stop-color="#162535"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a6a85"/>
    </marker>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="800" height="620" fill="url(#bg)" rx="8"/>
  <rect x="20" y="20" width="760" height="44" rx="4" fill="url(#hdr)"/>
  <text x="400" y="49" text-anchor="middle" fill="#0f1a24" font-weight="700" font-size="16">Pipe Direction and Flow - Wrong Manifold vs Dedicated Runs</text>

  <!-- Wrong panel -->
  <rect x="30" y="84" width="360" height="220" rx="8" fill="url(#box)" stroke="#e74c3c" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="210" y="110" text-anchor="middle" fill="#e74c3c" font-weight="700" font-size="14">Wrong: shared manifold</text>

  <rect x="70" y="130" width="80" height="34" rx="5" fill="#22182A" stroke="#4a6a85" stroke-width="1.2"/>
  <text x="110" y="152" text-anchor="middle" fill="#C8D6E8" font-size="10">Source</text>

  <line x1="150" y1="147" x2="270" y2="147" stroke="#4a6a85" stroke-width="3"/>
  <circle cx="200" cy="147" r="4" fill="#4a6a85"/>
  <circle cx="240" cy="147" r="4" fill="#4a6a85"/>

  <line x1="200" y1="147" x2="200" y2="196" stroke="#4a6a85" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="240" y1="147" x2="240" y2="196" stroke="#4a6a85" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="170" y="196" width="60" height="30" rx="5" fill="#1E3A2E" stroke="#00D4AA" stroke-width="1.2"/>
  <text x="200" y="215" text-anchor="middle" fill="#00D4AA" font-size="9">gets all</text>
  <rect x="210" y="196" width="60" height="30" rx="5" fill="#3A1E1E" stroke="#e74c3c" stroke-width="1.2"/>
  <text x="240" y="215" text-anchor="middle" fill="#e74c3c" font-size="9">starves</text>

  <text x="210" y="252" text-anchor="middle" fill="#6A8AAA" font-size="10">No even split. Nearest / shortest /</text>
  <text x="210" y="268" text-anchor="middle" fill="#6A8AAA" font-size="10">highest-tier branch takes the flow.</text>
  <text x="210" y="292" text-anchor="middle" fill="#e74c3c" font-size="10">Cannot force direction or balance it.</text>

  <!-- Right panel -->
  <rect x="410" y="84" width="360" height="220" rx="8" fill="url(#box)" stroke="#00D4AA" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="590" y="110" text-anchor="middle" fill="#00D4AA" font-weight="700" font-size="14">Right: dedicated parallel runs</text>

  <rect x="450" y="130" width="80" height="34" rx="5" fill="#1E3A2E" stroke="#00D4AA" stroke-width="1.2"/>
  <text x="490" y="152" text-anchor="middle" fill="#00D4AA" font-size="10">Source</text>

  <line x1="530" y1="140" x2="680" y2="140" stroke="#00D4AA" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="530" y1="160" x2="680" y2="160" stroke="#00D4AA" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="680" y="126" width="60" height="28" rx="5" fill="#162535" stroke="#4a90d9" stroke-width="1.2"/>
  <text x="710" y="144" text-anchor="middle" fill="#4a90d9" font-size="9">fixed flow</text>
  <rect x="680" y="162" width="60" height="28" rx="5" fill="#162535" stroke="#4a90d9" stroke-width="1.2"/>
  <text x="710" y="180" text-anchor="middle" fill="#4a90d9" font-size="9">fixed flow</text>

  <text x="590" y="222" text-anchor="middle" fill="#6A8AAA" font-size="10">Each line is a known quantity.</text>
  <text x="590" y="238" text-anchor="middle" fill="#6A8AAA" font-size="10">Tuning one does not disturb others.</text>
  <rect x="500" y="252" width="180" height="26" rx="5" fill="#1E3A2E" stroke="#00D4AA" stroke-width="1.2"/>
  <text x="590" y="270" text-anchor="middle" fill="#00D4AA" font-size="10">Direction is unambiguous per run</text>

  <line x1="330" y1="318" x2="470" y2="318" stroke="#4a6a85" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Flow control tricks -->
  <rect x="30" y="336" width="740" height="262" rx="8" fill="url(#box)" stroke="#4a90d9" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="400" y="362" text-anchor="middle" fill="#4a90d9" font-weight="700" font-size="13">Four tricks to control direction and distribution</text>

  <rect x="50" y="376" width="350" height="98" rx="6" fill="#162535" stroke="#4a90d9" stroke-width="1.2"/>
  <text x="225" y="398" text-anchor="middle" fill="#4a90d9" font-size="11" font-weight="600">1 Dedicated source-to-sink runs</text>
  <text x="70" y="420" fill="#C8D6E8" font-size="10">One source, one sink, one pipe - no ambiguity.</text>
  <text x="70" y="438" fill="#C8D6E8" font-size="10">No branch steals from another.</text>
  <text x="70" y="462" fill="#6A8AAA" font-size="10">Fluid version of separate belts to separate machines.</text>

  <rect x="410" y="376" width="340" height="98" rx="6" fill="#162535" stroke="#4a90d9" stroke-width="1.2"/>
  <text x="580" y="398" text-anchor="middle" fill="#4a90d9" font-size="11" font-weight="600">2 Distinct sources per flow</text>
  <text x="430" y="420" fill="#C8D6E8" font-size="10">Direction becomes a property of the source.</text>
  <text x="430" y="438" fill="#C8D6E8" font-size="10">Dedicated source to each consumer group.</text>
  <text x="430" y="462" fill="#6A8AAA" font-size="10">Merged sources fight; keep feeds separate.</text>

  <rect x="50" y="484" width="350" height="98" rx="6" fill="#162535" stroke="#FFB347" stroke-width="1.2"/>
  <text x="225" y="506" text-anchor="middle" fill="#FFB347" font-size="11" font-weight="600">3 Buffer tanks as flow gates</text>
  <text x="70" y="528" fill="#C8D6E8" font-size="10">Fills before passing fluid on.</text>
  <text x="70" y="546" fill="#C8D6E8" font-size="10">Anchors pressure and stages release.</text>
  <text x="70" y="570" fill="#6A8AAA" font-size="10">Closest thing to a direction control.</text>

  <rect x="410" y="484" width="340" height="98" rx="6" fill="#1E3A2E" stroke="#00D4AA" stroke-width="1.2"/>
  <text x="580" y="506" text-anchor="middle" fill="#00D4AA" font-size="11" font-weight="600">4 Parallel lines, not a manifold</text>
  <text x="430" y="528" fill="#C8D6E8" font-size="10">To split evenly, do not split at all.</text>
  <text x="430" y="546" fill="#C8D6E8" font-size="10">Build parallel dedicated lines instead.</text>
  <text x="430" y="570" fill="#6A8AAA" font-size="10">Each line is a known, tunable quantity.</text>
</svg>
