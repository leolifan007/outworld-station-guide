<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A2533"/>
      <stop offset="100%" stop-color="#0f1a24"/>
    </linearGradient>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00D4AA"/>
      <stop offset="100%" stop-color="#00b894"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3044"/>
      <stop offset="100%" stop-color="#162535"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a6a85"/>
    </marker>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="800" height="560" fill="url(#bg)" rx="8"/>
  <rect x="20" y="20" width="760" height="44" rx="4" fill="url(#hdr)"/>
  <text x="400" y="49" text-anchor="middle" fill="#0f1a24" font-weight="700" font-size="16">Carbon Nano-Conductors - Before vs After (v1.1.1.0)</text>

  <!-- Before -->
  <rect x="30" y="84" width="360" height="180" rx="8" fill="url(#box)" stroke="#e74c3c" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="210" y="108" text-anchor="middle" fill="#e74c3c" font-weight="700" font-size="14">Before (v1.1.0)</text>
  <rect x="60" y="126" width="150" height="40" rx="6" fill="#162535" stroke="#4a6a85" stroke-width="1"/>
  <text x="135" y="146" text-anchor="middle" fill="#C8D6E8" font-size="10">Rare conductors</text>
  <text x="135" y="160" text-anchor="middle" fill="#6A8AAA" font-size="9">(limited source)</text>
  <rect x="240" y="126" width="120" height="40" rx="6" fill="#162535" stroke="#4a6a85" stroke-width="1"/>
  <text x="300" y="146" text-anchor="middle" fill="#C8D6E8" font-size="10">Circuits</text>
  <text x="300" y="160" text-anchor="middle" fill="#6A8AAA" font-size="9">(always hungry)</text>
  <line x1="210" y1="146" x2="238" y2="146" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="196" width="300" height="48" rx="6" fill="#3A2E1E" stroke="#FFB347" stroke-width="1"/>
  <text x="210" y="215" text-anchor="middle" fill="#FFB347" font-size="10" font-weight="600">Everything stalls when rare</text>
  <text x="210" y="231" text-anchor="middle" fill="#FFB347" font-size="10" font-weight="600">source runs dry</text>

  <!-- After -->
  <rect x="410" y="84" width="360" height="180" rx="8" fill="url(#box)" stroke="#00D4AA" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="590" y="108" text-anchor="middle" fill="#00D4AA" font-weight="700" font-size="14">After (v1.1.1.0)</text>
  <rect x="440" y="126" width="130" height="40" rx="6" fill="#162535" stroke="#00D4AA" stroke-width="1"/>
  <text x="505" y="146" text-anchor="middle" fill="#C8D6E8" font-size="10">Carbon line</text>
  <text x="505" y="160" text-anchor="middle" fill="#6A8AAA" font-size="9">(abundant)</text>
  <rect x="600" y="126" width="140" height="40" rx="6" fill="#1E3A2E" stroke="#00D4AA" stroke-width="1.5"/>
  <text x="670" y="146" text-anchor="middle" fill="#00D4AA" font-size="10" font-weight="600">Nano-Conductor</text>
  <text x="670" y="160" text-anchor="middle" fill="#00D4AA" font-size="10" font-weight="600">converter</text>
  <line x1="570" y1="146" x2="598" y2="146" stroke="#4a6a85" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="440" y="196" width="300" height="48" rx="6" fill="#162535" stroke="#4a6a85" stroke-width="1"/>
  <text x="590" y="215" text-anchor="middle" fill="#C8D6E8" font-size="10">Circuits: bulk, always-on</text>
  <text x="590" y="231" text-anchor="middle" fill="#C8D6E8" font-size="10">Rare conductors: high-tier only</text>

  <!-- Flow bottom -->
  <rect x="200" y="290" width="400" height="46" rx="8" fill="url(#box)" stroke="#4a6a85" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="400" y="311" text-anchor="middle" fill="#C8D6E8" font-size="12" font-weight="600">Ratio: 1 converter per circuit assembler</text>
  <text x="400" y="327" text-anchor="middle" fill="#6A8AAA" font-size="10">Buffer output in storage network - monitor 30 min</text>

  <rect x="200" y="360" width="400" height="46" rx="8" fill="#1E3A2E" stroke="#00D4AA" stroke-width="1" filter="url(#shadow)"/>
  <text x="400" y="381" text-anchor="middle" fill="#00D4AA" font-size="12" font-weight="600">Unlock: Matter / Advanced Materials branch</text>
  <text x="400" y="397" text-anchor="middle" fill="#6A8AAA" font-size="10">Same tier as De-Energized Matter (v1.1.1.0)</text>

  <rect x="200" y="430" width="400" height="46" rx="8" fill="url(#box)" stroke="#4a6a85" stroke-width="1" filter="url(#shadow)"/>
  <text x="400" y="451" text-anchor="middle" fill="#C8D6E8" font-size="12" font-weight="600">Mistake to avoid: rushing conversion</text>
  <text x="400" y="467" text-anchor="middle" fill="#6A8AAA" font-size="10">Check recipe card - secondary input varies by save</text>

  <rect x="200" y="500" width="400" height="40" rx="8" fill="url(#box)" stroke="#f0c040" stroke-width="1" filter="url(#shadow)"/>
  <text x="400" y="525" text-anchor="middle" fill="#f0c040" font-size="12" font-weight="600">Verdict: the anti-bottleneck recipe - carbon in, circuits out</text>
</svg>
