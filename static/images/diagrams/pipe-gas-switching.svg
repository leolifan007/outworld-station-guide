<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 660" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A2533"/>
      <stop offset="100%" stop-color="#0f1a24"/>
    </linearGradient>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00D4AA"/>
      <stop offset="100%" stop-color="#00b894"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3044"/>
      <stop offset="100%" stop-color="#162535"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#00D4AA"/>
    </marker>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="800" height="660" fill="url(#bg)" rx="8"/>
  <rect x="20" y="20" width="760" height="44" rx="4" fill="url(#hdr)"/>
  <text x="400" y="49" text-anchor="middle" fill="#0f1a24" font-weight="700" font-size="16">Pipe Gas Switching - Empty Lines, No Venting (v1.1.2.0)</text>

  <!-- OLD -->
  <rect x="40" y="90" width="340" height="250" rx="8" fill="url(#box)" stroke="#FF9B9B" stroke-width="1.3" filter="url(#shadow)"/>
  <text x="210" y="116" text-anchor="middle" fill="#FF9B9B" font-weight="700" font-size="13">Before v1.1.2.0</text>

  <rect x="70" y="134" width="280" height="40" rx="6" fill="#16202c" stroke="#4a6a85" stroke-width="1"/>
  <text x="210" y="159" text-anchor="middle" fill="#C8D6E8" font-size="11">Drain the line</text>
  <line x1="210" y1="174" x2="210" y2="190" stroke="#4a6a85" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="70" y="192" width="280" height="40" rx="6" fill="#16202c" stroke="#4a6a85" stroke-width="1"/>
  <text x="210" y="217" text-anchor="middle" fill="#C8D6E8" font-size="11">VENT the pipe (extra step)</text>
  <line x1="210" y1="232" x2="210" y2="248" stroke="#4a6a85" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="70" y="250" width="280" height="40" rx="6" fill="#16202c" stroke="#4a6a85" stroke-width="1"/>
  <text x="210" y="275" text-anchor="middle" fill="#C8D6E8" font-size="11">Assign new gas/liquid</text>
  <text x="210" y="316" text-anchor="middle" fill="#FF9B9B" font-size="10" font-style="italic">3 steps - slow refactor ritual</text>

  <!-- NEW -->
  <rect x="420" y="90" width="340" height="250" rx="8" fill="url(#box)" stroke="#00D4AA" stroke-width="1.3" filter="url(#shadow)"/>
  <text x="590" y="116" text-anchor="middle" fill="#00D4AA" font-weight="700" font-size="13">v1.1.2.0</text>

  <rect x="450" y="134" width="280" height="40" rx="6" fill="#16202c" stroke="#4a6a85" stroke-width="1"/>
  <text x="590" y="159" text-anchor="middle" fill="#C8D6E8" font-size="11">Drain the line to empty</text>
  <line x1="590" y1="174" x2="590" y2="198" stroke="#00D4AA" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="450" y="200" width="280" height="40" rx="6" fill="#16202c" stroke="#00D4AA" stroke-width="1.3"/>
  <text x="590" y="225" text-anchor="middle" fill="#00D4AA" font-size="11">Assign new gas/liquid - DONE</text>
  <text x="590" y="286" text-anchor="middle" fill="#00D4AA" font-size="10" font-style="italic">2 steps - no vent required</text>
  <text x="590" y="316" text-anchor="middle" fill="#8FA8C0" font-size="10">Pipe must still be EMPTY</text>

  <!-- Rules -->
  <rect x="40" y="362" width="720" height="86" rx="8" fill="#1E2E3A" stroke="#4a90d9" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="400" y="386" text-anchor="middle" fill="#4a90d9" font-weight="700" font-size="12">What Is Still Blocked</text>
  <text x="400" y="410" text-anchor="middle" fill="#C8D6E8" font-size="11">Pipe WITH contents to a new type - still requires emptying first</text>
  <text x="400" y="432" text-anchor="middle" fill="#C8D6E8" font-size="11">Partially filled pipes - still blocked from switching</text>

  <!-- Risks -->
  <text x="400" y="482" text-anchor="middle" fill="#8FA8C0" font-size="11" font-weight="600">Watch For (guardrails are gone)</text>
  <rect x="60" y="498" width="210" height="66" rx="8" fill="url(#box)" stroke="#FFB347" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="165" y="524" text-anchor="middle" fill="#FFB347" font-weight="700" font-size="11">Cross-contamination</text>
  <text x="165" y="544" text-anchor="middle" fill="#8FA8C0" font-size="10">Verify zero contents first</text>

  <rect x="295" y="498" width="210" height="66" rx="8" fill="url(#box)" stroke="#FFB347" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="400" y="524" text-anchor="middle" fill="#FFB347" font-weight="700" font-size="11">Stale routing</text>
  <text x="400" y="544" text-anchor="middle" fill="#8FA8C0" font-size="10">Re-label after every switch</text>

  <rect x="530" y="498" width="210" height="66" rx="8" fill="url(#box)" stroke="#FFB347" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="635" y="524" text-anchor="middle" fill="#FFB347" font-weight="700" font-size="11">Mixer upset</text>
  <text x="635" y="544" text-anchor="middle" fill="#8FA8C0" font-size="10">Flush before the mixer</text>

  <text x="400" y="606" text-anchor="middle" fill="#00D4AA" font-size="11" font-weight="600">Result: refactor a fluid network in a fraction of the old time</text>
  <text x="400" y="628" text-anchor="middle" fill="#6A8AAA" font-size="10" font-style="italic">Beta build, September 2026</text>
</svg>
