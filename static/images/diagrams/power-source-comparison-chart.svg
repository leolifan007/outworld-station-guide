<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A2533"/>
      <stop offset="100%" stop-color="#0f1a24"/>
    </linearGradient>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00D4AA"/>
      <stop offset="100%" stop-color="#00b894"/>
    </linearGradient>
  </defs>
  <rect width="800" height="460" fill="url(#bg)" rx="8"/>
  <rect x="20" y="20" width="760" height="40" rx="4" fill="url(#hdr)"/>
  <text x="400" y="47" text-anchor="middle" fill="#0f1a24" font-weight="700" font-size="15">Power Source Comparison — Solar vs Fusion vs Antimatter</text>
  
  <!-- Solar column -->
  <rect x="30" y="80" width="230" height="260" rx="6" fill="#1e3044" stroke="#00D4AA" stroke-width="1.5"/>
  <text x="145" y="105" text-anchor="middle" fill="#00D4AA" font-weight="700" font-size="15">Solar + Battery</text>
  <text x="145" y="125" text-anchor="middle" fill="#aabbcc" font-size="11">Levels 1-6</text>
  <text x="145" y="150" text-anchor="middle" fill="#8899aa" font-size="10">Cost: 15 Steel + 5 El per panel</text>
  <text x="145" y="168" text-anchor="middle" fill="#8899aa" font-size="10">Output: 8 MW (day) / 0 (night)</text>
  <text x="145" y="186" text-anchor="middle" fill="#8899aa" font-size="10">Battery: 40 MW storage</text>
  <text x="145" y="210" text-anchor="middle" fill="#f0c040" font-size="20" font-weight="700">32 MW</text>
  <text x="145" y="228" text-anchor="middle" fill="#aabbcc" font-size="11">Peak (6 panels + 2 bat)</text>
  
  <rect x="50" y="245" width="190" height="40" rx="4" fill="#162535" stroke="#4a6a85" stroke-width="0.5"/>
  <text x="145" y="261" text-anchor="middle" fill="#00D4AA" font-size="10">Pros: Free fuel</text>
  <text x="145" y="277" text-anchor="middle" fill="#e74c3c" font-size="10">Cons: Night cycle gap</text>
  
  <rect x="50" y="295" width="190" height="35" rx="4" fill="#0d5a4a" stroke="#00D4AA" stroke-width="0.5"/>
  <text x="145" y="316" text-anchor="middle" fill="#00D4AA" font-size="11">Best for: Quick start</text>
  
  <!-- Fusion column -->
  <rect x="285" y="80" width="230" height="260" rx="6" fill="#1e3044" stroke="#f0c040" stroke-width="1.5"/>
  <text x="400" y="105" text-anchor="middle" fill="#f0c040" font-weight="700" font-size="15">Fusion Reactor</text>
  <text x="400" y="125" text-anchor="middle" fill="#aabbcc" font-size="11">Levels 7-11</text>
  <text x="400" y="150" text-anchor="middle" fill="#8899aa" font-size="10">Cost: 200 Steel + 80 El + 30 SA</text>
  <text x="400" y="168" text-anchor="middle" fill="#8899aa" font-size="10">Output: 80 MW constant</text>
  <text x="400" y="186" text-anchor="middle" fill="#8899aa" font-size="10">Fuel: 3H + 2He per min</text>
  <text x="400" y="210" text-anchor="middle" fill="#f0c040" font-size="20" font-weight="700">80 MW</text>
  <text x="400" y="228" text-anchor="middle" fill="#aabbcc" font-size="11">Constant, 24/7</text>
  
  <rect x="305" y="245" width="190" height="40" rx="4" fill="#162535" stroke="#4a6a85" stroke-width="0.5"/>
  <text x="400" y="261" text-anchor="middle" fill="#00D4AA" font-size="10">Pros: Stable 24/7</text>
  <text x="400" y="277" text-anchor="middle" fill="#e74c3c" font-size="10">Cons: Needs gas supply</text>
  
  <rect x="305" y="295" width="190" height="35" rx="4" fill="#0d5a4a" stroke="#00D4AA" stroke-width="0.5"/>
  <text x="400" y="316" text-anchor="middle" fill="#00D4AA" font-size="11">Best for: Main power</text>
  
  <!-- Antimatter column -->
  <rect x="540" y="80" width="230" height="260" rx="6" fill="#1e3044" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="655" y="105" text-anchor="middle" fill="#e74c3c" font-weight="700" font-size="15">Antimatter Cell</text>
  <text x="655" y="125" text-anchor="middle" fill="#aabbcc" font-size="11">Levels 12+</text>
  <text x="655" y="150" text-anchor="middle" fill="#8899aa" font-size="10">Cost: 120 SA + 60 El (reusable)</text>
  <text x="655" y="168" text-anchor="middle" fill="#8899aa" font-size="10">Output: 200 MW burst</text>
  <text x="655" y="186" text-anchor="middle" fill="#8899aa" font-size="10">Recharge: 3 min/cell</text>
  <text x="655" y="210" text-anchor="middle" fill="#f0c040" font-size="20" font-weight="700">200 MW</text>
  <text x="655" y="228" text-anchor="middle" fill="#aabbcc" font-size="11">Burst (20s)</text>
  
  <rect x="560" y="245" width="190" height="40" rx="4" fill="#162535" stroke="#4a6a85" stroke-width="0.5"/>
  <text x="655" y="261" text-anchor="middle" fill="#00D4AA" font-size="10">Pros: Massive burst</text>
  <text x="655" y="277" text-anchor="middle" fill="#e74c3c" font-size="10">Cons: 3 min cooldown</text>
  
  <rect x="560" y="295" width="190" height="35" rx="4" fill="#0d5a4a" stroke="#00D4AA" stroke-width="0.5"/>
  <text x="655" y="316" text-anchor="middle" fill="#00D4AA" font-size="11">Best for: Burst loads</text>
  
  <!-- Hybrid recommendation -->
  <rect x="30" y="360" width="740" height="80" rx="6" fill="#0d5a4a" stroke="#00D4AA" stroke-width="1.5"/>
  <text x="400" y="383" text-anchor="middle" fill="#00D4AA" font-weight="700" font-size="14">Recommended Endgame Hybrid (Level 15+)</text>
  <text x="400" y="405" text-anchor="middle" fill="#aabbcc" font-size="11">5 Solar + 2 Battery + 1 Fusion + 1 Antimatter Cell = 250+ MW hybrid</text>
  
  <rect x="120" y="418" width="120" height="16" rx="3" fill="#00D4AA" opacity="0.5"/>
  <text x="180" y="430" text-anchor="middle" fill="#fff" font-size="9">Solar: 40 MW day</text>
  <rect x="260" y="418" width="100" height="16" rx="3" fill="#f0c040" opacity="0.5"/>
  <text x="310" y="430" text-anchor="middle" fill="#fff" font-size="9">Fusion: 80 MW</text>
  <rect x="380" y="418" width="120" height="16" rx="3" fill="#e74c3c" opacity="0.5"/>
  <text x="440" y="430" text-anchor="middle" fill="#fff" font-size="9">Antimatter: 200 burst</text>
  <rect x="520" y="418" width="140" height="16" rx="3" fill="#4a90d9" opacity="0.5"/>
  <text x="590" y="430" text-anchor="middle" fill="#fff" font-size="9">Battery: 80 MW store</text>
</svg>
