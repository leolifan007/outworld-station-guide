<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 260" style="background:#1A2533;border-radius:8px;font-family:'Segoe UI',Arial,sans-serif;">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A5F;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#162D4A;stop-opacity:1"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#00D4AA"/>
    </marker>
  </defs>

  <text x="350" y="25" text-anchor="middle" fill="#C8D6E8" font-size="14" font-weight="bold">Scaling with Parallel Forges</text>

  <!-- Supply Line -->
  <rect x="30" y="55" width="140" height="35" rx="6" fill="url(#boxGrad)" stroke="#00D4AA" stroke-width="1.5"/>
  <text x="100" y="76" text-anchor="middle" fill="#00D4AA" font-size="11" font-weight="bold">📦 Tungsten Supply</text>

  <!-- Buffer -->
  <rect x="220" y="55" width="100" height="35" rx="6" fill="url(#boxGrad)" stroke="#4A9EFF" stroke-width="1.5"/>
  <text x="270" y="76" text-anchor="middle" fill="#4A9EFF" font-size="10">Input Buffer</text>

  <line x1="170" y1="72" x2="220" y2="72" stroke="#00D4AA" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Fork lines to 4 forges -->
  <line x1="320" y1="72" x2="380" y2="72" stroke="#00D4AA" stroke-width="1.5"/>
  <line x1="380" y1="72" x2="380" y2="102" stroke="#00D4AA" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="380" y1="72" x2="380" y2="140" stroke="#00D4AA" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="380" y1="72" x2="380" y2="178" stroke="#00D4AA" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="380" y1="72" x2="380" y2="216" stroke="#00D4AA" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Forge 1 -->
  <rect x="390" y="88" width="110" height="30" rx="6" fill="url(#boxGrad)" stroke="#00D4AA" stroke-width="1.5"/>
  <text x="445" y="107" text-anchor="middle" fill="#00D4AA" font-size="10" font-weight="bold">⚙️ Forge 1</text>

  <!-- Forge 2 -->
  <rect x="390" y="126" width="110" height="30" rx="6" fill="url(#boxGrad)" stroke="#00D4AA" stroke-width="1.5"/>
  <text x="445" y="145" text-anchor="middle" fill="#00D4AA" font-size="10" font-weight="bold">⚙️ Forge 2</text>

  <!-- Forge 3 -->
  <rect x="390" y="164" width="110" height="30" rx="6" fill="url(#boxGrad)" stroke="#00D4AA" stroke-width="1.5"/>
  <text x="445" y="183" text-anchor="middle" fill="#00D4AA" font-size="10" font-weight="bold">⚙️ Forge 3</text>

  <!-- Forge 4 -->
  <rect x="390" y="202" width="110" height="30" rx="6" fill="url(#boxGrad)" stroke="#00D4AA" stroke-width="1.5"/>
  <text x="445" y="221" text-anchor="middle" fill="#00D4AA" font-size="10" font-weight="bold">⚙️ Forge 4</text>

  <!-- Output arrows -->
  <line x1="500" y1="103" x2="540" y2="103" stroke="#00D4AA" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="500" y1="141" x2="540" y2="141" stroke="#00D4AA" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="500" y1="179" x2="540" y2="179" stroke="#00D4AA" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="500" y1="217" x2="540" y2="217" stroke="#00D4AA" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Shared output -->
  <rect x="550" y="103" width="130" height="115" rx="6" fill="url(#boxGrad)" stroke="#FFB347" stroke-width="1.5"/>
  <text x="615" y="155" text-anchor="middle" fill="#FFB347" font-size="11" font-weight="bold">📦 Shared</text>
  <text x="615" y="172" text-anchor="middle" fill="#FFB347" font-size="11" font-weight="bold">Output Buffer</text>
  <text x="615" y="195" text-anchor="middle" fill="#6A8AAA" font-size="9">All forges feed</text>
  <text x="615" y="208" text-anchor="middle" fill="#6A8AAA" font-size="9">the same buffer</text>

  <text x="350" y="248" text-anchor="middle" fill="#4A6070" font-size="9">Parallel Superalloy Forge Array — Outworld Station Guide</text>
</svg>
