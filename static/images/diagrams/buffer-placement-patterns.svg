<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300">
  <rect width="600" height="300" fill="#1A2533" rx="8"/>
  <text x="300" y="30" fill="#00D4AA" font-family="Arial,sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Buffer Placement Patterns</text>

  <!-- Pattern 1 -->
  <g transform="translate(10, 55)">
    <text x="0" y="0" fill="#4ECDC4" font-family="Arial,sans-serif" font-size="12" font-weight="bold">Pattern 1: Output Buffer</text>
    <rect x="0" y="10" width="60" height="28" fill="#2A3F55" rx="4" stroke="#8899AA" stroke-width="1"/>
    <text x="30" y="29" fill="#8899AA" font-family="Arial,sans-serif" font-size="9" text-anchor="middle">Smelter</text>
    <line x1="60" y1="24" x2="85" y2="24" stroke="#B0C4D8" stroke-width="1.5" marker-end="url(#aG)"/>
    <rect x="85" y="10" width="50" height="28" fill="#1E3045" rx="4" stroke="#FFD93D" stroke-width="2"/>
    <text x="110" y="29" fill="#FFD93D" font-family="Arial,sans-serif" font-size="9" text-anchor="middle">Buffer</text>
    <line x1="135" y1="24" x2="160" y2="24" stroke="#B0C4D8" stroke-width="1.5" marker-end="url(#aG)"/>
    <rect x="160" y="10" width="60" height="28" fill="#2A3F55" rx="4" stroke="#8899AA" stroke-width="1"/>
    <text x="190" y="29" fill="#8899AA" font-family="Arial,sans-serif" font-size="9" text-anchor="middle">Assembler</text>
  </g>

  <!-- Pattern 2 -->
  <g transform="translate(10, 115)">
    <text x="0" y="0" fill="#00D4AA" font-family="Arial,sans-serif" font-size="12" font-weight="bold">Pattern 2: Input Buffer</text>
    <rect x="0" y="10" width="60" height="28" fill="#2A3F55" rx="4" stroke="#8899AA" stroke-width="1"/>
    <text x="30" y="29" fill="#8899AA" font-family="Arial,sans-serif" font-size="9" text-anchor="middle">Smelter</text>
    <line x1="60" y1="24" x2="85" y2="24" stroke="#B0C4D8" stroke-width="1.5" marker-end="url(#aG)"/>
    <rect x="85" y="0" width="50" height="50" fill="#1E3045" rx="4" stroke="#FFD93D" stroke-width="2"/>
    <text x="110" y="16" fill="#FFD93D" font-family="Arial,sans-serif" font-size="9" text-anchor="middle">Buffer</text>
    <text x="110" y="36" fill="#8899AA" font-family="Arial,sans-serif" font-size="8" text-anchor="middle">500</text>
    <line x1="135" y1="10" x2="160" y2="10" stroke="#B0C4D8" stroke-width="1.5" marker-end="url(#aG)"/>
    <line x1="135" y1="24" x2="160" y2="24" stroke="#B0C4D8" stroke-width="1.5" marker-end="url(#aG)"/>
    <line x1="135" y1="38" x2="160" y2="38" stroke="#B0C4D8" stroke-width="1.5" marker-end="url(#aG)"/>
    <rect x="160" y="0" width="50" height="22" fill="#2A3F55" rx="4" stroke="#8899AA" stroke-width="1"/>
    <text x="185" y="15" fill="#8899AA" font-family="Arial,sans-serif" font-size="9" text-anchor="middle">Assembler 1</text>
    <rect x="160" y="14" width="50" height="22" fill="#2A3F55" rx="4" stroke="#8899AA" stroke-width="1"/>
    <text x="185" y="29" fill="#8899AA" font-family="Arial,sans-serif" font-size="9" text-anchor="middle">Assembler 2</text>
    <rect x="160" y="28" width="50" height="22" fill="#2A3F55" rx="4" stroke="#8899AA" stroke-width="1"/>
    <text x="185" y="43" fill="#8899AA" font-family="Arial,sans-serif" font-size="9" text-anchor="middle">Assembler 3</text>
  </g>

  <!-- Pattern 3 -->
  <g transform="translate(10, 195)">
    <text x="0" y="0" fill="#FF6B35" font-family="Arial,sans-serif" font-size="12" font-weight="bold">Pattern 3: Throughput Buffer</text>
    <rect x="0" y="12" width="55" height="28" fill="#2A3F55" rx="4" stroke="#8899AA" stroke-width="1"/>
    <text x="28" y="31" fill="#8899AA" font-family="Arial,sans-serif" font-size="9" text-anchor="middle">Zone A</text>
    <line x1="55" y1="26" x2="75" y2="26" stroke="#B0C4D8" stroke-width="1.5"/>
    <rect x="80" y="10" width="45" height="30" fill="#1E3045" rx="4" stroke="#FFD93D" stroke-width="2"/>
    <text x="103" y="29" fill="#FFD93D" font-family="Arial,sans-serif" font-size="9" text-anchor="middle">Buf</text>
    <line x1="125" y1="26" x2="145" y2="26" stroke="#B0C4D8" stroke-width="1.5"/>
    <rect x="150" y="10" width="45" height="30" fill="#1E3045" rx="4" stroke="#FFD93D" stroke-width="2"/>
    <text x="173" y="29" fill="#FFD93D" font-family="Arial,sans-serif" font-size="9" text-anchor="middle">Buf</text>
    <line x1="195" y1="26" x2="215" y2="26" stroke="#B0C4D8" stroke-width="1.5"/>
    <rect x="220" y="12" width="55" height="28" fill="#2A3F55" rx="4" stroke="#8899AA" stroke-width="1"/>
    <text x="248" y="31" fill="#8899AA" font-family="Arial,sans-serif" font-size="9" text-anchor="middle">Zone B</text>
  </g>

  <defs>
    <marker id="aG" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto">
      <path d="M0,0 L6,2 L0,4" fill="#B0C4D8"/>
    </marker>
  </defs>
</svg>
