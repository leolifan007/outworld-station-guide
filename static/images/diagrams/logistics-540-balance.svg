<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A2533"/>
      <stop offset="100%" stop-color="#0f1a24"/>
    </linearGradient>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00D4AA"/>
      <stop offset="100%" stop-color="#00b894"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3044"/>
      <stop offset="100%" stop-color="#162535"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a6a85"/>
    </marker>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="800" height="620" fill="url(#bg)" rx="8"/>
  <rect x="20" y="20" width="760" height="44" rx="4" fill="url(#hdr)"/>
  <text x="400" y="49" text-anchor="middle" fill="#0f1a24" font-weight="700" font-size="16">Late-Game Logistics - Beating the 540 Items/Min Cap</text>

  <!-- The cap -->
  <rect x="220" y="84" width="360" height="56" rx="8" fill="#3A2E1E" stroke="#FFB347" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="400" y="106" text-anchor="middle" fill="#FFB347" font-weight="700" font-size="13">The 540 items/min Cap</text>
  <text x="400" y="126" text-anchor="middle" fill="#C8D6E8" font-size="11">Applies to belts, pipes, connectors - still in v1.1.1.0</text>

  <!-- Wrong -->
  <rect x="30" y="160" width="360" height="190" rx="8" fill="url(#box)" stroke="#e74c3c" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="210" y="184" text-anchor="middle" fill="#e74c3c" font-weight="700" font-size="14">Wrong: Shared Belt</text>
  <rect x="55" y="200" width="90" height="36" rx="6" fill="#162535" stroke="#4a6a85" stroke-width="1"/>
  <text x="100" y="222" text-anchor="middle" fill="#C8D6E8" font-size="10">Smelter 1</text>
  <rect x="165" y="200" width="90" height="36" rx="6" fill="#162535" stroke="#4a6a85" stroke-width="1"/>
  <text x="210" y="222" text-anchor="middle" fill="#C8D6E8" font-size="10">Smelter 2</text>
  <rect x="275" y="200" width="90" height="36" rx="6" fill="#162535" stroke="#4a6a85" stroke-width="1"/>
  <text x="320" y="222" text-anchor="middle" fill="#C8D6E8" font-size="10">Smelter 3</text>
  <line x1="100" y1="236" x2="210" y2="270" stroke="#e74c3c" stroke-width="1.5"/>
  <line x1="210" y1="236" x2="210" y2="270" stroke="#e74c3c" stroke-width="1.5"/>
  <line x1="320" y1="236" x2="210" y2="270" stroke="#e74c3c" stroke-width="1.5"/>
  <rect x="160" y="270" width="100" height="36" rx="6" fill="#3A2E1E" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="210" y="292" text-anchor="middle" fill="#e74c3c" font-size="10" font-weight="600">Shared belt</text>
  <text x="210" y="316" text-anchor="middle" fill="#e74c3c" font-size="10">540 cap - starving!</text>
  <text x="210" y="338" text-anchor="middle" fill="#6A8AAA" font-size="10">Merging onto one belt = one cap</text>

  <!-- Right -->
  <rect x="410" y="160" width="360" height="190" rx="8" fill="url(#box)" stroke="#00D4AA" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="590" y="184" text-anchor="middle" fill="#00D4AA" font-weight="700" font-size="14">Right: One Belt Per Machine</text>
  <rect x="435" y="200" width="90" height="36" rx="6" fill="#162535" stroke="#4a6a85" stroke-width="1"/>
  <text x="480" y="222" text-anchor="middle" fill="#C8D6E8" font-size="10">Smelter 1</text>
  <rect x="545" y="200" width="90" height="36" rx="6" fill="#162535" stroke="#4a6a85" stroke-width="1"/>
  <text x="590" y="222" text-anchor="middle" fill="#C8D6E8" font-size="10">Smelter 2</text>
  <rect x="655" y="200" width="90" height="36" rx="6" fill="#162535" stroke="#4a6a85" stroke-width="1"/>
  <text x="700" y="222" text-anchor="middle" fill="#C8D6E8" font-size="10">Smelter 3</text>
  <line x1="480" y1="236" x2="480" y2="300" stroke="#00D4AA" stroke-width="1.5"/>
  <line x1="590" y1="236" x2="590" y2="300" stroke="#00D4AA" stroke-width="1.5"/>
  <line x1="700" y1="236" x2="700" y2="300" stroke="#00D4AA" stroke-width="1.5"/>
  <rect x="440" y="300" width="90" height="30" rx="6" fill="#1E3A2E" stroke="#00D4AA" stroke-width="1"/>
  <text x="485" y="320" text-anchor="middle" fill="#00D4AA" font-size="9">Belt A</text>
  <rect x="550" y="300" width="90" height="30" rx="6" fill="#1E3A2E" stroke="#00D4AA" stroke-width="1"/>
  <text x="595" y="320" text-anchor="middle" fill="#00D4AA" font-size="9">Belt B</text>
  <rect x="660" y="300" width="90" height="30" rx="6" fill="#1E3A2E" stroke="#00D4AA" stroke-width="1"/>
  <text x="705" y="320" text-anchor="middle" fill="#00D4AA" font-size="9">Belt C</text>
  <text x="590" y="346" text-anchor="middle" fill="#6A8AAA" font-size="10">Each belt under cap - total scales</text>

  <!-- Tier map -->
  <rect x="200" y="370" width="400" height="120" rx="8" fill="url(#box)" stroke="#4a90d9" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="400" y="392" text-anchor="middle" fill="#4a90d9" font-weight="700" font-size="13">Tiered Routing - The Pro Solution</text>
  <text x="400" y="414" text-anchor="middle" fill="#C8D6E8" font-size="11">HIGH (&gt;540/min) - dedicated direct belt, machine-to-machine</text>
  <text x="400" y="434" text-anchor="middle" fill="#C8D6E8" font-size="11">MEDIUM (200-540/min) - shared belt, strict balancing</text>
  <text x="400" y="454" text-anchor="middle" fill="#C8D6E8" font-size="11">LOW (&lt;200/min) - shared bus, any convenient path</text>
  <text x="400" y="480" text-anchor="middle" fill="#6A8AAA" font-size="10">Use v1.1.1.0 per-minute presets to set 540 exactly</text>

  <!-- Do not -->
  <rect x="200" y="510" width="400" height="88" rx="8" fill="#3A2E1E" stroke="#FFB347" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="400" y="532" text-anchor="middle" fill="#FFB347" font-weight="700" font-size="12">Do NOT</text>
  <text x="400" y="552" text-anchor="middle" fill="#C8D6E8" font-size="11">- Rebuild everything at once (fix one line, verify, next)</text>
  <text x="400" y="570" text-anchor="middle" fill="#C8D6E8" font-size="11">- Assume MK3 belts bypass the cap (they do not)</text>
  <text x="400" y="588" text-anchor="middle" fill="#C8D6E8" font-size="11">- Wait for a fix - no announcement; design around it now</text>
</svg>
