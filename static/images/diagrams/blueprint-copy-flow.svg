<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280">
  <rect width="600" height="280" fill="#1A2533" rx="8"/>
  <text x="300" y="30" fill="#00D4AA" font-family="Arial,sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Blueprint Copy-Paste Flow</text>

  <!-- Source room -->
  <g transform="translate(30, 55)">
    <rect x="0" y="0" width="200" height="120" fill="#1E3045" rx="8" stroke="#00D4AA" stroke-width="2"/>
    <text x="100" y="18" fill="#00D4AA" font-family="Arial,sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Source Room</text>

    <rect x="10" y="28" width="50" height="25" fill="#2A3F55" rx="4" stroke="#8899AA" stroke-width="1.5"/>
    <text x="35" y="44" fill="#B0C4D8" font-family="Arial,sans-serif" font-size="9" text-anchor="middle">Smelter</text>
    <line x1="60" y1="40" x2="85" y2="40" stroke="#B0C4D8" stroke-width="1.5"/>
    <rect x="85" y="28" width="40" height="25" fill="#1E3045" rx="4" stroke="#FFD93D" stroke-width="1.5"/>
    <text x="105" y="44" fill="#FFD93D" font-family="Arial,sans-serif" font-size="9" text-anchor="middle">Buf</text>
    <line x1="125" y1="40" x2="145" y2="40" stroke="#B0C4D8" stroke-width="1.5"/>
    <rect x="145" y="28" width="45" height="25" fill="#2A3F55" rx="4" stroke="#8899AA" stroke-width="1.5"/>
    <text x="168" y="44" fill="#B0C4D8" font-family="Arial,sans-serif" font-size="9" text-anchor="middle">Storage</text>

    <!-- Input line -->
    <line x1="35" y1="28" x2="35" y2="8" stroke="#FF6B35" stroke-width="1.5" stroke-dasharray="4,2"/>
    <text x="10" y="70" fill="#FF6B35" font-family="Arial,sans-serif" font-size="9">Input: Manual</text>
    <text x="10" y="84" fill="#FF6B35" font-family="Arial,sans-serif" font-size="9">reconnect</text>

    <text x="18" y="105" fill="#4ECDC4" font-family="Arial,sans-serif" font-size="9">Output: Auto-copied</text>
  </g>

  <!-- Arrow -->
  <g transform="translate(230, 100)">
    <text x="0" y="0" fill="#FFD93D" font-family="Arial,sans-serif" font-size="12" font-weight="bold">Ctrl+C</text>
    <line x1="0" y1="8" x2="60" y2="8" stroke="#FFD93D" stroke-width="2" marker-end="url(#aY)"/>
    <text x="30" y="30" fill="#8899AA" font-family="Arial,sans-serif" font-size="10" text-anchor="middle">Copy</text>
  </g>

  <!-- Pasted room -->
  <g transform="translate(320, 55)">
    <rect x="0" y="0" width="200" height="120" fill="#1E3045" rx="8" stroke="#4ECDC4" stroke-width="2"/>
    <text x="100" y="18" fill="#4ECDC4" font-family="Arial,sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Pasted Room (Ctrl+V)</text>

    <rect x="10" y="28" width="50" height="25" fill="#2A3F55" rx="4" stroke="#8899AA" stroke-width="1.5"/>
    <text x="35" y="44" fill="#B0C4D8" font-family="Arial,sans-serif" font-size="9" text-anchor="middle">Smelter</text>
    <line x1="60" y1="40" x2="85" y2="40" stroke="#B0C4D8" stroke-width="1.5"/>
    <rect x="85" y="28" width="40" height="25" fill="#1E3045" rx="4" stroke="#FFD93D" stroke-width="1.5"/>
    <text x="105" y="44" fill="#FFD93D" font-family="Arial,sans-serif" font-size="9" text-anchor="middle">Buf</text>
    <line x1="125" y1="40" x2="145" y2="40" stroke="#B0C4D8" stroke-width="1.5"/>
    <rect x="145" y="28" width="45" height="25" fill="#2A3F55" rx="4" stroke="#8899AA" stroke-width="1.5"/>
    <text x="168" y="44" fill="#B0C4D8" font-family="Arial,sans-serif" font-size="9" text-anchor="middle">Storage</text>

    <!-- Input: must reconnect -->
    <line x1="35" y1="28" x2="35" y2="8" stroke="#FF6B35" stroke-width="1.5" stroke-dasharray="4,2"/>
    <text x="50" y="70" fill="#FF6B35" font-family="Arial,sans-serif" font-size="9">Input: MUST reconnect</text>
    <text x="10" y="105" fill="#4ECDC4" font-family="Arial,sans-serif" font-size="9">Output: Auto-copied</text>
  </g>

  <defs>
    <marker id="aY" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto">
      <path d="M0,0 L6,2 L0,4" fill="#FFD93D"/>
    </marker>
  </defs>
</svg>
