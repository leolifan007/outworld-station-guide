<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="100%" height="100%">
  <rect width="600" height="420" fill="#1A2533"/>
  <defs>
    <linearGradient id="starField" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A2533"/>
      <stop offset="100%" stop-color="#0F1A26"/>
    </linearGradient>
    <linearGradient id="shipGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A9EFF"/>
      <stop offset="100%" stop-color="#2A7EDF"/>
    </linearGradient>
    <linearGradient id="beamGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00D4AA" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00D4AA" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="asteroidGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6B7B8F"/>
      <stop offset="50%" stop-color="#4A5A6E"/>
      <stop offset="100%" stop-color="#3A4A5E"/>
    </linearGradient>
  </defs>

  <rect width="600" height="420" fill="url(#starField)"/>

  <!-- Stars background -->
  <g fill="#ffffff" opacity="0.15">
    <circle cx="45" cy="60" r="1"/><circle cx="120" cy="30" r="1.5"/><circle cx="200" cy="100" r="1"/>
    <circle cx="340" cy="45" r="1.5"/><circle cx="420" cy="85" r="1"/><circle cx="520" cy="40" r="1.5"/>
    <circle cx="560" cy="120" r="1"/><circle cx="30" cy="180" r="1"/><circle cx="580" cy="300" r="1.5"/>
    <circle cx="100" cy="350" r="1"/><circle cx="480" cy="380" r="1"/><circle cx="550" cy="250" r="1"/>
  </g>

  <!-- Title -->
  <text x="300" y="32" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="bold">Asteroid Towing Sequence</text>
  <line x1="150" y1="40" x2="450" y2="40" stroke="#4A9EFF" stroke-width="1.5" opacity="0.5"/>

  <!-- ====== STEP 1: Fly to asteroid ====== -->
  <g transform="translate(30,55)">
    <rect x="0" y="0" width="120" height="150" rx="8" fill="#0F1A26" stroke="#4A9EFF" stroke-width="1.5"/>
    <rect x="0" y="0" width="120" height="22" rx="8" fill="#4A9EFF"/>
    <rect x="0" y="14" width="120" height="8" rx="0" fill="#4A9EFF"/>
    <text x="60" y="16" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="9" font-weight="bold">1. Navigate To</text>

    <!-- Ship -->
    <polygon points="60,50 85,65 60,80 35,65" fill="url(#shipGrad)" stroke="#4A9EFF" stroke-width="1.5"/>
    <polygon points="60,55 72,62 60,69 48,62" fill="#00D4AA" opacity="0.3"/>
    <!-- Engine glow -->
    <circle cx="60" cy="85" r="4" fill="#FFB300" opacity="0.3"/>
    <circle cx="60" cy="85" r="2" fill="#FFB300" opacity="0.5"/>

    <!-- Asteroid -->
    <polygon points="60,130 65,125 72,127 75,133 71,139 64,140 58,137" fill="url(#asteroidGrad)" stroke="#6B7B8F" stroke-width="1"/>
    <circle cx="63" cy="131" r="1.5" fill="#2A3D4F" opacity="0.5"/>
    <circle cx="68" cy="135" r="1" fill="#2A3D4F" opacity="0.5"/>

    <!-- Trajectory -->
    <line x1="60" y1="80" x2="60" y2="125" stroke="#FFB300" stroke-width="1" stroke-dasharray="3,3"/>
    <polygon points="60,125 56,119 64,119" fill="#FFB300"/>

    <text x="60" y="148" text-anchor="middle" fill="#8A9BAE" font-family="sans-serif" font-size="8">Travel to asteroid</text>
  </g>

  <!-- Arrow 1→2 -->
  <g transform="translate(155,130)">
    <polygon points="0,0 -6,-5 -6,5" fill="#4A9EFF"/>
    <line x1="0" y1="0" x2="20" y2="0" stroke="#4A9EFF" stroke-width="2"/>
    <polygon points="20,0 14,-5 14,5" fill="#4A9EFF"/>
  </g>

  <!-- ====== STEP 2: Lock tractor beam ====== -->
  <g transform="translate(180,55)">
    <rect x="0" y="0" width="120" height="150" rx="8" fill="#0F1A26" stroke="#00D4AA" stroke-width="1.5"/>
    <rect x="0" y="0" width="120" height="22" rx="8" fill="#00D4AA"/>
    <rect x="0" y="14" width="120" height="8" rx="0" fill="#00D4AA"/>
    <text x="60" y="16" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="9" font-weight="bold">2. Lock Tractor Beam</text>

    <!-- Ship (hovering above asteroid) -->
    <polygon points="60,35 85,50 60,65 35,50" fill="url(#shipGrad)" stroke="#4A9EFF" stroke-width="1.5"/>
    <polygon points="60,40 72,47 60,54 48,47" fill="#00D4AA" opacity="0.2"/>

    <!-- Tractor beam -->
    <polygon points="55,65 50,115 70,115 65,65" fill="#00D4AA" opacity="0.12"/>
    <line x1="60" y1="65" x2="60" y2="115" stroke="#00D4AA" stroke-width="2" stroke-dasharray="4,3"/>
    <line x1="55" y1="75" x2="65" y2="75" stroke="#00D4AA" stroke-width="0.5" opacity="0.4"/>
    <line x1="54" y1="85" x2="66" y2="85" stroke="#00D4AA" stroke-width="0.5" opacity="0.4"/>
    <line x1="53" y1="95" x2="67" y2="95" stroke="#00D4AA" stroke-width="0.5" opacity="0.4"/>

    <!-- Asteroid -->
    <polygon points="60,130 65,125 72,127 75,133 71,139 64,140 58,137" fill="url(#asteroidGrad)" stroke="#6B7B8F" stroke-width="1"/>
    <!-- Lock indicator -->
    <circle cx="60" cy="133" r="2" fill="#00D4AA"/>

    <text x="60" y="148" text-anchor="middle" fill="#8A9BAE" font-family="sans-serif" font-size="8">Tractor beam engaged</text>
  </g>

  <!-- Arrow 2→3 -->
  <g transform="translate(305,130)">
    <polygon points="0,0 -6,-5 -6,5" fill="#00D4AA"/>
    <line x1="0" y1="0" x2="20" y2="0" stroke="#00D4AA" stroke-width="2"/>
    <polygon points="20,0 14,-5 14,5" fill="#00D4AA"/>
  </g>

  <!-- ====== STEP 3: Tow back ====== -->
  <g transform="translate(330,55)">
    <rect x="0" y="0" width="120" height="150" rx="8" fill="#0F1A26" stroke="#FFB300" stroke-width="1.5"/>
    <rect x="0" y="0" width="120" height="22" rx="8" fill="#FFB300"/>
    <rect x="0" y="14" width="120" height="8" rx="0" fill="#FFB300"/>
    <text x="60" y="16" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="9" font-weight="bold">3. Tow to Station</text>

    <!-- Station -->
    <rect x="25" y="25" width="30" height="20" rx="3" fill="#0F1A26" stroke="#FFB300" stroke-width="1.5"/>
    <text x="40" y="38" text-anchor="middle" fill="#FFB300" font-family="sans-serif" font-size="6">Station</text>

    <!-- Ship towing -->
    <polygon points="75,50 95,60 75,70 55,60" fill="url(#shipGrad)" stroke="#4A9EFF" stroke-width="1.5"/>
    <polygon points="75,55 84,59 75,63 66,59" fill="#00D4AA" opacity="0.2"/>

    <!-- Engine glow -->
    <circle cx="55" cy="60" r="3" fill="#FF5252" opacity="0.3"/>
    <circle cx="52" cy="60" r="1.5" fill="#FF5252" opacity="0.5"/>

    <!-- Tractor line -->
    <line x1="75" y1="60" x2="55" y2="60" stroke="#00D4AA" stroke-width="1.5" stroke-dasharray="3,2"/>

    <!-- Asteroid -->
    <polygon points="75,110 80,105 87,107 90,113 86,119 79,120 73,117" fill="url(#asteroidGrad)" stroke="#6B7B8F" stroke-width="1"/>

    <!-- Trajectory -->
    <path d="M 40,35 Q 60,20 85,60" fill="none" stroke="#FFB300" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>

    <!-- Arrow from station to asteroid -->
    <polygon points="55,55 50,60 60,60" fill="none"/>

    <text x="60" y="148" text-anchor="middle" fill="#8A9BAE" font-family="sans-serif" font-size="8">Towing in progress</text>
  </g>

  <!-- Arrow 3→4 -->
  <g transform="translate(455,130)">
    <polygon points="0,0 -6,-5 -6,5" fill="#FFB300"/>
    <line x1="0" y1="0" x2="20" y2="0" stroke="#FFB300" stroke-width="2"/>
    <polygon points="20,0 14,-5 14,5" fill="#FFB300"/>
  </g>

  <!-- ====== STEP 4: Park near drills ====== -->
  <g transform="translate(480,55)">
    <rect x="0" y="0" width="115" height="150" rx="8" fill="#0F1A26" stroke="#00D4AA" stroke-width="1.5"/>
    <rect x="0" y="0" width="115" height="22" rx="8" fill="#00D4AA"/>
    <rect x="0" y="14" width="115" height="8" rx="0" fill="#00D4AA"/>
    <text x="57" y="16" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="9" font-weight="bold">4. Park at Drills</text>

    <!-- Station -->
    <rect x="10" y="30" width="95" height="18" rx="3" fill="#0F1A26" stroke="#00D4AA" stroke-width="1"/>
    <text x="57" y="42" text-anchor="middle" fill="#00D4AA" font-family="sans-serif" font-size="7">Station Mining Zone</text>

    <!-- Drill icon -->
    <rect x="20" y="55" width="16" height="16" rx="3" fill="url(#shipGrad)" stroke="#4A9EFF" stroke-width="1"/>
    <text x="28" y="66" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="7">D</text>

    <rect x="80" y="55" width="16" height="16" rx="3" fill="url(#shipGrad)" stroke="#4A9EFF" stroke-width="1"/>
    <text x="88" y="66" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="7">D</text>

    <!-- Asteroid parked -->
    <polygon points="57,95 63,90 70,92 73,98 69,104 62,105 55,102" fill="url(#asteroidGrad)" stroke="#00D4AA" stroke-width="1.5"/>
    <circle cx="60" cy="97" r="1.5" fill="#2A3D4F" opacity="0.5"/>
    <circle cx="66" cy="100" r="1" fill="#2A3D4F" opacity="0.5"/>

    <!-- Drill beam to asteroid -->
    <line x1="28" y1="71" x2="57" y2="92" stroke="#00D4AA" stroke-width="1" stroke-dasharray="3,2" opacity="0.5"/>
    <line x1="88" y1="71" x2="67" y2="92" stroke="#00D4AA" stroke-width="1" stroke-dasharray="3,2" opacity="0.5"/>

    <!-- Checkmark -->
    <circle cx="57" cy="115" r="10" fill="none" stroke="#00D4AA" stroke-width="1.5"/>
    <polyline points="50,115 55,120 64,111" fill="none" stroke="#00D4AA" stroke-width="1.5"/>

    <text x="57" y="145" text-anchor="middle" fill="#8A9BAE" font-family="sans-serif" font-size="8">Ready to mine</text>
  </g>

  <!-- Bottom tip -->
  <rect x="40" y="230" width="520" height="32" rx="6" fill="#0F1A26" stroke="#4A9EFF" stroke-width="1"/>
  <text x="60" y="248" fill="#4A9EFF" font-family="sans-serif" font-size="10" font-weight="bold">💡 Tip:</text>
  <text x="120" y="248" fill="#B0C4DE" font-family="sans-serif" font-size="10">Tractor beam speed scales with ship tier. T2 hauler tows 40% faster than T1.</text>
  <text x="60" y="260" fill="#8A9BAE" font-family="sans-serif" font-size="9">Each towing cycle takes ~90s. Prioritize high-yield asteroids (visible via scanner).</text>
</svg>