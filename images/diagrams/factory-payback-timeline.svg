<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" style="background:#1A2533;border-radius:8px;font-family:'Segoe UI',Arial,sans-serif;">
  <defs>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D4AA;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1E8A6A;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFB347;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#CC8820;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF6B6B;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#CC4444;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <text x="360" y="30" text-anchor="middle" fill="#00D4AA" font-size="16" font-weight="bold">Mk 2 Upgrade Payback Timeline (Hours to Recoup Investment)</text>

  <!-- Mk 2 Smelter -->
  <text x="100" y="65" text-anchor="end" fill="#C8D6E8" font-size="11">Mk 2 Smelter</text>
  <rect x="110" y="52" width="90" height="22" rx="4" fill="url(#greenGrad)"/>
  <text x="205" y="68" fill="#00D4AA" font-size="10" font-weight="bold">~45 min</text>

  <!-- Mk 2 Plasma Forge -->
  <text x="100" y="95" text-anchor="end" fill="#C8D6E8" font-size="11">Mk 2 Plasma Forge</text>
  <rect x="110" y="82" width="90" height="22" rx="4" fill="url(#greenGrad)"/>
  <text x="205" y="98" fill="#00D4AA" font-size="10" font-weight="bold">~47 min</text>

  <!-- Mk 2 Atomizer -->
  <text x="100" y="125" text-anchor="end" fill="#C8D6E8" font-size="11">Mk 2 Atomizer</text>
  <rect x="110" y="112" width="150" height="22" rx="4" fill="url(#yellowGrad)"/>
  <text x="265" y="128" fill="#FFB347" font-size="10" font-weight="bold">~1.2 hrs</text>

  <!-- Mk 2 Fabricator -->
  <text x="100" y="155" text-anchor="end" fill="#C8D6E8" font-size="11">Mk 2 Fabricator</text>
  <rect x="110" y="142" width="180" height="22" rx="4" fill="url(#yellowGrad)"/>
  <text x="295" y="158" fill="#FFB347" font-size="10" font-weight="bold">~1.5 hrs</text>

  <!-- Mk 2 Refinery -->
  <text x="100" y="185" text-anchor="end" fill="#C8D6E8" font-size="11">Mk 2 Refinery</text>
  <rect x="110" y="172" width="200" height="22" rx="4" fill="url(#yellowGrad)"/>
  <text x="315" y="188" fill="#FFB347" font-size="10" font-weight="bold">~1.8 hrs</text>

  <!-- Mk 2 Matter Printer -->
  <text x="100" y="215" text-anchor="end" fill="#C8D6E8" font-size="11">Mk 2 Matter Printer</text>
  <rect x="110" y="202" width="260" height="22" rx="4" fill="url(#yellowGrad)"/>
  <text x="375" y="218" fill="#FFB347" font-size="10" font-weight="bold">~2.5 hrs</text>

  <!-- Mk 3 Bio-extractor -->
  <text x="100" y="245" text-anchor="end" fill="#C8D6E8" font-size="11">Mk 3 Bio-extractor</text>
  <rect x="110" y="232" width="140" height="22" rx="4" fill="url(#greenGrad)"/>
  <text x="255" y="248" fill="#00D4AA" font-size="10" font-weight="bold">~1 hr (5x output!)</text>

  <!-- Mk 2 Fusion Reactor -->
  <text x="100" y="275" text-anchor="end" fill="#C8D6E8" font-size="11">Mk 2 Fusion Reactor</text>
  <rect x="110" y="262" width="460" height="22" rx="4" fill="url(#redGrad)"/>
  <text x="575" y="278" fill="#FF6B6B" font-size="10" font-weight="bold">~8+ hrs (Skip!)</text>

  <!-- Scale -->
  <rect x="30" y="300" width="660" height="40" rx="8" fill="#1E3A5F" stroke="#6A8AAA" stroke-width="1"/>
  <text x="360" y="328" text-anchor="middle" fill="#8AACCD" font-size="10">Time scale: 0 min  |  1 hr  |  2 hr  |  3 hr  |  4 hr  |  5 hr  |  6 hr  |  7 hr  |  8+ hr</text>

  <text x="360" y="350" text-anchor="middle" fill="#4A6070" font-size="9">Outworld Station Guide - Mk 2 &amp; Mk 3 Factory v1.1</text>
</svg>