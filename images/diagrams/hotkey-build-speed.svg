<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280">
  <rect width="600" height="280" fill="#1A2533" rx="8"/>
  <text x="300" y="30" fill="#00D4AA" font-family="Arial,sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Building Speed: Mouse-Only vs Keyboard Shortcuts</text>

  <!-- Bars -->
  <g transform="translate(60, 60)">
    <!-- Y axis -->
    <line x1="30" y1="0" x2="30" y2="170" stroke="#8899AA" stroke-width="1.5"/>
    <!-- X axis -->
    <line x1="30" y1="170" x2="500" y2="170" stroke="#8899AA" stroke-width="1.5"/>

    <!-- Y labels -->
    <text x="22" y="172" fill="#8899AA" font-family="Arial,sans-serif" font-size="10" text-anchor="end">0s</text>
    <text x="22" y="87" fill="#8899AA" font-family="Arial,sans-serif" font-size="10" text-anchor="end">20s</text>
    <text x="22" y="3" fill="#8899AA" font-family="Arial,sans-serif" font-size="10" text-anchor="end">40s</text>

    <!-- Single building -->
    <rect x="50" y="120" width="70" height="50" fill="#2A3F55" rx="4" stroke="#8899AA" stroke-width="1"/>
    <text x="85" y="180" fill="#B0C4D8" font-family="Arial,sans-serif" font-size="10" text-anchor="middle" font-weight="bold">Single Building</text>
    <!-- Mouse-only -->
    <rect x="55" y="148" width="28" height="22" fill="#FF6B35" rx="2" opacity="0.8"/>
    <text x="69" y="144" fill="#FF6B35" font-family="Arial,sans-serif" font-size="8" text-anchor="middle">8s</text>
    <!-- With keys -->
    <rect x="87" y="154" width="28" height="16" fill="#00D4AA" rx="2" opacity="0.8"/>
    <text x="101" y="150" fill="#00D4AA" font-family="Arial,sans-serif" font-size="8" text-anchor="middle">4s</text>

    <!-- Smelter row (6 buildings) -->
    <rect x="160" y="120" width="90" height="50" fill="#2A3F55" rx="4" stroke="#8899AA" stroke-width="1"/>
    <text x="205" y="180" fill="#B0C4D8" font-family="Arial,sans-serif" font-size="10" text-anchor="middle" font-weight="bold">6 Smelters</text>
    <rect x="165" y="170" width="35" height="0" fill="#FF6B35" rx="2" opacity="0.8"/>
    <text x="183" y="167" fill="#FF6B35" font-family="Arial,sans-serif" font-size="8" text-anchor="middle">38s</text>
    <rect x="210" y="154" width="35" height="16" fill="#00D4AA" rx="2" opacity="0.8"/>
    <text x="228" y="150" fill="#00D4AA" font-family="Arial,sans-serif" font-size="8" text-anchor="middle">8s</text>

    <!-- Connector network -->
    <rect x="290" y="120" width="100" height="50" fill="#2A3F55" rx="4" stroke="#8899AA" stroke-width="1"/>
    <text x="340" y="180" fill="#B0C4D8" font-family="Arial,sans-serif" font-size="10" text-anchor="middle" font-weight="bold">12 Connectors</text>
    <rect x="295" y="170" width="42" height="0" fill="#FF6B35" rx="2" opacity="0.8"/>
    <text x="316" y="167" fill="#FF6B35" font-family="Arial,sans-serif" font-size="8" text-anchor="middle">50s</text>
    <rect x="345" y="148" width="42" height="22" fill="#00D4AA" rx="2" opacity="0.8"/>
    <text x="366" y="144" fill="#00D4AA" font-family="Arial,sans-serif" font-size="8" text-anchor="middle">12s</text>

    <!-- Full room -->
    <rect x="430" y="120" width="60" height="50" fill="#2A3F55" rx="4" stroke="#8899AA" stroke-width="1"/>
    <text x="460" y="180" fill="#B0C4D8" font-family="Arial,sans-serif" font-size="10" text-anchor="middle" font-weight="bold">Room</text>
    <rect x="435" y="170" width="24" height="0" fill="#FF6B35" rx="2" opacity="0.8"/>
    <text x="447" y="167" fill="#FF6B35" font-family="Arial,sans-serif" font-size="8" text-anchor="middle">120s</text>
    <rect x="463" y="148" width="24" height="22" fill="#00D4AA" rx="2" opacity="0.8"/>
    <text x="475" y="144" fill="#00D4AA" font-family="Arial,sans-serif" font-size="8" text-anchor="middle">30s</text>
  </g>

  <!-- Legend -->
  <g transform="translate(60, 230)">
    <rect x="0" y="0" width="14" height="14" fill="#FF6B35" rx="2" opacity="0.8"/>
    <text x="20" y="12" fill="#B0C4D8" font-family="Arial,sans-serif" font-size="11">Mouse-Only</text>
    <rect x="150" y="0" width="14" height="14" fill="#00D4AA" rx="2" opacity="0.8"/>
    <text x="170" y="12" fill="#B0C4D8" font-family="Arial,sans-serif" font-size="11">With Keyboard Shortcuts</text>
  </g>
</svg>
