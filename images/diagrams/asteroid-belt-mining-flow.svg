<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" fill="none">
  <rect width="800" height="320" fill="#1A2533" rx="12"/>
  
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" fill="#00D4AA" font-size="16" font-family="system-ui,sans-serif" font-weight="600">Asteroid Belt Mining Flow</text>
  
  <!-- Node icon -->
  <rect x="30" y="70" width="120" height="80" rx="10" fill="#2A3F55"/>
  <text x="90" y="100" text-anchor="middle" fill="#E8A838" font-size="14" font-family="monospace">Ore Node</text>
  <text x="90" y="120" text-anchor="middle" fill="#8899AA" font-size="11" font-family="monospace">80% Purity</text>
  <text x="90" y="138" text-anchor="middle" fill="#8899AA" font-size="11" font-family="monospace">30 ore/sec</text>
  
  <!-- Arrow 1 -->
  <line x1="150" y1="110" x2="210" y2="110" stroke="#00D4AA" stroke-width="2.5"/>
  <polygon points="208,104 218,110 208,116" fill="#00D4AA"/>
  
  <!-- Miner -->
  <rect x="215" y="70" width="130" height="80" rx="10" fill="#3A6B5A"/>
  <text x="280" y="105" text-anchor="middle" fill="#FFFFFF" font-size="14" font-family="monospace" font-weight="600">Miner Module</text>
  <text x="280" y="125" text-anchor="middle" fill="#AAD4CA" font-size="11" font-family="monospace">Tier 1</text>
  
  <!-- Arrow 2 -->
  <line x1="345" y1="110" x2="405" y2="110" stroke="#00D4AA" stroke-width="2.5"/>
  <polygon points="403,104 413,110 403,116" fill="#00D4AA"/>
  
  <!-- Belt -->
  <rect x="410" y="70" width="100" height="80" rx="10" fill="#2A3F55"/>
  <text x="460" y="105" text-anchor="middle" fill="#8899AA" font-size="13" font-family="monospace">Belt</text>
  <text x="460" y="125" text-anchor="middle" fill="#8899AA" font-size="11" font-family="monospace">Conveyor</text>
  
  <!-- Arrow 3 -->
  <line x1="510" y1="110" x2="560" y2="110" stroke="#00D4AA" stroke-width="2.5"/>
  <polygon points="558,104 568,110 558,116" fill="#00D4AA"/>
  
  <!-- Buffer -->
  <rect x="565" y="70" width="100" height="80" rx="10" fill="#2A3F55"/>
  <text x="615" y="105" text-anchor="middle" fill="#E8A838" font-size="13" font-family="monospace">Buffer</text>
  <text x="615" y="125" text-anchor="middle" fill="#8899AA" font-size="11" font-family="monospace">Storage</text>
  
  <!-- Arrow 4 -->
  <line x1="665" y1="110" x2="725" y2="110" stroke="#00D4AA" stroke-width="2.5"/>
  <polygon points="723,104 733,110 723,116" fill="#00D4AA"/>
  
  <!-- Launcher -->
  <rect x="730" y="55" width="60" height="110" rx="10" fill="#6B3A6B"/>
  <text x="760" y="105" text-anchor="middle" fill="#FFFFFF" font-size="11" font-family="monospace">Cargo</text>
  <text x="760" y="120" text-anchor="middle" fill="#FFFFFF" font-size="11" font-family="monospace">Launcher</text>
  <text x="760" y="140" text-anchor="middle" fill="#CCAACC" font-size="10" font-family="monospace">-&gt; Station</text>

  <!-- Power note -->
  <rect x="215" y="175" width="200" height="35" rx="6" fill="#1E2D40" stroke="#8899AA" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="315" y="197" text-anchor="middle" fill="#8899AA" font-size="11" font-family="monospace">Power: miner 60kW + launcher 40kW</text>

  <!-- Tip -->
  <rect x="30" y="230" width="740" height="65" rx="8" fill="#1E2D40" stroke="#00D4AA" stroke-width="1"/>
  <text x="50" y="255" fill="#00D4AA" font-size="12" font-family="system-ui,sans-serif" font-weight="600">Tip</text>
  <text x="90" y="255" fill="#AAD4CA" font-size="12" font-family="system-ui,sans-serif">Set launcher production rule: "Maintain 200 ore in station storage."</text>
  <text x="50" y="278" fill="#8899AA" font-size="11" font-family="system-ui,sans-serif">Place two solar panels per miner-launcher pair. No external power grid needed.</text>
</svg>
