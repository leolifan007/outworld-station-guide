<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" style="background:#1A2533;border-radius:8px;font-family:'Segoe UI',Arial,sans-serif;">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A5F;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#162D4A;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="400" y="32" text-anchor="middle" fill="#C8D6E8" font-size="18" font-weight="bold">Station Defense Layout</text>

  <!-- Station (center) -->
  <rect x="320" y="130" width="160" height="100" rx="12" fill="url(#boxGrad)" stroke="#00D4AA" stroke-width="2"/>
  <text x="400" y="165" text-anchor="middle" fill="#00D4AA" font-size="14" font-weight="bold">🛸 Station Core</text>
  <text x="400" y="185" text-anchor="middle" fill="#8AACCD" font-size="11">Smelters, Refineries,</text>
  <text x="400" y="200" text-anchor="middle" fill="#8AACCD" font-size="11">Superalloy Forges</text>
  <text x="400" y="218" text-anchor="middle" fill="#6A8AAA" font-size="10">Most valuable buildings here</text>

  <!-- Drone Bay 1 (top-left) -->
  <rect x="120" y="55" width="130" height="55" rx="8" fill="url(#boxGrad)" stroke="#FF6B6B" stroke-width="2"/>
  <text x="185" y="78" text-anchor="middle" fill="#FF6B6B" font-size="13" font-weight="bold">🛡 Drone Bay A</text>
  <text x="185" y="98" text-anchor="middle" fill="#8AACCD" font-size="11">Patrol: NW perimeter</text>

  <!-- Drone Bay 2 (top-right) -->
  <rect x="550" y="55" width="130" height="55" rx="8" fill="url(#boxGrad)" stroke="#FF6B6B" stroke-width="2"/>
  <text x="615" y="78" text-anchor="middle" fill="#FF6B6B" font-size="13" font-weight="bold">🛡 Drone Bay B</text>
  <text x="615" y="98" text-anchor="middle" fill="#8AACCD" font-size="11">Patrol: NE perimeter</text>

  <!-- Drone Bay 3 (bottom-left) -->
  <rect x="120" y="275" width="130" height="55" rx="8" fill="url(#boxGrad)" stroke="#FF6B6B" stroke-width="2"/>
  <text x="185" y="298" text-anchor="middle" fill="#FF6B6B" font-size="13" font-weight="bold">🛡 Drone Bay C</text>
  <text x="185" y="318" text-anchor="middle" fill="#8AACCD" font-size="11">Patrol: SW perimeter</text>

  <!-- Drone Bay 4 (bottom-right) -->
  <rect x="550" y="275" width="130" height="55" rx="8" fill="url(#boxGrad)" stroke="#FF6B6B" stroke-width="2"/>
  <text x="615" y="298" text-anchor="middle" fill="#FF6B6B" font-size="13" font-weight="bold">🛡 Drone Bay D</text>
  <text x="615" y="318" text-anchor="middle" fill="#8AACCD" font-size="11">Patrol: SE perimeter</text>

  <!-- Patrol circles (dashed) -->
  <circle cx="185" cy="150" r="70" fill="none" stroke="#FF6B6B" stroke-width="1" stroke-dasharray="6,4" opacity="0.4"/>
  <circle cx="615" cy="150" r="70" fill="none" stroke="#FF6B6B" stroke-width="1" stroke-dasharray="6,4" opacity="0.4"/>
  <circle cx="185" cy="340" r="70" fill="none" stroke="#FF6B6B" stroke-width="1" stroke-dasharray="6,4" opacity="0.4"/>
  <circle cx="615" cy="340" r="70" fill="none" stroke="#FF6B6B" stroke-width="1" stroke-dasharray="6,4" opacity="0.4"/>

  <!-- Overlap highlight -->
  <ellipse cx="400" cy="245" rx="40" ry="25" fill="#00D4AA" opacity="0.12"/>
  <text x="400" y="248" text-anchor="middle" fill="#00D4AA" font-size="10" font-weight="bold">Overlap</text>
  <text x="400" y="260" text-anchor="middle" fill="#00D4AA" font-size="9">Protection Zone</text>

  <!-- Missile Turret positions -->
  <rect x="270" y="80" width="100" height="40" rx="6" fill="url(#boxGrad)" stroke="#FFB347" stroke-width="1.5"/>
  <text x="320" y="100" text-anchor="middle" fill="#FFB347" font-size="11" font-weight="bold">🔫 Turret 1</text>
  <text x="320" y="114" text-anchor="middle" fill="#8AACCD" font-size="9">Ammo buffer: 50+</text>

  <rect x="430" y="280" width="100" height="40" rx="6" fill="url(#boxGrad)" stroke="#FFB347" stroke-width="1.5"/>
  <text x="480" y="300" text-anchor="middle" fill="#FFB347" font-size="11" font-weight="bold">🔫 Turret 2</text>
  <text x="480" y="314" text-anchor="middle" fill="#8AACCD" font-size="9">Ammo buffer: 50+</text>

  <!-- Ion Cannon (endgame) -->
  <rect x="355" y="360" width="90" height="35" rx="6" fill="url(#boxGrad)" stroke="#D4A0FF" stroke-width="1.5"/>
  <text x="400" y="382" text-anchor="middle" fill="#D4A0FF" font-size="11" font-weight="bold">⚡ Ion Cannon</text>

  <!-- Connector from ammo to turret -->
  <line x1="270" y1="100" x2="250" y2="100" stroke="#6A8AAA" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="530" y1="300" x2="550" y2="300" stroke="#6A8AAA" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Bottom notes -->
  <text x="400" y="425" text-anchor="middle" fill="#6A8AAA" font-size="11">💡 Overlap 2+ drone patrol circles above your most valuable buildings for max coverage</text>
  <text x="400" y="445" text-anchor="middle" fill="#6A8AAA" font-size="11">💡 Keep 20% power headroom — defense systems spike during raids</text>

  <text x="400" y="470" text-anchor="middle" fill="#4A6070" font-size="9">Outworld Station Guide — Defense Layout v1.0</text>
</svg>
