<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" style="background:#1A2533;border-radius:8px;font-family:'Segoe UI',Arial,sans-serif;">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A5F;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#162D4A;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="wormholeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D4AA;stop-opacity:0.3"/>
      <stop offset="50%" style="stop-color:#D4A0FF;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#00D4AA;stop-opacity:0.3"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Title -->
  <text x="400" y="32" text-anchor="middle" fill="#C8D6E8" font-size="18" font-weight="bold">Wormhole Network Topology</text>

  <!-- Main Station -->
  <rect x="290" y="180" width="220" height="70" rx="12" fill="url(#boxGrad)" stroke="#00D4AA" stroke-width="2"/>
  <text x="400" y="207" text-anchor="middle" fill="#00D4AA" font-size="14" font-weight="bold">🏠 Main Station</text>
  <text x="400" y="225" text-anchor="middle" fill="#8AACCD" font-size="11">Wormhole: Channel 1</text>
  <text x="400" y="240" text-anchor="middle" fill="#6A8AAA" font-size="10">Power: 500+ reserve</text>

  <!-- Wormhole links (glowing) -->
  <line x1="290" y1="200" x2="105" y2="90" stroke="#D4A0FF" stroke-width="3" stroke-dasharray="8,4" opacity="0.6" filter="url(#glow)"/>
  <line x1="510" y1="215" x2="690" y2="90" stroke="#D4A0FF" stroke-width="3" stroke-dasharray="8,4" opacity="0.6" filter="url(#glow)"/>
  <line x1="400" y1="250" x2="400" y2="355" stroke="#D4A0FF" stroke-width="3" stroke-dasharray="8,4" opacity="0.6" filter="url(#glow)"/>

  <!-- Channel label -->
  <text x="180" y="130" fill="#D4A0FF" font-size="11" font-weight="bold" filter="url(#glow)">🌀 Channel 1</text>

  <!-- Remote Station 1 (Tungsten) -->
  <rect x="20" y="55" width="170" height="65" rx="8" fill="url(#boxGrad)" stroke="#FFB347" stroke-width="2"/>
  <text x="105" y="78" text-anchor="middle" fill="#FFB347" font-size="12" font-weight="bold">⛏ Tungsten Mine</text>
  <text x="105" y="96" text-anchor="middle" fill="#8AACCD" font-size="11">Exports: Tungsten Ore</text>
  <text x="105" y="112" text-anchor="middle" fill="#6A8AAA" font-size="10">Wormhole: Channel 1</text>

  <!-- Remote Station 2 (Defense) -->
  <rect x="610" y="55" width="170" height="65" rx="8" fill="url(#boxGrad)" stroke="#FF6B6B" stroke-width="2"/>
  <text x="695" y="78" text-anchor="middle" fill="#FF6B6B" font-size="12" font-weight="bold">🛡 Forward Base</text>
  <text x="695" y="96" text-anchor="middle" fill="#8AACCD" font-size="11">Imports: Ammo, Repairs</text>
  <text x="695" y="112" text-anchor="middle" fill="#6A8AAA" font-size="10">Wormhole: Channel 1</text>

  <!-- Remote Station 3 (Uranium) -->
  <rect x="300" y="360" width="200" height="65" rx="8" fill="url(#boxGrad)" stroke="#FF6BB5" stroke-width="2"/>
  <text x="400" y="383" text-anchor="middle" fill="#FF6BB5" font-size="12" font-weight="bold">☢️ Uranium Outpost</text>
  <text x="400" y="401" text-anchor="middle" fill="#8AACCD" font-size="11">Exports: Uranium Ore</text>
  <text x="400" y="417" text-anchor="middle" fill="#6A8AAA" font-size="10">Wormhole: Channel 1</text>

  <!-- Sidebar: Channel rules -->
  <rect x="20" y="200" width="170" height="120" rx="8" fill="#1E3A5F" stroke="#6A8AAA" stroke-width="1" opacity="0.8"/>
  <text x="105" y="222" text-anchor="middle" fill="#C8D6E8" font-size="11" font-weight="bold">Channel Rules</text>
  <text x="105" y="242" text-anchor="middle" fill="#8AACCD" font-size="10">Same channel = linked</text>
  <text x="105" y="259" text-anchor="middle" fill="#8AACCD" font-size="10">Max 4 per channel</text>
  <text x="105" y="276" text-anchor="middle" fill="#8AACCD" font-size="10">Unlimited range</text>
  <text x="105" y="293" text-anchor="middle" fill="#8AACCD" font-size="10">Syncs: Items, Pairing</text>
  <text x="105" y="310" text-anchor="middle" fill="#6A8AAA" font-size="10">No: Power, Buildings</text>

  <!-- Sidebar: Best practice tips -->
  <rect x="610" y="200" width="170" height="120" rx="8" fill="#1E3A5F" stroke="#6A8AAA" stroke-width="1" opacity="0.8"/>
  <text x="695" y="222" text-anchor="middle" fill="#C8D6E8" font-size="11" font-weight="bold">Best Practices</text>
  <text x="695" y="242" text-anchor="middle" fill="#8AACCD" font-size="10">Dedicated channels</text>
  <text x="695" y="259" text-anchor="middle" fill="#8AACCD" font-size="10">per resource type</text>
  <text x="695" y="276" text-anchor="middle" fill="#8AACCD" font-size="10">Power redundancy</text>
  <text x="695" y="293" text-anchor="middle" fill="#8AACCD" font-size="10">at BOTH ends</text>
  <text x="695" y="310" text-anchor="middle" fill="#6A8AAA" font-size="10">Inventory Pairing = 🔥</text>

  <!-- Footer -->
  <text x="400" y="465" text-anchor="middle" fill="#4A6070" font-size="9">Outworld Station Guide — Wormhole Network v1.0</text>
</svg>
