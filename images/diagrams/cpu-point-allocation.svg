<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" style="background:#1A2533;border-radius:8px;font-family:'Segoe UI',Arial,sans-serif;">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A5F;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#162D4A;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D4AA;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#4A9EFF;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <text x="360" y="30" text-anchor="middle" fill="#00D4AA" font-size="16" font-weight="bold">CPU Point Allocation by Station Level</text>
  
  <!-- Level 9-10: 2 pts -->
  <text x="80" y="75" text-anchor="end" fill="#C8D6E8" font-size="12">Level 9-10</text>
  <rect x="90" y="60" width="60" height="22" rx="4" fill="url(#barGrad)"/>
  <text x="100" y="75" fill="#1A2533" font-size="10" font-weight="bold">2 pts</text>
  <text x="155" y="75" fill="#6A8AAA" font-size="10">- 2 Fighters or 2 Freighters</text>
  
  <!-- Level 11-13: 4 pts -->
  <text x="80" y="105" text-anchor="end" fill="#C8D6E8" font-size="12">Level 11-13</text>
  <rect x="90" y="90" width="120" height="22" rx="4" fill="url(#barGrad)"/>
  <text x="100" y="105" fill="#1A2533" font-size="10" font-weight="bold">4 pts</text>
  <text x="215" y="105" fill="#6A8AAA" font-size="10">+ Co-processor upgrade</text>
  
  <!-- Level 14-15: 7 pts -->
  <text x="80" y="135" text-anchor="end" fill="#C8D6E8" font-size="12">Level 14-15</text>
  <rect x="90" y="120" width="200" height="22" rx="4" fill="url(#barGrad)"/>
  <text x="100" y="135" fill="#1A2533" font-size="10" font-weight="bold">7 pts</text>
  <text x="295" y="135" fill="#6A8AAA" font-size="10">+ Advanced Command Center</text>

  <!-- Level 16+: 22 pts -->
  <text x="80" y="165" text-anchor="end" fill="#C8D6E8" font-size="12">Level 16+</text>
  <rect x="90" y="150" width="420" height="22" rx="4" fill="url(#barGrad)"/>
  <text x="100" y="165" fill="#1A2533" font-size="10" font-weight="bold">22 pts</text>
  <text x="515" y="165" fill="#6A8AAA" font-size="10">+ 2x Fleet Command Array</text>

  <!-- What 22 CPU points can do -->
  <rect x="30" y="195" width="660" height="105" rx="8" fill="#1E3A5F" stroke="#6A8AAA" stroke-width="1"/>
  <text x="360" y="215" text-anchor="middle" fill="#C8D6E8" font-size="12" font-weight="bold">What 22 CPU Points Can Control</text>
  
  <text x="50" y="235" fill="#00D4AA" font-size="11">Option A:</text>
  <text x="130" y="235" fill="#8AACCD" font-size="11">22 Fighters/Scouts - max patrol coverage</text>
  
  <text x="50" y="253" fill="#00D4AA" font-size="11">Option B:</text>
  <text x="130" y="253" fill="#8AACCD" font-size="11">8 Freighters (trade routes) + 6 Fighters (escort) + 8 leftover for scouts</text>
  
  <text x="50" y="271" fill="#00D4AA" font-size="11">Option C:</text>
  <text x="130" y="271" fill="#8AACCD" font-size="11">2 Destroyers (8 pts) + 2 Corvettes (4 pts) + 10 Scouts (10 pts)</text>

  <text x="360" y="305" text-anchor="middle" fill="#4A6070" font-size="9">Outworld Station Guide - Ship CPU Control v1.1</text>
</svg>