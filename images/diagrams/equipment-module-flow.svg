<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" style="background:#1A2533;border-radius:8px;font-family:'Segoe UI',Arial,sans-serif;">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A5F;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#162D4A;stop-opacity:1"/>
    </linearGradient>
    <marker id="arrowCyan" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00D4AA"/>
    </marker>
  </defs>
  <text x="360" y="30" text-anchor="middle" fill="#00D4AA" font-size="16" font-weight="bold">装备模块升级路径</text>
  <rect x="30" y="65" width="140" height="80" rx="10" fill="#6B3A6B" stroke="#9A6ABA" stroke-width="1.5"/>
  <text x="100" y="100" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="bold">基础模块</text>
  <text x="100" y="120" text-anchor="middle" fill="#CCCCDD" font-size="11">Mk1 连接器</text>
  <text x="100" y="137" text-anchor="middle" fill="#9A6ABA" font-size="10">效率锁定</text>
  <line x1="170" y1="105" x2="200" y2="105" stroke="#00D4AA" stroke-width="2.5" marker-end="url(#arrowCyan)"/>
  <rect x="210" y="65" width="140" height="80" rx="10" fill="#2A3F55" stroke="#4A9EFF" stroke-width="1.5"/>
  <text x="280" y="100" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="bold">升级车站</text>
  <text x="280" y="120" text-anchor="middle" fill="#CCCCDD" font-size="11">Mk2-3 连接器</text>
  <text x="280" y="137" text-anchor="middle" fill="#6A8AAA" font-size="10">吞吐量翻倍</text>
  <line x1="350" y1="105" x2="380" y2="105" stroke="#00D4AA" stroke-width="2.5" marker-end="url(#arrowCyan)"/>
  <rect x="390" y="65" width="140" height="80" rx="10" fill="#2A3F55" stroke="#4A9EFF" stroke-width="1.5"/>
  <text x="460" y="100" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="bold">高级装备</text>
  <text x="460" y="120" text-anchor="middle" fill="#CCCCDD" font-size="11">Mk4 连接器</text>
  <text x="460" y="137" text-anchor="middle" fill="#6A8AAA" font-size="10">主总线标准</text>
  <line x1="530" y1="105" x2="560" y2="105" stroke="#00D4AA" stroke-width="2.5" marker-end="url(#arrowCyan)"/>
  <rect x="570" y="65" width="140" height="80" rx="10" fill="#3A6B5A" stroke="#00D4AA" stroke-width="1.5"/>
  <text x="640" y="100" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="bold">顶级装备</text>
  <text x="640" y="120" text-anchor="middle" fill="#CCCCDD" font-size="11">6品/次传输</text>
  <text x="640" y="137" text-anchor="middle" fill="#6A8AAA" font-size="10">支持3-4管道</text>
  <!-- Tips -->
  <rect x="100" y="170" width="520" height="75" rx="8" fill="#1E3A5F" stroke="#6A8AAA" stroke-width="1"/>
  <text x="360" y="192" text-anchor="middle" fill="#C8D6E8" font-size="12" font-weight="bold">升级建议</text>
  <text x="360" y="210" text-anchor="middle" fill="#8AACCD" font-size="11">• 优先把主总线升级到Mk4，分支线路保持Mk2即可</text>
  <text x="360" y="228" text-anchor="middle" fill="#8AACCD" font-size="11">• 每个连接器最多服务1-2台机器以避免吞吐瓶颈</text>
  <text x="360" y="265" text-anchor="middle" fill="#4A6070" font-size="9">Outworld Station Guide — Equipment Upgrade Path v1.0</text>
</svg>
