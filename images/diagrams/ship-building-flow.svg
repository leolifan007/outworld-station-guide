<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" style="background:#1A2533;border-radius:8px;font-family:'Segoe UI',Arial,sans-serif;">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A5F;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#162D4A;stop-opacity:1"/>
    </linearGradient>
    <marker id="arrowCyan" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00D4AA"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="32" text-anchor="middle" fill="#00D4AA" font-size="18" font-weight="bold">飞船建造 → 合同收益全流程</text>

  <!-- Step 1 -->
  <rect x="30" y="55" width="220" height="65" rx="8" fill="url(#boxGrad)" stroke="#FFB347" stroke-width="2"/>
  <text x="140" y="78" text-anchor="middle" fill="#FFB347" font-size="13" font-weight="bold">1. 研究船坞</text>
  <text x="140" y="96" text-anchor="middle" fill="#8AACCD" font-size="11">电力稳定后解锁</text>
  <text x="140" y="112" text-anchor="middle" fill="#6A8AAA" font-size="10">约游戏时间4-6小时</text>

  <line x1="250" y1="85" x2="290" y2="85" stroke="#00D4AA" stroke-width="2" marker-end="url(#arrowCyan)"/>

  <!-- Step 2 -->
  <rect x="295" y="55" width="220" height="65" rx="8" fill="url(#boxGrad)" stroke="#FFB347" stroke-width="2"/>
  <text x="405" y="78" text-anchor="middle" fill="#FFB347" font-size="13" font-weight="bold">2. 建造船坞</text>
  <text x="405" y="96" text-anchor="middle" fill="#8AACCD" font-size="11">留空位, 靠近材料</text>
  <text x="405" y="112" text-anchor="middle" fill="#6A8AAA" font-size="10">船会从旁边生成</text>

  <line x1="515" y1="85" x2="555" y2="85" stroke="#00D4AA" stroke-width="2" marker-end="url(#arrowCyan)"/>

  <!-- Step 3 -->
  <rect x="560" y="55" width="210" height="65" rx="8" fill="url(#boxGrad)" stroke="#FFB347" stroke-width="2"/>
  <text x="665" y="78" text-anchor="middle" fill="#FFB347" font-size="13" font-weight="bold">3. 供应材料</text>
  <text x="665" y="96" text-anchor="middle" fill="#8AACCD" font-size="11">钢材+电子+复合材料</text>
  <text x="665" y="112" text-anchor="middle" fill="#6A8AAA" font-size="10">船坞通过配对自动取料</text>

  <!-- Down arrow -->
  <line x1="140" y1="120" x2="140" y2="155" stroke="#00D4AA" stroke-width="2" marker-end="url(#arrowCyan)"/>

  <!-- Step 4 - Ship Selection -->
  <rect x="30" y="160" width="740" height="80" rx="8" fill="url(#boxGrad)" stroke="#4A9EFF" stroke-width="2"/>
  <text x="400" y="183" text-anchor="middle" fill="#4A9EFF" font-size="14" font-weight="bold">4. 选择飞船类型</text>

  <rect x="40" y="195" width="170" height="35" rx="6" fill="url(#boxGrad)" stroke="#00D4AA" stroke-width="1.5"/>
  <text x="125" y="210" text-anchor="middle" fill="#00D4AA" font-size="11" font-weight="bold">🛸 侦察机</text>
  <text x="125" y="224" text-anchor="middle" fill="#6A8AAA" font-size="9">快 · 低货仓 · 便宜</text>

  <rect x="220" y="195" width="170" height="35" rx="6" fill="url(#boxGrad)" stroke="#00D4AA" stroke-width="1.5"/>
  <text x="305" y="210" text-anchor="middle" fill="#00D4AA" font-size="11" font-weight="bold">🚚 货船</text>
  <text x="305" y="224" text-anchor="middle" fill="#6A8AAA" font-size="9">高货仓 · 慢 · 中等</text>

  <rect x="400" y="195" width="170" height="35" rx="6" fill="url(#boxGrad)" stroke="#6A8AAA" stroke-width="1.5"/>
  <text x="485" y="210" text-anchor="middle" fill="#6A8AAA" font-size="11">⛏ 采矿船</text>
  <text x="485" y="224" text-anchor="middle" fill="#6A8AAA" font-size="9">中货仓 · 资源采集</text>

  <rect x="580" y="195" width="170" height="35" rx="6" fill="url(#boxGrad)" stroke="#6A8AAA" stroke-width="1.5"/>
  <text x="665" y="210" text-anchor="middle" fill="#6A8AAA" font-size="11">⚔ 战斗船</text>
  <text x="665" y="224" text-anchor="middle" fill="#6A8AAA" font-size="9">低货仓 · 护卫任务</text>

  <!-- Down arrow -->
  <line x1="400" y1="240" x2="400" y2="270" stroke="#00D4AA" stroke-width="2" marker-end="url(#arrowCyan)"/>

  <!-- Step 5: Build & Launch -->
  <rect x="30" y="275" width="240" height="65" rx="8" fill="url(#boxGrad)" stroke="#FFB347" stroke-width="2"/>
  <text x="150" y="298" text-anchor="middle" fill="#FFB347" font-size="13" font-weight="bold">5. 建造+发射</text>
  <text x="150" y="316" text-anchor="middle" fill="#8AACCD" font-size="11">耗电激增 · 船生成在船坞旁</text>
  <text x="150" y="332" text-anchor="middle" fill="#6A8AAA" font-size="10">船坞旁边预留空位</text>

  <line x1="270" y1="305" x2="310" y2="305" stroke="#00D4AA" stroke-width="2" marker-end="url(#arrowCyan)"/>

  <!-- Step 6: Contract -->
  <rect x="315" y="275" width="220" height="65" rx="8" fill="url(#boxGrad)" stroke="#00D4AA" stroke-width="2"/>
  <text x="425" y="298" text-anchor="middle" fill="#00D4AA" font-size="13" font-weight="bold">6. 分配合同</text>
  <text x="425" y="316" text-anchor="middle" fill="#8AACCD" font-size="11">打开合同终端 → 选合同 → 匹配船型</text>
  <text x="425" y="332" text-anchor="middle" fill="#6A8AAA" font-size="10">选错船型合同不会完成</text>

  <line x1="535" y1="305" x2="575" y2="305" stroke="#00D4AA" stroke-width="2" marker-end="url(#arrowCyan)"/>

  <!-- Step 7: Rewards -->
  <rect x="580" y="275" width="190" height="65" rx="8" fill="#2A5A3A" stroke="#00D4AA" stroke-width="2"/>
  <text x="675" y="298" text-anchor="middle" fill="#00D4AA" font-size="13" font-weight="bold">7. 自动收益</text>
  <text x="675" y="316" text-anchor="middle" fill="#8AACCD" font-size="11">💰 积分 + 资源</text>
  <text x="675" y="332" text-anchor="middle" fill="#8AACCD" font-size="11">🏆 声望解锁高级合同</text>

  <!-- Fleet tip -->
  <rect x="150" y="365" width="500" height="35" rx="8" fill="#1E3A5F" stroke="#4A9EFF" stroke-width="1"/>
  <text x="400" y="383" text-anchor="middle" fill="#4A9EFF" font-size="11">💡 舰队建议: 2侦察机+1货船+1采矿船 · 错开发射保证持续收益</text>

  <text x="400" y="412" text-anchor="middle" fill="#4A6070" font-size="9">Outworld Station Guide — 飞船建造与合同系统 v1.0</text>
</svg>
