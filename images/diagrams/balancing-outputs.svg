<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120" style="background:#1A2533;border-radius:8px;font-family:'Segoe UI',Arial,sans-serif;">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A5F;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#162D4A;stop-opacity:1"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#00D4AA"/>
    </marker>
  </defs>

  <text x="400" y="20" text-anchor="middle" fill="#C8D6E8" font-size="11" font-weight="bold">Balancing Multiple Outputs</text>

  <!-- Machine A -->
  <rect x="50" y="35" width="60" height="30" rx="4" fill="url(#boxGrad)" stroke="#FFB347" stroke-width="1.5"/>
  <text x="80" y="55" text-anchor="middle" fill="#FFB347" font-size="9">[A]</text>
  <line x1="110" y1="50" x2="150" y2="50" stroke="#00D4AA" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Machine B -->
  <rect x="50" y="75" width="60" height="30" rx="4" fill="url(#boxGrad)" stroke="#FFB347" stroke-width="1.5"/>
  <text x="80" y="95" text-anchor="middle" fill="#FFB347" font-size="9">[B]</text>
  <line x1="110" y1="90" x2="150" y2="90" stroke="#00D4AA" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Machine C -->
  <rect x="50" y="115" width="60" height="30" rx="4" fill="url(#boxGrad)" stroke="#FFB347" stroke-width="1.5"/>
  <text x="80" y="135" text-anchor="middle" fill="#FFB347" font-size="9">[C]</text>
  <line x1="110" y1="130" x2="150" y2="130" stroke="#00D4AA" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Splitters -->
  <rect x="155" y="35" width="80" height="30" rx="4" fill="url(#boxGrad)" stroke="#4A9EFF" stroke-width="1.5"/>
  <text x="195" y="55" text-anchor="middle" fill="#4A9EFF" font-size="8">Splitter</text>

  <rect x="155" y="75" width="80" height="30" rx="4" fill="url(#boxGrad)" stroke="#4A9EFF" stroke-width="1.5"/>
  <text x="195" y="95" text-anchor="middle" fill="#4A9EFF" font-size="8">Splitter</text>

  <rect x="155" y="115" width="80" height="30" rx="4" fill="url(#boxGrad)" stroke="#4A9EFF" stroke-width="1.5"/>
  <text x="195" y="135" text-anchor="middle" fill="#4A9EFF" font-size="8">Splitter</text>

  <!-- Mergers -->
  <line x1="235" y1="50" x2="280" y2="70" stroke="#00D4AA" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="235" y1="90" x2="280" y2="90" stroke="#00D4AA" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="235" y1="130" x2="280" y2="110" stroke="#00D4AA" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="285" y="70" width="80" height="40" rx="4" fill="url(#boxGrad)" stroke="#00D4AA" stroke-width="1.5"/>
  <text x="325" y="95" text-anchor="middle" fill="#00D4AA" font-size="8">Merge</text>

  <!-- Main Line -->
  <line x1="365" y1="90" x2="420" y2="90" stroke="#00D4AA" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="425" y="70" width="150" height="40" rx="6" fill="url(#boxGrad)" stroke="#00D4AA" stroke-width="2"/>
  <text x="500" y="95" text-anchor="middle" fill="#00D4AA" font-size="9" font-weight="bold">Main Line</text>
</svg>