<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" style="background:#1A2533;border-radius:8px;font-family:'Segoe UI',Arial,sans-serif;">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A5F;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#162D4A;stop-opacity:1"/>
    </linearGradient>
    <marker id="arrowCyan" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00D4AA"/>
    </marker>
  </defs>
  <text x="360" y="30" text-anchor="middle" fill="#00D4AA" font-size="16" font-weight="bold">Ship CPU Control Flow</text>
  <rect x="30" y="65" width="140" height="80" rx="10" fill="#6B3A6B" stroke="#9A6ABA" stroke-width="1.5"/>
  <text x="100" y="100" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="bold">Unlock CPU</text>
  <text x="100" y="120" text-anchor="middle" fill="#CCCCDD" font-size="11">Station Level 9</text>
  <text x="100" y="137" text-anchor="middle" fill="#9A6ABA" font-size="10">Fleet Command Tree</text>
  <line x1="170" y1="105" x2="200" y2="105" stroke="#00D4AA" stroke-width="2.5" marker-end="url(#arrowCyan)"/>
  <rect x="210" y="65" width="140" height="80" rx="10" fill="#2A3F55" stroke="#4A9EFF" stroke-width="1.5"/>
  <text x="280" y="100" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="bold">Assign Ships</text>
  <text x="280" y="120" text-anchor="middle" fill="#CCCCDD" font-size="11">CPU Points Pool</text>
  <text x="280" y="137" text-anchor="middle" fill="#6A8AAA" font-size="10">1 pt = 1 small ship</text>
  <line x1="350" y1="105" x2="380" y2="105" stroke="#00D4AA" stroke-width="2.5" marker-end="url(#arrowCyan)"/>
  <rect x="390" y="65" width="140" height="80" rx="10" fill="#2A3F55" stroke="#4A9EFF" stroke-width="1.5"/>
  <text x="460" y="100" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="bold">Set Tasks</text>
  <text x="460" y="120" text-anchor="middle" fill="#CCCCDD" font-size="11">Trade / Haul / Escort</text>
  <text x="460" y="137" text-anchor="middle" fill="#6A8AAA" font-size="10">Fleet Management UI</text>
  <line x1="530" y1="105" x2="560" y2="105" stroke="#00D4AA" stroke-width="2.5" marker-end="url(#arrowCyan)"/>
  <rect x="570" y="65" width="140" height="80" rx="10" fill="#3A6B5A" stroke="#00D4AA" stroke-width="1.5"/>
  <text x="640" y="100" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="bold">Auto Operate</text>
  <text x="640" y="120" text-anchor="middle" fill="#CCCCDD" font-size="11">Autonomous fleet</text>
  <text x="640" y="137" text-anchor="middle" fill="#6A8AAA" font-size="10">No manual dispatch</text>
  <rect x="100" y="170" width="520" height="75" rx="8" fill="#1E3A5F" stroke="#6A8AAA" stroke-width="1"/>
  <text x="360" y="192" text-anchor="middle" fill="#C8D6E8" font-size="12" font-weight="bold">CPU Control Key Points</text>
  <text x="360" y="210" text-anchor="middle" fill="#8AACCD" font-size="11">- Start with 2 CPU points at unlock, expand via Co-processor and Fleet Command Array</text>
  <text x="360" y="228" text-anchor="middle" fill="#8AACCD" font-size="11">- Assign fastest haulers to trade routes first for best early return</text>
  <text x="360" y="265" text-anchor="middle" fill="#4A6070" font-size="9">Outworld Station Guide - Ship CPU Control v1.1</text>
</svg>