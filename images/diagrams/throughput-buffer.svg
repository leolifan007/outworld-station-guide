<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 100" style="background:#1A2533;border-radius:8px;font-family:'Segoe UI',Arial,sans-serif;">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A5F;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#162D4A;stop-opacity:1"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#00D4AA"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="20" text-anchor="middle" fill="#C8D6E8" font-size="12" font-weight="bold">Throughput Buffer Pattern</text>

  <!-- Source -->
  <rect x="30" y="35" width="80" height="35" rx="6" fill="url(#boxGrad)" stroke="#FFB347" stroke-width="1.5"/>
  <text x="70" y="57" text-anchor="middle" fill="#FFB347" font-size="10" font-weight="bold">Source</text>

  <line x1="110" y1="52" x2="145" y2="52" stroke="#00D4AA" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Splitter -->
  <rect x="150" y="35" width="80" height="35" rx="6" fill="url(#boxGrad)" stroke="#4A9EFF" stroke-width="1.5"/>
  <text x="190" y="57" text-anchor="middle" fill="#4A9EFF" font-size="10">Splitter</text>

  <line x1="230" y1="52" x2="265" y2="52" stroke="#00D4AA" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Buffer Storage (highlighted) -->
  <rect x="270" y="30" width="120" height="45" rx="6" fill="url(#boxGrad)" stroke="#00D4AA" stroke-width="2"/>
  <text x="330" y="50" text-anchor="middle" fill="#00D4AA" font-size="10" font-weight="bold">Buffer Storage</text>
  <text x="330" y="65" text-anchor="middle" fill="#6A8AAA" font-size="8">(1-2 stacks)</text>

  <line x1="390" y1="52" x2="425" y2="52" stroke="#00D4AA" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Splitter 2 -->
  <rect x="430" y="35" width="80" height="35" rx="6" fill="url(#boxGrad)" stroke="#4A9EFF" stroke-width="1.5"/>
  <text x="470" y="57" text-anchor="middle" fill="#4A9EFF" font-size="10">Splitter</text>

  <line x1="510" y1="52" x2="545" y2="52" stroke="#00D4AA" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Consumers -->
  <rect x="550" y="35" width="220" height="35" rx="6" fill="url(#boxGrad)" stroke="#FFB347" stroke-width="1.5"/>
  <text x="660" y="57" text-anchor="middle" fill="#FFB347" font-size="10">Consumers</text>
</svg>