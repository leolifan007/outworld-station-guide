<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120" style="background:#1A2533;border-radius:8px;font-family:'Segoe UI',Arial,sans-serif;">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A5F;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#162D4A;stop-opacity:1"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00D4AA"/>
    </marker>
  </defs>

  <text x="400" y="20" text-anchor="middle" fill="#C8D6E8" font-size="13" font-weight="bold">Planet-to-Planet Wormhole Chain</text>

  <!-- Planet A -->
  <rect x="10" y="35" width="130" height="50" rx="25" fill="url(#boxGrad)" stroke="#4A9EFF" stroke-width="2"/>
  <text x="75" y="58" text-anchor="middle" fill="#4A9EFF" font-size="12" font-weight="bold">🪐 Planet A</text>
  <text x="75" y="75" text-anchor="middle" fill="#6A8AAA" font-size="9">Wormhole Station</text>

  <line x1="140" y1="60" x2="195" y2="60" stroke="#00D4AA" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="167" y="52" text-anchor="middle" fill="#D4A0FF" font-size="9">Channel 1</text>

  <!-- Planet B -->
  <rect x="200" y="35" width="130" height="50" rx="25" fill="url(#boxGrad)" stroke="#4A9EFF" stroke-width="2"/>
  <text x="265" y="58" text-anchor="middle" fill="#4A9EFF" font-size="12" font-weight="bold">🪐 Planet B</text>
  <text x="265" y="75" text-anchor="middle" fill="#6A8AAA" font-size="9">Wormhole Station</text>

  <line x1="330" y1="60" x2="385" y2="60" stroke="#00D4AA" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="357" y="52" text-anchor="middle" fill="#D4A0FF" font-size="9">Channel 2</text>

  <!-- Planet C -->
  <rect x="390" y="35" width="130" height="50" rx="25" fill="url(#boxGrad)" stroke="#4A9EFF" stroke-width="2"/>
  <text x="455" y="58" text-anchor="middle" fill="#4A9EFF" font-size="12" font-weight="bold">🪐 Planet C</text>
  <text x="455" y="75" text-anchor="middle" fill="#6A8AAA" font-size="9">Wormhole Station</text>

  <line x1="520" y1="60" x2="575" y2="60" stroke="#00D4AA" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="547" y="52" text-anchor="middle" fill="#D4A0FF" font-size="9">Channel 3</text>

  <!-- Main Station -->
  <rect x="580" y="35" width="160" height="50" rx="25" fill="url(#boxGrad)" stroke="#00D4AA" stroke-width="3"/>
  <text x="660" y="58" text-anchor="middle" fill="#00D4AA" font-size="12" font-weight="bold">🏠 Main Station</text>
  <text x="660" y="75" text-anchor="middle" fill="#6A8AAA" font-size="9">Central Hub</text>

  <text x="400" y="108" text-anchor="middle" fill="#4A6070" font-size="9">Planet Chain Topology — Outworld Station Guide</text>
</svg>
