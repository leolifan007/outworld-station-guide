  </defs>
  <text x="360" y="30" text-anchor="middle" fill="#00D4AA" font-size="16" font-weight="bold">终局冲刺流程</text>
  <rect x="30" y="65" width="140" height="80" rx="10" fill="#6B3A6B" stroke="#9A6ABA" stroke-width="1.5"/>
  <text x="100" y="100" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="bold">最终研究</text>
  <text x="100" y="120" text-anchor="middle" fill="#CCCCDD" font-size="11">方舟蓝图</text>
  <text x="100" y="137" text-anchor="middle" fill="#9A6ABA" font-size="10">聚变锁前置</text>
  <line x1="170" y1="105" x2="200" y2="105" stroke="#00D4AA" stroke-width="2.5" marker-end="url(#arrowCyan)"/>
  <rect x="210" y="65" width="140" height="80" rx="10" fill="#2A3F55" stroke="#4A9EFF" stroke-width="1.5"/>
  <text x="280" y="100" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="bold">终极资源</text>
  <text x="280" y="120" text-anchor="middle" fill="#CCCCDD" font-size="11">N-Asteroid合金</text>
  <text x="280" y="137" text-anchor="middle" fill="#6A8AAA" font-size="10">虫洞运输</text>
  <line x1="350" y1="105" x2="380" y2="105" stroke="#00D4AA" stroke-width="2.5" marker-end="url(#arrowCyan)"/>
  <rect x="390" y="65" width="140" height="80" rx="10" fill="#2A3F55" stroke="#4A9EFF" stroke-width="1.5"/>
  <text x="460" y="100" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="bold">飞船组装</text>
  <text x="460" y="120" text-anchor="middle" fill="#CCCCDD" font-size="11">船坞+部件</text>
  <text x="460" y="137" text-anchor="middle" fill="#6A8AAA" font-size="10">500+单位材料</text>
  <line x1="530" y1="105" x2="560" y2="105" stroke="#00D4AA" stroke-width="2.5" marker-end="url(#arrowCyan)"/>
  <rect x="570" y="65" width="140" height="80" rx="10" fill="#3A6B5A" stroke="#00D4AA" stroke-width="1.5"/>
  <text x="640" y="110" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="bold">🚀 胜利!</text>
  <!-- Checklist -->
  <rect x="100" y="170" width="520" height="75" rx="8" fill="#1E3A5F" stroke="#6A8AAA" stroke-width="1"/>
  <text x="360" y="192" text-anchor="middle" fill="#C8D6E8" font-size="12" font-weight="bold">冲刺检查清单</text>
  <text x="360" y="210" text-anchor="middle" fill="#8AACCD" font-size="11">✅ 聚变动力稳定  ✅ 虫洞网络就绪  ✅ 船坞II级</text>
  <text x="360" y="228" text-anchor="middle" fill="#8AACCD" font-size="11">✅ 自动化产线  ✅ 大型仓储  ✅ 回收系统就位</text>
  <text x="360" y="265" text-anchor="middle" fill="#4A6070" font-size="9">Outworld Station Guide — Endgame Path v1.0</text>
</svg>
