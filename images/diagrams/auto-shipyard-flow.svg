<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260">
  <rect width="600" height="260" fill="#1A2533" rx="8"/>
  <text x="300" y="30" fill="#00D4AA" font-family="Arial,sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Automated Shipyard Material Flow</text>

  <!-- Dedicated Assemblers -->
  <g transform="translate(15, 55)">
    <text x="0" y="0" fill="#8899AA" font-family="Arial,sans-serif" font-size="10" font-weight="bold">Dedicated Assemblers</text>
    <rect x="0" y="8" width="65" height="22" fill="#2A3F55" rx="4" stroke="#4ECDC4" stroke-width="1.5"/>
    <text x="33" y="23" fill="#4ECDC4" font-family="Arial,sans-serif" font-size="9" text-anchor="middle">Hull Plates</text>
    <rect x="0" y="34" width="65" height="22" fill="#2A3F55" rx="4" stroke="#4ECDC4" stroke-width="1.5"/>
    <text x="33" y="49" fill="#4ECDC4" font-family="Arial,sans-serif" font-size="9" text-anchor="middle">Superalloy</text>
    <rect x="0" y="60" width="65" height="22" fill="#2A3F55" rx="4" stroke="#FF6B35" stroke-width="1.5"/>
    <text x="33" y="75" fill="#FF6B35" font-family="Arial,sans-serif" font-size="9" text-anchor="middle">Reactors</text>
    <rect x="0" y="86" width="65" height="22" fill="#2A3F55" rx="4" stroke="#FFD93D" stroke-width="1.5"/>
    <text x="33" y="101" fill="#FFD93D" font-family="Arial,sans-serif" font-size="9" text-anchor="middle">Fuel Cells</text>
    <rect x="0" y="112" width="65" height="22" fill="#2A3F55" rx="4" stroke="#00D4AA" stroke-width="1.5"/>
    <text x="33" y="127" fill="#00D4AA" font-family="Arial,sans-serif" font-size="9" text-anchor="middle">Circuits</text>
  </g>

  <!-- Arrows to buffers -->
  <g transform="translate(80, 55)">
    <line x1="10" y1="20" x2="30" y2="20" stroke="#B0C4D8" stroke-width="1.5" marker-end="url(#aaa)"/>
    <line x1="10" y1="46" x2="30" y2="46" stroke="#B0C4D8" stroke-width="1.5" marker-end="url(#aaa)"/>
    <line x1="10" y1="72" x2="30" y2="72" stroke="#B0C4D8" stroke-width="1.5" marker-end="url(#aaa)"/>
    <line x1="10" y1="98" x2="30" y2="98" stroke="#B0C4D8" stroke-width="1.5" marker-end="url(#aaa)"/>
    <line x1="10" y1="124" x2="30" y2="124" stroke="#B0C4D8" stroke-width="1.5" marker-end="url(#aaa)"/>
  </g>

  <!-- Buffer column -->
  <g transform="translate(115, 55)">
    <text x="30" y="0" fill="#FFD93D" font-family="Arial,sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Buffers (each 200 units)</text>
    <rect x="0" y="8" width="60" height="22" fill="#1E3045" rx="4" stroke="#FFD93D" stroke-width="1.5"/>
    <text x="30" y="23" fill="#B0C4D8" font-family="Arial,sans-serif" font-size="9" text-anchor="middle">Hull buf</text>
    <rect x="0" y="34" width="60" height="22" fill="#1E3045" rx="4" stroke="#FFD93D" stroke-width="1.5"/>
    <text x="30" y="49" fill="#B0C4D8" font-family="Arial,sans-serif" font-size="9" text-anchor="middle">Alloy buf</text>
    <rect x="0" y="60" width="60" height="22" fill="#1E3045" rx="4" stroke="#FFD93D" stroke-width="1.5"/>
    <text x="30" y="75" fill="#B0C4D8" font-family="Arial,sans-serif" font-size="9" text-anchor="middle">Reac buf</text>
    <rect x="0" y="86" width="60" height="22" fill="#1E3045" rx="4" stroke="#FFD93D" stroke-width="1.5"/>
    <text x="30" y="101" fill="#B0C4D8" font-family="Arial,sans-serif" font-size="9" text-anchor="middle">Fuel buf</text>
    <rect x="0" y="112" width="60" height="22" fill="#1E3045" rx="4" stroke="#FFD93D" stroke-width="1.5"/>
    <text x="30" y="127" fill="#B0C4D8" font-family="Arial,sans-serif" font-size="9" text-anchor="middle">Circ buf</text>
  </g>

  <!-- Arrows to Shipyard -->
  <g transform="translate(175, 55)">
    <line x1="10" y1="20" x2="30" y2="10" stroke="#B0C4D8" stroke-width="1.5" marker-end="url(#aaa)"/>
    <line x1="10" y1="46" x2="30" y2="28" stroke="#B0C4D8" stroke-width="1.5" marker-end="url(#aaa)"/>
    <line x1="10" y1="72" x2="30" y2="46" stroke="#B0C4D8" stroke-width="1.5" marker-end="url(#aaa)"/>
    <line x1="10" y1="98" x2="30" y2="64" stroke="#B0C4D8" stroke-width="1.5" marker-end="url(#aaa)"/>
    <line x1="10" y1="124" x2="30" y2="82" stroke="#B0C4D8" stroke-width="1.5" marker-end="url(#aaa)"/>
  </g>

  <!-- Shipyard -->
  <g transform="translate(230, 55)">
    <rect x="0" y="0" width="120" height="90" fill="#2A3F55" rx="6" stroke="#00D4AA" stroke-width="2"/>
    <text x="60" y="22" fill="#00D4AA" font-family="Arial,sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Shipyard</text>
    <text x="60" y="42" fill="#8899AA" font-family="Arial,sans-serif" font-size="10" text-anchor="middle">4 Input Slots:</text>
    <text x="60" y="58" fill="#B0C4D8" font-family="Arial,sans-serif" font-size="9" text-anchor="middle">Structural / Power</text>
    <text x="60" y="73" fill="#B0C4D8" font-family="Arial,sans-serif" font-size="9" text-anchor="middle">Electronics / Weapons</text>
  </g>

  <!-- Output arrow -->
  <g transform="translate(350, 55)">
    <line x1="15" y1="45" x2="55" y2="45" stroke="#00D4AA" stroke-width="2" marker-end="url(#aaa)"/>
  </g>

  <!-- Completed ship output -->
  <g transform="translate(410, 55)">
    <rect x="0" y="15" width="100" height="60" fill="#1E3045" rx="6" stroke="#4ECDC4" stroke-width="2" stroke-dasharray="4,2"/>
    <text x="50" y="42" fill="#4ECDC4" font-family="Arial,sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Completed</text>
    <text x="50" y="60" fill="#4ECDC4" font-family="Arial,sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Ship</text>
  </g>

  <!-- Bottom note -->
  <g transform="translate(230, 170)">
    <rect x="0" y="0" width="260" height="60" fill="#1E3045" rx="6" stroke="#8899AA" stroke-width="1"/>
    <text x="130" y="20" fill="#B0C4D8" font-family="Arial,sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Auto-Build Settings</text>
    <text x="15" y="38" fill="#8899AA" font-family="Arial,sans-serif" font-size="10">Ship Type: Small Freighter</text>
    <text x="15" y="53" fill="#8899AA" font-family="Arial,sans-serif" font-size="10">Build Until: 3  |  Min Materials: 80%</text>
  </g>

  <defs>
    <marker id="aaa" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto">
      <path d="M0,0 L6,2 L0,4" fill="#B0C4D8"/>
    </marker>
  </defs>
</svg>
