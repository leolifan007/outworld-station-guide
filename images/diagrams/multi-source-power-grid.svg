<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" style="background:#1A2533;font-family:Arial,sans-serif">
  <defs><marker id="a" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#00D4AA"/></marker></defs>
  <text x="400" y="28" text-anchor="middle" fill="#00D4AA" font-size="16" font-weight="bold">Multi-Source Power Grid - 3-Layer Architecture</text>
  <rect x="120" y="45" width="150" height="40" rx="4" fill="#2A3A4A" stroke="#FF6B35" stroke-width="1.5"/>
  <text x="195" y="65" text-anchor="middle" fill="#FF6B35" font-size="12">Layer 1: Solar Panels</text>
  <text x="195" y="80" text-anchor="middle" fill="#8899AA" font-size="10">Base load - Instant</text>
  <line x1="270" y1="65" x2="330" y2="65" stroke="#667788" stroke-width="2" marker-end="url(#a)"/>
  <rect x="335" y="45" width="150" height="40" rx="4" fill="#2A3A4A" stroke="#4A9EFF" stroke-width="1.5"/>
  <text x="410" y="65" text-anchor="middle" fill="#4A9EFF" font-size="12">Layer 2: Battery Banks</text>
  <text x="410" y="80" text-anchor="middle" fill="#8899AA" font-size="10">Spike absorption - 2 sec</text>
  <line x1="485" y1="65" x2="545" y2="65" stroke="#667788" stroke-width="2" marker-end="url(#a)"/>
  <rect x="550" y="45" width="150" height="40" rx="4" fill="#2A3A4A" stroke="#00D4AA" stroke-width="1.5"/>
  <text x="625" y="65" text-anchor="middle" fill="#00D4AA" font-size="12">Layer 3: Fusion/Antimatter</text>
  <text x="625" y="80" text-anchor="middle" fill="#8899AA" font-size="10">Sustained load - 45 sec</text>
  <rect x="200" y="110" width="400" height="2" fill="#667788"/>
  <text x="400" y="130" text-anchor="middle" fill="#00D4AA" font-size="14" font-weight="bold">Power Flow During a Day-Night Cycle</text>
  <rect x="30" y="145" width="200" height="90" rx="4" fill="#1A2A3A" stroke="#FF6B35" stroke-width="1"/>
  <text x="130" y="165" text-anchor="middle" fill="#FF6B35" font-size="11" font-weight="bold">Daytime (10 min)</text>
  <text x="130" y="182" text-anchor="middle" fill="#E0E0E0" font-size="10">Solar: 120 kW active</text>
  <text x="130" y="196" text-anchor="middle" fill="#E0E0E0" font-size="10">Battery: Charging</text>
  <text x="130" y="210" text-anchor="middle" fill="#E0E0E0" font-size="10">Fusion: Idle/standby</text>
  <text x="130" y="224" text-anchor="middle" fill="#4A9EFF" font-size="10">Total: 120 kW + charging</text>
  <rect x="290" y="145" width="200" height="90" rx="4" fill="#1A2A3A" stroke="#FF6B35" stroke-width="1"/>
  <text x="390" y="165" text-anchor="middle" fill="#FF6B35" font-size="11" font-weight="bold">Dusk Transition</text>
  <text x="390" y="182" text-anchor="middle" fill="#E0E0E0" font-size="10">Solar: Dropping (120 to 0)</text>
  <text x="390" y="196" text-anchor="middle" fill="#E0E0E0" font-size="10">Battery: Discharging</text>
  <text x="390" y="210" text-anchor="middle" fill="#E0E0E0" font-size="10">Fusion: Spinning up</text>
  <text x="390" y="224" text-anchor="middle" fill="#00D4AA" font-size="10">Trigger: Battery &lt; 60%</text>
  <rect x="550" y="145" width="200" height="90" rx="4" fill="#1A2A3A" stroke="#FF6B35" stroke-width="1"/>
  <text x="650" y="165" text-anchor="middle" fill="#FF6B35" font-size="11" font-weight="bold">Nighttime (8 min)</text>
  <text x="650" y="182" text-anchor="middle" fill="#E0E0E0" font-size="10">Solar: 0 kW</text>
  <text x="650" y="196" text-anchor="middle" fill="#E0E0E0" font-size="10">Battery: Reserve (60-20%)</text>
  <text x="650" y="210" text-anchor="middle" fill="#E0E0E0" font-size="10">Fusion: 100% load</text>
  <text x="650" y="224" text-anchor="middle" fill="#00D4AA" font-size="10">Total: 500 kW stable</text>
  <rect x="50" y="260" width="700" height="55" rx="4" fill="#1A2A3A" stroke="#00D4AA" stroke-width="1"/>
  <text x="400" y="280" text-anchor="middle" fill="#00D4AA" font-size="11" font-weight="bold">Config: Fusion triggers when battery drops below 60% (not 40%)</text>
  <text x="400" y="298" text-anchor="middle" fill="#E0E0E0" font-size="10">This gives 45-second spin-up window before batteries run out. Zero grid crashes.</text>
  <rect x="100" y="340" width="600" height="40" rx="4" fill="#0A2A1A" stroke="#FF6B35" stroke-width="1"/>
  <text x="400" y="358" text-anchor="middle" fill="#FF6B35" font-size="11">Separation: Solar covers 18%, Battery covers 8%, Fusion/Antimatter covers 74% of daily load</text>
  <text x="400" y="374" text-anchor="middle" fill="#8899AA" font-size="10">Solar saves 180 kW/min fuel cost during daytime = 35% total energy cost reduction</text>
</svg>