<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 80" style="background:#1A2533;border-radius:8px;font-family:'Segoe UI',Arial,sans-serif;">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A5F;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#162D4A;stop-opacity:1"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#00D4AA"/>
    </marker>
  </defs>

  <text x="400" y="20" text-anchor="middle" fill="#C8D6E8" font-size="11" font-weight="bold">Linear Production Chain</text>

  <rect x="50" y="35" width="120" height="30" rx="6" fill="url(#boxGrad)" stroke="#FFB347" stroke-width="1.5"/>
  <text x="110" y="55" text-anchor="middle" fill="#FFB347" font-size="9">Input Dock</text>

  <line x1="170" y1="50" x2="210" y2="50" stroke="#00D4AA" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="215" y="35" width="120" height="30" rx="6" fill="url(#boxGrad)" stroke="#4A9EFF" stroke-width="1.5"/>
  <text x="275" y="55" text-anchor="middle" fill="#4A9EFF" font-size="9">Processing</text>

  <line x1="335" y1="50" x2="375" y2="50" stroke="#00D4AA" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="380" y="35" width="120" height="30" rx="6" fill="url(#boxGrad)" stroke="#4A9EFF" stroke-width="1.5"/>
  <text x="440" y="55" text-anchor="middle" fill="#4A9EFF" font-size="9">Processing</text>

  <line x1="500" y1="50" x2="540" y2="50" stroke="#00D4AA" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="545" y="35" width="150" height="30" rx="6" fill="url(#boxGrad)" stroke="#00D4AA" stroke-width="1.5"/>
  <text x="620" y="55" text-anchor="middle" fill="#00D4AA" font-size="9">Output Storage</text>
</svg>