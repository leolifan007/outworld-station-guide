<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" style="background:#1A2533;border-radius:8px;font-family:'Segoe UI',Arial,sans-serif;">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A5F;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#162D4A;stop-opacity:1"/>
    </linearGradient>
    <marker id="arrowPink" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#FF6BB5"/>
    </marker>
    <marker id="arrowCyan" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00D4AA"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="32" text-anchor="middle" fill="#C8D6E8" font-size="18" font-weight="bold">Antimatter Power Production Chain</text>

  <!-- Step 1: Uranium -->
  <rect x="80" y="65" width="180" height="60" rx="8" fill="url(#boxGrad)" stroke="#FF6BB5" stroke-width="2"/>
  <text x="170" y="88" text-anchor="middle" fill="#FF6BB5" font-size="13" font-weight="bold">☢️ Uranium Mining</text>
  <text x="170" y="106" text-anchor="middle" fill="#8AACCD" font-size="11">Find on star map (rare)</text>
  <text x="170" y="120" text-anchor="middle" fill="#6A8AAA" font-size="10">Add defense at outpost</text>

  <!-- Arrow -->
  <line x1="260" y1="95" x2="320" y2="95" stroke="#FF6BB5" stroke-width="2" marker-end="url(#arrowPink)"/>

  <!-- Step 2: Processing -->
  <rect x="325" y="65" width="200" height="60" rx="8" fill="url(#boxGrad)" stroke="#FF6BB5" stroke-width="2"/>
  <text x="425" y="88" text-anchor="middle" fill="#FF6BB5" font-size="13" font-weight="bold">⚗️ Uranium Processing</text>
  <text x="425" y="106" text-anchor="middle" fill="#8AACCD" font-size="11">Superalloy Forge +</text>
  <text x="425" y="120" text-anchor="middle" fill="#8AACCD" font-size="11">Advanced Assembler</text>

  <!-- Arrow -->
  <line x1="525" y1="95" x2="585" y2="95" stroke="#FF6BB5" stroke-width="2" marker-end="url(#arrowPink)"/>

  <!-- Step 3: Neutron Initiators -->
  <rect x="590" y="65" width="150" height="60" rx="8" fill="url(#boxGrad)" stroke="#D4A0FF" stroke-width="2"/>
  <text x="665" y="88" text-anchor="middle" fill="#D4A0FF" font-size="12" font-weight="bold">🔬 Neutron Initiators</text>
  <text x="665" y="106" text-anchor="middle" fill="#8AACCD" font-size="10">Fuel for reactor</text>
  <text x="665" y="120" text-anchor="middle" fill="#6A8AAA" font-size="10">Expensive to make</text>

  <!-- Big arrow down to reactor -->
  <line x1="665" y1="125" x2="665" y2="175" stroke="#D4A0FF" stroke-width="2" marker-end="url(#arrowPink)"/>
  <line x1="400" y1="180" x2="665" y2="175" stroke="#00D4AA" stroke-width="2" marker-end="url(#arrowCyan)"/>

  <!-- Power source -->
  <rect x="80" y="165" width="220" height="50" rx="8" fill="url(#boxGrad)" stroke="#00D4AA" stroke-width="1.5"/>
  <text x="190" y="190" text-anchor="middle" fill="#00D4AA" font-size="12" font-weight="bold">⚡ Fusion Grid (baseline)</text>
  <text x="190" y="207" text-anchor="middle" fill="#8AACCD" font-size="10">Keep as backup for spikes</text>

  <!-- Arrow fusion to reactor -->
  <line x1="300" y1="190" x2="345" y2="190" stroke="#00D4AA" stroke-width="2" marker-end="url(#arrowCyan)"/>

  <!-- Antimatter Reactor (center) -->
  <rect x="250" y="230" width="300" height="75" rx="12" fill="url(#boxGrad)" stroke="#D4A0FF" stroke-width="3"/>
  <text x="400" y="258" text-anchor="middle" fill="#D4A0FF" font-size="16" font-weight="bold">⚛️ Antimatter Reactor</text>
  <text x="400" y="278" text-anchor="middle" fill="#8AACCD" font-size="12">500+ power/sec</text>
  <text x="400" y="295" text-anchor="middle" fill="#FF6B6B" font-size="11">⚠️ Requires Radiation Shielding</text>

  <!-- Reactor to grid -->
  <line x1="400" y1="305" x2="400" y2="345" stroke="#D4A0FF" stroke-width="3" marker-end="url(#arrowPink)"/>

  <!-- Power Grid -->
  <rect x="250" y="350" width="300" height="55" rx="8" fill="url(#boxGrad)" stroke="#00D4AA" stroke-width="2"/>
  <text x="400" y="373" text-anchor="middle" fill="#00D4AA" font-size="14" font-weight="bold">🔌 Station Power Grid</text>
  <text x="400" y="393" text-anchor="middle" fill="#8AACCD" font-size="11">Ion Cannons · Forges · Drone Bays · Wormholes</text>

  <!-- Prereq box -->
  <rect x="80" y="370" width="140" height="35" rx="6" fill="#1E3A5F" stroke="#6A8AAA" stroke-width="1" opacity="0.7"/>
  <text x="150" y="388" text-anchor="middle" fill="#6A8AAA" font-size="10">Prereq: Station Level 10</text>

  <rect x="580" y="370" width="150" height="35" rx="6" fill="#1E3A5F" stroke="#6A8AAA" stroke-width="1" opacity="0.7"/>
  <text x="655" y="388" text-anchor="middle" fill="#6A8AAA" font-size="10">Hybrid: Keep fusion + antimatter</text>

  <!-- Footer -->
  <text x="400" y="448" text-anchor="middle" fill="#4A6070" font-size="9">Outworld Station Guide — Antimatter Power Chain v1.0</text>
</svg>
