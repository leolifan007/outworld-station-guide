<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 180" style="background:#1A2533;border-radius:8px;font-family:'Segoe UI',Arial,sans-serif;">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A5F;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#162D4A;stop-opacity:1"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#00D4AA"/>
    </marker>
  </defs>

  <text x="400" y="20" text-anchor="middle" fill="#C8D6E8" font-size="11" font-weight="bold">Modular Blocks Pattern</text>

  <!-- Top row -->
  <rect x="50" y="40" width="200" height="50" rx="6" fill="url(#boxGrad)" stroke="#4A9EFF" stroke-width="1.5"/>
  <text x="150" y="70" text-anchor="middle" fill="#4A9EFF" font-size="9">Module A: Power</text>

  <rect x="300" y="40" width="200" height="50" rx="6" fill="url(#boxGrad)" stroke="#FFB347" stroke-width="1.5"/>
  <text x="400" y="70" text-anchor="middle" fill="#FFB347" font-size="9">Module B: Smelting</text>

  <rect x="550" y="40" width="200" height="50" rx="6" fill="url(#boxGrad)" stroke="#00D4AA" stroke-width="1.5"/>
  <text x="650" y="70" text-anchor="middle" fill="#00D4AA" font-size="9">Module C: Assembly</text>

  <!-- Arrows -->
  <line x1="150" y1="90" x2="150" y2="115" stroke="#00D4AA" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="90" x2="400" y2="115" stroke="#00D4AA" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="650" y1="90" x2="650" y2="115" stroke="#00D4AA" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Bottom row -->
  <rect x="50" y="120" width="200" height="50" rx="6" fill="url(#boxGrad)" stroke="#FF6B6B" stroke-width="1.5"/>
  <text x="150" y="150" text-anchor="middle" fill="#FF6B6B" font-size="9">Module D: Research</text>

  <rect x="300" y="120" width="200" height="50" rx="6" fill="url(#boxGrad)" stroke="#9B59B6" stroke-width="1.5"/>
  <text x="400" y="150" text-anchor="middle" fill="#9B59B6" font-size="9">Module E: Storage</text>

  <rect x="550" y="120" width="200" height="50" rx="6" fill="url(#boxGrad)" stroke="#2ECC71" stroke-width="1.5"/>
  <text x="650" y="150" text-anchor="middle" fill="#2ECC71" font-size="9">Module F: Shipping</text>
</svg>