<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120" style="background:#1A2533;border-radius:8px;font-family:'Segoe UI',Arial,sans-serif;">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A5F;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#162D4A;stop-opacity:1"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#00D4AA"/>
    </marker>
  </defs>

  <text x="400" y="20" text-anchor="middle" fill="#C8D6E8" font-size="11" font-weight="bold">Storage Hub Layout</text>

  <!-- Production Area (top) -->
  <rect x="300" y="35" width="200" height="30" rx="6" fill="url(#boxGrad)" stroke="#4A9EFF" stroke-width="1.5"/>
  <text x="400" y="55" text-anchor="middle" fill="#4A9EFF" font-size="9">Production Area</text>
  <line x1="400" y1="65" x2="400" y2="75" stroke="#00D4AA" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Central Storage -->
  <rect x="250" y="80" width="300" height="35" rx="8" fill="url(#boxGrad)" stroke="#00D4AA" stroke-width="2"/>
  <text x="400" y="102" text-anchor="middle" fill="#00D4AA" font-size="10" font-weight="bold">Central Storage</text>

  <!-- Input (left) -->
  <rect x="50" y="80" width="120" height="35" rx="6" fill="url(#boxGrad)" stroke="#FFB347" stroke-width="1.5"/>
  <text x="110" y="102" text-anchor="middle" fill="#FFB347" font-size="9">Input</text>
  <line x1="170" y1="97" x2="250" y2="97" stroke="#00D4AA" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Output (right) -->
  <line x1="550" y1="97" x2="590" y2="97" stroke="#00D4AA" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="595" y="80" width="120" height="35" rx="6" fill="url(#boxGrad)" stroke="#00D4AA" stroke-width="1.5"/>
  <text x="655" y="102" text-anchor="middle" fill="#00D4AA" font-size="9">Output</text>

  <!-- Shipping/Receiving (bottom) -->
  <line x1="400" y1="115" x2="400" y2="125" stroke="#00D4AA" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="300" y="130" width="200" height="30" rx="6" fill="url(#boxGrad)" stroke="#FFB347" stroke-width="1.5"/>
  <text x="400" y="150" text-anchor="middle" fill="#FFB347" font-size="9">Shipping/Receiving</text>
</svg>